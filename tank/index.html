<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Barsik Tank Classic</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { --bg:#000; --ui:#fff; --accent:#0f0; --brick:#b7410e; --steel:#7f7f7f; }
  body { margin:0; background:var(--bg); color:var(--ui); font-family:'Courier New', monospace; overflow:hidden; touch-action:none; user-select:none; height:100vh; display:flex; flex-direction:column; }
  
  #hud { padding:5px 10px; background:#111; border-bottom:1px solid #333; display:flex; justify-content:space-between; font-size:12px; z-index:10; }
  #hud b { color:var(--accent); }
  
  #game-container { flex:1; position:relative; display:flex; justify-content:center; align-items:center; background:#000; overflow:hidden; }
  canvas { image-rendering:pixelated; max-width:100%; max-height:100%; border:2px solid #333; }
  
  /* Controls Overlay */
  #controls { 
    position:absolute; bottom:10px; left:0; right:0; height:140px; 
    display:grid; grid-template-columns:repeat(3, 1fr); gap:5px; padding:0 20px; 
    pointer-events:none; /* Let clicks pass through empty spaces */
    z-index:20;
  }
  .ctrl-btn { 
    width:60px; height:60px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.3); 
    color:#fff; font-size:24px; display:flex; align-items:center; justify-content:center; 
    border-radius:8px; cursor:pointer; pointer-events:auto; user-select:none; 
  }
  .ctrl-btn:active { background:rgba(255,255,255,0.4); border-color:var(--accent); color:var(--accent); }
  
  #btn-up { grid-column:2; grid-row:1; }
  #btn-left { grid-column:1; grid-row:2; }
  #btn-right { grid-column:3; grid-row:2; }
  #btn-down { grid-column:2; grid-row:3; }
  
  #btn-fire { 
    grid-column:1 / -1; grid-row:4; 
    background:rgba(255,0,0,0.2); border-color:#f00; color:#f00; 
    height:50px; font-weight:bold; font-size:18px; 
  }
  #btn-fire:active { background:rgba(255,0,0,0.5); color:#fff; }

  /* Overlays */
  .overlay { 
    position:absolute; inset:0; background:rgba(0,0,0,0.9); 
    display:flex; flex-direction:column; align-items:center; justify-content:center; 
    z-index:30; text-align:center; 
  }
  .hidden { display:none !important; }
  h1 { color:var(--accent); font-size:24px; margin:0 0 10px; text-transform:uppercase; letter-spacing:2px; }
  p { color:#ccc; font-size:14px; margin:5px 0; }
  button.menu-btn { 
    margin-top:15px; padding:10px 20px; background:#00f; color:#fff; border:none; 
    font-family:inherit; font-size:16px; cursor:pointer; text-transform:uppercase; 
  }
  button.menu-btn:hover { background:#00aaff; }
</style>
</head>
<body>

<div id="hud">
  <span>LVL: <b id="dispLvl">1</b></span>
  <span>SCORE: <b id="dispScore">0</b></span>
  <span>LIVES: <b id="dispLives">3</b></span>
</div>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>
  
  <!-- Start Menu -->
  <div id="menuStart" class="overlay">
    <h1>BATTLE CITY</h1>
    <p>Защити свою базу!</p>
    <button class="menu-btn" onclick="startGame()">START GAME</button>
  </div>

  <!-- Game Over -->
  <div id="menuOver" class="overlay hidden">
    <h1 style="color:#f00;">GAME OVER</h1>
    <p>Final Score: <span id="finalScore">0</span></p>
    <button class="menu-btn" onclick="resetGame()">RETRY</button>
  </div>
  
  <!-- Stage Clear -->
  <div id="menuStage" class="overlay hidden">
    <h1 style="color:#0f0;">STAGE CLEAR</h1>
    <button class="menu-btn" onclick="nextLevel()">NEXT LEVEL</button>
  </div>
</div>

<!-- Mobile Controls -->
<div id="controls">
  <div class="ctrl-btn" id="btn-up">▲</div>
  <div class="ctrl-btn" id="btn-left">◀</div>
  <div class="ctrl-btn" id="btn-right">▶</div>
  <div class="ctrl-btn" id="btn-down">▼</div>
  <div class="ctrl-btn" id="btn-fire">FIRE</div>
</div>

<script>
// --- TELEGRAM INIT ---
var tg = window.Telegram && window.Telegram.WebApp ? Telegram.WebApp : null;
if(tg){
  try{
    tg.ready();
    tg.expand();
    if(tg.setHeaderColor) tg.setHeaderColor('#000000');
    if(tg.setBackgroundColor) tg.setBackgroundColor('#000000');
    if(tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  }catch(e){}
}

// --- CONFIG ---
const TILE = 32; // Pixel size of one tile
const GRID_W = 13;
const GRID_H = 13;
const CANVAS_W = GRID_W * TILE;
const CANVAS_H = GRID_H * TILE;

// Directions: 0 Up, 1 Right, 2 Down, 3 Left
const DIRS = [{dx:0,dy:-1},{dx:1,dy:0},{dx:0,dy:1},{dx:-1,dy:0}];

// Tile Types
const T_EMPTY = 0;
const T_BRICK = 1;
const T_STEEL = 2;
const T_BASE = 5;
const T_BASE_DEAD = 6;

// State
let canvas, ctx;
let map = [];
let player = null;
let enemies = [];
let bullets = [];
let particles = [];
let score = 0;
let lives = 3;
let level = 1;
let gameState = 'MENU'; // MENU, PLAYING, OVER, WIN
let keys = {};
let frameCount = 0;
let enemySpawnTimer = 0;
let totalEnemiesToSpawn = 20;
let spawnedEnemies = 0;

// --- CLASSES ---

class Bullet {
  constructor(x, y, dir, owner) {
    this.x = x;
    this.y = y;
    this.dir = dir;
    this.owner = owner; // 'player' or 'enemy'
    this.speed = 6;
    this.active = true;
    this.size = 4;
  }
  
  update() {
    const d = DIRS[this.dir];
    this.x += d.dx * this.speed;
    this.y += d.dy * this.speed;
    
    // Bounds
    if(this.x < 0 || this.x > CANVAS_W || this.y < 0 || this.y > CANVAS_H) {
      this.active = false;
      return;
    }
    
    // Grid Collision
    const gx = Math.floor(this.x / TILE);
    const gy = Math.floor(this.y / TILE);
    
    if(gx >= 0 && gx < GRID_W && gy >= 0 && gy < GRID_H) {
      const tile = map[gy][gx];
      
      if(tile === T_BRICK) {
        map[gy][gx] = T_EMPTY;
        createExplosion(this.x, this.y, '#b7410e');
        this.active = false;
        if(this.owner === 'player') addScore(10);
        return;
      }
      if(tile === T_STEEL) {
        this.active = false;
        createExplosion(this.x, this.y, '#7f7f7f');
        return;
      }
      if(tile === T_BASE) {
        map[gy][gx] = T_BASE_DEAD;
        gameOver();
        return;
      }
    }
    
    // Entity Collision
    if(this.owner === 'player') {
      for(let e of enemies) {
        if(e.active && rectIntersect(this.x-this.size/2, this.y-this.size/2, this.size, this.size, e.x, e.y, TILE, TILE)) {
          e.hp--;
          this.active = false;
          createExplosion(this.x, this.y, '#fff');
          if(e.hp <= 0) {
            e.active = false;
            addScore(100);
            createBigExplosion(e.x+TILE/2, e.y+TILE/2, e.color);
          }
          return;
        }
      }
    } else {
      if(player.active && rectIntersect(this.x-this.size/2, this.y-this.size/2, this.size, this.size, player.x, player.y, TILE, TILE)) {
        playerHit();
        this.active = false;
        return;
      }
    }
  }
  
  draw() {
    ctx.fillStyle = this.owner === 'player' ? '#fff' : '#f00';
    ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
  }
}

class Tank {
  constructor(x, y, type, color) {
    this.x = x;
    this.y = y;
    this.type = type; // 'player' or 'enemy'
    this.color = color;
    this.dir = 0;
    this.speed = type === 'player' ? 3 : 2;
    this.active = true;
    this.hp = 1;
    this.cooldown = 0;
    this.aiTimer = 0;
  }
  
  update() {
    if(!this.active) return;
    
    if(this.type === 'player') {
      let dx = 0, dy = 0;
      let newDir = this.dir;
      
      if(keys['ArrowUp'] || keys['w']) { dy = -this.speed; newDir = 0; }
      else if(keys['ArrowDown'] || keys['s']) { dy = this.speed; newDir = 2; }
      else if(keys['ArrowLeft'] || keys['a']) { dx = -this.speed; newDir = 3; }
      else if(keys['ArrowRight'] || keys['d']) { dx = this.speed; newDir = 1; }
      
      if(dx !== 0 || dy !== 0) {
        this.dir = newDir;
        if(canMove(this.x + dx, this.y + dy)) {
          this.x += dx;
          this.y += dy;
        }
      }
      
      if((keys[' '] || keys['Enter'] || keys['fire']) && this.cooldown <= 0) {
        this.shoot();
      }
    } else {
      // Enemy AI
      this.aiTimer++;
      if(this.aiTimer % 60 === 0 || !canMove(this.x + DIRS[this.dir].dx*this.speed, this.y + DIRS[this.dir].dy*this.speed)) {
        // Change direction randomly or towards player
        if(Math.random() < 0.3 && player.active) {
           // Chase player roughly
           if(Math.abs(player.x - this.x) > Math.abs(player.y - this.y)) {
             this.dir = player.x > this.x ? 1 : 3;
           } else {
             this.dir = player.y > this.y ? 2 : 0;
           }
        } else {
           this.dir = Math.floor(Math.random()*4);
        }
      }
      
      const d = DIRS[this.dir];
      if(canMove(this.x + d.dx*this.speed, this.y + d.dy*this.speed)) {
        this.x += d.dx*this.speed;
        this.y += d.dy*this.speed;
      }
      
      if(Math.random() < 0.01 && this.cooldown <= 0) {
        this.shoot();
      }
    }
    
    if(this.cooldown > 0) this.cooldown--;
  }
  
  shoot() {
    const d = DIRS[this.dir];
    bullets.push(new Bullet(this.x + TILE/2 + d.dx*10, this.y + TILE/2 + d.dy*10, this.dir, this.type));
    this.cooldown = 20;
  }
  
  draw() {
    if(!this.active) return;
    ctx.save();
    ctx.translate(this.x + TILE/2, this.y + TILE/2);
    ctx.rotate(this.dir * Math.PI/2);
    
    // Body
    ctx.fillStyle = this.color;
    ctx.fillRect(-TILE/2+2, -TILE/2+2, TILE-4, TILE-4);
    
    // Tracks
    ctx.fillStyle = '#000';
    ctx.fillRect(-TILE/2, -TILE/2+2, 4, TILE-4);
    ctx.fillRect(TILE/2-4, -TILE/2+2, 4, TILE-4);
    
    // Barrel
    ctx.fillStyle = '#ddd';
    ctx.fillRect(-2, -TILE/2-4, 4, 10);
    
    ctx.restore();
  }
}

// --- HELPERS ---

function canMove(nx, ny) {
  if(nx < 0 || nx + TILE > CANVAS_W || ny < 0 || ny + TILE > CANVAS_H) return false;
  
  const tl = Math.floor(nx / TILE);
  const tr = Math.floor((nx + TILE - 1) / TILE);
  const tt = Math.floor(ny / TILE);
  const tb = Math.floor((ny + TILE - 1) / TILE);
  
  for(let j=tt; j<=tb; j++) {
    for(let i=tl; i<=tr; i++) {
      if(i>=0 && i<GRID_W && j>=0 && j<GRID_H) {
        const t = map[j][i];
        if(t === T_BRICK || t === T_STEEL || t === T_BASE || t === T_BASE_DEAD) return false;
      } else {
        return false;
      }
    }
  }
  
  // Check other tanks
  const others = [...enemies, ...(player.active?[player]:[])];
  for(let o of others) {
    if(o.active && rectIntersect(nx, ny, TILE, TILE, o.x, o.y, TILE, TILE)) return false;
  }
  
  return true;
}

function rectIntersect(x1,y1,w1,h1,x2,y2,w2,h2) {
  return x2 < x1+w1 && x2+w2 > x1 && y2 < y1+h1 && y2+h2 > y1;
}

function createExplosion(x, y, color) {
  for(let i=0; i<5; i++) {
    particles.push({x:x, y:y, vx:(Math.random()-0.5)*4, vy:(Math.random()-0.5)*4, life:10, color:color});
  }
}

function createBigExplosion(x, y, color) {
  for(let i=0; i<15; i++) {
    particles.push({x:x, y:y, vx:(Math.random()-0.5)*8, vy:(Math.random()-0.5)*8, life:20, color:color});
  }
}

function addScore(pts) {
  score += pts;
  document.getElementById('dispScore').textContent = score;
}

function playerHit() {
  lives--;
  document.getElementById('dispLives').textContent = lives;
  createBigExplosion(player.x+TILE/2, player.y+TILE/2, '#fff');
  player.active = false;
  
  if(lives <= 0) {
    setTimeout(gameOver, 1000);
  } else {
    setTimeout(respawnPlayer, 1000);
  }
}

function respawnPlayer() {
  player = new Tank(Math.floor(GRID_W/2)*TILE, (GRID_H-4)*TILE, 'player', '#fff');
  player.dir = 0;
}

function gameOver() {
  gameState = 'OVER';
  document.getElementById('finalScore').textContent = score;
  document.getElementById('menuOver').classList.remove('hidden');
  sendToBot();
}

function stageClear() {
  gameState = 'WIN';
  document.getElementById('menuStage').classList.remove('hidden');
  sendToBot();
}

function generateMap(lvl) {
  map = [];
  for(let y=0; y<GRID_H; y++) {
    let row = [];
    for(let x=0; x<GRID_W; x++) {
      if(x===0 || x===GRID_W-1 || y===0 || y===GRID_H-1) row.push(T_STEEL); // Borders
      else if(y > 2 && y < 10 && x > 2 && x < 10 && Math.random() < 0.3) row.push(T_BRICK);
      else row.push(T_EMPTY);
    }
    map.push(row);
  }
  
  // Base
  const bx = Math.floor(GRID_W/2);
  const by = GRID_H-2;
  map[by][bx] = T_BASE;
  map[by-1][bx] = T_BRICK;
  map[by][bx-1] = T_BRICK;
  map[by][bx+1] = T_BRICK;
  
  // Clear spawn area
  map[GRID_H-4][bx] = T_EMPTY;
  map[GRID_H-3][bx] = T_EMPTY;
}

function spawnEnemy() {
  if(spawnedEnemies >= totalEnemiesToSpawn) return;
  if(enemies.filter(e=>e.active).length >= 4) return;
  
  const spots = [[1,1], [Math.floor(GRID_W/2),1], [GRID_W-2,1]];
  const spot = spots[Math.floor(Math.random()*spots.length)];
  
  // Check if spot is clear
  if(map[spot[1]][spot[0]] !== T_EMPTY) return;
  
  const colors = ['#ccc', '#ffaa00', '#00aaaa']; // Normal, Fast, Power
  const color = colors[Math.floor(Math.random()*colors.length)];
  
  const e = new Tank(spot[0]*TILE, spot[1]*TILE, 'enemy', color);
  enemies.push(e);
  spawnedEnemies++;
}

// --- MAIN LOOP ---

function init() {
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  canvas.width = CANVAS_W;
  canvas.height = CANVAS_H;
  
  resetGame();
  loop();
}

function resetGame() {
  level = 1;
  score = 0;
  lives = 3;
  startLevel();
}

function startLevel() {
  generateMap(level);
  enemies = [];
  bullets = [];
  particles = [];
  spawnedEnemies = 0;
  totalEnemiesToSpawn = 20 + (level-1)*5;
  
  player = new Tank(Math.floor(GRID_W/2)*TILE, (GRID_H-4)*TILE, 'player', '#fff');
  
  gameState = 'PLAYING';
  document.getElementById('menuStart').classList.add('hidden');
  document.getElementById('menuOver').classList.add('hidden');
  document.getElementById('menuStage').classList.add('hidden');
  
  updateUI();
}

function nextLevel() {
  level++;
  startLevel();
}

function updateUI() {
  document.getElementById('dispLvl').textContent = level;
  document.getElementById('dispScore').textContent = score;
  document.getElementById('dispLives').textContent = lives;
}

function update() {
  if(gameState !== 'PLAYING') return;
  
  frameCount++;
  
  // Spawn Enemies
  if(frameCount % 120 === 0) spawnEnemy();
  
  // Update Entities
  if(player.active) player.update();
  enemies.forEach(e => e.update());
  bullets.forEach(b => b.update());
  bullets = bullets.filter(b => b.active);
  
  // Particles
  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
  });
  particles = particles.filter(p => p.life > 0);
  
  // Win Condition
  if(enemyQueueEmpty()) {
    stageClear();
  }
}

function enemyQueueEmpty() {
  return spawnedEnemies >= totalEnemiesToSpawn && enemies.filter(e=>e.active).length === 0;
}

function draw() {
  ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
  
  // Map
  for(let y=0; y<GRID_H; y++) {
    for(let x=0; x<GRID_W; x++) {
      const t = map[y][x];
      const px = x*TILE;
      const py = y*TILE;
      
      if(t === T_BRICK) {
        ctx.fillStyle = '#b7410e';
        ctx.fillRect(px+2, py+2, TILE-4, TILE-4);
        ctx.strokeStyle = '#8b0000';
        ctx.strokeRect(px+2, py+2, TILE-4, TILE-4);
      } else if(t === T_STEEL) {
        ctx.fillStyle = '#7f7f7f';
        ctx.fillRect(px+2, py+2, TILE-4, TILE-4);
        ctx.fillStyle = '#fff';
        ctx.fillRect(px+6, py+6, 4, 4);
      } else if(t === T_BASE) {
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.arc(px+TILE/2, py+TILE/2, TILE/3, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.font = '10px Arial';
        ctx.fillText('★', px+10, py+20);
      } else if(t === T_BASE_DEAD) {
        ctx.fillStyle = '#333';
        ctx.fillRect(px, py, TILE, TILE);
      }
    }
  }
  
  // Tanks
  if(player.active) player.draw();
  enemies.forEach(e => { if(e.active) e.draw(); });
  
  // Bullets
  bullets.forEach(b => b.draw());
  
  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life / 20;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 4, 4);
    ctx.globalAlpha = 1;
  });
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// --- INPUT ---

window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' ','Enter'].includes(e.key)) e.preventDefault();
});
window.addEventListener('keyup', e => keys[e.key] = false);

// Touch Buttons
const bindBtn = (id, key) => {
  const el = document.getElementById(id);
  if(!el) return;
  el.addEventListener('touchstart', (e) => { e.preventDefault(); keys[key] = true; });
  el.addEventListener('touchend', (e) => { e.preventDefault(); keys[key] = false; });
  el.addEventListener('mousedown', () => keys[key] = true);
  el.addEventListener('mouseup', () => keys[key] = false);
};

bindBtn('btn-up', 'ArrowUp');
bindBtn('btn-down', 'ArrowDown');
bindBtn('btn-left', 'ArrowLeft');
bindBtn('btn-right', 'ArrowRight');
bindBtn('btn-fire', 'fire');

function sendToBot() {
  if(tg && tg.sendData) {
    tg.sendData(JSON.stringify({
      game: 'tank',
      level: level,
      score: score,
      lives: lives
    }));
  }
}

// Global functions for buttons
window.startGame = function() {
  if(window.Telegram && window.Telegram.WebApp) {
     window.Telegram.WebApp.ready();
     window.Telegram.WebApp.expand();
  }
  resetGame();
};
window.resetGame = resetGame;
window.nextLevel = nextLevel;

init();

</script>
</body>
</html>
