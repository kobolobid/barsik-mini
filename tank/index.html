<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Barsik Tank</title>
<style>
  body { margin: 0; background: #000; color: #fff; font-family: monospace; overflow: hidden; touch-action: none; }
  #app { display: flex; flex-direction: column; height: 100vh; align-items: center; justify-content: center; gap: 10px; }
  canvas { border: 2px solid #444; image-rendering: pixelated; max-width: 95vw; max-height: 60vh; }
  .ui { display: flex; gap: 20px; font-size: 14px; color: #0f0; }
  .controls { display: grid; grid-template-columns: repeat(3, 60px); gap: 5px; }
  button { width: 60px; height: 60px; font-size: 24px; background: #333; border: 1px solid #555; color: #fff; border-radius: 8px; cursor: pointer; user-select: none; }
  button:active { background: #555; }
  .fire-btn { grid-column: span 3; background: #800; font-weight: bold; }
</style>
</head>
<body>
<div id="app">
  <div class="ui">
    <span>LVL: <b id="lvl">1</b></span>
    <span>SCORE: <b id="score">0</b></span>
    <span>LIVES: <b id="lives">3</b></span>
  </div>
  <canvas id="game"></canvas>
  <div class="controls">
    <button style="visibility:hidden"></button>
    <button id="up">▲</button>
    <button style="visibility:hidden"></button>
    <button id="left">◀</button>
    <button id="right">▶</button>
    <button id="down">▼</button>
    <button class="fire-btn" id="fire">🔥 FIRE</button>
  </div>
</div>

<script>
const TILE = 32;
const W = 13; // Grid Width
const H = 13; // Grid Height
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
canvas.width = W * TILE;
canvas.height = H * TILE;

// Game State
let map = [];
let player = { x: 6*TILE, y: 10*TILE, dir: 0, speed: 2, alive: true };
let enemies = [];
let bullets = [];
let score = 0;
let lives = 3;
let level = 1;
let keys = {};
let lastShot = 0;

// Directions: 0 Up, 1 Right, 2 Down, 3 Left
const DIRS = [{dx:0,dy:-1},{dx:1,dy:0},{dx:0,dy:1},{dx:-1,dy:0}];

function initMap() {
  map = [];
  for(let y=0; y<H; y++) {
    let row = [];
    for(let x=0; x<W; x++) {
      if(x===0 || x===W-1 || y===0 || y===H-1) row.push(2); // Steel Border
      else if(y > 2 && y < 10 && x > 2 && x < 10 && Math.random() < 0.3) row.push(1); // Brick Center
      else row.push(0); // Empty
    }
    map.push(row);
  }
  // Base at bottom center
  map[H-2][Math.floor(W/2)] = 5; // Base Icon
  
  // Player Start
  player.x = Math.floor(W/2)*TILE;
  player.y = (H-4)*TILE;
  player.alive = true;
  
  // Enemies
  enemies = [];
  for(let i=0; i<4; i++) {
    enemies.push({
      x: (i*3+1)*TILE, 
      y: TILE, 
      dir: 2, 
      speed: 1.5, 
      hp: 1, 
      timer: 0
    });
  }
}

function resetGame() {
  score = 0;
  lives = 3;
  level = 1;
  initMap();
  updateUI();
}

function updateUI() {
  document.getElementById('lvl').textContent = level;
  document.getElementById('score').textContent = score;
  document.getElementById('lives').textContent = lives;
}

function checkCollision(x, y, w, h, ignoreSelf) {
  const left = Math.floor(x / TILE);
  const right = Math.floor((x + w - 1) / TILE);
  const top = Math.floor(y / TILE);
  const bottom = Math.floor((y + h - 1) / TILE);

  for(let j=top; j<=bottom; j++) {
    for(let i=left; i<=right; i++) {
      if(i<0 || i>=W || j<0 || j>=H) return true; // Out of bounds
      const tile = map[j][i];
      if(tile === 1 || tile === 2 || tile === 5) return true; // Solid
    }
  }
  return false;
}

function moveEntity(ent, dx, dy) {
  const nx = ent.x + dx;
  const ny = ent.y + dy;
  if(!checkCollision(nx, ny, TILE-4, TILE-4)) {
    ent.x = nx;
    ent.y = ny;
    return true;
  }
  return false;
}

function shoot(owner, x, y, dir) {
  const d = DIRS[dir];
  bullets.push({
    x: x + TILE/2,
    y: y + TILE/2,
    dx: d.dx * 6,
    dy: d.dy * 6,
    owner: owner, // 'player' or 'enemy'
    life: 60
  });
}

function update() {
  if(!player.alive) return;

  // Player Movement
  let dx = 0, dy = 0;
  if(keys['ArrowUp'] || keys['w']) { dy = -player.speed; player.dir = 0; }
  else if(keys['ArrowDown'] || keys['s']) { dy = player.speed; player.dir = 2; }
  else if(keys['ArrowLeft'] || keys['a']) { dx = -player.speed; player.dir = 3; }
  else if(keys['ArrowRight'] || keys['d']) { dx = player.speed; player.dir = 1; }
  
  if(dx !== 0 || dy !== 0) {
    moveEntity(player, dx, dy);
  }

  // Enemy AI & Movement
  enemies.forEach(e => {
    e.timer++;
    if(e.timer % 60 === 0) {
      // Random direction change or chase player
      if(Math.random() < 0.5) {
        e.dir = Math.floor(Math.random()*4);
      } else {
        // Simple chase
        if(Math.abs(player.x - e.x) > Math.abs(player.y - e.y)) {
          e.dir = player.x > e.x ? 1 : 3;
        } else {
          e.dir = player.y > e.y ? 2 : 0;
        }
      }
    }
    
    const d = DIRS[e.dir];
    if(!moveEntity(e, d.dx*e.speed, d.dy*e.speed)) {
      e.dir = Math.floor(Math.random()*4); // Bounce off wall
    }

    // Enemy Shoot
    if(Math.random() < 0.01) {
      shoot('enemy', e.x, e.y, e.dir);
    }
  });

  // Bullets
  bullets.forEach(b => {
    b.x += b.dx;
    b.y += b.dy;
    b.life--;

    // Check Wall Collision
    const tx = Math.floor(b.x / TILE);
    const ty = Math.floor(b.y / TILE);
    
    if(tx >= 0 && tx < W && ty >= 0 && ty < H) {
      const tile = map[ty][tx];
      if(tile === 1) { // Brick
        map[ty][tx] = 0;
        b.life = 0;
        score += 10;
        updateUI();
      } else if(tile === 2) { // Steel
        b.life = 0;
      } else if(tile === 5) { // Base Hit -> Game Over
        b.life = 0;
        gameOver();
      }
    } else {
      b.life = 0; // Off screen
    }

    // Check Entity Collision
    if(b.owner === 'player') {
      enemies.forEach(e => {
        if(b.life > 0 && Math.abs(b.x - (e.x+TILE/2)) < 10 && Math.abs(b.y - (e.y+TILE/2)) < 10) {
          e.hp--;
          b.life = 0;
          if(e.hp <= 0) {
            score += 100;
            e.x = -100; // Mark dead
            updateUI();
          }
        }
      });
    } else {
      if(b.life > 0 && Math.abs(b.x - (player.x+TILE/2)) < 10 && Math.abs(b.y - (player.y+TILE/2)) < 10) {
        b.life = 0;
        playerHit();
      }
    }
  });

  bullets = bullets.filter(b => b.life > 0);
  enemies = enemies.filter(e => e.x > -50);

  // Win Level
  if(enemies.length === 0) {
    level++;
    initMap();
    updateUI();
  }
}

function playerHit() {
  lives--;
  updateUI();
  if(lives <= 0) {
    gameOver();
  } else {
    // Respawn
    player.x = Math.floor(W/2)*TILE;
    player.y = (H-4)*TILE;
    player.alive = true;
  }
}

function gameOver() {
  alert(`GAME OVER! Score: ${score}`);
  resetGame();
}

function draw() {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw Map
  for(let y=0; y<H; y++) {
    for(let x=0; x<W; x++) {
      const t = map[y][x];
      const px = x*TILE;
      const py = y*TILE;
      
      if(t === 1) { // Brick
        ctx.fillStyle = '#b7410e';
        ctx.fillRect(px+2, py+2, TILE-4, TILE-4);
        ctx.strokeStyle = '#8b0000';
        ctx.strokeRect(px+2, py+2, TILE-4, TILE-4);
      } else if(t === 2) { // Steel
        ctx.fillStyle = '#7f7f7f';
        ctx.fillRect(px+2, py+2, TILE-4, TILE-4);
        ctx.fillStyle = '#fff';
        ctx.fillRect(px+6, py+6, 4, 4);
      } else if(t === 5) { // Base
        ctx.fillStyle = '#ffd700';
        ctx.beginPath();
        ctx.arc(px+TILE/2, py+TILE/2, TILE/3, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.font = '10px Arial';
        ctx.fillText('★', px+10, py+20);
      }
    }
  }

  // Draw Player
  if(player.alive) {
    ctx.save();
    ctx.translate(player.x + TILE/2, player.y + TILE/2);
    ctx.rotate(player.dir * Math.PI/2);
    ctx.fillStyle = '#fff';
    ctx.fillRect(-TILE/2+2, -TILE/2+2, TILE-4, TILE-4);
    ctx.fillStyle = '#000';
    ctx.fillRect(-4, -TILE/2-4, 8, 12); // Barrel
    ctx.restore();
  }

  // Draw Enemies
  enemies.forEach(e => {
    ctx.save();
    ctx.translate(e.x + TILE/2, e.y + TILE/2);
    ctx.rotate(e.dir * Math.PI/2);
    ctx.fillStyle = '#c0c0c0';
    ctx.fillRect(-TILE/2+2, -TILE/2+2, TILE-4, TILE-4);
    ctx.fillStyle = '#000';
    ctx.fillRect(-4, -TILE/2-4, 8, 12);
    ctx.restore();
  });

  // Draw Bullets
  ctx.fillStyle = '#ff0';
  bullets.forEach(b => {
    ctx.fillRect(b.x-2, b.y-2, 4, 4);
  });
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Controls
window.addEventListener('keydown', e => {
  keys[e.key] = true;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if(e.key === ' ') shoot('player', player.x, player.y, player.dir);
});
window.addEventListener('keyup', e => keys[e.key] = false);

document.getElementById('up').addEventListener('touchstart', () => keys['ArrowUp']=true);
document.getElementById('up').addEventListener('touchend', () => keys['ArrowUp']=false);
document.getElementById('down').addEventListener('touchstart', () => keys['ArrowDown']=true);
document.getElementById('down').addEventListener('touchend', () => keys['ArrowDown']=false);
document.getElementById('left').addEventListener('touchstart', () => keys['ArrowLeft']=true);
document.getElementById('left').addEventListener('touchend', () => keys['ArrowLeft']=false);
document.getElementById('right').addEventListener('touchstart', () => keys['ArrowRight']=true);
document.getElementById('right').addEventListener('touchend', () => keys['ArrowRight']=false);
document.getElementById('fire').addEventListener('touchstart', () => shoot('player', player.x, player.y, player.dir));

resetGame();
loop();
</script>
</body>
</html>
