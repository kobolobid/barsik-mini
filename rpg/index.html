<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0d0a1a">
<title>БАРСИК RPG — Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg0:#0d0a1a;--bg1:#151027;--surf:#1c1533f2;--surf2:#251b45;--line:#3a2b63;--line2:#52408c;--ink:#f3edff;--dim:#b9aade;--mute:#8d7cb5;--acc:#8b5cf6;--acc2:#ffb020;--cyan:#3fd9ff;--green:#6dff9c;--red:#ff4d5e;--gold:#ffcf5c;--grad:linear-gradient(135deg,#6d3df0,#b02ee0 55%,#ff2e97);--grad-gold:linear-gradient(135deg,#ffb020,#ff7a3d);--disp:'Unbounded',system-ui,sans-serif;--body:'Manrope',system-ui,sans-serif;--vh:100dvh;--nav:58px;--safe:env(safe-area-inset-bottom,0px)}
body[data-set="rad"]{--acc:#9dff3f;--acc2:#ff7a3d;--bg0:#0e120a;--bg1:#161c0f;--surf:#1b2413f2;--surf2:#26331a;--line:#3c5226;--line2:#57743a;--dim:#c2d9a8;--mute:#8fa876;--grad:linear-gradient(135deg,#5a9e1f,#9dff3f 60%,#ff7a3d)}
body[data-set="neo"]{--acc:#3fd9ff;--acc2:#ff2e97;--bg0:#0a0d1c;--bg1:#10152b;--surf:#151c38f2;--surf2:#1d2648;--line:#2c3a6b;--line2:#3f5296;--dim:#a8c2de;--mute:#7c92b5;--grad:linear-gradient(135deg,#1f6fd9,#3fd9ff 55%,#ff2e97)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg0);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased;touch-action:manipulation}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;touch-action:manipulation}
input,select{font:inherit;color:var(--ink)}
b{font-weight:800}
.hidden{display:none!important}
*{scrollbar-width:thin;scrollbar-color:var(--acc) var(--bg1)}
::-webkit-scrollbar{width:7px;height:6px}
::-webkit-scrollbar-track{background:var(--bg1)}
::-webkit-scrollbar-thumb{background:var(--acc);border-radius:6px}
canvas{display:block}
#cv,#cvCreate{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#cv{touch-action:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:800;font-size:14px;padding:12px 18px;min-height:46px;border-radius:13px;border:1px solid var(--line2);background:var(--surf2);transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-p{background:var(--grad);border:none;color:#fff}
.btn-g{background:var(--grad-gold);border:none;color:#241300}
.btn-d{background:linear-gradient(135deg,#c22,#ff4d5e);border:none;color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:9px 14px;min-height:40px;border-radius:20px;background:var(--surf2);border:1px solid var(--line2);white-space:nowrap}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--grad);color:#fff;border-color:transparent}
.chip:disabled{opacity:.4;pointer-events:none}
.ibtn{width:42px;height:42px;display:grid;place-items:center;font-size:17px;border-radius:12px;background:var(--surf);border:1px solid var(--line2);flex:none}
.ibtn:active{transform:scale(.92)}
/* ===== создание (mobile-first) ===== */
#create{position:fixed;inset:0;z-index:10;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 14px 0;height:var(--vh)}
.cr-wrap{max-width:1020px;margin:0 auto;padding-bottom:110px}
.cr-title{text-align:center}
.cr-title h1{font:900 clamp(24px,6vw,42px)/1.1 var(--disp);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.cr-title p{color:var(--dim);font-size:12.5px;font-weight:600;margin-top:6px}
.neuro-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:var(--cyan);border:1px solid var(--cyan);border-radius:20px;padding:4px 12px;margin-top:8px;background:rgba(63,217,255,.08)}
.cr-cont{display:flex;justify-content:center;margin:12px 0}
.cr-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
.cr-prev{background:var(--surf);border:1px solid var(--line2);border-radius:16px;padding:10px}
.cr-prev canvas{width:100%;height:150px;border-radius:12px;background:radial-gradient(ellipse at 50% 80%,rgba(139,92,246,.2),var(--bg0) 75%)}
.cr-prev .cap{text-align:center;font-size:12px;color:var(--dim);font-weight:700;margin-top:6px}
.cr-sec{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.cr-sec h3{font:700 11px var(--disp);letter-spacing:1.4px;text-transform:uppercase;color:var(--acc2);margin-bottom:10px}
.cards{display:grid;gap:8px}
.c1{grid-template-columns:1fr}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:1fr}
.card-o{position:relative;text-align:left;background:var(--bg1);border:1px solid var(--line2);border-radius:13px;padding:11px 12px;min-height:52px}
.card-o:active{transform:scale(.98)}
.card-o.on{border-color:var(--acc2);box-shadow:0 0 0 1px var(--acc2)}
.card-o .ci{font-size:22px;float:left;margin-right:10px}
.card-o .cn{font-weight:800;font-size:13.5px}
.card-o .cd{font-size:11px;color:var(--mute);font-weight:600;line-height:1.35;margin-top:2px}
.card-o.on::after{content:"✓";position:absolute;top:8px;right:10px;font-weight:900;color:var(--acc2)}
.cr-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.cr-row label{font-size:13px;font-weight:700;color:var(--dim);min-width:86px}
#inpName{flex:1;min-width:150px;background:var(--bg0);border:1px solid var(--line2);border-radius:12px;padding:12px 13px;font-weight:700;font-size:15px}
#inpName:focus{outline:none;border-color:var(--acc)}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent}
.sw.on{border-color:#fff;transform:scale(1.12)}
.attr-row{display:flex;align-items:center;gap:8px;padding:6px 0}
.attr-row .an{flex:1;font-size:13px;font-weight:700;color:var(--dim)}
.attr-row .an small{display:block;font-size:10.5px;color:var(--mute)}
.attr-row .av{font:800 16px var(--disp);color:var(--gold);width:28px;text-align:center}
.attr-row .btn{padding:6px 14px;min-height:40px;font-size:16px}
.pts{font-size:12px;font-weight:800;color:var(--green)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.cr-start{position:fixed;left:0;right:0;bottom:0;z-index:12;padding:12px 14px calc(12px + var(--safe));background:linear-gradient(180deg,transparent,var(--bg0) 40%)}
.cr-start .btn{width:100%;font:800 15px var(--disp);padding:16px;letter-spacing:.5px}
@media(min-width:900px){
.cr-grid{grid-template-columns:300px 1fr}
.cr-left{position:sticky;top:14px;align-self:start}
.cr-prev canvas{height:210px}
.c3{grid-template-columns:repeat(3,1fr)}
.card-o .ci{float:none;margin:0 0 4px}
.cr-start{position:static;background:none;padding:16px 0 30px}
.cr-start .btn{width:auto;padding:16px 46px}
.cr-wrap{padding-bottom:20px}}
/* ===== HUD ===== */
#hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:7px;padding:calc(6px + env(safe-area-inset-top,0px)) 8px 6px;pointer-events:none}
#hud>*{pointer-events:auto}
.hud-box{display:flex;align-items:center;gap:8px;background:var(--surf);border:1px solid var(--line2);border-radius:12px;padding:6px 11px}
#zoneName{font:700 11.5px var(--disp);max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#clockTxt{font-size:10.5px;color:var(--dim);font-weight:700}
.hud-gold{color:var(--gold);font-weight:800;font-size:13px}
.hud-party{display:none}
.hud-btns{margin-left:auto;display:flex;gap:6px}
.hud-btns .pc-btn{display:none}
#minimap{display:none}
#hint{display:none}
#prompt{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safe) + 128px);transform:translateX(-50%);z-index:19;font-weight:800;font-size:13px;background:var(--surf);border:1px solid var(--acc2);border-radius:20px;padding:9px 18px;max-width:88vw;text-align:center}
#joy{position:fixed;left:14px;bottom:calc(var(--nav) + var(--safe) + 14px);z-index:21;width:112px;height:112px;border-radius:50%;background:rgba(37,27,69,.55);border:1px solid var(--line2);touch-action:none}
#joyKnob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:var(--grad)}
#btnAct{position:fixed;right:16px;bottom:calc(var(--nav) + var(--safe) + 22px);z-index:21;width:72px;height:72px;border-radius:50%;background:var(--grad-gold);color:#241300;font:900 15px var(--disp);touch-action:none}
#btnAct:active{transform:scale(.92)}
/* нижняя навигация mini app */
#mnav{position:fixed;left:0;right:0;bottom:0;z-index:22;display:flex;gap:2px;background:var(--surf);border-top:1px solid var(--line2);padding:6px 6px calc(6px + var(--safe))}
#mnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:19px;padding:5px 2px;border-radius:11px;color:var(--dim);min-height:46px}
#mnav button span{font-size:9px;font-weight:800}
#mnav button:active{background:var(--surf2)}
body.in-battle #mnav,body.in-battle #joy,body.in-battle #btnAct{display:none}
@media(min-width:900px){
#mnav{display:none}
.hud-party{display:flex}
.hud-btns .pc-btn{display:grid}
#minimap{display:block;position:fixed;top:56px;right:10px;z-index:19;border:1px solid var(--line2);border-radius:11px;background:var(--surf)}
#hint{display:block;position:fixed;left:12px;bottom:12px;z-index:19;font-size:11px;color:var(--dim);font-weight:700;background:var(--surf);border:1px solid var(--line);border-radius:11px;padding:7px 12px}
#joy,#btnAct{display:none}
#prompt{bottom:96px}
body.coarse #joy,body.coarse #btnAct{display:block}
body.coarse #hint{display:none}}
.mini{display:flex;flex-direction:column;gap:3px;min-width:110px}
.mini .mn{font-size:10px;font-weight:800;display:flex;justify-content:space-between}
.mtrack{height:5px;background:var(--bg0);border-radius:4px;overflow:hidden}
.mfill{height:100%;border-radius:4px;transition:width .25s}
.f-hp{background:linear-gradient(90deg,#ff4d5e,#ff9d5c)}.f-mp{background:linear-gradient(90deg,#3fd9ff,#8b5cf6)}.f-atb{background:linear-gradient(90deg,#ffb020,#ffcf5c)}.f-xp{background:linear-gradient(90deg,#6dff9c,#3fd9ff)}
/* ===== диалог ===== */
#dialog{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safe) + 8px);transform:translateX(-50%);z-index:30;width:min(720px,96vw);max-height:62vh;overflow-y:auto;background:var(--surf);border:1px solid var(--line2);border-radius:16px;padding:12px}
.dlg-top{display:flex;gap:10px}
#dlgPortrait{width:60px;height:60px;flex:none;border-radius:12px;background:var(--bg0);border:2px solid var(--acc)}
.dlg-main{flex:1;min-width:0}
#dlgName{font:700 13.5px var(--disp)}
#dlgTag{font-size:10px;color:var(--mute);font-weight:700}
#dlgTag .ai{color:var(--cyan)}
#dlgText{font-size:13.5px;margin-top:4px;min-height:40px}
#dlgChoices{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.dlg-c{display:flex;align-items:center;gap:8px;text-align:left;padding:12px 13px;min-height:46px;border-radius:12px;background:var(--bg0);border:1px solid var(--line2);font-weight:700;font-size:13px}
.dlg-c:active{transform:scale(.98);border-color:var(--acc)}
.dlg-c .h{margin-left:auto;font-size:11px;color:var(--acc2);font-weight:800;flex:none}
.dlg-c:disabled{opacity:.45;pointer-events:none}
@media(min-width:900px){#dialog{bottom:14px}}
/* ===== бой ===== */
#battleUI{position:fixed;left:0;right:0;bottom:0;z-index:25;background:linear-gradient(180deg,transparent,var(--bg0) 22%);padding:20px 8px calc(8px + var(--safe))}
.bt-in{max-width:900px;margin:0 auto;background:var(--surf);border:1px solid var(--line2);border-radius:15px;padding:9px 10px}
#btLog{font-size:11px;color:var(--dim);font-weight:600;min-height:30px;margin-bottom:6px;line-height:1.4}
#btLog .lc{color:var(--gold)}#btLog .lw{color:var(--red)}#btLog .lh{color:var(--green)}#btLog .li{color:var(--cyan)}
.bt-row{display:flex;flex-direction:column;gap:8px}
#partyCards{display:flex;gap:6px}
.pc{flex:1;background:var(--bg0);border:1px solid var(--line2);border-radius:11px;padding:6px 8px}
.pc.ready{border-color:var(--acc2)}.pc.active{border-color:var(--cyan)}.pc.dead{opacity:.45}
.pc .pn{font-size:10.5px;font-weight:800;display:flex;justify-content:space-between}
.pc .pn .st{color:var(--acc2);font-size:9.5px}
.pc .mtrack{margin-top:3px}
.pc .nums{font-size:9px;color:var(--mute);font-weight:700;display:flex;justify-content:space-between}
#btMenu{display:flex;flex-direction:column;gap:6px}
.bt-cmds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bt-cmds .btn{flex-direction:column;gap:1px;padding:9px 3px;font-size:12px;min-height:52px}
.bt-cmds .btn small{font-size:8.5px;color:var(--mute);font-weight:700}
.bt-list{display:flex;flex-direction:column;gap:5px;max-height:132px;overflow-y:auto}
.bt-t{display:flex;align-items:center;gap:8px;text-align:left;padding:10px 11px;min-height:44px;border-radius:10px;background:var(--bg0);border:1px solid var(--line2);font-size:12.5px;font-weight:700}
.bt-t:disabled{opacity:.4;pointer-events:none}
.bt-t .el{font-size:15px}.bt-t .mp{margin-left:auto;color:var(--cyan);font-size:11px;font-weight:800;flex:none}
.bt-t .ds{font-size:10px;color:var(--mute);font-weight:600}
.bt-target{display:flex;align-items:center;gap:6px;background:var(--bg0);border:1px solid var(--acc2);border-radius:11px;padding:7px 9px;font-size:12.5px;font-weight:800;flex-wrap:wrap}
.bt-target .tn{color:var(--gold);flex:1;text-align:center;min-width:90px}
.bt-target .btn{min-height:40px;padding:8px 12px}
.bt-wait{font-size:11px;color:var(--mute);font-weight:700;text-align:center;padding:8px}
#btBanner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);z-index:26;font:900 clamp(26px,7vw,46px) var(--disp);color:#fff;text-shadow:0 0 30px var(--acc);pointer-events:none;animation:ban 1.1s ease forwards}
@keyframes ban{0%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
@media(min-width:900px){.bt-row{flex-direction:row}#partyCards{flex-direction:column;width:230px;flex:none}}
/* ===== панель ===== */
#panel{position:fixed;inset:0;z-index:40;background:linear-gradient(170deg,var(--surf2),var(--bg1));display:flex;flex-direction:column;height:var(--vh)}
.p-head{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;border-bottom:1px solid var(--line)}
.p-head h2{font:700 14px var(--disp);flex:1}
.p-tabs{display:flex;gap:5px;padding:8px 10px;border-bottom:1px solid var(--line);overflow-x:auto}
.p-tabs .chip{flex:none}
#panelBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px calc(24px + var(--safe))}
.p-sec{margin-bottom:14px}
.p-sec h4{font:700 10.5px var(--disp);letter-spacing:1.2px;text-transform:uppercase;color:var(--acc2);margin-bottom:8px}
.eq-row{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.eq{background:var(--bg0);border:1px dashed var(--line2);border-radius:11px;padding:8px 6px;text-align:center;min-height:70px}
.eq.f{border-style:solid;border-color:var(--acc)}
.eq .ei{font-size:22px}.eq .en{font-size:9.5px;font-weight:800;margin-top:2px;line-height:1.2}
.eq .el{font-size:8.5px;color:var(--mute);font-weight:700;text-transform:uppercase}
.inv-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.icell{position:relative;background:var(--bg0);border:1px solid var(--line2);border-radius:11px;padding:9px 4px 7px;text-align:center;min-height:64px}
.icell:active{transform:scale(.95)}
.icell .ii{font-size:22px}.icell .in{font-size:9px;font-weight:800;color:var(--dim);line-height:1.2;margin-top:2px}
.icell .iq{position:absolute;top:2px;right:4px;font-size:9px;font-weight:800;color:var(--gold);background:var(--surf2);border-radius:8px;padding:0 4px}
.shop-item{display:flex;align-items:center;gap:9px;background:var(--bg0);border:1px solid var(--line2);border-radius:11px;padding:8px 9px;margin-bottom:6px}
.si-i{font-size:22px;width:38px;height:38px;flex:none;display:grid;place-items:center;background:var(--surf2);border-radius:9px}
.si-n{flex:1;min-width:0}.si-n b{font-size:12.5px;display:block;line-height:1.25}
.si-n small{font-size:10px;color:var(--mute);font-weight:600}
.si-b{flex:none;text-align:right}
.price{font-size:12.5px;font-weight:800;color:var(--gold)}
.si-btn{margin-top:3px;font-size:11.5px;font-weight:800;padding:7px 13px;min-height:36px;border-radius:9px;background:var(--grad-gold);color:#241300}
.si-btn:disabled{opacity:.4;pointer-events:none}
.si-btn.sell{background:var(--surf2);color:var(--ink);border:1px solid var(--line2)}
.q-card{background:var(--bg0);border:1px solid var(--line2);border-radius:12px;padding:11px;margin-bottom:8px}
.q-card.main{border-color:var(--acc2)}.q-card.ready{border-color:var(--green)}.q-card.done{opacity:.6}
.q-t{display:flex;gap:7px;align-items:center;font-size:13px;font-weight:800}
.q-t .tag{margin-left:auto;font-size:8.5px;font-weight:800;padding:1px 7px;border-radius:9px;color:var(--gold);border:1px solid var(--acc2);flex:none}
.q-d{font-size:11.5px;color:var(--mute);margin:4px 0 7px;line-height:1.45}
.q-p{display:flex;align-items:center;gap:8px}
.q-p .mtrack{flex:1;height:7px}.q-p .n{font-size:11px;font-weight:800;color:var(--dim)}
.q-r{font-size:11px;color:var(--gold);font-weight:700;margin-top:6px}
.q-btns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.q-btns .btn{padding:8px 13px;font-size:12px;min-height:40px}
.stat-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:13px}
.stat-row .sn{flex:1;font-weight:700;color:var(--dim)}
.stat-row .sv{font:800 15px var(--disp);color:var(--gold)}
.tech-row{display:flex;align-items:center;gap:8px;background:var(--bg0);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;margin-bottom:5px;font-size:12.5px}
.tech-row.lock{opacity:.45}.tech-row .tn{flex:1;font-weight:700}.tech-row .tm{font-size:11px;color:var(--cyan);font-weight:800}
.set-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.set-row label{flex:1;font-size:13px;font-weight:700;color:var(--dim)}
.set-row label small{display:block;font-size:10.5px;color:var(--mute)}
.set-row select,.set-row input[type=text],.set-row input[type=password]{background:var(--bg0);border:1px solid var(--line2);border-radius:10px;padding:9px 10px;font-size:13px;width:170px;max-width:46vw}
.set-row input[type=range]{width:120px;accent-color:var(--acc)}
.switch{position:relative;width:46px;height:26px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;cursor:pointer;z-index:2}
.switch .sl{position:absolute;inset:0;background:var(--bg0);border:1px solid var(--line2);border-radius:20px;transition:.2s}
.switch .sl::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:var(--mute);transition:.2s}
.switch input:checked+.sl{background:var(--grad);border-color:transparent}
.switch input:checked+.sl::after{left:22px;background:#fff}

 buildings.forEach(function(b){for(var by=b.y;by<b.y+b.h;by++)for(var bx=b.x;bx<b.x+b.w;bx++)setT(bx,by,4)});
 for(y=0;y<H;y++)for(x=14;x<W;x++){var t=at(x,y);if(t!==0&&t!==8)continue;if(y>=16&&y<=19)continue;
  var d=x>=34?.13:.15;if(r()<d)setT(x,y,x>=34&&r()<.5?9:1);else if(r()<.05)setT(x,y,6)}
 for(y=10;y<=26;y++)for(x=2;x<=13;x++)if(at(x,y)===1)setT(x,y,0);
 function walk(wx,wy){var tt=at(Math.floor(wx),Math.floor(wy));return tt!==1&&tt!==2&&tt!==4&&tt!==9}
 function findSpot(x0,x1){for(var i=0;i<200;i++){var sx=x0+r()*(x1-x0),sy=3+r()*(H-6);if(walk(sx,sy)&&walk(sx+1,sy)&&walk(sx,sy+1))return{x:sx*T+T/2,y:sy*T+T/2}}return{x:(x0+2)*T,y:17*T}}

function neuro(messages,maxTokens){var s=G?G.settings:null;
 var base=s?s.apiBase:NEURO.base,key=s?s.apiKey:NEURO.key,model=s?s.apiModel:NEURO.model;
 var ctl=new AbortController();var to=setTimeout(function(){ctl.abort()},22000);
 return fetch(base,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},body:JSON.stringify({model:model,messages:messages,temperature:.9,max_tokens:maxTokens||200}),signal:ctl.signal})
 .then(function(r){clearTimeout(to);if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})

 for(var i=0;i<3;i++){var x=VW*(.2+i*.3)+Math.sin(t*.0002+i*2)*70,y=VH*(.25+i*.2)+Math.cos(t*.00015+i)*50;
