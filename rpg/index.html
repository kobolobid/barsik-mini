<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0d0a1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>БАРСИК RPG — Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg0: #0d0a1a; --bg1: #151027; --surf: #1c1533f2; --surf2: #251b45;
  --line: #3a2b63; --line2: #52408c; --ink: #f3edff; --dim: #b9aade; --mute: #8d7cb5;
  --acc: #8b5cf6; --acc2: #ffb020; --cyan: #3fd9ff; --green: #6dff9c; --red: #ff4d5e; --gold: #ffcf5c;
  --grad: linear-gradient(135deg, #6d3df0, #b02ee0 55%, #ff2e97);
  --grad-gold: linear-gradient(135deg, #ffb020, #ff7a3d);
  --disp: 'Unbounded', system-ui, sans-serif;
  --body: 'Manrope', system-ui, sans-serif;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
body[data-set="rad"] { --acc: #9dff3f; --acc2: #ff7a3d; --bg0: #0e120a; --bg1: #161c0f; --surf: #1b2413f2; --surf2: #26331a; --line: #3c5226; --line2: #57743a; --dim: #c2d9a8; --mute: #8fa876; --grad: linear-gradient(135deg, #5a9e1f, #9dff3f 60%, #ff7a3d); }
body[data-set="neo"] { --acc: #3fd9ff; --acc2: #ff2e97; --bg0: #0a0d1c; --bg1: #10152b; --surf: #151c38f2; --surf2: #1d2648; --line: #2c3a6b; --line2: #3f5296; --dim: #a8c2de; --mute: #7c92b5; --grad: linear-gradient(135deg, #1f6fd9, #3fd9ff 55%, #ff2e97); }

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--bg0); color: var(--ink); font: 400 15px/1.5 var(--body); }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; touch-action: manipulation; }
input, select { font: inherit; color: var(--ink); }
b { font-weight: 800; }
.hidden { display: none !important; }

/* ===== КНОПКИ (Гарантированно кликабельные) ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  font-weight: 800; font-size: 14px; padding: 12px 18px; min-height: 48px;
  border-radius: 13px; border: 1px solid var(--line2); background: var(--surf2);
  transition: transform 0.1s, opacity 0.1s; width: 100%;
}
.btn:active { transform: scale(0.96); opacity: 0.9; }
.btn:disabled { opacity: 0.4; pointer-events: none; }
.btn-p { background: var(--grad); border: none; color: #fff; }
.btn-g { background: var(--grad-gold); border: none; color: #241300; }
.btn-d { background: linear-gradient(135deg, #c22, #ff4d5e); border: none; color: #fff; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px;
  padding: 10px 14px; min-height: 44px; border-radius: 20px; background: var(--surf2);
  border: 1px solid var(--line2); white-space: nowrap; transition: transform 0.1s;
}
.chip:active { transform: scale(0.95); }
.chip.on { background: var(--grad); color: #fff; border-color: transparent; }
.chip:disabled { opacity: 0.4; pointer-events: none; }
.ibtn {
  width: 44px; height: 44px; display: grid; place-items: center; font-size: 18px;
  border-radius: 12px; background: var(--surf); border: 1px solid var(--line2); flex-none;
}
.ibtn:active { transform: scale(0.92); }

/* ===== ЭКРАН СОЗДАНИЯ ===== */
#create { position: fixed; inset: 0; z-index: 10; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 14px 0; }
.cr-wrap { max-width: 600px; margin: 0 auto; padding-bottom: 100px; }
.cr-title { text-align: center; margin-bottom: 12px; }
.cr-title h1 { font: 900 clamp(24px, 6vw, 36px)/1.1 var(--disp); background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
.cr-title p { color: var(--dim); font-size: 13px; font-weight: 600; margin-top: 6px; }
.neuro-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; color: var(--cyan); border: 1px solid var(--cyan); border-radius: 20px; padding: 4px 12px; margin-top: 8px; background: rgba(63,217,255,0.08); }
.cr-prev { background: var(--surf); border: 1px solid var(--line2); border-radius: 16px; padding: 10px; margin-bottom: 14px; }
.cr-prev canvas { width: 100%; height: 140px; border-radius: 12px; background: radial-gradient(ellipse at 50% 80%, rgba(139,92,246,0.2), var(--bg0) 75%); }
.cr-prev .cap { text-align: center; font-size: 12px; color: var(--dim); font-weight: 700; margin-top: 6px; }
.cr-sec { background: var(--surf); border: 1px solid var(--line); border-radius: 16px; padding: 14px; margin-bottom: 12px; }
.cr-sec h3 { font: 700 11px var(--disp); letter-spacing: 1.4px; text-transform: uppercase; color: var(--acc2); margin-bottom: 10px; }
.cards { display: grid; gap: 8px; }
.c2 { grid-template-columns: 1fr 1fr; }
.c3 { grid-template-columns: 1fr 1fr 1fr; }
.card-o { position: relative; text-align: left; background: var(--bg1); border: 1px solid var(--line2); border-radius: 13px; padding: 12px; min-height: 56px; }
.card-o:active { transform: scale(0.97); }
.card-o.on { border-color: var(--acc2); box-shadow: 0 0 0 1px var(--acc2); }
.card-o .ci { font-size: 22px; float: left; margin-right: 10px; margin-top: 2px; }
.card-o .cn { font-weight: 800; font-size: 13.5px; }
.card-o .cd { font-size: 11px; color: var(--mute); font-weight: 600; line-height: 1.3; margin-top: 2px; }
.card-o.on::after { content: "✓"; position: absolute; top: 8px; right: 10px; font-weight: 900; color: var(--acc2); }
.cr-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.cr-row label { font-size: 13px; font-weight: 700; color: var(--dim); min-width: 80px; }
#inpName { flex: 1; min-width: 150px; background: var(--bg0); border: 1px solid var(--line2); border-radius: 12px; padding: 12px 13px; font-weight: 700; font-size: 15px; }
#inpName:focus { outline: none; border-color: var(--acc); }
.sws { display: flex; gap: 8px; flex-wrap: wrap; }
.sw { width: 36px; height: 36px; border-radius: 50%; border: 2px solid transparent; }
.sw.on { border-color: #fff; transform: scale(1.1); }
.attr-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
.attr-row .an { flex: 1; font-size: 13px; font-weight: 700; color: var(--dim); }
.attr-row .an small { display: block; font-size: 10.5px; color: var(--mute); }
.attr-row .av { font: 800 16px var(--disp); color: var(--gold); width: 28px; text-align: center; }
.attr-row .btn { width: 44px; height: 44px; padding: 0; font-size: 18px; flex: none; }
.pts { font-size: 12px; font-weight: 800; color: var(--green); }
.cr-start { position: fixed; left: 0; right: 0; bottom: 0; z-index: 12; padding: 12px 14px calc(12px + var(--safe-b)); background: linear-gradient(180deg, transparent, var(--bg0) 40%); }
.cr-start .btn { font: 800 15px var(--disp); padding: 16px; letter-spacing: 0.5px; }

/* ===== HUD ===== */
#hud { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; gap: 7px; padding: calc(6px + var(--safe-t)) 8px 6px; pointer-events: none; }
#hud > * { pointer-events: auto; }
.hud-box { display: flex; align-items: center; gap: 8px; background: var(--surf); border: 1px solid var(--line2); border-radius: 12px; padding: 6px 11px; backdrop-filter: blur(8px); }
#zoneName { font: 700 11.5px var(--disp); max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#clockTxt { font-size: 10.5px; color: var(--dim); font-weight: 700; }
.hud-gold { color: var(--gold); font-weight: 800; font-size: 13px; }
.hud-party { display: none; }
.hud-btns { margin-left: auto; display: flex; gap: 6px; }
.pc-btn { display: none; }
#minimap { display: none; }
#hint { display: none; }
#prompt { position: fixed; left: 50%; bottom: calc(60px + var(--safe-b) + 120px); transform: translateX(-50%); z-index: 19; font-weight: 800; font-size: 13px; background: var(--surf); border: 1px solid var(--acc2); border-radius: 20px; padding: 9px 18px; max-width: 88vw; text-align: center; pointer-events: none; }
#joy { position: fixed; left: 16px; bottom: calc(60px + var(--safe-b) + 16px); z-index: 21; width: 112px; height: 112px; border-radius: 50%; background: rgba(37,27,69,0.6); border: 1px solid var(--line2); touch-action: none; display: none; }
#joyKnob { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px; border-radius: 50%; background: var(--grad); pointer-events: none; }
#btnAct { position: fixed; right: 16px; bottom: calc(60px + var(--safe-b) + 24px); z-index: 21; width: 72px; height: 72px; border-radius: 50%; background: var(--grad-gold); color: #241300; font: 900 15px var(--disp); touch-action: none; display: none; box-shadow: 0 4px 16px rgba(255,176,32,0.4); }
#btnAct:active { transform: scale(0.92); }

/* Нижняя навигация */
#mnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 22; display: flex; gap: 2px; background: var(--surf); border-top: 1px solid var(--line2); padding: 6px 4px calc(6px + var(--safe-b)); backdrop-filter: blur(10px); }
#mnav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 20px; padding: 6px 2px; border-radius: 10px; color: var(--dim); min-height: 50px; }
#mnav button span { font-size: 9px; font-weight: 800; }
#mnav button:active { background: var(--surf2); color: var(--ink); }
body.in-battle #mnav, body.in-battle #joy, body.in-battle #btnAct { display: none !important; }

@media (min-width: 768px) {
  #mnav { display: none; }
  .hud-party { display: flex; }
  .pc-btn { display: grid; }
  #minimap { display: block; position: fixed; top: 56px; right: 10px; z-index: 19; border: 1px solid var(--line2); border-radius: 11px; background: var(--surf); }
  #hint { display: block; position: fixed; left: 12px; bottom: 12px; z-index: 19; font-size: 11px; color: var(--dim); font-weight: 700; background: var(--surf); border: 1px solid var(--line); border-radius: 11px; padding: 7px 12px; }
  #joy, #btnAct { display: none !important; }
  #prompt { bottom: 96px; }
}
.mini { display: flex; flex-direction: column; gap: 3px; min-width: 110px; }
.mini .mn { font-size: 10px; font-weight: 800; display: flex; justify-content: space-between; }
.mtrack { height: 5px; background: var(--bg0); border-radius: 4px; overflow: hidden; }
.mfill { height: 100%; border-radius: 4px; transition: width 0.25s; }
.f-hp { background: linear-gradient(90deg, #ff4d5e, #ff9d5c); }
.f-mp { background: linear-gradient(90deg, #3fd9ff, #8b5cf6); }
.f-atb { background: linear-gradient(90deg, #ffb020, #ffcf5c); }

/* ===== ДИАЛОГ ===== */
#dialog { position: fixed; left: 50%; bottom: calc(60px + var(--safe-b) + 8px); transform: translateX(-50%); z-index: 30; width: min(600px, 96vw); max-height: 55vh; overflow-y: auto; background: var(--surf); border: 1px solid var(--line2); border-radius: 16px; padding: 12px; backdrop-filter: blur(12px); }
.dlg-top { display: flex; gap: 10px; }
#dlgPortrait { width: 56px; height: 56px; flex: none; border-radius: 12px; background: var(--bg0); border: 2px solid var(--acc); }
.dlg-main { flex: 1; min-width: 0; }
#dlgName { font: 700 13.5px var(--disp); }
#dlgTag { font-size: 10px; color: var(--mute); font-weight: 700; margin-bottom: 4px; }
#dlgTag .ai { color: var(--cyan); }
#dlgText { font-size: 14px; line-height: 1.5; min-height: 40px; }
#dlgChoices { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
.dlg-c { display: flex; align-items: center; gap: 8px; text-align: left; padding: 12px 13px; min-height: 48px; border-radius: 12px; background: var(--bg0); border: 1px solid var(--line2); font-weight: 700; font-size: 13.5px; }
.dlg-c:active { transform: scale(0.98); border-color: var(--acc); background: var(--surf2); }
.dlg-c .h { margin-left: auto; font-size: 11px; color: var(--acc2); font-weight: 800; flex: none; }
.dlg-c:disabled { opacity: 0.45; pointer-events: none; }
@media (min-width: 768px) { #dialog { bottom: 14px; } }

/* ===== БОЙ ===== */
#battleUI { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: linear-gradient(180deg, transparent, var(--bg0) 20%); padding: 16px 8px calc(8px + var(--safe-b)); }
.bt-in { max-width: 800px; margin: 0 auto; background: var(--surf); border: 1px solid var(--line2); border-radius: 15px; padding: 10px; backdrop-filter: blur(10px); }
#btLog { font-size: 11.5px; color: var(--dim); font-weight: 600; min-height: 32px; margin-bottom: 8px; line-height: 1.4; }
#btLog .lc { color: var(--gold); } #btLog .lw { color: var(--red); } #btLog .lh { color: var(--green); } #btLog .li { color: var(--cyan); }
.bt-row { display: flex; flex-direction: column; gap: 8px; }
#partyCards { display: flex; gap: 6px; }
.pc { flex: 1; background: var(--bg0); border: 1px solid var(--line2); border-radius: 11px; padding: 6px 8px; }
.pc.ready { border-color: var(--acc2); box-shadow: 0 0 8px rgba(255,176,32,0.3); }
.pc.active { border-color: var(--cyan); }
.pc.dead { opacity: 0.45; }
.pc .pn { font-size: 11px; font-weight: 800; display: flex; justify-content: space-between; }
.pc .pn .st { color: var(--acc2); font-size: 10px; }
.pc .mtrack { margin-top: 4px; }
.pc .nums { font-size: 9.5px; color: var(--mute); font-weight: 700; display: flex; justify-content: space-between; margin-top: 2px; }
#btMenu { display: flex; flex-direction: column; gap: 6px; }
.bt-cmds { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.bt-cmds .btn { flex-direction: column; gap: 2px; padding: 10px 4px; font-size: 12px; min-height: 56px; }
.bt-cmds .btn small { font-size: 9px; color: var(--mute); font-weight: 700; }
.bt-list { display: flex; flex-direction: column; gap: 5px; max-height: 140px; overflow-y: auto; }
.bt-t { display: flex; align-items: center; gap: 8px; text-align: left; padding: 10px 11px; min-height: 48px; border-radius: 10px; background: var(--bg0); border: 1px solid var(--line2); font-size: 13px; font-weight: 700; }
.bt-t:active { transform: scale(0.98); border-color: var(--acc); }
.bt-t:disabled { opacity: 0.4; pointer-events: none; }
.bt-t .el { font-size: 16px; }
.bt-t .mp { margin-left: auto; color: var(--cyan); font-size: 11px; font-weight: 800; flex: none; }
.bt-t .ds { font-size: 10.5px; color: var(--mute); font-weight: 600; }
.bt-target { display: flex; align-items: center; gap: 6px; background: var(--bg0); border: 1px solid var(--acc2); border-radius: 11px; padding: 8px; font-size: 13px; font-weight: 800; flex-wrap: wrap; }
.bt-target .tn { color: var(--gold); flex: 1; text-align: center; min-width: 90px; }
.bt-target .btn { min-height: 44px; padding: 8px 12px; width: auto; flex: 1; }
.bt-wait { font-size: 12px; color: var(--mute); font-weight: 700; text-align: center; padding: 10px; }
#btBanner { position: fixed; left: 50%; top: 30%; transform: translate(-50%, -50%); z-index: 26; font: 900 clamp(28px, 8vw, 48px) var(--disp); color: #fff; text-shadow: 0 0 30px var(--acc); pointer-events: none; animation: ban 1.1s ease forwards; }
@keyframes ban { 0% { opacity: 0; transform: translate(-50%, -50%) scale(1.6); } 25% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; } }
@media (min-width: 768px) {
  .bt-row { flex-direction: row; }
  #partyCards { flex-direction: column; width: 220px; flex: none; }
}

/* ===== ПАНЕЛИ ===== */
#panel { position: fixed; inset: 0; z-index: 40; background: linear-gradient(170deg, var(--surf2), var(--bg1)); display: flex; flex-direction: column; height: 100dvh; }
.p-head { display: flex; align-items: center; gap: 8px; padding: calc(10px + var(--safe-t)) 12px 10px; border-bottom: 1px solid var(--line); }
.p-head h2 { font: 700 15px var(--disp); flex: 1; }
.p-tabs { display: flex; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.p-tabs .chip { flex: none; }
#panelBody { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 12px calc(24px + var(--safe-b)); }
.p-sec { margin-bottom: 16px; }
.p-sec h4 { font: 700 11px var(--disp); letter-spacing: 1.2px; text-transform: uppercase; color: var(--acc2); margin-bottom: 8px; }
.eq-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.eq { background: var(--bg0); border: 1px dashed var(--line2); border-radius: 11px; padding: 8px 6px; text-align: center; min-height: 72px; }
.eq.f { border-style: solid; border-color: var(--acc); }
.eq .ei { font-size: 24px; }
.eq .en { font-size: 10px; font-weight: 800; margin-top: 4px; line-height: 1.2; }
.eq .el { font-size: 9px; color: var(--mute); font-weight: 700; text-transform: uppercase; }
.inv-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.icell { position: relative; background: var(--bg0); border: 1px solid var(--line2); border-radius: 11px; padding: 10px 4px 8px; text-align: center; min-height: 68px; }
.icell:active { transform: scale(0.95); border-color: var(--acc); }
.icell .ii { font-size: 24px; }
.icell .in { font-size: 9.5px; font-weight: 800; color: var(--dim); line-height: 1.2; margin-top: 4px; }
.icell .iq { position: absolute; top: 3px; right: 4px; font-size: 10px; font-weight: 800; color: var(--gold); background: var(--surf2); border-radius: 8px; padding: 0 5px; }
.shop-item { display: flex; align-items: center; gap: 10px; background: var(--bg0); border: 1px solid var(--line2); border-radius: 11px; padding: 10px; margin-bottom: 8px; }
.si-i { font-size: 24px; width: 40px; height: 40px; flex: none; display: grid; place-items: center; background: var(--surf2); border-radius: 10px; }
.si-n { flex: 1; min-width: 0; }
.si-n b { font-size: 13px; display: block; line-height: 1.3; }
.si-n small { font-size: 11px; color: var(--mute); font-weight: 600; }
.si-b { flex: none; text-align: right; }
.price { font-size: 13px; font-weight: 800; color: var(--gold); }
.si-btn { margin-top: 4px; font-size: 12px; font-weight: 800; padding: 8px 14px; min-height: 38px; border-radius: 9px; background: var(--grad-gold); color: #241300; width: 100%; }
.si-btn:disabled { opacity: 0.4; pointer-events: none; }
.si-btn.sell { background: var(--surf2); color: var(--ink); border: 1px solid var(--line2); }
.q-card { background: var(--bg0); border: 1px solid var(--line2); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
.q-card.main { border-color: var(--acc2); }
.q-card.ready { border-color: var(--green); }
.q-card.done { opacity: 0.6; }
.q-t { display: flex; gap: 7px; align-items: center; font-size: 13.5px; font-weight: 800; }
.q-t .tag { margin-left: auto; font-size: 9px; font-weight: 800; padding: 2px 8px; border-radius: 9px; color: var(--gold); border: 1px solid var(--acc2); flex: none; }
.q-d { font-size: 12px; color: var(--mute); margin: 6px 0 8px; line-height: 1.45; }
.q-p { display: flex; align-items: center; gap: 8px; }
.q-p .mtrack { flex: 1; height: 7px; }
.q-p .n { font-size: 11.5px; font-weight: 800; color: var(--dim); }
.q-r { font-size: 11.5px; color: var(--gold); font-weight: 700; margin-top: 6px; }
.q-btns { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.q-btns .btn { padding: 10px 14px; font-size: 12.5px; min-height: 42px; width: auto; flex: 1; }
.stat-row { display: flex; align-items: center; gap: 8px; padding: 7px 0; font-size: 13.5px; }
.stat-row .sn { flex: 1; font-weight: 700; color: var(--dim); }
.stat-row .sv { font: 800 15px var(--disp); color: var(--gold); }
.tech-row { display: flex; align-items: center; gap: 8px; background: var(--bg0); border: 1px solid var(--line2); border-radius: 10px; padding: 9px 10px; margin-bottom: 6px; font-size: 13px; }
.tech-row.lock { opacity: 0.45; }
.tech-row .tn { flex: 1; font-weight: 700; }
.tech-row .tm { font-size: 11.5px; color: var(--cyan); font-weight: 800; }
.set-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
.set-row label { flex: 1; font-size: 13.5px; font-weight: 700; color: var(--dim); }
.set-row label small { display: block; font-size: 11px; color: var(--mute); }
.set-row select, .set-row input { background: var(--bg0); border: 1px solid var(--line2); border-radius: 10px; padding: 10px; font-size: 13px; width: 160px; max-width: 45vw; }
.set-row input[type=range] { width: 120px; accent-color: var(--acc); }
.switch { position: relative; width: 48px; height: 28px; flex: none; }

const W = 48, H = 36, T = 32;
let mmCache = null;

function genWorld() {
 const r = mulberry(G.seed), set = SETS[G.setting], tiles = new Uint8Array(W * H);
 function at(x, y) { return tiles[y * W + x]; }
 function setT(x, y, v) { if (x >= 0 && y >= 0 && x < W && y < H) tiles[y * W + x] = v; }
 let x, y;
 for (y = 0; y < H; y++) for (x = 0; x < W; x++) setT(x, y, x >= 34 ? 8 : 0);
 for (y = 0; y < H; y++) { const rx = 30 + Math.round(Math.sin(y * 0.4) * 1.4); setT(rx, y, 2); setT(rx + 1, y, 2); }
 for (y = 16; y <= 19; y++) for (x = 28; x <= 33; x++) setT(x, y, 7);
 for (x = 2; x < 47; x++) { setT(x, 17, 3); setT(x, 18, 3); }
 for (y = 11; y <= 26; y++) { setT(6, y, 3); setT(10, y, 3); }
 const buildings = [{x:3,y:11,w:3,h:3,e:'🛒'}, {x:8,y:11,w:3,h:3,e:'🛏️'}, {x:3,y:21,w:4,h:3,e:'📜'}, {x:9,y:21,w:3,h:3,e:'⚒️'}, {x:12,y:13,w:2,h:3,e:'💚'}];
 buildings.forEach(b => { for (let by = b.y; by < b.y + b.h; by++) for (let bx = b.x; bx < b.x + b.w; bx++) setT(bx, by, 4); });
 for (y = 0; y < H; y++) for (x = 14; x < W; x++) {
  const t = at(x, y); if (t !== 0 && t !== 8) continue; if (y >= 16 && y <= 19) continue;
  const d = x >= 34 ? 0.13 : 0.15;
  if (r() < d) setT(x, y, x >= 34 && r() < 0.5 ? 9 : 1);
  else if (r() < 0.05) setT(x, y, 6);
 }
 for (y = 10; y <= 26; y++) for (x = 2; x <= 13; x++) if (at(x, y) === 1) setT(x, y, 0);
 
 function walk(wx, wy) { const tt = at(Math.floor(wx), Math.floor(wy)); return tt !== 1 && tt !== 2 && tt !== 4 && tt !== 9; }
 function findSpot(x0, x1) {
  for (let i = 0; i < 200; i++) {
   const sx = x0 + r() * (x1 - x0), sy = 3 + r() * (H - 6);
   if (walk(sx, sy) && walk(sx + 1, sy) && walk(sx, sy + 1)) return { x: sx * T + T / 2, y: sy * T + T / 2 };
  }
  return { x: (x0 + 2) * T, y: 17 * T };
 }
 
 R.world = { tiles: tiles, buildings: buildings, walk: walk, set: set };
 const npcDefs = [{role:'merchant',x:4.5,y:15.2}, {role:'bard',x:8,y:16.2}, {role:'healer',x:12.5,y:17.2}, {role:'guard',x:13.5,y:19}, {role:'guild',x:5,y:20.2}, {role:'smith',x:10.5,y:20.2}, {role:'wander',x:22,y:12}];
 const npcCols = ['#ffb020','#ff2e97','#6dff9c','#8a93b5','#c44dff','#ff7a3d','#3fd9ff'];

  const nr = mulberry(G.seed + i * 77);
  return { id: 'npc' + i, role: d.role, name: set.npc[Math.floor(nr() * set.npc.length)], x: d.x * T, y: d.y * T, hx: d.x * T, hy: d.y * T, face: 1, walk: 0, dir: 0, dt: 0, seed: G.seed + i * 77, col: npcCols[i], skin: SKINS[Math.floor(nr() * 4)], hair: HAIRS[Math.floor(nr() * 6)], trait: BANK.trait[Math.floor(nr() * 3)] };
 });
 
 R.foes = [];
 const wildShapes = G.setting === 'neo' ? ['drone', 'slime', 'bat'] : ['slime', 'wolf', 'bat'];
 const deepShapes = ['golem', 'wraith'];
 for (let i = 0; i < 8; i++) { const p = findSpot(15, 29); R.foes.push(mkMapFoe(wildShapes[i % 3], p.x, p.y, false)); }
 for (let j = 0; j < 4; j++) { const p2 = findSpot(35, 46); R.foes.push(mkMapFoe(deepShapes[j % 2], p2.x, p2.y, true)); }

 R.chests = [];
 for (let k = 0; k < 6; k++) {
  const cp = k === 0 ? { x: 11 * T, y: 25 * T } : findSpot(k < 3 ? 15 : 35, k < 3 ? 29 : 46);
  R.chests.push({ id: 'ch' + k, x: cp.x, y: cp.y, locked: r() < 0.5 });
 }

 G.quests.forEach(q => { if (q.type === 'reach' && q.state === 'active') spawnBeacon(q); });

function mkMapFoe(shape, x, y, deep) { return { id: uid(), shape: shape, x: x, y: y, hx: x, hy: y, deep: deep, face: 1, walk: 0, dir: Math.random() * 7, dt: 0, aggro: false, dead: false, respawn: 0 }; }

function zoneOf(x) { const t = x / T; return t < 14 ? 0 : t < 34 ? 1 : 2; }
function zoneName() { return SETS[G.setting].zones[zoneOf(R.player.x)]; }
function paused() { return !!(R.dialog || R.panel || R.event || $('#modalRoot').children.length); }

function updateWorld(dt) {
 const p = R.player;
 if (!paused()) {
  let dx = 0, dy = 0, k = R.keys;
  if (k['w'] || k['arrowup'] || k['ц']) dy -= 1; if (k['s'] || k['arrowdown'] || k['ы']) dy += 1;
  if (k['a'] || k['arrowleft'] || k['ф']) dx -= 1; if (k['d'] || k['arrowright'] || k['в']) dx += 1;
  dx += R.joy.x; dy += R.joy.y;
  
  if (R.moveTarget && !dx && !dy) {
   const mx = R.moveTarget.x - p.x, my = R.moveTarget.y - p.y, md2 = Math.hypot(mx, my);
   if (md2 < 8) { const mn = R.moveNPC; R.moveTarget = null; R.moveNPC = null; if (mn && Math.hypot(mn.x - p.x, mn.y - p.y) < 60) openDialog(mn); }
   else { dx = mx / md2; dy = my / md2; }
  }
  
  const len = Math.hypot(dx, dy);
  if (len > 0) {
   dx /= len; dy /= len;
   const spd = (k['shift'] ? 185 : 135) * dt;
   tryMove(p, dx * spd, dy * spd);
   p.face = dx < 0 ? -1 : dx > 0 ? 1 : p.face;
   p.walk += dt * 1.6;

  }

  R.cat.x += (cx - R.cat.x) * Math.min(dt * 4, 1);
  R.cat.y += (cy - R.cat.y) * Math.min(dt * 4, 1);
  R.cat.face = p.face; R.cat.walk = len > 0 ? p.walk : 0;
  
  G.clock += dt * 2.2;
  if (G.clock >= 1440) { G.clock -= 1440; G.day++; G.shop = null; toast('🌅', 'День ' + G.day + '. Лавки обновили товар.', 'good'); }
  
  R.npcs.forEach(n => {
   if (n.role !== 'wander') return;
   n.dt -= dt; if (n.dt <= 0) { n.dt = ri(2, 5); n.dir = Math.random() * 7; }
   const nx = n.x + Math.cos(n.dir) * 22 * dt, ny = n.y + Math.sin(n.dir) * 22 * dt;
   if (Math.hypot(nx - n.hx, ny - n.hy) < 70 && R.world.walk(nx / T, ny / T)) { n.x = nx; n.y = ny; n.walk += dt; n.face = Math.cos(n.dir) < 0 ? -1 : 1; }
   else n.dir += 2;
  });
  
  const aggroR = Math.max(58, 105 - attr('agi') * 2.5);
  for (let fi = 0; fi < R.foes.length; fi++) {
   const f = R.foes[fi];
   if (f.dead) { f.respawn -= dt; if (f.respawn <= 0) { f.dead = false; f.x = f.hx; f.y = f.hy; } continue; }
   const d = Math.hypot(p.x - f.x, p.y - f.y);
   f.aggro = d < aggroR && zoneOf(p.x) > 0;
   if (f.aggro) {
    const a = Math.atan2(p.y - f.y, p.x - f.x);
    f.x += Math.cos(a) * 62 * dt; f.y += Math.sin(a) * 62 * dt;
    f.face = Math.cos(a) < 0 ? -1 : 1; f.walk += dt * 1.5;
   } else {
    f.dt -= dt; if (f.dt <= 0) { f.dt = ri(2, 4); f.dir = Math.random() * 7; }
    const fx2 = f.x + Math.cos(f.dir) * 26 * dt, fy2 = f.y + Math.sin(f.dir) * 26 * dt;
    if (Math.hypot(fx2 - f.hx, fy2 - f.hy) < 80 && R.world.walk(fx2 / T, fy2 / T)) { f.x = fx2; f.y = fy2; f.walk += dt; f.face = Math.cos(f.dir) < 0 ? -1 : 1; }
    else f.dir += 2;
   }
   if (d < 24 && R.invuln <= 0) { startBattle(f, false); return; }
  }
  R.invuln = Math.max(0, R.invuln - dt);
  
  R.waypoints.forEach(wpt => {
   if (G.discovered.indexOf(wpt.id) < 0 && Math.hypot(p.x - wpt.x, p.y - wpt.y) < 70) {
    G.discovered.push(wpt.id); toast('🗺️', 'Открыта точка: ' + wpt.n, 'good'); sfx('quest');
   }
  });
  
  if (G.settings.freq === 'on' && performance.now() > R.eventAt && zoneOf(p.x) > 0 && !R.battle) {
   genEvent(); R.eventAt = performance.now() + ri(45000, 85000) * (G.brole === 'master' ? 0.7 : 1);
  }
  updateInteract();
 }
 
 R.cam.x += (p.x - VW / 2 - R.cam.x) * Math.min(dt * 5, 1);
 R.cam.y += (p.y - VH / 2 - R.cam.y) * Math.min(dt * 5, 1);
 R.cam.x = clamp(R.cam.x, 0, Math.max(0, W * T - VW));
 R.cam.y = clamp(R.cam.y, 0, Math.max(0, H * T - VH));
 
 updateParts(dt);
 R.hudT += dt; if (R.hudT > 0.25) { R.hudT = 0; updateHUD(); }
}

function tryMove(p, dx, dy) {

 function ok(x, y) { return wk((x - r) / T, (y - r) / T) && wk((x + r) / T, (y - r) / T) && wk((x - r) / T, (y + r) / T) && wk((x + r) / T, (y + r) / T) && x > r && y > r && x < W * T - r && y < H * T - r; }
 if (ok(p.x + dx, p.y)) p.x += dx;
 if (ok(p.x, p.y + dy)) p.y += dy;
}

}

function countItem(id) { let n = 0; G.inv.forEach(i => { if (i.id === id) n += i.qty; }); return n; }
function addItem(id, qty) { let it = null; G.inv.forEach(i => { if (i.id === id) it = i; }); if (it) it.qty += qty; else G.inv.push({ id: id, qty: qty }); trackQuests(); save(); }
function removeItem(id, qty) { let it = null; G.inv.forEach(i => { if (i.id === id) it = i; }); if (!it) return; it.qty -= qty; if (it.qty <= 0) G.inv = G.inv.filter(i => i.id !== id); trackQuests(); }

function genQuest(giver) {
 const set = SETS[G.setting], type = pick(['kill', 'collect', 'choice', 'reach']), id = uid();
 const q = { id: id, type: type, giver: giver.id, giverName: giver.name, state: 'active', seed: hex(), need: 0, prog: 0 };
 if (type === 'kill') {
  const wilds = G.setting === 'neo' ? ['drone', 'slime', 'bat'] : ['slime', 'wolf', 'bat'];
  q.target = pick(wilds); q.targetName = set.foes[q.target]; q.need = ri(3, 5);
  q.title = pick(BANK.questT.kill).replace('{foe}', q.targetName);
  q.desc = pick(BANK.questD.kill).replace('{foe}', q.targetName).replace('{need}', q.need).replace('{place}', pick(set.places));
  const wp = R.waypoints[1]; G.waypoint = { x: wp.x, y: wp.y, label: q.targetName };
 } else if (type === 'collect') {
  q.target = chance(70) ? 'mat1' : 'mat2'; q.need = q.target === 'mat2' ? 2 : ri(2, 4);
  q.title = pick(BANK.questT.collect).replace('{mat}', iname(q.target));
  q.desc = pick(BANK.questD.collect).replace('{mat}', iname(q.target)).replace('{need}', q.need).replace('{place}', pick(set.places));
 } else if (type === 'choice') {
  q.target = 'mat2'; q.need = 1; q.price = ri(40, 80);
  q.title = pick(BANK.questT.choice).replace('{mat}', iname('mat2'));
  q.desc = pick(BANK.questD.choice).replace('{mat}', iname('mat2'));
 } else {
  q.need = 1; q.deep = chance(40);
  q.title = pick(BANK.questT.reach).replace('{place}', pick(set.places));
  q.desc = pick(BANK.questD.reach).replace('{place}', pick(set.places));
 }
 q.reward = { g: ri(45, 90) + G.lvl * 8, x: ri(30, 55) + G.lvl * 5, item: chance(50) ? pick(['hipot', 'ether', 'antidote', 'phoenix']) : null };
 return q;
}

function foeDef(shape, deep) {
 const b = FOES[shape], set = SETS[G.setting], sc = (deep ? 1.5 : 1) * (1 + G.ng * 0.3) * { easy: 0.8, normal: 1, hard: 1.3 }[G.settings.diff];
 return { shape: shape, name: shape === set.bossShape ? set.boss : (set.foes[shape] || set.boss), hp: Math.round(b.hp * sc), maxHp: Math.round(b.hp * sc), mp: 20, atk: Math.round(b.atk * sc), def: b.def, spd: b.spd, xp: Math.round(b.xp * (deep ? 1.4 : 1)), g: Math.round(b.g * (deep ? 1.4 : 1)), weak: shape === set.bossShape ? set.bossWeak : b.weak, resist: b.resist, sp: b.sp, boss: !!b.boss, deep: deep };
}

function startBattle(mapFoe, boss) {
 if (R.battle) return;
 closeDialog(); closePanel(); R.moveTarget = null; R.event = null;
 const deep = zoneOf(R.player.x) === 2, foes = [];

 const h = heroD(), cd = catD();

function btLog(t, cls) {
 const B = R.battle; if (!B) return;
 B.log.push({ t: t, cls: cls }); if (B.log.length > 3) B.log.shift();
 $('#btLog').innerHTML = B.log.map(l => '<div class="' + (l.cls || '') + '">' + l.t + '</div>').join('');

function updateBattle(dt) {
 const B = R.battle; if (!B) return;
 B.shake = Math.max(0, B.shake - dt * 3);
 if (B.phase === 'intro') { B.introT -= dt; if (B.introT <= 0) { B.phase = 'run'; renderBattleUI(); } return; }
 if (B.phase === 'end') return;
 
 let i, u;
 if (B.phase === 'anim') {
  const a = B.anim; a.t += dt;
  if (!a.applied && a.t >= 0.32) { a.applied = true; applyAction(a.actor, a.act, a.target); }
  for (i = 0; i < B.allies.length; i++) { u = B.allies[i]; u.flash = Math.max(0, u.flash - dt * 4); u.lunge = Math.max(0, u.lunge - dt * 2.5); }
  for (i = 0; i < B.foes.length; i++) { u = B.foes[i]; u.flash = Math.max(0, u.flash - dt * 4); u.lunge = Math.max(0, u.lunge - dt * 2.5); if (u.dead) u.fade = Math.max(0, u.fade - dt * 2); }
  updateBattleFX(dt); renderBattleBars();
  if (a.t >= a.dur) finishAction();
  return;
 }
 
 const waitPause = G.settings.wait && B.phase === 'menu';
 const all = B.allies.concat(B.foes);
 for (i = 0; i < all.length; i++) {
  u = all[i]; if (u.dead) continue;
  if (u.st.stun > 0) { u.st.stun -= dt; continue; }
  if (!waitPause) u.atb = Math.min(100, u.atb + u.spd * 5.5 * G.settings.bspeed * dt);
  u.flash = Math.max(0, u.flash - dt * 4); u.lunge = Math.max(0, u.lunge - dt * 2.5);
 }
 for (i = 0; i < B.foes.length; i++) if (B.foes[i].dead) B.foes[i].fade = Math.max(0, B.foes[i].fade - dt * 2);
 
 for (i = 0; i < B.foes.length; i++) {
  const f = B.foes[i]; if (!f.dead && f.atb >= 100) { foeAct(f); return; }
 }
 for (i = 0; i < B.allies.length; i++) {
  const al = B.allies[i]; if (!al.dead && al.atb >= 100) {
   const manual = al.id === 'hero' || !G.settings.auto;
   if (manual) { if (B.phase !== 'menu') { B.phase = 'menu'; B.menuUnit = al; B.menu = 'root'; B.pending = null; renderBattleUI(); sfx('menu'); } return; }
   aiAct(al); return;
  }
 }
 updateBattleFX(dt); renderBattleBars();
}

function updateBattleFX(dt) {
 const B = R.battle;
 for (let i = B.fx.length - 1; i >= 0; i--) { B.fx[i].t += dt; if (B.fx[i].t > B.fx[i].life) B.fx.splice(i, 1); }
 for (let i = B.nums.length - 1; i >= 0; i--) { B.nums[i].t += dt; B.nums[i].y -= 40 * dt; if (B.nums[i].t > 1) B.nums.splice(i, 1); }
}

function calcDmg(att, def, pow, el, pierce) {
 let base = att.atk * pow, d = def.def * (el === 'phys' && !pierce ? 1 : pierce ? 0 : 0.5);
 if (def.st.defDown) d *= 0.6; if (att.st.atkUp) base *= 1.3; if (def.st.defUp) d *= 1.5;
 let dmg = Math.max(1, Math.round((base - d) * (0.9 + Math.random() * 0.2))), weak = false, resist = false, crit = false;
 if (el !== 'phys' && el !== 'heal' && el !== 'buff' && el !== 'debuff') {
  if (def.weak === el) { dmg = Math.round(dmg * 1.5); weak = true; def.revealed = true; }
  else if (def.resist === el) { dmg = Math.round(dmg * 0.5); resist = true; def.revealed = true; }
 }
 if (chance(att.crit || 7)) { dmg = Math.round(dmg * 1.6); crit = true; }
 return { dmg: dmg, weak: weak, resist: resist, crit: crit };
}

function applyDmg(u, d) { u.hp = Math.max(0, u.hp - d); u.flash = 1; if (u.hp <= 0) { u.dead = true; u.atb = 0; } }
function addNum(x, y, txt, color, crit) { R.battle.nums.push({ x: x + ri(-10, 10), y: y - 30, txt: txt, color: color, t: 0, crit: crit }); }
function addFx(kind, x, y, el) {
 const B = R.battle, c = EL[el] ? EL[el].c : '#fff', n = kind === 'big' ? 18 : 9;
 for (let i = 0; i < n; i++) {
  const a = Math.random() * 7, sp = ri(30, 120);
  B.fx.push({ x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 40, t: 0, life: 0.5 + Math.random() * 0.4, c: c, r: ri(2, 4), kind: kind });
 }
 if (kind === 'slash') B.fx.push({ x: x, y: y, t: 0, life: 0.3, c: '#fff', kind: 'arc' });
}
function actorName(u) { return u.id === 'hero' ? G.name : u.id === 'barsik' ? 'Барсик' : u.name; }

function beginAction(actor, act, target) {
 const B = R.battle; actor.atb = 0; actor.lunge = 1;
 if (actor.st.poison) { const pd = Math.max(2, Math.round(actor.maxHp * 0.05)); actor.hp = Math.max(1, actor.hp - pd); addNum(actor.x, actor.y, '-' + pd, '#9dff3f'); }
 if (actor.st.atkUp) actor.st.atkUp--; if (actor.st.defUp) actor.st.defUp--;
 B.phase = 'anim'; B.anim = { actor: actor, act: act, target: target, t: 0, dur: 0.7, applied: false }; B.pending = null; renderBattleUI();
}

function applyAction(actor, act, target) {
 const B = R.battle; if (!B) return;
 let i;
 if (act.kind === 'charge') return;
 if (act.kind === 'bossAoE') {
  const targets = B.allies.filter(a => !a.dead);
  for (i = 0; i < targets.length; i++) {
   const t0 = targets[i]; const r0 = calcDmg(actor, t0, 2, 'phys');
   applyDmg(t0, r0.dmg); addNum(t0.x, t0.y, r0.dmg, '#ff4d5e'); addFx('big', t0.x, t0.y - 14, 'fire');
  }
  btLog('💥 ' + actor.name + ' обрушивает СОКРУШЕНИЕ!', 'lw'); sfx('crit'); haptic('heavy'); B.shake = 0.8; renderBattleBars(); return;
 }
 if (act.kind === 'attack') {
  const r = calcDmg(actor, target, 1, 'phys');
  applyDmg(target, r.dmg); addNum(target.x, target.y, r.dmg, r.crit ? '#ffcf5c' : '#fff', r.crit); addFx('slash', target.x, target.y - 14, 'phys');
  btLog('⚔️ ' + actorName(actor) + ' → ' + target.name + ': <b>' + r.dmg + '</b>' + (r.crit ? ' КРИТ!' : '') + (r.weak ? ' СЛАБОСТЬ!' : ''), 'lc');
  sfx(r.crit ? 'crit' : 'hit'); haptic('light'); B.shake = r.crit ? 0.5 : 0.25;
 } else if (act.kind === 'tech') {
  const tc = act.tech; actor.mp -= tc.mp;
  if (tc.el === 'heal') {
   const hs = tc.tgt === 'allAllies' ? B.allies.filter(a => !a.dead) : tc.tgt === 'self' ? [actor] : [target];
   for (i = 0; i < hs.length; i++) {
    const t = hs[i]; if (!t) continue;
    if (tc.revive && t.dead) { t.dead = false; t.hp = Math.round(t.maxHp * 0.5); btLog('💫 ' + actorName(t) + ' возвращается к жизни!', 'lh'); }
    else if (!t.dead) {
     const heal = Math.round(actor.atk * tc.pow + 10); t.hp = Math.min(t.maxHp, t.hp + heal); addNum(t.x, t.y, '+' + heal, '#6dff9c');
     if (tc.cure) t.st = {}; addFx('heal', t.x, t.y - 14, 'heal');
    }
   }
   btLog('💚 ' + actorName(actor) + ': ' + tc.n + '!', 'lh'); sfx('heal');
  } else if (tc.el === 'buff') {
   const bs = B.allies.filter(a => !a.dead);
   for (i = 0; i < bs.length; i++) { bs[i].st[tc.st] = 3; addFx('buff', bs[i].x, bs[i].y - 14, 'buff'); addNum(bs[i].x, bs[i].y, tc.st === 'atkUp' ? 'АТК↑' : 'ЗАЩ↑', '#3fd9ff'); }
   btLog('⬆️ ' + tc.n + ' — отряд усилен!', 'li'); sfx('magic');
  } else {
   const fs = tc.tgt === 'allFoes' ? B.foes.filter(f => !f.dead) : [target];
   for (i = 0; i < fs.length; i++) {
    const ft = fs[i]; if (!ft) continue;
    if (tc.reveal) { ft.revealed = true; ft.st.defDown = 3; addNum(ft.x, ft.y, 'ЗАЩ↓', '#ff9d5c'); btLog('🔍 ' + ft.name + ': слабость ' + EL[ft.weak].e + ', защита снижена!', 'li'); continue; }
    const hits = tc.hits || 1;
    for (let hh = 0; hh < hits; hh++) {
     const rr2 = calcDmg(actor, ft, tc.pow, tc.el, tc.pierce);
     applyDmg(ft, rr2.dmg); addNum(ft.x, ft.y, rr2.dmg, rr2.crit ? '#ffcf5c' : EL[tc.el].c, rr2.crit);
     if (tc.st && !ft.dead) ft.st[tc.st] = tc.st === 'stun' ? 1.6 : 3;
     btLog(EL[tc.el].e + ' ' + tc.n + ' → ' + ft.name + ': <b>' + rr2.dmg + '</b>' + (rr2.weak ? ' СЛАБОСТЬ!' : ''), 'lc');
    }
    addFx('spell', ft.x, ft.y - 14, tc.el);
    if (tc.gold) { G.gold += tc.gold; G.stats.goldEarned += tc.gold; addNum(ft.x, ft.y - 20, '+' + tc.gold + '🪙', '#ffcf5c'); }
   }
   sfx('magic'); haptic('light'); B.shake = 0.3;
  }
 } else if (act.kind === 'item') {
  const u = ITEMS[act.item]; removeItem(act.item, 1);

  if (u.use.mp) { target.mp = Math.min(target.maxMp, target.mp + u.use.mp); addNum(target.x, target.y, '+' + u.use.mp + 'MP', '#3fd9ff'); sfx('heal'); }

  if (u.use.cure) { target.st = {}; sfx('heal'); }
  if (u.use.revive && target.dead) { target.dead = false; target.hp = Math.round(target.maxHp * 0.5); sfx('heal'); }
  if (u.use.dmg) { applyDmg(target, u.use.dmg); addNum(target.x, target.y, u.use.dmg, '#ff7a3d'); addFx('spell', target.x, target.y - 14, 'fire'); sfx('hit'); }
  btLog('🎒 ' + iname(act.item), 'li');
 } else if (act.kind === 'dual') {
  const d = DUALS[G.cls];
  for (i = 0; i < B.allies.length; i++) { B.allies[i].mp -= 8; B.allies[i].lunge = 1; }
  const df = B.foes.filter(f => !f.dead);
  for (i = 0; i < df.length; i++) {
   const dr = calcDmg({ atk: (B.allies[0].atk + B.allies[1].atk) * 0.75, crit: 15 }, df[i], d.pow, d.el);
   applyDmg(df[i], dr.dmg); addNum(df[i].x, df[i].y, dr.dmg, '#ffcf5c', true); addFx('big', df[i].x, df[i].y - 14, d.el);
  }
  if (d.heal) for (i = 0; i < B.allies.length; i++) { B.allies[i].hp = Math.min(B.allies[i].maxHp, B.allies[i].hp + Math.round(B.allies[i].maxHp * d.heal)); }
  btLog('🔗 ДВОЙНАЯ ТЕХНИКА «' + d.n + '»!', 'lc'); sfx('crit'); haptic('heavy'); B.shake = 1;
 }

}

function finishAction() {
 const B = R.battle; if (!B) return; B.anim = null;
 if (B.foes.every(f => f.dead)) { endBattle('win'); return; }
 if (B.allies.every(a => a.dead)) { endBattle('lose'); return; }
 B.phase = 'run'; B.menuUnit = null; renderBattleUI();
}

function foeAct(f) {
 const B = R.battle;
 if (f.boss) {
  f.pi++;
  if (f.pi % 3 === 0) {
   f.charge = true; f.atb = 0;
   btLog('⚠️ ' + f.name + ' готовит СОКРУШЕНИЕ! Защищайся!', 'lw');
   addNum(f.x, f.y, '⚠️', '#ff9d5c');
   B.phase = 'anim'; B.anim = { actor: f, act: { kind: 'charge' }, target: null, t: 0, dur: 0.5, applied: true };
   renderBattleUI(); return;
  }
  if (f.charge) { f.charge = false; beginAction(f, { kind: 'bossAoE' }, null); return; }
 }
 const alive = B.allies.filter(a => !a.dead);
 const t = chance(35) ? alive.reduce((a, b) => a.hp < b.hp ? a : b) : pick(alive);
 const useSp = f.sp && f.mp >= f.sp.mp && chance(40);
 if (useSp) {
  f.mp -= f.sp.mp;
  const sp2 = { n: f.sp.n, el: f.sp.el, pow: f.sp.pow, st: f.sp.st, tgt: 'foe' };
  beginAction(f, { kind: 'tech', tech: sp2 }, t);
 } else beginAction(f, { kind: 'attack' }, t);
}

function aiAct(a) {
 const B = R.battle, foes = B.foes.filter(f => !f.dead), allies = B.allies.filter(x => !x.dead);
 const low = allies.reduce((x, y) => x.hp / x.maxHp < y.hp / y.maxHp ? x : y);
 let tech = null;
 if (low.hp / low.maxHp < 0.5) tech = a.techs.find(t => t.el === 'heal' && t.mp <= a.mp && !t.revive);
 if (!tech) {
  const wf = foes.find(f => f.revealed && a.techs.some(t => t.el === f.weak && t.mp <= a.mp));
  if (wf) tech = a.techs.find(t => t.el === wf.weak && t.mp <= a.mp);
 }
 if (!tech && foes.length > 1) tech = a.techs.find(t => t.tgt === 'allFoes' && t.mp <= a.mp);
 if (!tech) tech = a.techs.find(t => t.tgt === 'foe' && t.mp <= a.mp && t.el !== 'debuff');
 if (tech) {
  const tgt = tech.el === 'heal' ? low : tech.tgt === 'foe' ? foes[0] : null;
  beginAction(a, { kind: 'tech', tech: tech }, tgt);
 } else beginAction(a, { kind: 'attack' }, foes[0]);
}

function chooseTech(i) {

function chooseItem(i) {

 B.menu = 'target'; renderMenu(); sfx('menu');
}
function confirmTarget() {
 const B = R.battle, p = B.pending; if (!p) return;

  tgt = B.allies[p.target]; if (!tgt) return;

  const alive = B.foes.filter(f => !f.dead); tgt = alive[p.target]; if (!tgt) return;

}
function cycleTarget(d) {

function tryFlee() {
 const B = R.battle; if (B.boss) { btLog('👑 От босса не сбежать!', 'lw'); return; }
 const avgA = B.allies.reduce((s, a) => s + a.spd, 0) / 2, avgF = B.foes.reduce((s, f) => s + f.spd, 0) / B.foes.length;
 if (chance(clamp(60 + (avgA - avgF) * 3, 25, 92))) { btLog('🏃 Отряд ускользает!', 'li'); endBattle('flee'); }
 else { btLog('🚫 Побег не удался!', 'lw'); B.menuUnit.atb = 0; B.phase = 'run'; B.menuUnit = null; renderBattleUI(); }

function battleKeys(k) {

function gainXp(x) {
 G.xp += x; let ups = 0;
 while (G.xp >= needXp()) { G.xp -= needXp(); G.lvl++; G.pts++; ups++; }
 if (ups) {
  const h = heroD(), cd = catD();
  G.party[0].hp = h.maxHp; G.party[0].mp = h.maxMp; G.party[1].hp = cd.maxHp; G.party[1].mp = cd.maxMp;
  sfx('level');
  TECHS[G.cls].concat(BTECHS[G.brole]).forEach(t => { if (t.lvl === G.lvl) toast('✨', 'Новая техника: ' + t.n, 'good'); });
  toast('⬆️', 'Уровень ' + G.lvl + '! +1 очко (панель Герой)', 'good');

function renderBattle(t) {
 const B = R.battle; if (!B) return;
 const c = ctx, p = SETS[G.setting].pal, zone = zoneOf(R.player.x);
 const shx = (Math.random() - 0.5) * B.shake * 12, shy = (Math.random() - 0.5) * B.shake * 8;
 c.save(); c.translate(shx, shy);
 const g = c.createLinearGradient(0, 0, 0, VH); g.addColorStop(0, p.sky[0]); g.addColorStop(0.55, p.sky[1]); g.addColorStop(1, p.sky[2]); c.fillStyle = g; c.fillRect(-20, -20, VW + 40, VH + 40);
 c.fillStyle = 'rgba(0,0,0,.25)';
 for (let i = 0; i < 7; i++) {
  const x = (i * 173 + 40) % VW, h = 50 + ((i * 97) % 80);
  if (G.setting === 'neo') c.fillRect(x, VH * 0.4 - h, 50, h + 40);
  else { c.beginPath(); c.moveTo(x - 60, VH * 0.46); c.lineTo(x, VH * 0.46 - h); c.lineTo(x + 60, VH * 0.46); c.closePath(); c.fill(); }
 }
 const gg = c.createLinearGradient(0, VH * 0.46, 0, VH); gg.addColorStop(0, zone === 2 ? p.deep : p.g1); gg.addColorStop(1, p.g2); c.fillStyle = gg; c.fillRect(-20, VH * 0.46, VW + 40, VH * 0.54 + 20);
 
 function drawUnit(u, isFoe) {
  if (isFoe && u.dead && u.fade <= 0) return;
  c.globalAlpha = isFoe && u.dead ? u.fade : 1;
  c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(u.x, u.y + 4, u.boss ? 30 : 20, 7, 0, 0, 7); c.fill();
  const lx = u.lunge > 0 ? (isFoe ? 1 : -1) * Math.sin(u.lunge * Math.PI) * 32 : 0;
  if (isFoe) drawFoe(c, u.x + lx, u.y, u.scale, u.shape, p, t * 0.001, u.flash);
  else if (u.id === 'hero') drawHero(c, u.x + lx, u.y, 2.3 * B.us, -1, u.lunge > 0 ? t * 0.02 : 0, G.look, G.cls);
  else drawCat(c, u.x + lx, u.y, 2.3 * B.us, -1, u.lunge > 0 ? t * 0.02 : 0, G.brole);
  if (u.dead && !isFoe) { c.globalAlpha = 0.5; c.fillStyle = '#000'; c.beginPath(); c.ellipse(u.x, u.y - 10, 18, 24, 0, 0, 7); c.fill(); }
  c.globalAlpha = 1;
  if (isFoe && !u.dead) {
   const bw = u.boss ? 100 : 70, top = u.y - (u.boss ? 86 : 58);
   c.fillStyle = 'rgba(0,0,0,.55)'; rr(c, u.x - bw / 2, top, bw, 6, 3); c.fill();
   c.fillStyle = '#ff4d5e'; rr(c, u.x - bw / 2, top, bw * u.hp / u.maxHp, 6, 3); c.fill();
   c.font = '700 10.5px Manrope'; c.textAlign = 'center'; c.fillStyle = '#fff'; c.fillText(u.name, u.x, top - 7);
   if (u.revealed) { c.font = '11px sans-serif'; c.fillText(EL[u.weak].e, u.x + bw / 2 + 11, top + 6); }
   if (u.charge) { c.font = '15px sans-serif'; c.fillText('⚠️', u.x, top - 20); }
   if (B.pending && B.pending.tgtMode === 'foe' && B.phase === 'menu') {
    const alive = B.foes.filter(f => !f.dead);
    if (alive[B.pending.target] === u) { c.strokeStyle = '#ffcf5c'; c.lineWidth = 2.5; c.beginPath(); c.ellipse(u.x, u.y + 4, (u.boss ? 36 : 26) + Math.sin(t * 0.008) * 3, 10, 0, 0, 7); c.stroke(); }
   }
  }
  c.textAlign = 'left';
 }
 B.foes.forEach(f => drawUnit(f, true));
 B.allies.forEach(a => drawUnit(a, false));
 B.fx.forEach(f => {
  const a = 1 - f.t / f.life; c.globalAlpha = a;
  if (f.kind === 'arc') { c.strokeStyle = f.c; c.lineWidth = 3; c.beginPath(); c.arc(f.x, f.y, 24 * (1 + f.t * 3), -0.6, 1.2); c.stroke(); }
  else { c.fillStyle = f.c; c.beginPath(); c.arc(f.x + f.vx * f.t, f.y + f.vy * f.t + 60 * f.t * f.t, f.r * a, 0, 7); c.fill(); }
 });
 c.globalAlpha = 1;
 B.nums.forEach(n => {
  c.globalAlpha = 1 - n.t; c.font = (n.crit ? '900 24px' : '800 18px') + ' Unbounded'; c.textAlign = 'center';
  c.fillStyle = 'rgba(0,0,0,.5)'; c.fillText(n.txt, n.x + 2, n.y + 2); c.fillStyle = n.color; c.fillText(n.txt, n.x, n.y); c.textAlign = 'left';
 });
 c.globalAlpha = 1; c.restore();
}

}
function closePanel() { R.panel = null; $('#panel').classList.add('hidden'); }

function useItemWorld(id, t) {
 const d = ITEMS[id]; if (!d || d.t !== 'cons' || countItem(id) < 1) return;
 const idx = t === 'cat' ? 1 : 0, dd = idx ? catD() : heroD(), u = G.party[idx];
 if (d.use.revive) { toast('🪶', 'Воскрешение — только в бою', 'warn'); return; }
 if (d.use.dmg || d.use.flee) { toast('💣', 'Боевые предметы — только в бою', 'warn'); return; }
 if (d.use.hp) u.hp = clamp(u.hp + d.use.hp, 0, dd.maxHp);
 if (d.use.mp) u.mp = clamp(u.mp + d.use.mp, 0, dd.maxMp);
 if (d.use.full) { u.hp = dd.maxHp; u.mp = dd.maxMp; }
 removeItem(id, 1); sfx('heal'); toast(d.e, iname(id) + ' использован', 'good'); renderPanel(); updateHUD();
}

function equipItem(id) {
 const d = ITEMS[id]; if (d.t !== 'weapon' && d.t !== 'armor' && d.t !== 'acc') return;
 removeItem(id, 1); const old = G.equip[d.t]; G.equip[d.t] = id; if (old) addItem(old, 1);
 clampParty(); sfx('menu'); toast(d.e, iname(id) + ' экипировано', 'good'); closeModal(); renderPanel(); updateHUD();
}

function ensureStock() {
 if (G.shop && G.shop.day === G.day && G.shop.stock && G.shop.stock.length) return;
 const tier = Math.min(4, 1 + Math.floor(G.lvl / 2));
 const stock = ['potion', 'potion', 'hipot', 'ether', 'antidote', 'phoenix', 'bomb', 'smoke', 'w' + tier, 'a' + tier, pick(['claw', 'heart', 'mind', 'luck'])];
 if (G.lvl >= 4) stock.push('w' + Math.min(4, tier + 1));
 if (G.lvl >= 5) stock.push('elixir');
 G.shop = { day: G.day, stock: stock.map(id => ({ id: id, qty: (ITEMS[id].t === 'weapon' || ITEMS[id].t === 'armor' || ITEMS[id].t === 'acc') ? 1 : ri(3, 6) })) };
}

function discount() { let d = 0; if (G.brole === 'trader') d += 15; d += Math.floor(attr('cha') * 0.4); return Math.min(d, 30); }

function buyItem(id) {
 ensureStock(); let s = null; G.shop.stock.forEach(x => { if (x.id === id) s = x; });
 if (!s || s.qty < 1) return;
 const p = Math.max(1, Math.round(ITEMS[id].v * (1 - discount() / 100)));
 if (G.gold < p) { toast('🪙', 'Не хватает золота', 'warn'); return; }
 G.gold -= p; s.qty--; addItem(id, 1); sfx('coin'); haptic('light'); toast(ITEMS[id].e, 'Куплено: ' + iname(id), 'good'); renderPanel(); updateHUD();
}

function sellItem(id) {
 if (countItem(id) < 1) return;
 const g = Math.max(1, Math.round(ITEMS[id].v * 0.45));
 removeItem(id, 1); G.gold += g; G.stats.goldEarned += g; sfx('coin'); toast('🪙', '+' + g + '🪙 за ' + iname(id), 'good'); renderPanel(); updateHUD();
}

 const px = ctxP, pw = cvP.width, ph = cvP.height;
 px.clearRect(0, 0, pw, ph);
 px.fillStyle = 'rgba(0,0,0,.3)'; px.beginPath(); px.ellipse(pw / 2, ph - 22, 80, 12, 0, 0, 7); px.fill();
 const bob = Math.sin(t * 0.002) * 3;
 drawHero(px, pw * 0.38, ph - 25 + bob, 2.8, 1, t * 0.001, { hair: CR.hair, skin: CR.skin }, CR.cls);
 drawCat(px, pw * 0.68, ph - 22 - bob, 2.6, -1, t * 0.001, CR.role);
}
function startGame(fresh) {
 document.body.dataset.set = G.setting;
 $('#create').classList.add('hidden'); cvC.classList.add('hidden'); cv.classList.remove('hidden');
 $('#hud').classList.remove('hidden'); $('#mnav').classList.remove('hidden');
 if (isMobile) { $('#joy').classList.remove('hidden'); $('#btnAct').classList.remove('hidden'); document.body.classList.add('coarse'); }
 R.mode = 'world'; genWorld(); mMode = 'world';
 if (AC) { stopMusic(); startMusic(); }
 $('#btnSound').textContent = G.settings.sound ? '🔊' : '🔇';
 if (fresh) {
  saveNow();
  setTimeout(() => {
   if (R.mode !== 'world') return;
   R.dialog = { npc: { name: 'Барсик', seed: G.seed + 1, role: 'wander' }, node: null };
   $('#dialog').classList.remove('hidden');
   drawPortrait($('#dlgPortrait'), G.seed + 1, 'wander');
   $('#dlgName').textContent = 'Барсик · ' + BROLES[G.brole].n;
   $('#dlgTag').innerHTML = '<span class="ai">✦ твой спутник</span>';
   showNode({
    text: 'Мурр~ ' + G.name + '! Добро пожаловать в *' + SETS[G.setting].n + '*. Я — Барсик, твой ' + BROLES[G.brole].n.toLowerCase() + '. Мир и задания сгенерированы нейросетью.',
    choices: [
     { l: '📖 Как играть?', act: () => showNode({ text: 'Двигайся (джойстик/WASD), говори с NPC (Ⓔ). Враги видимы — касание начинает ATB-бой как в Chrono Trigger: техники, двойные техники, слабости. В городе: лавка, целитель, гильдия, кузнец. Главная цель — у мастера гильдии. Проверки d20 открывают мирные пути. Я на связи — кнопка 🐾.', choices: [{ l: '🐾 В путь!', act: () => { closeDialog(); toast('👑', 'Загляни к мастеру гильдии', 'good'); } }] }) },
     { l: '🐾 В путь!', act: () => { closeDialog(); toast('👑', 'Загляни к мастеру гильдии', 'good'); } }
    ]
   });
  }, 400);
 } else {
  toast('🐾', 'С возвращением, ' + G.name + '! День ' + G.day, 'good');
 }
 updateHUD(); save();
}

/* ================= ГЛОБАЛЬНЫЙ ДИСПЕТЧЕР (ГАРАНТИЯ РАБОТЫ КНОПОК) ================= */
window.act = function(cmd, val, val2) {
 try {
  haptic('light');
  if (cmd === 'set') { CR.setting = val; buildCreate(); sfx('menu'); }
  else if (cmd === 'cls') { CR.cls = val; buildCreate(); sfx('menu'); }
  else if (cmd === 'brole') { CR.role = val; buildCreate(); sfx('menu'); }
  else if (cmd === 'hair') { CR.hair = val; buildCreate(); }
  else if (cmd === 'skin') { CR.skin = val; buildCreate(); }
  else if (cmd === 'attr+') { if (CR.pts > 0) { CR.pts--; CR.attr[val]++; renderAttrs(); sfx('menu'); } }
  else if (cmd === 'attr-') { const k = val; if (CR.attr[k] > 0) { CR.attr[k]--; CR.pts++; renderAttrs(); sfx('menu'); } }
  else if (cmd === 'diff') { CR.diff = val; buildCreate(); }
  else if (cmd === 'wait') { CR.wait = val === 'true'; buildCreate(); }
  else if (cmd === 'start') { CR.name = $('#inpName').value.trim() || 'JFD_Барсик'; G = defaultG(); const h = heroD(), cd = catD(); G.party[0].hp = h.maxHp; G.party[0].mp = h.maxMp; G.party[1].hp = cd.maxHp; G.party[1].mp = cd.maxMp; haptic('medium'); startGame(true); }
  else if (cmd === 'continue') { try { const d = JSON.parse(localStorage.getItem(KEY)); if (!d || d.v !== 5) throw 0; G = d; startGame(false); } catch (err) { toast('❌', 'Сейв повреждён', 'bad'); } }
  else if (cmd === 'panel') openPanel(val);
  else if (cmd === 'panel-close') closePanel();
  else if (cmd === 'sound') toggleSound();
  else if (cmd === 'interact') doInteract();
  else if (cmd === 'dlg') { if (R.dialog && R.dialog.node) { const c = R.dialog.node.choices[+val]; if (c && c.act) c.act(); } }
  else if (cmd === 'ev') { if (R.event) { const ec = R.event.choices[+val]; if (ec && ec.act) ec.act(); } }
  else if (cmd === 'bt') btCmd(val);
  else if (cmd === 'bt-tech') chooseTech(+val);
  else if (cmd === 'bt-item') chooseItem(+val);
  else if (cmd === 'bt-back') btBack();
  else if (cmd === 'bt-tprev') cycleTarget(-1);
  else if (cmd === 'bt-tnext') cycleTarget(1);
  else if (cmd === 'bt-tok') confirmTarget();
  else if (cmd === 'buy') buyItem(val);
  else if (cmd === 'sell') sellItem(val);
  else if (cmd === 'restock') { if (G.gold < 25) toast('🪙', 'Нужно 25🪙', 'warn'); else { G.gold -= 25; G.shop = null; ensureStock(); renderPanel(); sfx('coin'); } }
  else if (cmd === 'shop-tab') { R.shopTab = val; renderPanel(); }
  else if (cmd === 'item') openItem(val);
  else if (cmd === 'item-use') useItemWorld(val, val2 || 'hero');
  else if (cmd === 'item-equip') equipItem(val);
  else if (cmd === 'item-unequip') { const sl = val, id2 = G.equip[sl]; if (id2) { G.equip[sl] = null; addItem(id2, 1); } clampParty(); renderPanel(); sfx('menu'); }
  else if (cmd === 'travel') { let wpt = null; R.waypoints.forEach(w => { if (w.id === val) wpt = w; }); if (wpt && G.discovered.indexOf(wpt.id) >= 0) { R.player.x = wpt.x; R.player.y = wpt.y; G.pos = { x: R.player.x, y: R.player.y }; R.cam.x = R.player.x - VW / 2; R.cam.y = R.player.y - VH / 2; closePanel(); toast('🧭', 'Переход: ' + wpt.n, 'good'); sfx('quest'); } }
  else if (cmd === 'wp-quest') { let q = null; G.quests.forEach(x => { if (x.id === val) q = x; }); if (q) { if (q.type === 'reach') { let bb = null; R.beacons.forEach(x => { if (x.id === q.id) bb = x; }); if (bb) G.waypoint = { x: bb.x, y: bb.y, label: q.title }; } else { let nn = null; R.npcs.forEach(x => { if (x.id === q.giver) nn = x; }); if (nn) G.waypoint = { x: nn.x, y: nn.y, label: q.giverName }; } toast('🗺️', 'Цель отмечена', 'good'); closePanel(); } }
  else if (cmd === 'wp-boss') { G.waypoint = { x: R.boss.x, y: R.boss.y, label: SETS[G.setting].boss }; toast('🗺️', 'Босс отмечен', 'good'); closePanel(); }
  else if (cmd === 'choice-open') openChoiceQuest(val);
  else if (cmd === 'attr-game') { const ak = val; if (G.pts > 0) { G.pts--; G.extra[ak]++; clampParty(); renderPanel(); sfx('menu'); } }
  else if (cmd === 'bk-role') { G.chatRole = val; renderPanel(); bkSay(val, roleGreet(val)); }
  else if (cmd === 'bk-chip') bkChip(val);
  else if (cmd === 'bk-accept') { const bq = R.bkQuest; if (bq && !G.quests.find(x => x.id === bq.id)) { G.quests.push(bq); if (bq.type === 'reach') spawnBeacon(bq); sfx('quest'); toast('📋', 'Принято: ' + bq.title, 'good'); trackQuests(); event.target.disabled = true; event.target.textContent = '✅ Принято'; } }
  else if (cmd === 'bk-neuro-quest') { const nq = R.bkQuest; if (!nq) return; event.target.disabled = true; event.target.textContent = '…'; neuro([{ role: 'system', content: neuroSystem('Перепиши описание квеста атмосферно, 2 предложения.') }, { role: 'user', content: 'Квест «' + nq.title + '»: ' + nq.desc }], 120).then(txt => { nq.desc = txt; nq.ai = true; bkSay(G.chatRole, '🧠 «*' + nq.title + '*»\n' + nq.desc, '<div class="bk-card"><button class="btn btn-p" onclick="act(\'bk-accept\')">✅ Взяться</button></div>'); }).catch(() => { event.target.disabled = false; event.target.textContent = '✨ Нейро'; toast('📡', 'Нейро недоступна', 'warn'); }); }
  else if (cmd === 'bk-stake') { R.stake = +val; $$('#panelBody [data-a="bk-stake"]').forEach(b => b.classList.toggle('on', +b.dataset.v === R.stake)); }
  else if (cmd === 'bk-roll') bkRoll();
  else if (cmd === 'bk-send') { const inp = $('#bkInput'); const v = inp.value.trim(); if (!v) return; inp.value = ''; bkUser(v); }
  else if (cmd === 'modal-close') closeModal();
  else if (cmd === 'end-continue') exitBattle();
  else if (cmd === 'end-revive') { const hh = heroD(), cc = catD(); G.party[0].hp = Math.round(hh.maxHp * 0.5); G.party[0].mp = Math.round(hh.maxMp * 0.5); G.party[1].hp = Math.round(cc.maxHp * 0.5); G.party[1].mp = Math.round(cc.maxMp * 0.5); R.player.x = 6 * T; R.player.y = 17.5 * T; G.pos = { x: R.player.x, y: R.player.y }; exitBattle(); toast('💚', 'Ты очнулся в городе', 'good'); }
  else if (cmd === 'ng-plus') ngPlus();
  else if (cmd === 'confirm-ok') { const fn = R.confirm; R.confirm = null; closeModal(); if (fn) fn(); }
  else if (cmd === 'export') exportSave();
  else if (cmd === 'import') $('#importFile').click();
  else if (cmd === 'newgame') openConfirm('Новая игра?', 'Весь прогресс будет стёрт. Барсик загрустит, но поймёт.', 'Стереть', () => { localStorage.removeItem(KEY); location.reload(); });
  else if (cmd === 'api-test') apiTest();
  else if (cmd === 'set-opt') { if (!G) return; const s = G.settings; if (val === 'engine') s.engine = val2; else if (val === 'apiModel') s.apiModel = val2; else if (val === 'apiBase') s.apiBase = val2; else if (val === 'apiKey') s.apiKey = val2; else if (val === 'diff') s.diff = val2; else if (val === 'wait') s.wait = val2 === '1'; else if (val === 'bspeed') { s.bspeed = +val2; const vv = $('#s-bspeed-v'); if (vv) vv.textContent = s.bspeed + '×'; } else if (val === 'vol') { s.vol = +val2; applyAudio(); } else if (val === 'freq') s.freq = val2; else if (val === 'night') s.night = val2 === 'on'; else if (val === 'particles') s.particles = val2 === 'on'; else if (val === 'text') s.text = +val2; else if (val === 'aiChat') s.aiChat = val2 === 'on'; else if (val === 'autosave') s.autosave = val2 === 'on'; save(); }
 } catch (e) {
  console.error('Action error:', cmd, val, e);
  showErr('Ошибка: ' + e.message);
 }
};

/* ================= ЦИКЛ ================= */
let lastT = 0;
function loop(t) {
 requestAnimationFrame(loop);
 const dt = Math.min((t - lastT) / 1000, 0.05);
 lastT = t;
 try {
  if (R.mode === 'create') { renderCreateBg(t); return; }
  if (!G) return;
  if (R.mode === 'world') { updateWorld(dt); renderWorld(t); }
  else if (R.mode === 'battle') { updateBattle(dt); renderBattle(t); }
 } catch (err) {
  showErr('Цикл: ' + err.message);
 }
}

/* ================= СТАРТ ================= */
try {
 tgInit();
 resize();
 buildCreate();
 const raw = localStorage.getItem(KEY);
 if (raw) {
  const sd = JSON.parse(raw);
  if (sd && sd.v === 5) {
   $('#contWrap').classList.remove('hidden');
   $('#btnContinue').textContent = '▶ Продолжить: ' + sd.name + ' · ур.' + sd.lvl + ' · день ' + sd.day;
  }
 }
 requestAnimationFrame(loop);
 setInterval(() => { if (G && R.mode === 'world') saveNow(); }, 20000);
 addEventListener('beforeunload', saveNow);
 document.addEventListener('visibilitychange', () => { lastT = performance.now(); });
} catch (err) {
 showErr('Запуск: ' + err.message);
}
</script>
