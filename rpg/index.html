<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Barsik RPG — JRPG Мультивселенная</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0f1e;--panel:#141b33;--line:#2b3a66;--text:#eef2ff;--muted:#93a0c4;--gold:#ffd166;--grn:#39ff8e;--red:#ff5d5d;--ice:#7fd8ff;--vio:#b48bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:linear-gradient(180deg,#0d1226,#0a0f1e);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;user-select:none;touch-action:manipulation;overscroll-behavior:none}
.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;width:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);gap:5px}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:#0a0f1e}::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--ice),var(--vio));border-radius:6px}
.hud{display:flex;align-items:center;gap:5px;padding:6px 7px;background:linear-gradient(135deg,#1c2444,#141b33);border:1px solid var(--line);border-radius:13px;flex-wrap:wrap}
.who{font-weight:900;font-size:11px;color:var(--gold);white-space:nowrap;max-width:34vw;overflow:hidden;text-overflow:ellipsis}
.bars{flex:1;min-width:110px;display:flex;flex-direction:column;gap:3px}
.bar{height:9px;border-radius:6px;background:#0a0f22;border:1px solid #202a4d;overflow:hidden;position:relative}
.bar i{display:block;height:100%;transition:width .3s;border-radius:6px}
.bar.hp i{background:linear-gradient(90deg,#ff5d5d,#ff9d9d)}
.bar.en i{background:linear-gradient(90deg,#1d6fa8,#60c8ff)}
.bar b{position:absolute;inset:0;font-size:7.5px;line-height:9px;text-align:center;color:#fff;font-weight:900;text-shadow:0 1px 2px #000}
.pill{display:flex;align-items:center;gap:4px;background:#0d1226;border:1px solid var(--line);border-radius:999px;padding:3px 8px;font-size:10.5px;font-weight:900}
.pill b{color:var(--gold)}
.ibtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#0d1226;color:var(--text);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ibtn:active{transform:scale(.92)}
.stage{flex:1;position:relative;min-height:180px;background:#060a14;border:1px solid var(--line);border-radius:13px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#banner{position:absolute;left:0;right:0;top:38%;text-align:center;font-size:22px;font-weight:950;letter-spacing:2px;color:var(--gold);text-shadow:0 0 18px rgba(255,209,102,.8),0 2px 0 #000;opacity:0;pointer-events:none;z-index:5}
#banner.show{animation:bn 1.3s ease}
@keyframes bn{0%{opacity:0;transform:translateY(18px) scale(.8)}18%{opacity:1;transform:translateY(0) scale(1.06)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.tab{border:1px solid var(--line);background:linear-gradient(180deg,#20294c,#161d3a);color:var(--muted);border-radius:11px;padding:7px 2px;font-size:9.5px;font-weight:900;cursor:pointer;text-align:center}
.tab .ti{font-size:16px;display:block;margin-bottom:1px}
.tab.on{color:#fff;border-color:var(--ice);background:linear-gradient(180deg,#1d3a5c,#16294a);box-shadow:0 0 10px rgba(127,216,255,.2)}
#panel{max-height:46vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:8px}
.jrmsg{background:#0a0f22;border:2px solid #3d4c85;border-radius:10px;padding:8px 10px;min-height:44px;font-size:12px;line-height:1.45;color:#e8eef8;margin-bottom:7px;box-shadow:inset 0 0 12px rgba(0,0,0,.6)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--line);background:linear-gradient(180deg,#20294c,#161d3a);color:var(--text);border-radius:11px;padding:9px 10px;font-size:11.5px;font-weight:900;cursor:pointer;font-family:inherit;min-height:37px}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.gold{background:linear-gradient(180deg,#b98b20,#7a5b15);border-color:var(--gold);color:#fff8dc}
.btn.grn{background:linear-gradient(180deg,#1f8f4d,#146637);border-color:#4ade80}
.btn.red{background:linear-gradient(180deg,#a83232,#7a2020);border-color:#f87171}
.btn.blu{background:linear-gradient(180deg,#1d6fa8,#14537b);border-color:#60c8ff}
.btn.vio{background:linear-gradient(180deg,#6d28d9,#4c1d95);border-color:#c4b5fd}
.msg{min-height:16px;font-size:11.5px;font-weight:800;color:var(--gold);text-align:center;margin-top:5px;line-height:1.35}
.eqrow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:8px}
.eslot{aspect-ratio:1;border-radius:11px;border:1px dashed #3d4c85;background:#0d1430;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative}
.eslot img{width:70%;height:70%;object-fit:contain}
.eslot span{font-size:7.5px;color:var(--muted);font-weight:900}
.eslot.filled{border-style:solid}
.invgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.icell{aspect-ratio:1;border-radius:10px;border:1px solid #2a3560;background:#101736;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.icell img{width:78%;height:78%;object-fit:contain}
.icell .q{position:absolute;bottom:1px;right:3px;font-size:8.5px;font-weight:900;color:var(--gold);text-shadow:0 1px 2px #000}
.icell:active{transform:scale(.93)}
.statline{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:3px 0}
.statline .sv{color:var(--ice);min-width:26px;text-align:right}
.logbox{font-size:11px;line-height:1.5;color:#c9d4f0}
.logbox div{padding:2px 0;border-bottom:1px solid rgba(43,58,102,.4)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,8,18,.8);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{width:100%;max-width:600px;max-height:88vh;background:linear-gradient(180deg,#1b2342,#141b34);border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.sheet header{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font-size:14px;flex:1}
.x{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#111832;color:var(--muted);font-size:14px;cursor:pointer}
.mbody{padding:11px 13px;overflow-y:auto;flex:1}
.dlg{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.dlg img{width:64px;height:64px;border-radius:12px;border:2px solid var(--gold);background:#0d1430}
.dlgbox{flex:1;background:#0a0f22;border:1px solid #3d4c85;border-radius:12px;padding:9px 11px;font-size:12.5px;line-height:1.45;min-height:56px}
.dlgname{font-size:10px;font-weight:950;color:var(--gold);margin-bottom:3px}
.ithead{display:flex;gap:10px;align-items:center}
.ithead img{width:64px;height:64px;background:#0d1430;border:1px solid var(--line);border-radius:12px;padding:5px}
.itname{font-weight:950;font-size:14px}
.itrar{font-size:10px;font-weight:900}
.itmods{font-size:11.5px;color:#c9d4f0;line-height:1.6;margin:8px 0}
.cmp{font-size:11px;line-height:1.7;margin:6px 0;padding:7px 9px;background:#0d1430;border:1px solid var(--line);border-radius:10px}
.cmp .up{color:var(--grn);font-weight:900}
.cmp .dn{color:var(--red);font-weight:900}
.fld{margin:8px 0}
.fld label{font-size:10.5px;color:var(--muted);font-weight:800;display:block;margin-bottom:3px}
.fld input,.fld textarea{width:100%;background:#0e1430;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:8px 10px;font-size:12px;outline:none;font-family:inherit}
.tog{display:flex;align-items:center;justify-content:space-between;background:#101736;border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin:7px 0;font-size:12px;font-weight:800}
.sw{width:42px;height:23px;border-radius:999px;background:#2a3560;position:relative;cursor:pointer;transition:.2s;flex:0 0 auto}
.sw i{position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#8b98c2;transition:.2s}
.sw.on{background:linear-gradient(135deg,var(--grn),#2fbf85)}
.sw.on i{left:22px;background:#fff}
.selcard{border:1px solid var(--line);border-radius:13px;background:#101736;padding:10px;margin-bottom:7px;cursor:pointer}
.selcard.on{border-color:var(--grn);background:#0d2418}
.selcard .t{font-weight:950;font-size:13px}
.selcard .d{font-size:10.5px;color:var(--muted);margin-top:3px;line-height:1.35}
.skrow{display:flex;align-items:center;gap:7px;background:#101736;border:1px solid var(--line);border-radius:11px;padding:8px;margin-bottom:6px}
.skrow .sn{flex:1;font-size:11.5px;font-weight:900;line-height:1.3}
.skrow .sn small{display:block;color:var(--muted);font-weight:700;font-size:9.5px}
.stars{color:var(--gold);font-size:11px;letter-spacing:2px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(16px);z-index:90;background:rgba(14,20,42,.96);border:1px solid var(--gold);color:var(--text);padding:8px 16px;border-radius:12px;font-size:12px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#fatal{display:none;position:fixed;inset:0;z-index:99;background:#101018;color:#ffd7d7;padding:16px;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow:auto}
#boot{position:fixed;inset:0;z-index:98;background:#0a0f1e;color:var(--ice);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:13px/1.5 ui-monospace,Menlo,monospace;text-align:center;padding:20px}
#boot .spin{width:38px;height:38px;border:4px solid #1c2444;border-top-color:var(--ice);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="boot"><div class="spin"></div><div>🐾 Барсик загружает мультивселенную…</div><div id="bootMsg" style="color:#93a0c4;font-size:11px"></div></div>
<div id="fatal"></div>
<div class="app">
  <div class="hud">
    <div class="who" id="whoTxt">…</div>
    <div class="bars">
      <div class="bar hp"><i id="hpFill"></i><b id="hpTxt"></b></div>
      <div class="bar en"><i id="enFill"></i><b id="enTxt"></b></div>
    </div>
    <div class="pill" id="ammoPill" style="display:none">🔫 <b id="ammoTxt"></b></div>
    <div class="pill">🪙 <b id="goldTxt">0</b></div>
    <div class="pill">⭐ <b id="lvTxt">1</b></div>
    <button class="ibtn" id="btnGM" title="Событие ГМ">✨</button>
    <button class="ibtn" id="btnMusic" title="Музыка">🎵</button>
    <button class="ibtn" id="btnSet" title="Настройки и ИИ">⚙️</button>
  </div>
  <div class="stage" id="stage"><canvas id="cv"></canvas><div id="banner"></div></div>
  <div class="tabs" id="tabs">
    <button class="tab on" data-scr="loc"><span class="ti">🌍</span>Мир</button>
    <button class="tab" data-scr="map"><span class="ti">🗺</span>Карта</button>
    <button class="tab" data-scr="inv"><span class="ti">🎒</span>Сумка</button>
    <button class="tab" data-scr="char"><span class="ti">🐾</span>Герой</button>
    <button class="tab" data-scr="log"><span class="ti">📜</span>Журнал</button>
  </div>
  <div id="panel"></div>
</div>
<div class="modal" id="modal"><div class="sheet">
  <header><h3 id="mTitle">…</h3><button class="x" id="mClose">✕</button></header>
  <div class="mbody" id="mBody"></div>
</div></div>
<div id="toast"></div>
<script>
(function(){'use strict';
function showFatal(e){var el=document.getElementById('fatal');el.style.display='block';el.innerHTML='<b>⚠ Barsik RPG error</b>\n\n'+(e&&e.stack?e.stack:String(e));}
window.onerror=function(m,s,l,c,e){showFatal(e||(m+' @ '+l+':'+c));return true;};
window.addEventListener('unhandledrejection',function(ev){showFatal(ev.reason);});
try{main();}catch(e){showFatal(e);}
function main(){
var TG=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
if(TG){try{TG.ready();TG.expand();if(TG.setHeaderColor)TG.setHeaderColor('#0a0f1e');if(TG.setBackgroundColor)TG.setBackgroundColor('#0a0f1e');if(TG.disableVerticalSwipes)TG.disableVerticalSwipes();}catch(e){}}
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function rand(a,b){return a+Math.random()*(b-a);}
function randi(a,b){return Math.floor(rand(a,b+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function fmt(n){return String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function now(){return Date.now();}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
var toastT=null;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2300);}
function banner(txt){var b=$('banner');b.textContent=txt;b.classList.remove('show');void b.offsetWidth;b.classList.add('show');}
/* ================= SAVE ================= */
var KEY='barsik_rpg_v3';
var DEF={
 name:'',set:'snow',cls:'warrior',arch:'brute',bg:'wanderer',role:'companion',
 lv:1,xp:0,sp:0,stats:{str:6,agi:5,int:4,vit:6},hp:0,en:0,gold:60,mag:0,
 inv:[],equip:{w:null,a:null,h:null,c:null,t:null},skills:{},
 loc:'',flags:{},log:[],quest:null,invF:'all',invSort:'type',healDay:0,discount:0,
 ai:{enabled:true,endpoint:'https://anymodel.org/v1/chat/completions',model:'am/nemotron-3-ultra-550b-a55b',key:'sk-dc9d4b7df36ba555-wof1d4-80376593',note:''},
 av:{base:'you'},sound:true,music:true,vol:50,gmCool:0,created:0,seen:now()
};
function load(){var s=JSON.parse(JSON.stringify(DEF));try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);for(var k in DEF){if(o[k]===undefined)continue;if(k==='stats'||k==='equip'||k==='ai'||k==='flags'||k==='av'||k==='skills'){for(var kk in DEF[k])s[k][kk]=(o[k]&&o[k][kk]!==undefined)?o[k][kk]:DEF[k][kk];}else s[k]=o[k];}}}catch(e){}return s;}
var S=load();
var saveT=null;
function save(){S.seen=now();clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}},200);renderHUD();}
function logAdd(t){S.log.unshift('• '+t);if(S.log.length>80)S.log.pop();}
/* ================= AUDIO ================= */
var A={ctx:null,master:null};
function volGain(){return S.sound?(clamp(S.vol,0,100)/100)*0.5:0;}
function applyAudio(){if(A.master)A.master.gain.value=volGain();}
function audioInit(){if(A.ctx)return;try{var C=window.AudioContext||window.webkitAudioContext;A.ctx=new C();A.master=A.ctx.createGain();A.master.gain.value=volGain();A.master.connect(A.ctx.destination);MU.next=A.ctx.currentTime+0.1;}catch(e){}}
function tone(f,dur,type,vol,slide){if(!A.ctx||!S.sound)return;try{var o=A.ctx.createOscillator(),g=A.ctx.createGain(),t=A.ctx.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);g.gain.setValueAtTime(vol||0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(A.master);o.start(t);o.stop(t+dur+0.02);}catch(e){}}
function noise(dur,vol,freq){if(!A.ctx||!S.sound)return;try{var n=Math.floor(A.ctx.sampleRate*dur),buf=A.ctx.createBuffer(1,n,A.ctx.sampleRate),d=buf.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);var s=A.ctx.createBufferSource();s.buffer=buf;var f=A.ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||1200;var g=A.ctx.createGain();g.gain.value=vol||0.1;s.connect(f);f.connect(g);g.connect(A.master);s.start();}catch(e){}}
var SFX={
 click:function(){tone(700,0.05,'square',0.06);},
 hit:function(){noise(0.09,0.16,900);tone(180,0.12,'sawtooth',0.12,-60);},
 crit:function(){noise(0.12,0.2,1400);tone(320,0.18,'sawtooth',0.14,-120);setTimeout(function(){tone(660,0.12,'square',0.1);},60);},
 hurt:function(){tone(140,0.2,'sawtooth',0.14,-40);noise(0.08,0.1,500);},
 heal:function(){[523,659,784].forEach(function(f,i){setTimeout(function(){tone(f,0.14,'sine',0.1);},i*70);});},
 magic:function(){tone(880,0.25,'sine',0.1,420);setTimeout(function(){tone(1320,0.2,'sine',0.08,-300);},90);},
 shoot:function(){noise(0.07,0.22,2600);tone(110,0.12,'square',0.16,-50);setTimeout(function(){noise(0.05,0.1,900);},40);},
 reload:function(){tone(500,0.04,'square',0.08);setTimeout(function(){tone(700,0.04,'square',0.08);},120);setTimeout(function(){tone(900,0.05,'square',0.09);},240);},
 coin:function(){tone(980,0.07,'square',0.1);setTimeout(function(){tone(1460,0.1,'square',0.1);},60);},
 lvl:function(){[392,523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,0.22,'triangle',0.13);},i*90);});},
 win:function(){[523,659,784,1046,1318].forEach(function(f,i){setTimeout(function(){tone(f,0.2,'triangle',0.12);},i*100);});},
 lose:function(){[392,311,233,175].forEach(function(f,i){setTimeout(function(){tone(f,0.25,'sawtooth',0.09);},i*130);});},
 step:function(){noise(0.05,0.06,700);},
 slash:function(){noise(0.06,0.14,4200);tone(240,0.08,'sawtooth',0.1,-120);},
 guard:function(){tone(300,0.12,'square',0.1,80);noise(0.06,0.08,1800);}
};
var MU={theme:'explore',step:0,next:0};
var MU_TH={
 explore:{bpm:0.42,notes:[0,-1,3,-1,5,-1,3,-1,7,-1,5,-1,3,-1,0,-1,-2,-1,3,-1,5,-1,7,-1,10,-1,7,-1,5,-1,3,-1],bass:[0,-1,-1,-1,5,-1,-1,-1,3,-1,-1,-1,7,-1,-1,-1]},
 battle:{bpm:0.2,notes:[12,-1,12,-1,10,-1,12,-1,15,-1,12,-1,10,-1,8,-1,12,-1,12,-1,10,-1,12,-1,17,-1,15,-1,12,-1,10,-1],bass:[0,0,7,0,5,5,3,3,0,0,7,0,8,8,10,10]}
};
function muTick(){
 if(!A.ctx||!S.music)return;
 var th=MU_TH[MU.theme];
 if(MU.next<A.ctx.currentTime)MU.next=A.ctx.currentTime+0.05;
 while(MU.next<A.ctx.currentTime+0.3){
  var i=MU.step%32;
  if(th.bass[i]!==undefined&&th.bass[i]!==-1)tone(65.41*Math.pow(2,th.bass[i]/12),th.bpm*1.7,'sine',0.08);
  if(th.notes[i]!==undefined&&th.notes[i]!==-1)tone(261.63*Math.pow(2,th.notes[i]/12),th.bpm*1.3,MU.theme==='battle'?'square':'triangle',0.045);
  if(MU.theme==='battle'&&MU.step%2===1)noise(0.02,0.02,6000);
  MU.step++;MU.next+=th.bpm;
 }
}
setInterval(muTick,120);
function firstTouch(){audioInit();if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume();if(A.ctx)MU.next=A.ctx.currentTime+0.1;document.removeEventListener('pointerdown',firstTouch);}
document.addEventListener('pointerdown',firstTouch,{passive:true});

function eqMods(s){
 var m={atk:0,def:0,hp:0,en:0,str:0,agi:0,int:0,vit:0,crit:0,spd:0};
 for(var k in s.equip){var id=s.equip[k];if(!id)continue;var it2=ITEMS[id];if(!it2)continue;for(var mk in it2.mods)m[mk]=(m[mk]||0)+it2.mods[mk];}
 return m;
}
function derived(s){
 s=s||S;
 var m=eqMods(s),st=s.stats;
 var str=st.str+(m.str||0),agi=st.agi+(m.agi||0),int=st.int+(m.int||0),vit=st.vit+(m.vit||0);
 return{
  maxHp:40+vit*6+s.lv*8+(m.hp||0),
  maxEn:20+int*4+s.lv*3+(m.en||0),
  atk:4+s.lv*2+Math.round(str*1.6)+(m.atk||0),
  matk:4+s.lv*2+Math.round(int*1.8)+(m.atk||0),
  def:2+s.lv+Math.round(vit*0.8)+(m.def||0),
  crit:5+agi*0.6+(m.crit||0),
  spd:agi*1.2+s.lv*0.5+(m.spd||0),
  str:str,agi:agi,int:int,vit:vit,mods:m
 };
}
function xpNeed(lv){return Math.floor(80*Math.pow(lv,1.35));}
function addXp(n){
 if(S.role==='mentor')n=Math.round(n*1.15);
 S.xp+=n;logAdd('Опыт +'+n);
 while(S.xp>=xpNeed(S.lv)){
  S.xp-=xpNeed(S.lv);S.lv++;S.sp+=2;
  var g=S.arch==='brute'?{str:3,agi:1,int:1,vit:3}:S.arch==='shooter'?{str:2,agi:4,int:1,vit:2}:{str:1,agi:1,int:4,vit:2};
  S.stats.str+=g.str;S.stats.agi+=g.agi;S.stats.int+=g.int;S.stats.vit+=g.vit;
  var d=derived();S.hp=d.maxHp;S.en=d.maxEn;
  SFX.lvl();confetti(30);floatTxt('УРОВЕНЬ '+S.lv+'!',CW/2,CH*0.35,'#ffd166');banner('LEVEL UP!');
  logAdd('🎉 Уровень '+S.lv+'! +2 очка характеристик');
 }
 save();
}

function doReload(free){
 var w=weapon();if(!w||w.sub!=='gun')return false;
 var need=w.mag-S.mag;
 if(need<=0){if(!free)toast('Магазин полон');return false;}
 var have=invCount(w.ammo);
 if(have<=0){if(!free)toast('Нет патронов!');return false;}
 var take=Math.min(need,have);
 invDel(w.ammo,take);S.mag+=take;
 SFX.reload();logAdd('🔄 Перезарядка: +'+take);
 save();return true;
}

function applyPlayerHit(){
 var d=derived(),e=CB.enemy,w=weapon(),gun=w&&w.sub==='gun';
 var sk=CB.pendSkill;
 var base=sk&&sk.type==='magic'?d.matk:d.atk;
 var hits=CB.pendHits,total=0,crits=0,shots=0;
 for(var h=0;h<hits;h++){
  var mult=CB.pendMult,usedGun=false;
  if(gun&&CB.animType==='shoot'){
   if(S.mag>0){S.mag--;usedGun=true;shots++;}
   else mult*=0.5;
  }
  var crit=Math.random()*100<d.crit+CB.pendCrit;
  var raw=base*mult*rand(0.9,1.1);
  var defPart=e.def*(sk&&sk.type==='magic'?0.4:1);
  var dmg=Math.max(1,Math.round(raw-defPart*0.5));
  if(crit){dmg=Math.round(dmg*1.7);crits++;}
  e.hp-=dmg;total+=dmg;
  if(usedGun){FLASH={t:now(),x:CW*0.32,y:CH*0.55,tx:CW*0.7,ty:CH*0.4,col:'#ffd166',w:2.5};for(var sh2=0;sh2<3;sh2++)part(CW*0.34,CH*0.55,'shell');part(CW*0.34,CH*0.52,'smoke');}
 }
 if(CB.animType==='slash'){CB.slashT=now();SFX.slash();}
 if(CB.animType==='shoot'&&!shots){FLASH={t:now(),x:CW*0.32,y:CH*0.55,tx:CW*0.7,ty:CH*0.4,col:'#e8eef8',w:1.5};}
 e.pose={hurt:0.4};
 CB.shake=crits?9:5;
 if(crits){CB.flash=0.35;CB.flashCol='#ffd166';}
 floatTxt('-'+total+(crits?' КРИТ!':''),CW*0.7,CH*0.28,crits?'#ffd166':'#ff5d5d');
 for(var i=0;i<8;i++)part(CW*0.7+rand(-20,20),CH*0.4+rand(-26,20),crits?'spark':'blood');
 if(crits)SFX.crit();else if(shots)SFX.shoot();else SFX.hit();
 setMsg((crits?'КРИТИЧЕСКИЙ удар! ':'Ты попадаешь: ')+'-'+total+' HP.'+(shots?' (магазин '+S.mag+')':''));
 logAdd('Ты бьёшь '+e.n+': -'+total+(crits?' (крит!)':''));
}

function modsText(it2){
 var out=[],map={atk:'⚔ Атака',def:'🛡 Защита',hp:'❤ HP',en:'⚡ EN',str:'💪 СИЛ',agi:'🏃 ЛОВ',int:'🧠 РАЗ',vit:'❤ СТО',crit:'🎯 Крит',spd:'💨 Скор'};
 for(var k in it2.mods)out.push('+'+it2.mods[k]+' '+map[k]);
 var extra=[];
 if(it2.mag)extra.push('магазин '+it2.mag);
 if(it2.ammo)extra.push('боеприпас: '+ITEMS[it2.ammo].name);
 return (out.join(', ')||'—')+(extra.length?' · '+extra.join(', '):'');
}
function cmpText(it2){
 var slot=it2.kind,cur=S.equip[slot]?ITEMS[S.equip[slot]]:null;
 var keys=['atk','def','hp','en','str','agi','int','vit','crit','spd'];
 var out=[];
 keys.forEach(function(k){
  var a=cur?(cur.mods[k]||0):0,b=it2.mods[k]||0;
  if(a===b&&b===0)return;
  var diff=b-a;
  out.push('<span class="'+(diff>=0?'up':'dn')+'">'+(diff>=0?'+':'')+diff+' '+k.toUpperCase()+'</span>');
 });

  });
  var l3=document.createElement('div');l3.className='msg';l3.style.textAlign='left';l3.innerHTML='<b>3. Происхождение</b>';b.appendChild(l3);
  Object.keys(BGS).forEach(function(bk){
   var d=document.createElement('div');d.className='selcard'+(ch.bg===bk?' on':'');
   d.innerHTML='<div class="t">'+BGS[bk].n+'</div><div class="d">'+BGS[bk].d+'</div>';
   d.onclick=function(){ch.bg=bk;SFX.click();render();};
   b.appendChild(d);
  });
  var l4=document.createElement('div');l4.className='msg';l4.style.textAlign='left';l4.innerHTML='<b>4. Внешность</b>';b.appendChild(l4);
  var r4=document.createElement('div');r4.className='row';b.appendChild(r4);
  Object.keys(BASES).forEach(function(bk){
   var btn=document.createElement('button');btn.className='btn '+(ch.base===bk?'grn':'');btn.textContent=BASE_NAMES[bk];
   btn.onclick=function(){ch.base=bk;SFX.click();render();};
   r4.appendChild(btn);
  });
  var l5=document.createElement('div');l5.className='msg';l5.style.textAlign='left';l5.innerHTML='<b>5. Роль Барсика</b>';b.appendChild(l5);
  Object.keys(ROLES).forEach(function(rk){
   var d=document.createElement('div');d.className='selcard'+(ch.role===rk?' on':'');
   d.innerHTML='<div class="t">🐾 '+ROLES[rk].n+'</div><div class="d">'+ROLES[rk].d+'</div>';
   d.onclick=function(){ch.role=rk;SFX.click();render();};
   b.appendChild(d);
  });
  var f=document.createElement('div');f.className='fld';f.innerHTML='<label>Имя героя</label><input id="crName" value="'+ch.name+'">';b.appendChild(f);
  var go=document.createElement('button');go.className='btn gold grow';go.style.width='100%';go.textContent='⚔ Начать историю';
  go.onclick=function(){
   S.name=$('crName').value.trim()||'Барс';
   S.set=ch.set;S.role=ch.role;S.bg=ch.bg;S.av.base=ch.base;
   var cl=SETS[ch.set].classes[ch.cls];
   S.cls=cl[0];S.arch=cl[2];
   var bm=BGS[ch.bg].m;
   S.stats={str:6+(bm.str||0),agi:5+(bm.agi||0),int:4+(bm.int||0),vit:6+(bm.vit||0)};
   S.inv=[];S.equip={w:null,a:null,h:null,c:null,t:null};S.skills={};
   SETS[ch.set].kit.forEach(function(id){invAdd(id,1);});
   if(SETS[ch.set].ammo)invAdd(SETS[ch.set].ammo,24);
   S.loc='hub';S.mag=0;S.created=1;
   var d=derived();S.hp=d.maxHp;S.en=d.maxEn;
   logAdd('🌍 '+S.name+' начинает путь в мире «'+SETS[ch.set].n+'». Класс: '+cl[1]+'. Барсик: '+ROLES[S.role].n+'.');
   closeModal();save();ui();SFX.lvl();confetti(30);
   askAI({text:'Короткое вступительное слово мира для нового героя.',topic:'world'},function(txt){logAdd('✨ '+txt);toast(txt.slice(0,80));save();ui();});
  };
  b.appendChild(go);
 }
 render();
}
/* ================= INIT ================= */
resize();
if(!S.created){renderHUD();openCreation();}
else{renderHUD();setTabs();buildPanel();}
requestAnimationFrame(loop);
setTimeout(function(){var b=$('boot');if(b&&b.parentNode)b.parentNode.removeChild(b);},400);
window.__BARSIK_OK=true;
} /* end main */
})();
</script>
