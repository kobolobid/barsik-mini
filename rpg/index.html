<style>
:root{--bg:#0a0f1e;--panel:#141b33;--line:#2b3a66;--text:#eef2ff;--muted:#93a0c4;--gold:#ffd166;--grn:#39ff8e;--red:#ff5d5d;--ice:#7fd8ff;--vio:#b48bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:linear-gradient(180deg,#0d1226,#0a0f1e);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;user-select:none;touch-action:manipulation;overscroll-behavior:none}
.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;width:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);gap:4px}
.hud{display:flex;align-items:center;gap:4px;padding:5px 6px;background:linear-gradient(135deg,#1c2444,#141b33);border:1px solid var(--line);border-radius:12px;flex-wrap:wrap}
.who{font-weight:900;font-size:10px;color:var(--gold);white-space:nowrap}
.bars{flex:1;min-width:100px;display:flex;flex-direction:column;gap:2px}
.bar{height:8px;border-radius:5px;background:#0a0f22;border:1px solid #202a4d;overflow:hidden;position:relative}
.bar i{display:block;height:100%;transition:width .3s;border-radius:5px}
.bar.hp i{background:linear-gradient(90deg,#ff5d5d,#ff9d9d)}
.bar.en i{background:linear-gradient(90deg,#1d6fa8,#60c8ff)}
.bar b{position:absolute;inset:0;font-size:7px;line-height:8px;text-align:center;color:#fff;font-weight:900;text-shadow:0 1px 2px #000}
.pill{display:flex;align-items:center;gap:3px;background:#0d1226;border:1px solid var(--line);border-radius:999px;padding:2px 7px;font-size:9.5px;font-weight:900}
.pill b{color:var(--gold)}
.ibtn{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#0d1226;color:var(--text);font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.stage{flex:1;position:relative;min-height:200px;background:#060a14;border:1px solid var(--line);border-radius:12px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.tab{border:1px solid var(--line);background:linear-gradient(180deg,#20294c,#161d3a);color:var(--muted);border-radius:10px;padding:6px 2px;font-size:8.5px;font-weight:900;cursor:pointer;text-align:center}
.tab .ti{font-size:14px;display:block;margin-bottom:1px}
.tab.on{color:#fff;border-color:var(--ice);background:linear-gradient(180deg,#1d3a5c,#16294a)}
#panel{max-height:40vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px}
.jrmsg{background:#0a0f22;border:2px solid #3d4c85;border-radius:9px;padding:7px 9px;min-height:40px;font-size:11px;line-height:1.4;color:#e8eef8;margin-bottom:6px}
.row{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--line);background:linear-gradient(180deg,#20294c,#161d3a);color:var(--text);border-radius:10px;padding:8px 9px;font-size:10.5px;font-weight:900;cursor:pointer;font-family:inherit;min-height:34px}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.gold{background:linear-gradient(180deg,#b98b20,#7a5b15);border-color:var(--gold);color:#fff8dc}
.btn.grn{background:linear-gradient(180deg,#1f8f4d,#146637);border-color:#4ade80}
.btn.red{background:linear-gradient(180deg,#a83232,#7a2020);border-color:#f87171}
.btn.blu{background:linear-gradient(180deg,#1d6fa8,#14537b);border-color:#60c8ff}
.btn.vio{background:linear-gradient(180deg,#6d28d9,#4c1d95);border-color:#c4b5fd}
.msg{min-height:14px;font-size:10.5px;font-weight:800;color:var(--gold);text-align:center;margin-top:4px;line-height:1.3}
.eqrow{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:7px}
.eslot{aspect-ratio:1;border-radius:10px;border:1px dashed #3d4c85;background:#0d1430;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;position:relative;font-size:7px}
.eslot img{width:68%;height:68%;object-fit:contain}
.invgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
.icell{aspect-ratio:1;border-radius:9px;border:1px solid #2a3560;background:#101736;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.icell img{width:76%;height:76%;object-fit:contain}
.icell .q{position:absolute;bottom:0;right:2px;font-size:7.5px;font-weight:900;color:var(--gold);text-shadow:0 1px 2px #000}
.logbox{font-size:10px;line-height:1.4;color:#c9d4f0}
.logbox div{padding:2px 0;border-bottom:1px solid rgba(43,58,102,.3)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,8,18,.85);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{width:100%;max-width:600px;max-height:88vh;background:linear-gradient(180deg,#1b2342,#141b34);border:1px solid var(--line);border-bottom:none;border-radius:16px 16px 0 0;display:flex;flex-direction:column}
.sheet header{display:flex;align-items:center;gap:7px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font-size:13px;flex:1}
.x{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:#111832;color:var(--muted);font-size:13px;cursor:pointer}
.mbody{padding:10px 12px;overflow-y:auto;flex:1}
.dlg{display:flex;gap:9px;align-items:flex-start;margin-bottom:7px}
.dlg img{width:56px;height:56px;border-radius:11px;border:2px solid var(--gold);background:#0d1430}
.dlgbox{flex:1;background:#0a0f22;border:1px solid #3d4c85;border-radius:11px;padding:8px 10px;font-size:11.5px;line-height:1.4;min-height:50px}
.dlgname{font-size:9px;font-weight:950;color:var(--gold);margin-bottom:2px}
.ithead{display:flex;gap:9px;align-items:center}
.ithead img{width:56px;height:56px;background:#0d1430;border:1px solid var(--line);border-radius:11px;padding:4px}
.itname{font-weight:950;font-size:13px}
.itmods{font-size:10.5px;color:#c9d4f0;line-height:1.5;margin:7px 0}
.fld{margin:7px 0}
.fld label{font-size:9.5px;color:var(--muted);font-weight:800;display:block;margin-bottom:2px}
.fld input,.fld textarea{width:100%;background:#0e1430;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:7px 9px;font-size:11px;outline:none;font-family:inherit}
.tog{display:flex;align-items:center;justify-content:space-between;background:#101736;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin:6px 0;font-size:11px;font-weight:800}
.sw{width:40px;height:22px;border-radius:999px;background:#2a3560;position:relative;cursor:pointer;transition:.2s;flex:0 0 auto}
.sw i{position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#8b98c2;transition:.2s}
.sw.on{background:linear-gradient(135deg,var(--grn),#2fbf85)}
.sw.on i{left:21px;background:#fff}
.selcard{border:1px solid var(--line);border-radius:12px;background:#101736;padding:9px;margin-bottom:6px;cursor:pointer}
.selcard.on{border-color:var(--grn);background:#0d2418}
.selcard .t{font-weight:950;font-size:12px}
.selcard .d{font-size:9.5px;color:var(--muted);margin-top:2px;line-height:1.3}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%) translateY(16px);z-index:90;background:rgba(14,20,42,.96);border:1px solid var(--gold);color:var(--text);padding:7px 14px;border-radius:11px;font-size:11px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#fatal{display:none;position:fixed;inset:0;z-index:99;background:#101018;color:#ffd7d7;padding:16px;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow:auto}
#boot{position:fixed;inset:0;z-index:98;background:#0a0f1e;color:var(--ice);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:13px/1.5 ui-monospace,Menlo,monospace;text-align:center;padding:20px}
#boot .spin{width:38px;height:38px;border:4px solid #1c2444;border-top-color:var(--ice);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.joy{position:fixed;bottom:80px;left:20px;width:100px;height:100px;border-radius:50%;background:rgba(20,27,51,.7);border:2px solid var(--line);display:none;z-index:40}
.joy.show{display:block}
.joy i{position:absolute;top:50%;left:50%;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;background:var(--ice);border:2px solid #fff;transition:transform .1s}
</style>
</head>

function $(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function rand(a,b){return a+Math.random()*(b-a);}
function randi(a,b){return Math.floor(rand(a,b+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}

/* ================= AUDIO ================= */
var A={ctx:null,master:null};
function volGain(){return S.sound?(clamp(S.vol,0,100)/100)*0.5:0;}
function applyAudio(){if(A.master)A.master.gain.value=volGain();}
function audioInit(){if(A.ctx)return;try{var C=window.AudioContext||window.webkitAudioContext;A.ctx=new C();A.master=A.ctx.createGain();A.master.gain.value=volGain();A.master.connect(A.ctx.destination);}catch(e){}}
function tone(f,dur,type,vol,slide){if(!A.ctx||!S.sound)return;try{var o=A.ctx.createOscillator(),g=A.ctx.createGain(),t=A.ctx.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);g.gain.setValueAtTime(vol||0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(A.master);o.start(t);o.stop(t+dur+0.02);}catch(e){}}
function noise(dur,vol,freq){if(!A.ctx||!S.sound)return;try{var n=Math.floor(A.ctx.sampleRate*dur),buf=A.ctx.createBuffer(1,n,A.ctx.sampleRate),d=buf.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);var s=A.ctx.createBufferSource();s.buffer=buf;var f=A.ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||1200;var g=A.ctx.createGain();g.gain.value=vol||0.1;s.connect(f);f.connect(g);g.connect(A.master);s.start();}catch(e){}}

 step:function(){noise(0.04,0.05,700);},
 chest:function(){tone(520,0.1,'sine',0.12);setTimeout(function(){tone(780,0.15,'sine',0.1);},80);},
 door:function(){noise(0.15,0.08,400);tone(120,0.2,'sine',0.08);}

/* ================= DERIVED ================= */
function eqMods(){
 var m={atk:0,def:0,hp:0,en:0,str:0,agi:0,int:0,vit:0,crit:0,spd:0};
 for(var k in S.equip){var id=S.equip[k];if(!id)continue;var it2=ITEMS[id];if(!it2)continue;for(var mk in it2.mods)m[mk]=(m[mk]||0)+it2.mods[mk];}
 return m;
}
function derived(){
 var m=eqMods(),st=S.stats;
 var str=st.str+(m.str||0),agi=st.agi+(m.agi||0),int=st.int+(m.int||0),vit=st.vit+(m.vit||0);
 return{
  maxHp:40+vit*6+S.lv*8+(m.hp||0),
  maxEn:20+int*4+S.lv*3+(m.en||0),
  atk:4+S.lv*2+Math.round(str*1.6)+(m.atk||0),
  def:2+S.lv+Math.round(vit*0.8)+(m.def||0),
  crit:5+agi*0.6+(m.crit||0)
 };
}
function xpNeed(lv){return Math.floor(80*Math.pow(lv,1.35));}
function addXp(n){
 S.xp+=n;logAdd('Опыт +'+n);
 while(S.xp>=xpNeed(S.lv)){
  S.xp-=xpNeed(S.lv);S.lv++;S.sp+=2;
  var g=S.arch==='brute'?{str:3,agi:1,int:1,vit:3}:{str:2,agi:4,int:1,vit:2};
  S.stats.str+=g.str;S.stats.agi+=g.agi;S.stats.int+=g.int;S.stats.vit+=g.vit;
  var d=derived();S.hp=d.maxHp;S.en=d.maxEn;
  SFX.lvl();toast('🎉 Уровень '+S.lv+'!');
  logAdd('🎉 Уровень '+S.lv+'! +2 очка');
 }
 save();
}
function invCount(id){var t=0;S.inv.forEach(function(r){if(r.id===id)t+=r.q;});return t;}
function invAdd(id,q){q=q||1;var r=null;S.inv.forEach(function(x){if(x.id===id)r=x;});if(r)r.q+=q;else S.inv.push({id:id,q:q});save();}
function invDel(id,q){q=q||1;for(var i=0;i<S.inv.length;i++){if(S.inv[i].id===id){S.inv[i].q-=q;if(S.inv[i].q<=0)S.inv.splice(i,1);break;}}save();}

var camX=0,camY=0;
function worldToScreen(wx,wy){return{x:wx*TILE-camX+CW/2,y:wy*TILE-camY+CH/2};}
function screenToWorld(sx,sy){return{x:(sx+camX-CW/2)/TILE,y:(sy+camY-CH/2)/TILE};}

function drawWorld(){
 var loc=LOCS[S.loc];if(!loc)return;
 CX.fillStyle=loc.bg==='snow'?'#e8eef8':(loc.bg==='forest'?'#1d3a52':(loc.bg==='cave'?'#2a2450':'#141b33'));
 CX.fillRect(0,0,CW,CH);
 camX=S.px*TILE;camY=S.py*TILE;
 var startX=Math.max(0,Math.floor((camX-CW/2)/TILE)-1);
 var startY=Math.max(0,Math.floor((camY-CH/2)/TILE)-1);
 var endX=Math.min(loc.w,Math.ceil((camX+CW/2)/TILE)+1);
 var endY=Math.min(loc.h,Math.ceil((camY+CH/2)/TILE)+1);
 for(var y=startY;y<endY;y++){
  for(var x=startX;x<endX;x++){
   var tile=loc.tiles(x,y);
   var sp=worldToScreen(x,y);
   if(tile===1){CX.fillStyle='#3a4560';CX.fillRect(sp.x,sp.y,TILE,TILE);}
   else if(tile===2){CX.fillStyle='#5a6a3a';CX.fillRect(sp.x,sp.y,TILE,TILE);}
   else if(tile===3){CX.fillStyle='#8f5a26';CX.fillRect(sp.x,sp.y,TILE,TILE);}
   else{CX.fillStyle=loc.bg==='snow'?'#f4f7fb':(loc.bg==='forest'?'#dfe9f5':'#3a2f6a');CX.fillRect(sp.x,sp.y,TILE,TILE);}
  }
 }
 loc.doors.forEach(function(d){
  var sp=worldToScreen(d.x,d.y);
  CX.fillStyle='#5e3a1e';CX.fillRect(sp.x+4,sp.y+4,TILE-8,TILE-8);
  CX.fillStyle='#ffd166';CX.beginPath();CX.arc(sp.x+TILE-10,sp.y+TILE/2,3,0,7);CX.fill();
 });
 loc.chests.forEach(function(ch){
  if(ch.opened)return;
  var sp=worldToScreen(ch.x,ch.y);
  CX.fillStyle='#8f5a26';rr(CX,sp.x+6,sp.y+8,TILE-12,TILE-16,4);CX.fill();
  CX.fillStyle='#ffd166';CX.fillRect(sp.x+TILE/2-3,sp.y+TILE/2-2,6,4);
 });
 loc.enemies.forEach(function(e){
  var sp=worldToScreen(e.x,e.y);
  drawEnemy(CX,sp.x+TILE/2,sp.y+TILE/2,e.type,TT);
 });
 loc.npcs.forEach(function(n){
  var sp=worldToScreen(n.x,n.y);
  drawNPC(CX,sp.x+TILE/2,sp.y+TILE/2,n.sprite,2,TT);
 });
 var psp=worldToScreen(S.px,S.py);
 drawChar(CX,psp.x+TILE/2,psp.y+TILE/2,S.pdir,S.pframe,S.race,S.hair,S.skin,S.eyes,S.outfit,S.pmoving);
 drawBarsik(CX,psp.x+TILE/2-TILE*0.8,psp.y+TILE/2,2,TT+10,'happy');
}

function buildWorldPanel(p){
 var loc=LOCS[S.loc];
 var h=document.createElement('div');h.className='msg';h.innerHTML='<b>📍 '+loc.name+'</b>';p.appendChild(h);
 var r=document.createElement('div');r.className='row';p.appendChild(r);P_REF=r;
 mkBtn('blu grow','🗺 Карта',function(){SCR='map';setTabs();ui();});
}
function buildMapPanel(p){
 var h=document.createElement('div');h.className='msg';h.textContent='Тапни локацию для перехода';p.appendChild(h);
 var r=document.createElement('div');r.className='row';p.appendChild(r);P_REF=r;
 mkBtn('grn grow','← Назад',function(){SCR='world';setTabs();ui();});
}
function buildInvPanel(p){
 var grid=document.createElement('div');grid.className='invgrid';p.appendChild(grid);
 if(!S.inv.length){var e2=document.createElement('div');e2.className='msg';e2.textContent='Пусто';p.appendChild(e2);}
 S.inv.forEach(function(row){
  var c=document.createElement('div');c.className='icell';
  c.innerHTML='<span style="font-size:20px">📦</span>';
  if(row.q>1){var q=document.createElement('span');q.className='q';q.textContent='×'+row.q;c.appendChild(q);}
  grid.appendChild(c);
 });
}
function buildQuestPanel(p){
 if(!S.quests.length){var e2=document.createElement('div');e2.className='msg';e2.textContent='Нет активных заданий';p.appendChild(e2);return;}
 S.quests.forEach(function(q){
  var d=document.createElement('div');d.className='msg';d.style.textAlign='left';
  d.innerHTML='📜 <b>'+q.title+'</b><br>Прогресс: '+q.prog+'/'+q.need;p.appendChild(d);
 });
}
function buildCharPanel(p){
 var d=derived();
 var rows=[['❤ HP',Math.round(S.hp)+'/'+d.maxHp],['⚡ EN',Math.round(S.en)+'/'+d.maxEn],['⚔ Атака',d.atk],['🛡 Защита',d.def],['🎯 Крит',d.crit.toFixed(1)+'%'],['📈 Опыт',S.xp+'/'+xpNeed(S.lv)]];
 rows.forEach(function(rw){
  var l=document.createElement('div');l.className='msg';l.style.textAlign='left';
  l.innerHTML=rw[0]+': <b>'+rw[1]+'</b>';p.appendChild(l);
 });
}
function buildLogPanel(p){
 var b=document.createElement('div');b.className='logbox';
 S.log.slice(0,30).forEach(function(l){var d2=document.createElement('div');d2.textContent=l;b.appendChild(d2);});
 if(!S.log.length)b.innerHTML='<div>Пока тихо…</div>';
 p.appendChild(b);
}
function setTabs(){document.querySelectorAll('.tab').forEach(function(t){t.classList.toggle('on',t.getAttribute('data-scr')===SCR);});}
document.querySelectorAll('.tab').forEach(function(t){t.onclick=function(){SCR=t.getAttribute('data-scr');SFX.click();setTabs();ui();};});

/* ================= MODALS ================= */
function openModal(title){$('mTitle').textContent=title;$('mBody').innerHTML='';$('modal').classList.add('open');return $('mBody');}
function closeModal(){$('modal').classList.remove('open');}
$('mClose').onclick=function(){SFX.click();closeModal();};

/* ================= SETTINGS ================= */
function openSettings(){
 var b=openModal('⚙ Настройки');
 var rs=document.createElement('button');rs.className='btn red grow';rs.style.width='100%';rs.textContent='🗑 Новый герой';
 rs.onclick=function(){if(confirm('Начать заново?')){try{localStorage.removeItem(KEY);}catch(e){}location.reload();}};
 b.appendChild(rs);
}
$('btnSet').onclick=function(){SFX.click();openSettings();};

/* ================= LOOP ================= */
var TT=0,lastTS=0;
function loop(ts){
 requestAnimationFrame(loop);
 try{
  if(!lastTS)lastTS=ts;
  var dt=clamp((ts-lastTS)/1000,0,0.05);lastTS=ts;TT+=dt;
  if(CW<10||CH<10)resize();
  CX.setTransform(DPR,0,0,DPR,0,0);
  CX.clearRect(0,0,CW,CH);
  if(S.created&&SCR==='world'){
   if(moveDir.x||moveDir.y)tryMove(moveDir.x,moveDir.y);
   else S.pmoving=false;
   drawWorld();
  }
  updFx(dt);
 }catch(err){showFatal(err);}
}

/* ================= CREATION ================= */
function openCreation(){
 var ch={name:S.name||'Барс',race:'human',hair:'#6b4014',skin:'#ffd9b3',eyes:'#3a2410',outfit:'#2e8fd8'};
 function render(){
  var b=openModal('🐾 Создание героя');
  var f1=document.createElement('div');f1.className='fld';f1.innerHTML='<label>Имя</label><input id="crName" value="'+ch.name+'">';b.appendChild(f1);
  var f2=document.createElement('div');f2.className='fld';f2.innerHTML='<label>Цвет волос</label><input id="crHair" type="color" value="'+ch.hair+'">';b.appendChild(f2);
  var f3=document.createElement('div');f3.className='fld';f3.innerHTML='<label>Цвет кожи</label><input id="crSkin" type="color" value="'+ch.skin+'">';b.appendChild(f3);
  var f4=document.createElement('div');f4.className='fld';f4.innerHTML='<label>Цвет глаз</label><input id="crEyes" type="color" value="'+ch.eyes+'">';b.appendChild(f4);
  var f5=document.createElement('div');f5.className='fld';f5.innerHTML='<label>Цвет одежды</label><input id="crOutfit" type="color" value="'+ch.outfit+'">';b.appendChild(f5);
  var go=document.createElement('button');go.className='btn gold grow';go.style.width='100%';go.textContent='⚔ Начать';
  go.onclick=function(){
   S.name=$('crName').value.trim()||'Барс';
   S.hair=$('crHair').value;S.skin=$('crSkin').value;S.eyes=$('crEyes').value;S.outfit=$('crOutfit').value;
   S.created=1;S.loc='hub';S.px=20;S.py=15;
   S.inv=[];invAdd('s_sword1',1);invAdd('s_cloth1',1);invAdd('pot1',3);
   var d=derived();S.hp=d.maxHp;S.en=d.maxEn;
   logAdd('🌍 '+S.name+' начинает путь!');
   closeModal();save();ui();SFX.lvl();toast('Добро пожаловать!');
  };
  b.appendChild(go);
 }
 render();
}

/* ================= INIT ================= */
resize();
if(!S.created){renderHUD();openCreation();}
else{renderHUD();setTabs();buildPanel();}
requestAnimationFrame(loop);
setTimeout(function(){var b=$('boot');if(b&&b.parentNode)b.parentNode.removeChild(b);},400);
window.__BARSIK_OK=true;
} /* end main */
})();
</script>
<script>
setTimeout(function(){
 if(!window.__BARSIK_OK){
  var b=document.getElementById('boot');
  if(b){b.innerHTML='<div style="max-width:92vw;line-height:1.6">⚠️ Ошибка загрузки.</div>';}
 }
},3000);
</script>
