<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141a2e">
<title>Barsik Life — домик снежного барса</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#141a2e;--bg2:#0d1222;--panel:#1c2440;--panel2:#242f52;--line:#33406b;
  --text:#eef2ff;--muted:#94a1c6;--ice:#7fd8ff;--mint:#5fe3b3;--amber:#ffc94d;
  --rose:#ff6d9d;--violet:#b48bff;--danger:#ff5d5d;--ok:#43d97b;--gold:#ffd166;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:radial-gradient(900px 500px at 12% -10%,rgba(127,216,255,.10),transparent 60%),
             radial-gradient(800px 460px at 108% 8%,rgba(180,139,255,.10),transparent 55%),
             linear-gradient(180deg,var(--bg),var(--bg2));}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;user-select:none;overscroll-behavior:none}
.app{display:flex;flex-direction:column;height:100%;width:100%;max-width:620px;margin:0 auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#0f1528;border-radius:8px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--ice),var(--violet));border-radius:8px;border:2px solid #0f1528}
.hud{display:flex;align-items:center;gap:7px;padding:8px 10px;background:linear-gradient(135deg,#1d2547,#161d36);border-bottom:1px solid var(--line)}
.logo{font-weight:900;font-size:14px;letter-spacing:.3px;white-space:nowrap;
  background:linear-gradient(90deg,var(--ice),var(--mint),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.pill{display:flex;align-items:center;gap:5px;background:#101733;border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:12px;font-weight:800}
.pill b{color:var(--gold)}
.pill.lv b{color:var(--mint)}
.sp{flex:1}
.ib{width:33px;height:33px;flex:0 0 auto;border-radius:10px;border:1px solid var(--line);background:#101733;color:var(--text);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.ib:active{transform:scale(.92)}
.ib i{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--rose);border:2px solid #161d36;display:none}
.ib.hot i{display:block}
.xp{height:4px;background:#0b1024}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--ice));transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:6px 8px;background:#151c36;border-bottom:1px solid var(--line)}
.st{background:#0f1530;border:1px solid #26315a;border-radius:9px;padding:4px 5px}
.st .l{font-size:8.5px;color:var(--muted);display:flex;justify-content:space-between;font-weight:800;gap:2px}
.st .l b{color:var(--text)}
.st .t{height:5px;background:#080d1e;border-radius:4px;margin-top:3px;overflow:hidden}
.st .t i{display:block;height:100%;width:0;border-radius:4px;transition:width .35s}
.stage{flex:1;position:relative;min-height:170px;background:#080c1a;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.wish{position:absolute;top:8px;left:8px;z-index:4;pointer-events:none;display:none;gap:7px;align-items:center;
  background:rgba(14,20,42,.93);border:1px solid var(--violet);border-radius:12px;padding:6px 10px;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.wish.on{display:flex}
.wish .wi{font-size:17px}
.wish .wt{font-size:11px;font-weight:800}
.wish .ws{font-size:9px;color:var(--muted);font-weight:700;margin-top:1px}
.tag{position:absolute;top:8px;right:8px;z-index:4;pointer-events:none;background:rgba(14,20,42,.86);
  border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:11px;font-weight:800;color:var(--ice)}
.rooms{display:flex;gap:5px;padding:6px 8px;background:#131a33;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.rt{flex:1;min-width:60px;border:1px solid var(--line);background:#0f1530;color:var(--muted);border-radius:11px;
  padding:5px 3px;font-size:9.5px;font-weight:800;cursor:pointer;text-align:center;line-height:1.15}
.rt span{display:block;font-size:16px}
.rt.on{background:linear-gradient(135deg,#20406b,#262c58);color:#fff;border-color:var(--ice);box-shadow:0 0 12px rgba(127,216,255,.22)}
.tools{display:flex;gap:6px;padding:7px 8px;background:#10162c;border-top:1px solid var(--line);overflow-x:auto;min-height:60px;scrollbar-width:none}
.tools::-webkit-scrollbar{display:none}
.tl{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:1px;border:1px solid var(--line);
  background:#151d3a;color:var(--text);border-radius:12px;padding:5px 9px;min-width:56px;font-size:9px;font-weight:800;cursor:pointer}
.tl span{font-size:19px;line-height:1.05}
.tl em{font-style:normal;color:var(--gold);font-size:9px}
.tl.on{border-color:var(--mint);background:#123020;box-shadow:0 0 10px rgba(95,227,179,.22)}
.tl:active{transform:scale(.94)}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px;background:linear-gradient(180deg,#18203c,#131a33);border-top:1px solid var(--line)}
.nb{border:1px solid var(--line);background:linear-gradient(180deg,#212a4e,#182040);color:var(--text);border-radius:12px;
  padding:7px 3px;font-size:9.5px;font-weight:900;cursor:pointer;text-align:center;line-height:1.2}
.nb span{display:block;font-size:17px;margin-bottom:2px}
.nb:active{transform:scale(.95);border-color:var(--ice)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(4,7,16,.8);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.sheet{width:100%;max-width:620px;max-height:88vh;display:flex;flex-direction:column;
  background:linear-gradient(180deg,#1c2444,#141b34);border:1px solid var(--line);border-bottom:none;
  border-radius:20px 20px 0 0;box-shadow:0 -18px 60px rgba(0,0,0,.55);animation:up .22s ease}
@keyframes up{from{transform:translateY(36px);opacity:.3}to{transform:none;opacity:1}}
.sheet header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet h3{margin:0;font-size:15px;flex:1}
.xx{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:#101733;color:var(--muted);font-size:15px;cursor:pointer}
.mb{padding:12px 14px;overflow-y:auto;flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tb{border:1px solid var(--line);background:#101733;color:var(--muted);border-radius:999px;padding:6px 11px;font-size:10.5px;font-weight:800;cursor:pointer}
.tb.on{background:linear-gradient(135deg,#24406b,#2b305e);color:#fff;border-color:var(--ice)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cd{background:#101736;border:1px solid #2a3560;border-radius:13px;padding:8px 6px;text-align:center;position:relative}
.cd.own{border-color:#41528c}
.cd.eq{border-color:var(--mint);box-shadow:0 0 10px rgba(95,227,179,.2)}
.cd img{width:62px;height:62px;display:block;margin:0 auto}
.cd .em{font-size:32px;line-height:62px}
.cd .nm{font-size:9.5px;font-weight:800;margin-top:3px;line-height:1.2;min-height:23px}
.cd .pr{font-size:10px;font-weight:900;color:var(--gold);margin-top:2px}
.cd .ds{font-size:8.5px;color:var(--muted);line-height:1.2;margin-top:2px}
.rar{position:absolute;top:5px;left:5px;font-size:8px;font-weight:900;padding:2px 5px;border-radius:6px}
.r0{background:#2a3560;color:#a9b5dd}.r1{background:#163a5e;color:#7fd8ff}
.r2{background:#3a2360;color:#c9a4ff}.r3{background:#5e3a10;color:#ffd166}
.cb{width:100%;margin-top:5px;border:none;border-radius:8px;padding:6px 4px;font-size:10px;font-weight:900;cursor:pointer;
  background:linear-gradient(135deg,var(--ice),#4aa8e0);color:#07112a}
.cb.g{background:linear-gradient(135deg,var(--mint),#2fbf85);color:#052018}
.cb.r{background:linear-gradient(135deg,#ff8080,#e04545);color:#fff}
.cb.d{background:#2a3560;color:#8b98c2}
.more{width:100%;margin-top:10px;border:1px dashed var(--line);background:none;color:var(--ice);border-radius:10px;padding:9px;font-weight:800;font-size:12px;cursor:pointer}
.note{font-size:11px;color:var(--muted);line-height:1.45;margin:4px 0 10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.big{width:100%;border:none;border-radius:12px;padding:12px;font-size:13px;font-weight:900;cursor:pointer;margin-top:8px;
  background:linear-gradient(135deg,var(--gold),#f0a832);color:#241a05}
.big.b{background:linear-gradient(135deg,var(--ice),#4aa8e0);color:#07112a}
.big.v{background:linear-gradient(135deg,var(--violet),#8b5cf6);color:#fff}
.big.d{background:#2a3560;color:#9aa7cf}
.big.x{background:#5b2330;color:#ffb8c4}
.gc{display:flex;gap:10px;align-items:center;background:#101736;border:1px solid #2a3560;border-radius:13px;padding:10px;margin-bottom:8px;cursor:pointer}
.gc:active{border-color:var(--ice)}
.gc .gi{font-size:26px;width:44px;height:44px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#182148;border-radius:11px}
.gc .gn{font-weight:900;font-size:13px}
.gc .gd{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.3}
.gc .gb{margin-left:auto;font-size:10px;color:var(--gold);font-weight:900;white-space:nowrap}
.chat{display:flex;flex-direction:column;gap:8px;min-height:180px}
.mg{max-width:84%;padding:8px 11px;border-radius:14px;font-size:12.5px;line-height:1.4}
.mg.u{align-self:flex-end;background:linear-gradient(135deg,#2b4a7c,#23345e);border:1px solid #3c5b96;border-bottom-right-radius:4px}
.mg.b{align-self:flex-start;background:#131b3a;border:1px solid var(--line);border-bottom-left-radius:4px}
.mg .who{font-size:8.5px;color:var(--mint);font-weight:900;margin-bottom:2px}
.ci{display:flex;gap:7px;padding-top:10px;margin-top:10px;border-top:1px solid var(--line)}
.ci input{flex:1;background:#0d1330;border:1px solid var(--line);border-radius:11px;color:var(--text);padding:10px 12px;font-size:13px;outline:none}
.ci input:focus{border-color:var(--ice)}
.ci button{border:none;border-radius:11px;padding:0 15px;font-size:16px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,var(--mint),#2fbf85);color:#052018}
.fld{margin:10px 0}
.fld label{display:block;font-size:11px;color:var(--muted);font-weight:800;margin-bottom:4px}
.fld input,.fld select{width:100%;background:#0d1330;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:9px 11px;font-size:12px;outline:none}
.tg{display:flex;align-items:center;justify-content:space-between;background:#101736;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin:8px 0;font-size:12px;font-weight:800}
.sw{width:44px;height:24px;border-radius:999px;background:#2a3560;position:relative;cursor:pointer;transition:.2s;flex:0 0 auto}
.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#8b98c2;transition:.2s}
.sw.on{background:linear-gradient(135deg,var(--mint),#2fbf85)}
.sw.on i{left:23px;background:#fff}
.bn{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#4a2a12,#5e3a10);border:1px solid var(--amber);
  border-radius:12px;padding:10px 12px;font-size:11.5px;font-weight:800;color:#ffd9a0;margin-bottom:10px}
.bn button{margin-left:auto;border:none;background:var(--amber);color:#241a05;border-radius:8px;padding:6px 10px;font-weight:900;font-size:11px;cursor:pointer}
#toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%) translateY(16px);z-index:90;opacity:0;pointer-events:none;
  background:rgba(13,19,40,.97);border:1px solid var(--ice);border-radius:12px;padding:9px 15px;font-size:12px;font-weight:800;
  max-width:86vw;text-align:center;transition:.25s;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translateX(-50%)}
#err{position:fixed;inset:0;z-index:200;display:none;background:#0d1222;color:#ffb8c4;padding:18px;font:12px/1.5 ui-monospace,monospace;overflow:auto;white-space:pre-wrap}
@media(max-width:370px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <div class="hud">
    <div class="logo">🐾 BARSIK LIFE</div>
    <div class="pill">🪙 <b id="hCoins">0</b></div>
    <div class="pill lv">⭐ <b id="hLvl">1</b></div>
    <div class="sp"></div>
    <button class="ib" id="bDaily">🎁<i></i></button>
    <button class="ib" id="bSound">🔊</button>
    <button class="ib" id="bSet">⚙️</button>
  </div>
  <div class="xp"><i id="hXp"></i></div>
  <div class="stats" id="stats"></div>
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="wish" id="wish"><span class="wi" id="wI">💭</span><div><div class="wt" id="wT"></div><div class="ws" id="wS"></div></div></div>
    <div class="tag" id="tag">🛋 Гостиная</div>
  </div>
  <div class="rooms" id="rooms"></div>
  <div class="tools" id="tools"></div>
  <div class="nav">
    <button class="nb" id="nShop"><span>🛍</span>Магазин</button>
    <button class="nb" id="nWard"><span>👗</span>Гардероб</button>
    <button class="nb" id="nGame"><span>🎮</span>Игры</button>
    <button class="nb" id="nFurn"><span>🛋</span>Мебель</button>
    <button class="nb" id="nChat"><span>💬</span>Чат</button>
  </div>
</div>
<div class="modal" id="modal"><div class="sheet">
  <header><h3 id="mT"></h3><button class="xx" id="mX">✕</button></header>
  <div class="mb" id="mB"></div>
</div></div>
<div id="toast"></div>
<div id="err"></div>
<script>
(function(){
"use strict";
function fail(e){var el=document.getElementById("err");el.style.display="block";el.textContent="Барсик споткнулся:\n\n"+(e&&e.stack?e.stack:String(e));}
window.onerror=function(m,s,l,c,e){fail(e||m);};
try{

/* ---------- Telegram ---------- */
var TG=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
if(TG){try{TG.ready();TG.expand();if(TG.setHeaderColor)TG.setHeaderColor("#141a2e");if(TG.setBackgroundColor)TG.setBackgroundColor("#0d1222");if(TG.disableVerticalSwipes)TG.disableVerticalSwipes();}catch(e){}}

/* ---------- utils ---------- */
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function rand(a,b){return a+Math.random()*(b-a);}
function randi(a,b){return Math.floor(a+Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function fmt(n){return String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g," ");}
function now(){return Date.now();}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function box(c,x,y,w,h,r,f){c.fillStyle=f;rr(c,x,y,w,h,r);c.fill();}
function qp(x0,y0,cx,cy,x1,y1,t){var u=1-t;return [u*u*x0+2*u*t*cx+t*t*x1,u*u*y0+2*u*t*cy+t*t*y1];}
function wrap(c,txt,max){var w=txt.split(" "),out=[],cur="";for(var i=0;i<w.length;i++){var t=cur?cur+" "+w[i]:w[i];if(c.measureText(t).width>max&&cur){out.push(cur);cur=w[i];}else cur=t;}if(cur)out.push(cur);return out;}
var toastTimer=null;
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove("on");},2100);}

/* ---------- audio ---------- */
var A={ctx:null,gain:null,on:true};
function audioOn(){if(A.ctx)return;try{var C=window.AudioContext||window.webkitAudioContext;if(!C)return;A.ctx=new C();A.gain=A.ctx.createGain();A.gain.gain.value=A.on?0.45:0;A.gain.connect(A.ctx.destination);}catch(e){}}
function tone(f,d,type,v,slide){if(!A.ctx||!A.on)return;try{var t=A.ctx.currentTime,o=A.ctx.createOscillator(),g=A.ctx.createGain();o.type=type||"sine";o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),t+d);g.gain.setValueAtTime(v||0.18,t);g.gain.exponentialRampToValueAtTime(0.001,t+d);o.connect(g);g.connect(A.gain);o.start(t);o.stop(t+d+0.03);}catch(e){}}
function noise(d,v,f){if(!A.ctx||!A.on)return;try{var n=Math.floor(A.ctx.sampleRate*d),b=A.ctx.createBuffer(1,n,A.ctx.sampleRate),ch=b.getChannelData(0);for(var i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);var s=A.ctx.createBufferSource();s.buffer=b;var bp=A.ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=f||1200;var g=A.ctx.createGain();g.gain.value=v||0.14;s.connect(bp);bp.connect(g);g.connect(A.gain);s.start();}catch(e){}}
var SFX={
  click:function(){tone(720,0.05,"square",0.07);},
  coin:function(){tone(880,0.07,"square",0.11);setTimeout(function(){tone(1320,0.11,"square",0.11);},70);},
  meow:function(){tone(640,0.26,"sawtooth",0.09,-250);setTimeout(function(){tone(430,0.2,"sawtooth",0.07,-110);},130);},
  purr:function(){for(var i=0;i<5;i++)(function(k){setTimeout(function(){tone(88+(k%2)*16,0.09,"triangle",0.13);},k*85);})(i);},
  eat:function(){noise(0.07,0.13,900);setTimeout(function(){noise(0.07,0.11,720);},130);setTimeout(function(){noise(0.06,0.09,820);},250);},
  splash:function(){noise(0.24,0.15,1700);},
  foam:function(){noise(0.11,0.08,2600);},
  pop:function(){tone(540,0.06,"sine",0.15,300);},
  scoop:function(){noise(0.1,0.11,520);setTimeout(function(){tone(980,0.1,"sine",0.09,220);},90);},
  win:function(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,0.15,"triangle",0.13);},i*85);});},
  lose:function(){tone(300,0.28,"sawtooth",0.09,-130);},
  lvl:function(){[523,659,784,1046,1318].forEach(function(f,i){setTimeout(function(){tone(f,0.18,"triangle",0.14);},i*75);});},
  squeak:function(){tone(1850,0.07,"square",0.08,600);},
  zzz:function(){tone(300,0.4,"sine",0.05,-80);}
};
document.addEventListener("pointerdown",function(){audioOn();if(A.ctx&&A.ctx.state==="suspended")A.ctx.resume();},{passive:true});

/* ---------- palettes ---------- */
var PAL=[
 {n:"Океан",a:"#2e8fd8",b:"#1b5e96",c:"#bfe6ff"},
 {n:"Закат",a:"#f0703c",b:"#b3441e",c:"#ffd9b8"},
 {n:"Мята",a:"#3ecf96",b:"#1f8f63",c:"#c9f7e4"},
 {n:"Роза",a:"#f0609a",b:"#b03368",c:"#ffd3e6"},
 {n:"Лаванда",a:"#9a6cf0",b:"#6a3fc0",c:"#e4d6ff"},
 {n:"Золото",a:"#f0b83c",b:"#b07f18",c:"#fff0c4"},
 {n:"Уголь",a:"#48527a",b:"#2a3150",c:"#aab4d4"},
 {n:"Снег",a:"#e8eef8",b:"#b0bcd6",c:"#ffffff"},
 {n:"Лес",a:"#4a8f3c",b:"#2c5e22",c:"#cdeec2"},
 {n:"Рубин",a:"#e04545",b:"#9c2424",c:"#ffc9c9"},
 {n:"Небо",a:"#6cc4f0",b:"#3a86b8",c:"#e0f5ff"},

function load(){
 var s=JSON.parse(JSON.stringify(DEF));
 try{
  var raw=localStorage.getItem(KEY);
  if(raw){
   var o=JSON.parse(raw);
   for(var k in DEF){
    if(!Object.prototype.hasOwnProperty.call(DEF,k))continue;
    if(o[k]===undefined||o[k]===null)continue;
    if(k==="inv"||k==="eq"||k==="res"||k==="best"){
     for(var kk in DEF[k]){if(o[k]&&o[k][kk]!==undefined)s[k][kk]=o[k][kk];}
    }else s[k]=o[k];
   }
  }
 }catch(e){}
 if(!Array.isArray(s.meals))s.meals=[];
 if(!Array.isArray(s.piles))s.piles=[];
 if(!Array.isArray(s.dirt))s.dirt=[];
 if(!Array.isArray(s.owned))s.owned=DEF.owned.slice();
 if(!Array.isArray(s.furn))s.furn=DEF.furn.slice();
 if(!Array.isArray(s.chat))s.chat=[];
 var away=clamp((now()-(s.seen||now()))/1000,0,28800);
 s.hunger=clamp(s.hunger-away*0.004,6,100);
 s.mood=clamp(s.mood-away*0.003,6,100);
 s.energy=clamp(s.energy+away*0.006,0,100);
 s.stomach=0;s.meals=[];
 return s;
}

/* ---------- particles ---------- */
function part(x,y,t,o){
 var p={x:x,y:y,t:t,life:1,vx:rand(-30,30),vy:rand(-90,-40),r:rand(3,7),rot:rand(0,6),ch:null,col:null};
 if(t==="heart"){p.ch="💗";p.vy=rand(-70,-40);}
 if(t==="foam"){p.vy=rand(-22,-4);p.vx=rand(-16,16);p.r=rand(4,9);}
 if(t==="drop"){p.vy=rand(20,60);p.vx=rand(-10,10);p.r=rand(2,4);}
 if(t==="spark")p.ch="✨";
 if(t==="zzz"){p.ch="💤";p.vy=-26;p.vx=rand(-8,8);}
 if(t==="crumb"){p.vy=rand(-40,-10);p.r=rand(1.5,3);p.col=(o&&o.col)||"#c98a4b";}
 if(t==="conf"){p.vy=rand(-170,-60);p.vx=rand(-95,95);p.col=pick(["#ff6d9d","#7fd8ff","#5fe3b3","#ffc94d","#b48bff"]);p.r=rand(3,6);}
 if(t==="fly"){p.ch="🪰";p.vx=rand(-130,130);p.vy=rand(-130,-40);}
 if(t==="leaf"){p.ch="🍃";p.vy=rand(-60,-20);}
 R.parts.push(p);
}
function hearts(x,y,n){for(var i=0;i<n;i++)part(x+rand(-30,30),y+rand(-20,20),"heart");}
function confetti(){for(var i=0;i<38;i++)part(rand(0,CW),rand(CH*0.1,CH*0.4),"conf");}
function floatTxt(t,x,y,col){R.floats.push({t:t,x:x,y:y,col:col||"#ffd166",life:1});}
function updParts(dt){
 for(var i=R.parts.length-1;i>=0;i--){
  var p=R.parts[i];
  p.life-=dt*(p.t==="zzz"?0.5:0.9);
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=dt*3;
  if(p.t==="conf")p.vy+=210*dt;
  if(p.t==="drop")p.vy+=300*dt;
  if(p.life<=0)R.parts.splice(i,1);
 }
 for(var j=R.floats.length-1;j>=0;j--){
  var f=R.floats[j];f.life-=dt*0.7;f.y-=42*dt;
  if(f.life<=0)R.floats.splice(j,1);
 }
}
function drawParts(){
 for(var i=0;i<R.parts.length;i++){
  var p=R.parts[i];
  CX.save();CX.globalAlpha=clamp(p.life,0,1);CX.translate(p.x,p.y);
  if(p.t==="conf")CX.rotate(p.rot);
  if(p.ch){CX.font=(p.t==="zzz"?18:15)+"px serif";CX.textAlign="center";CX.fillText(p.ch,0,0);}
  else if(p.t==="foam"){CX.fillStyle="rgba(232,247,255,.92)";CX.beginPath();CX.arc(0,0,p.r,0,7);CX.fill();CX.fillStyle="rgba(255,255,255,.85)";CX.beginPath();CX.arc(-p.r*0.3,-p.r*0.3,p.r*0.35,0,7);CX.fill();}
  else if(p.t==="drop"){CX.fillStyle="#7fd8ff";CX.beginPath();CX.ellipse(0,0,p.r*0.6,p.r,0,0,7);CX.fill();}
  else if(p.t==="crumb"){CX.fillStyle=p.col;CX.beginPath();CX.arc(0,0,p.r,0,7);CX.fill();}
  else if(p.t==="conf"){CX.fillStyle=p.col;CX.fillRect(-p.r/2,-p.r/2,p.r,p.r*0.6);}
  CX.restore();
 }
 CX.textAlign="left";CX.globalAlpha=1;
 for(var j=0;j<R.floats.length;j++){
  var f=R.floats[j];
  CX.save();CX.globalAlpha=clamp(f.life,0,1);CX.font="bold 15px system-ui";CX.textAlign="center";
  CX.lineWidth=3;CX.strokeStyle="rgba(0,0,0,.55)";CX.strokeText(f.t,f.x,f.y);
  CX.fillStyle=f.col;CX.fillText(f.t,f.x,f.y);CX.restore();
 }
 CX.textAlign="left";CX.globalAlpha=1;
}

var ANCH=[{x:-22,y:-98,r:9},{x:20,y:-82,r:8},{x:-8,y:-62,r:9},{x:26,y:-112,r:7},{x:0,y:-150,r:7,mz:1},{x:-16,y:-8,r:8,paw:1},{x:16,y:-8,r:8,paw:1}];
function addDirt(kind){
 if(S.dirt.length>=7)return;
 var free=ANCH.filter(function(a){
  if(kind==="muzzle"&&!a.mz)return false;
  if(kind==="paw"&&!a.paw)return false;
  if(kind==="body"&&(a.mz||a.paw))return false;
  for(var i=0;i<S.dirt.length;i++){if(S.dirt[i].ax===a.x&&S.dirt[i].ay===a.y)return false;}
  return true;
 });
 if(!free.length)return;
 var a=pick(free);
 S.dirt.push({ax:a.x,ay:a.y,r:a.r,foam:0,loose:false,seed:Math.random()});
 S.washBonus=true;save();
}

  S.health=clamp(S.health-4,0,100);S.mood=clamp(S.mood-6,0,100);

 }else target=(R.x<CW/2)?CW*0.85:CW*0.15;

}
function scoopAt(x,y){
 for(var i=S.piles.length-1;i>=0;i--){
  var p=S.piles[i];
  if(Math.hypot(x-p.x,y-p.y)<30*SC+12){
   S.piles.splice(i,1);
   for(var f=R.flies.length-1;f>=0;f--){if(R.flies[f].pid===p.id){part(R.flies[f].x,R.flies[f].y,"fly");R.flies.splice(f,1);}}
   SFX.scoop();
   for(var s=0;s<5;s++)part(p.x,p.y-8,"spark");
   S.mood=clamp(S.mood+2,0,100);S.cleans++;addXP(4);wishHook("clean",1);
   floatTxt("Чисто! ✨",p.x,p.y-26,"#5fe3b3");save();
   return true;
  }
 }
 return false;
}
function updFlies(dt){
 for(var k=0;k<S.piles.length;k++){
  var p=S.piles[k],age=(now()-p.born)/1000;
  var want=age>45?clamp(1+Math.floor((age-45)/25),1,4):0;
  var have=0;
  for(var i=0;i<R.flies.length;i++){if(R.flies[i].pid===p.id)have++;}
  for(var j=have;j<want;j++){R.flies.push({pid:p.id,x:p.x,y:p.y-14,a:rand(0,6),sp:rand(2,4),rr:rand(10,22),hx:p.x,hy:p.y-14});}
 }
 for(var f=R.flies.length-1;f>=0;f--){
  var fl=R.flies[f],alive=false;
  for(var m=0;m<S.piles.length;m++){if(S.piles[m].id===fl.pid){alive=true;fl.hx=S.piles[m].x;fl.hy=S.piles[m].y-14;break;}}
  if(!alive){R.flies.splice(f,1);continue;}
  fl.a+=dt*fl.sp;
  fl.x=fl.hx+Math.cos(fl.a)*fl.rr+Math.sin(fl.a*2.7)*4;
  fl.y=fl.hy+Math.sin(fl.a*1.3)*fl.rr*0.5;
 }
}

  CX.beginPath();CX.ellipse(0,-13*s,6*s,4.5*s,0,0,7);CX.fill();
  CX.fillStyle="#8a6238";CX.beginPath();CX.ellipse(-2*s,-14*s,2.5*s,1.5*s,-0.4,0,7);CX.fill();

  }

 }
 CX.font="11px serif";
