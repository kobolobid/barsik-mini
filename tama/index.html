function updateParticles(dt){for(var i=R.particles.length-1;i>=0;i--){var p=R.particles[i];p.life-=dt*(p.t==='zzz'?0.5:0.9);p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t==='confetti')p.vy+=200*dt;if(p.t==='drop')p.vy+=300*dt;p.rot+=dt*3;if(p.life<=0)R.particles.splice(i,1);}for(var j=R.floats.length-1;j>=0;j--){var f=R.floats[j];f.life-=dt*0.7;f.y-=40*dt;if(f.life<=0)R.floats.splice(j,1);}}

function updateGame(dt){var g=R.mg;if(!g||g.done)return;if(g.id==='mice'||g.id==='bubbles')g.t-=dt;if(g.id==='mice'){var d=g.data;d.spawn-=dt;if(d.spawn<=0&&d.mice.length<3+Math.min(2,S.level/4)){d.spawn=rand(0.5,1.1);var edge=randi(0,1);d.mice.push({x:edge?rand(30,CW-30):(Math.random()<0.5?-20:CW+20),y:edge?(Math.random()<0.5?CH*0.2:CH*0.85):rand(CH*0.25,CH*0.8),vx:rand(-60,60),vy:rand(-60,60),ph:rand(0,6)});}d.mice.forEach(function(m){m.ph+=dt*10;m.vx+=rand(-1,1)*140*dt*d.speed;m.vy+=rand(-1,1)*140*dt*d.speed;var sp=Math.hypot(m.vx,m.vy),max=150*d.speed;if(sp>max){m.vx*=max/sp;m.vy*=max/sp;}m.x+=m.vx*dt;m.y+=m.vy*dt;if(m.x<16){m.x=16;m.vx=Math.abs(m.vx);}if(m.x>CW-16){m.x=CW-16;m.vx=-Math.abs(m.vx);}if(m.y<CH*0.16){m.y=CH*0.16;m.vy=Math.abs(m.vy);}if(m.y>CH-16){m.y=CH-16;m.vy=-Math.abs(m.vy);}});if(g.t<=0)g.done=true;}else if(g.id==='fish'){var d2=g.data;d2.pos+=d2.dir*d2.speed*dt*0.55;if(d2.pos>1){d2.pos=1;d2.dir=-1;}if(d2.pos<0){d2.pos=0;d2.dir=1;}d2.flash=Math.max(0,d2.flash-dt);}else if(g.id==='memory'){g.data.cards.forEach(function(cd){cd.flip=lerp(cd.flip,(cd.open||cd.done)?1:0,clamp(dt*10,0,1));});}else if(g.id==='bubbles'){var d3=g.data;d3.spawn-=dt;if(d3.spawn<=0){d3.spawn=rand(0.25,0.5)/d3.speed;var kind=Math.random()<0.08?'gold':(Math.random()<0.16?'dark':'norm');d3.b.push({x:rand(24,CW-24),y:CH+20,r:kind==='gold'?rand(14,20):rand(16,30),vy:rand(60,110)*d3.speed,ph:rand(0,6),kind:kind});}for(var i=d3.b.length-1;i>=0;i--){var b=d3.b[i];b.ph+=dt*3;b.y-=b.vy*dt;b.x+=Math.sin(b.ph)*24*dt;if(b.y<-30)d3.b.splice(i,1);}if(g.t<=0)g.done=true;}}

/* ============ ИСПРАВЛЕННЫЙ КУРСОР (с учётом scroll и touch) ============ */
function ptr(e){
  var stage = $('stage');
  var rect = stage.getBoundingClientRect();
  var cx, cy;
  if(e.touches && e.touches.length > 0){ cx = e.touches[0].clientX; cy = e.touches[0].clientY; }
  else if(e.changedTouches && e.changedTouches.length > 0){ cx = e.changedTouches[0].clientX; cy = e.changedTouches[0].clientY; }
  else { cx = e.clientX; cy = e.clientY; }
  // Вычитаем scroll всех родителей (для Telegram WebApp где есть прокрутка)
  var scrollX = 0, scrollY = 0;
  var p = stage;
  while(p){
    scrollX += p.scrollLeft || 0;
    scrollY += p.scrollTop || 0;
    p = p.parentElement;
  }
  return { x: cx - rect.left + scrollX, y: cy - rect.top + scrollY };
}
