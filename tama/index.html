<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Домик Барсика Pro</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #111420;
    --panel: #1b2030;
    --line: #2a3145;
    --text: #e9edf5;
    --muted: #9aa3b2;
    --accent: #5ac8fa;
    --danger: #ff5a5a;
    --warn: #ffdc50;
    --good: #64e678;
    --belly-color: #f6a623;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,sans-serif; overflow:hidden; touch-action:none; user-select:none; height:100vh; display:flex; flex-direction:column; }
  
  /* Header & Stats */
  .header { padding:10px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; z-index:10; }
  .title { font-size:16px; font-weight:bold; color:var(--accent); }
  .stats-row { display:flex; gap:10px; font-size:12px; color:var(--muted); }
  .stat-item b { color:var(--text); }

  /* Rooms Navigation */
  .rooms-nav { display:flex; overflow-x:auto; padding:5px 10px; gap:5px; background:#0d1018; scrollbar-width:none; }
  .rooms-nav::-webkit-scrollbar { display:none; }
  .room-btn { min-width:80px; text-align:center; padding:8px; border-radius:8px; background:var(--panel); border:1px solid var(--line); font-size:12px; cursor:pointer; transition:all .2s; }
  .room-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  /* Main Stage (The Cat) */
  .stage-container { flex:1; position:relative; display:flex; justify-content:center; align-items:center; background:radial-gradient(circle at center, #1e2436, #111420); overflow:hidden; }
  
  /* Furniture Layers */
  .furniture-layer { position:absolute; inset:0; pointer-events:none; opacity:.6; transition:opacity .3s; }
  .furniture-item { position:absolute; font-size:40px; filter:drop-shadow(0 4px 6px rgba(0,0,0,.3)); }
  
  /* The Snow Leopard Sprite Container */
  #cat-wrapper { 
    position:relative; 
    width:200px; 
    height:200px; 
    display:flex; 
    justify-content:center; 
    align-items:flex-end; /* Align feet to bottom */
    z-index:5;
    transition:transform .3s cubic-bezier(.17,.67,.83,.67);
  }
  
  /* Physics Animation Classes */
  .idle { animation:bob 3s infinite ease-in-out; }
  .eating { animation:eat 0.5s ease; }
  .happy { animation:jump 0.6s ease; }
  .sick { animation:wobble 1.5s infinite ease-in-out; filter:grayscale(.3) brightness(.9); }
  .heavy-belly { transform:scaleY(1.15) scaleX(1.05); transform-origin:bottom center; }
  
  @keyframes bob { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  @keyframes eat { 0%{transform:scale(1)} 50%{transform:scale(1.1) rotate(-5deg)} 100%{transform:scale(1)} }
  @keyframes jump { 0%{transform:translateY(0)} 30%{transform:translateY(-30px) scale(1.1)} 100%{transform:translateY(0)} }
  @keyframes wobble { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-3deg)} 75%{transform:rotate(3deg)} }

  /* Bars UI */
  .bars-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:8px; padding:10px; background:var(--panel); border-top:1px solid var(--line); }
  .bar-box { background:#0d1018; padding:8px; border-radius:8px; border:1px solid var(--line); }
  .bar-label { font-size:10px; color:var(--muted); display:flex; justify-content:space-between; margin-bottom:4px; }
  .bar-track { height:6px; background:#333; border-radius:3px; overflow:hidden; }
  .bar-fill { height:100%; width:0%; transition:width .3s ease; border-radius:3px; }
  
  /* Actions Footer */
  .actions-footer { display:grid; grid-template-columns:repeat(4, 1fr); gap:5px; padding:10px; background:var(--bg); border-top:1px solid var(--line); }
  .action-btn { background:var(--panel); border:1px solid var(--line); color:var(--text); padding:10px; border-radius:8px; font-size:12px; font-weight:bold; cursor:pointer; text-align:center; }
  .action-btn:active { background:var(--line); }
  .action-btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .action-btn.danger { background:var(--danger); color:#fff; border-color:var(--danger); }

  /* Modal for Wardrobe/Game */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:100; display:none; align-items:center; justify-content:center; }
  .modal-content { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; max-width:90%; width:300px; max-height:80vh; overflow-y:auto; }
  .modal-title { font-size:18px; font-weight:bold; margin-bottom:15px; color:var(--accent); text-align:center; }
  .close-modal { float:right; cursor:pointer; color:var(--muted); font-size:20px; }
  
  /* Wardrobe Items Grid */
  .wardrobe-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .w-item { background:#0d1018; border:1px solid var(--line); border-radius:8px; padding:10px; text-align:center; cursor:pointer; position:relative; }
  .w-item.equipped { border-color:var(--good); background:#1a2e22; }
  .w-icon { font-size:24px; margin-bottom:5px; }
  .w-name { font-size:10px; color:var(--muted); }
  .w-cost { font-size:10px; color:var(--warn); font-weight:bold; }

  /* Speech Bubble */
  #speech-bubble { 
    position:absolute; top:20px; left:50%; transform:translateX(-50%); 
    background:#fff; color:#000; padding:8px 12px; border-radius:12px; 
    font-size:12px; font-weight:bold; opacity:0; transition:opacity .3s; z-index:20;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
  }
  #speech-bubble.show { opacity:1; }
  #speech-bubble::after { content:''; position:absolute; bottom:-5px; left:50%; transform:translateX(-50%); border-left:5px solid transparent; border-right:5px solid transparent; border-top:5px solid #fff; }

</style>
</head>
<body>

<div class="header">
  <div class="title">🐾 Домик Барсика</div>
  <div class="stats-row">
    <div class="stat-item">⭐ <b id="ui-level">1</b></div>
    <div class="stat-item">🪙 <b id="ui-coins">0</b></div>
  </div>
</div>

<nav class="rooms-nav" id="rooms-nav">
  <!-- Generated by JS -->
</nav>

<div class="stage-container">
  <div id="furniture-layer" class="furniture-layer"></div>
  
  <div id="cat-wrapper" class="idle">
    <!-- SVG Snow Leopard will be injected here -->
    <svg id="leopard-svg" viewBox="0 0 100 100" width="150" height="150">
      <!-- Body Base -->
      <ellipse cx="50" cy="60" rx="35" ry="30" fill="#eef3ff" stroke="#cbd5e1" stroke-width="2"/>
      
      <!-- Belly Spot (Dynamic Size) -->
      <ellipse id="belly-spot" cx="50" cy="65" rx="20" ry="15" fill="#dbeafe" opacity="0.5"/>
      
      <!-- Head -->
      <circle cx="50" cy="35" r="22" fill="#eef3ff" stroke="#cbd5e1" stroke-width="2"/>
      
      <!-- Ears -->
      <path d="M35 20 Q30 10 40 15 Z" fill="#eef3ff" stroke="#cbd5e1"/>
      <path d="M65 20 Q70 10 60 15 Z" fill="#eef3ff" stroke="#cbd5e1"/>
      
      <!-- Eyes -->
      <circle id="eye-l" cx="42" cy="32" r="3" fill="#1e293b"/>
      <circle id="eye-r" cx="58" cy="32" r="3" fill="#1e293b"/>
      
      <!-- Nose/Mouth -->
      <path d="M50 40 L48 43 L52 43 Z" fill="#f472b6"/>
      <path d="M50 43 Q45 48 40 45 M50 43 Q55 48 60 45" stroke="#1e293b" stroke-width="1" fill="none"/>
      
      <!-- Whiskers -->
      <line x1="30" y1="40" x2="20" y2="38" stroke="#94a3b8" stroke-width="1"/>
      <line x1="30" y1="43" x2="20" y2="45" stroke="#94a3b8" stroke-width="1"/>
      <line x1="70" y1="40" x2="80" y2="38" stroke="#94a3b8" stroke-width="1"/>
      <line x1="70" y1="43" x2="80" y2="45" stroke="#94a3b8" stroke-width="1"/>
      
      <!-- Tail -->
      <path id="tail-path" d="M85 60 Q95 50 90 40" stroke="#eef3ff" stroke-width="8" fill="none" stroke-linecap="round"/>
      
      <!-- Accessories Group (Hidden initially) -->
      <g id="accessories-group"></g>
    </svg>
  </div>
  
  <div id="speech-bubble">Мяу!</div>
</div>

<div class="bars-grid">
  <div class="bar-box">
    <div class="bar-label"><span>🍖 Сытость</span><span id="val-hunger">0%</span></div>
    <div class="bar-track"><div class="bar-fill" id="fill-hunger" style="background:#f65e3b;"></div></div>
  </div>
  <div class="bar-box">
    <div class="bar-label"><span>😊 Счастье</span><span id="val-happy">0%</span></div>
    <div class="bar-track"><div class="bar-fill" id="fill-happy" style="background:#edc22e;"></div></div>
  </div>
  <div class="bar-box">
    <div class="bar-label"><span>⚡ Энергия</span><span id="val-energy">0%</span></div>
    <div class="bar-track"><div class="bar-fill" id="fill-energy" style="background:#5ac8fa;"></div></div>
  </div>
  <div class="bar-box">
    <div class="bar-label"><span>🧼 Чистота</span><span id="val-clean">0%</span></div>
    <div class="bar-track"><div class="bar-fill" id="fill-clean" style="background:#64e678;"></div></div>
  </div>
  <div class="bar-box">
    <div class="bar-label"><span>❤️ Здоровье</span><span id="val-health">0%</span></div>
    <div class="bar-track"><div class="bar-fill" id="fill-health" style="background:#ff5a5a;"></div></div>
  </div>
  <div class="bar-box">
    <div class="bar-label"><span>🫃 Живот</span><span id="val-belly">0%</span></div>
    <div class="bar-track"><div class="bar-fill" id="fill-belly" style="background:var(--belly-color);"></div></div>
  </div>
</div>

<footer class="actions-footer">
  <button class="action-btn primary" onclick="openWardrobe()">👗 Гардероб</button>
  <button class="action-btn" onclick="feedAction()">🍖 Кормить</button>
  <button class="action-btn" onclick="playAction()">🎮 Играть</button>
  <button class="action-btn danger" onclick="cleanAction()">🧹 Убрать</button>
</footer>

<!-- Wardrobe Modal -->
<div class="modal-overlay" id="wardrobe-modal">
  <div class="modal-content">
    <span class="close-modal" onclick="closeModal('wardrobe-modal')">×</span>
    <div class="modal-title">Гардероб Барсика</div>
    <div class="wardrobe-grid" id="wardrobe-list">
      <!-- Items generated by JS -->
    </div>
  </div>
</div>

<script>
// --- TELEGRAM INIT ---
var tg = window.Telegram && window.Telegram.WebApp ? Telegram.WebApp : null;
if(tg){ try{ tg.ready(); tg.expand(); }catch(e){} }

// --- STATE MANAGEMENT ---
const KEY = 'barsik_tama_pro_v1';
let state = {
  level: 1, xp: 0, coins: 50,
  hunger: 80, happiness: 70, energy: 90, cleanliness: 85, health: 100, belly: 0,
  room: 'living', // kitchen, living, bedroom, bathroom, wardrobe, play, yard
  equipped: { hat:null, scarf:null, glasses:null },
  inventory: [],
  lastTick: Date.now()
};

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if(raw) {
      const parsed = JSON.parse(raw);
      // Merge defaults
      for(let k in state) if(parsed[k] !== undefined) state[k] = parsed[k];
    }
  } catch(e) {}
}

function saveState() {
  state.lastTick = Date.now();
  localStorage.setItem(KEY, JSON.stringify(state));
  updateUI();
}

loadState();

// --- ROOMS DATA ---
const ROOMS = [
  { id:'kitchen', name:'Кухня', icon:'🍽', furniture:['🥣','🍞','🧊'] },
  { id:'living', name:'Гостиная', icon:'🛋', furniture:['📺','🪴','🕰'] },
  { id:'bedroom', name:'Спальня', icon:'🛏', furniture:['🛌','💤','🌙'] },
  { id:'bathroom', name:'Ванная', icon:'🚿', furniture:['🛁','🧴','🪥'] },
  { id:'wardrobe', name:'Гардероб', icon:'👗', furniture:['👔','👠','🎩'] },
  { id:'play', name:'Игровая', icon:'🎮', furniture:['🧸','🎲','🏀'] },
  { id:'yard', name:'Двор', icon:'🌳', furniture:['🌻','🦋','☀️'] }
];

// --- WARDROBE ITEMS ---
const CLOTHES = [
  { id:'hat_cap', slot:'hat', name:'Кепка', cost:20, svg:'<rect x="35" y="15" width="30" height="10" fill="#333"/><path d="M35 25 Q50 35 65 25" fill="#333"/>' },
  { id:'hat_crown', slot:'hat', name:'Корона', cost:100, svg:'<polygon points="40,20 45,10 50,20 55,10 60,20" fill="gold"/>' },
  { id:'scarf_red', slot:'scarf', name:'Шарф', cost:30, svg:'<path d="M40 50 Q50 60 60 50" stroke="red" stroke-width="4" fill="none"/>' },
  { id:'glass_sun', slot:'glasses', name:'Очки', cost:40, svg:'<circle cx="42" cy="32" r="4" fill="#333"/><circle cx="58" cy="32" r="4" fill="#333"/><line x1="46" y1="32" x2="54" y2="32" stroke="#333"/>' },
  { id:'bowtie', slot:'scarf', name:'Бабочка', cost:50, svg:'<path d="M50 55 L45 50 L45 60 Z M50 55 L55 50 L55 60 Z" fill="purple"/>' }
];

// --- CORE FUNCTIONS ---

function initRoomsNav() {
  const nav = document.getElementById('rooms-nav');
  nav.innerHTML = '';
  ROOMS.forEach(r => {
    const btn = document.createElement('div');
    btn.className = 'room-btn' + (state.room === r.id ? ' active' : '');
    btn.textContent = r.icon + ' ' + r.name;
    btn.onclick = () => switchRoom(r.id);
    nav.appendChild(btn);
  });
}

function switchRoom(roomId) {
  state.room = roomId;
  saveState();
  initRoomsNav();
  renderFurniture();
  say(getRoomComment(roomId));
}

function renderFurniture() {
  const layer = document.getElementById('furniture-layer');
  layer.innerHTML = '';
  const roomData = ROOMS.find(r => r.id === state.room);
  if(!roomData) return;

  roomData.furniture.forEach((icon, i) => {
    const el = document.createElement('div');
    el.className = 'furniture-item';
    el.textContent = icon;
    // Random positioning within bounds
    el.style.left = (10 + Math.random()*80) + '%';
    el.style.top = (10 + Math.random()*80) + '%';
    el.style.transform = `scale(${0.8 + Math.random()*0.4})`;
    layer.appendChild(el);
  });
}

function getRoomComment(id) {
  const comments = {
    kitchen: "Хочу кушать! 🍖",
    living: "Здесь уютно. 🛋",
    bedroom: "Спать хочу... 💤",
    bathroom: "Чисто и свежо! 🚿",
    wardrobe: "Выберу что-нибудь модное! 👗",
    play: "Давай играть! 🎮",
    yard: "Свежий воздух! 🌳"
  };
  return comments[id] || "Мяу!";
}

// --- PHYSICS & ANIMATION LOGIC ---

function updateCatPhysics() {
  const wrapper = document.getElementById('cat-wrapper');
  const bellySpot = document.getElementById('belly-spot');
  const tail = document.getElementById('tail-path');
  
  // Reset classes
  wrapper.classList.remove('sick', 'heavy-belly', 'eating', 'happy');
  
  // Apply State-based Animations
  if(state.health < 30 || state.belly > 80) {
    wrapper.classList.add('sick');
    say("Мне плохо... 🤢");
  } else if(state.belly > 50) {
    wrapper.classList.add('heavy-belly');
    // Expand belly ellipse visually
    const expansion = 1 + (state.belly / 100);
    bellySpot.setAttribute('rx', 20 * expansion);
    bellySpot.setAttribute('ry', 15 * expansion);
    bellySpot.style.fill = "#f6a623"; // Orange tint for full belly
    bellySpot.style.opacity = "0.8";
  } else {
    // Normal belly
    bellySpot.setAttribute('rx', 20);
    bellySpot.setAttribute('ry', 15);
    bellySpot.style.fill = "#dbeafe";
    bellySpot.style.opacity = "0.5";
  }

  // Tail wag based on happiness
  if(state.happiness > 70) {
    tail.setAttribute('stroke', '#eef3ff');
    tail.setAttribute('d', 'M85 60 Q95 50 90 40'); // Happy curve
  } else {
    tail.setAttribute('stroke', '#cbd5e1');
    tail.setAttribute('d', 'M85 60 Q90 70 85 80'); // Sad droop
  }
}

function renderAccessories() {
  const group = document.getElementById('accessories-group');
  group.innerHTML = '';
  
  ['hat', 'scarf', 'glasses'].forEach(slot => {
    const itemId = state.equipped[slot];
    if(itemId) {
      const item = CLOTHES.find(c => c.id === itemId);
      if(item) {
        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.innerHTML = item.svg;
        group.appendChild(g);
      }
    }
  });
}

// --- ACTIONS ---

function feedAction() {
  if(state.hunger >= 95) {
    say("Я сыт! Не перекорми меня!");
    state.belly += 10; // Penalty for overfeeding attempt
    triggerAnim('sick');
    return;
  }
  
  state.hunger = Math.min(100, state.hunger + 15);
  state.belly += 5; // Eating increases belly slightly
  state.xp += 2;
  checkLevelUp();
  triggerAnim('eating');
  say("Ням-ням! 🍖");
  saveState();
  updateCatPhysics();
}

function playAction() {
  if(state.energy < 20) {
    say("Слишком устал... 😴");
    return;
  }
  if(state.belly > 60) {
    say("Тяжело прыгать с таким животом! 🫃");
    return;
  }

  state.happiness = Math.min(100, state.happiness + 10);
  state.energy -= 10;
  state.hunger -= 5;
  state.xp += 5;
  checkLevelUp();
  triggerAnim('happy');
  say("Весело! 🎉");
  saveState();
  updateCatPhysics();
}

function cleanAction() {
  state.cleanliness = 100;
  state.happiness += 5;
  say("Чисто! ✨");
  saveState();
  updateCatPhysics();
}

function openWardrobe() {
  const modal = document.getElementById('wardrobe-modal');
  const list = document.getElementById('wardrobe-list');
  list.innerHTML = '';
  
  CLOTHES.forEach(item => {
    const isOwned = state.inventory.includes(item.id);
    const isEquipped = Object.values(state.equipped).includes(item.id);
    
    const div = document.createElement('div');
    div.className = 'w-item' + (isEquipped ? ' equipped' : '');
    div.innerHTML = `
      <div class="w-icon">${item.slot === 'hat' ? '🧢' : item.slot === 'scarf' ? '🧣' : '🕶'}</div>
      <div class="w-name">${item.name}</div>
      <div class="w-cost">${isOwned ? (isEquipped ? 'Надето' : 'Надеть') : item.cost + ' 🪙'}</div>
    `;
    
    div.onclick = () => handleClothClick(item);
    list.appendChild(div);
  });
  
  modal.style.display = 'flex';
}

function handleClothClick(item) {
  if(state.inventory.includes(item.id)) {
    // Toggle equip
    if(state.equipped[item.slot] === item.id) {
      state.equipped[item.slot] = null; // Unequip
      say("Снял: " + item.name);
    } else {
      state.equipped[item.slot] = item.id; // Equip
      say("Надел: " + item.name);
    }
  } else {
    // Buy
    if(state.coins >= item.cost) {
      state.coins -= item.cost;
      state.inventory.push(item.id);
      state.equipped[item.slot] = item.id;
      say("Купил и надел: " + item.name);
    } else {
      say("Не хватает монет! 🪙");
    }
  }
  saveState();
  renderAccessories();
  openWardrobe(); // Refresh list
  closeModal('wardrobe-modal');
}

function closeModal(id) {
  document.getElementById(id).style.display = 'none';
}

function triggerAnim(cls) {
  const w = document.getElementById('cat-wrapper');
  w.classList.add(cls);
  setTimeout(() => w.classList.remove(cls), 600);
}

function say(text) {
  const bubble = document.getElementById('speech-bubble');
  bubble.textContent = text;
  bubble.classList.add('show');
  setTimeout(() => bubble.classList.remove('show'), 2000);
}

function checkLevelUp() {
  const needed = state.level * 100;
  if(state.xp >= needed) {
    state.level++;
    state.xp -= needed;
    state.coins += 20;
    say("Новый уровень! ⭐+" + state.level);
  }
}

// --- TICKER (Passive Decay) ---
setInterval(() => {
  // Every minute decay stats slightly
  if(state.hunger > 0) state.hunger--;
  if(state.happiness > 0) state.happiness--;
  if(state.energy < 100) state.energy++; // Recover slowly
  if(state.cleanliness > 0) state.cleanliness--;
  
  // Digestion
  if(state.belly > 0) state.belly--;
  
  // Health penalty if very hungry or dirty
  if(state.hunger < 10 || state.cleanliness < 10) {
    if(state.health > 0) state.health--;
  } else if(state.health < 100 && state.hunger > 50) {
    state.health++; // Heal if fed and clean
  }
  
  saveState();
  updateCatPhysics();
}, 60000); // Once a minute

// --- UI UPDATE ---
function updateUI() {
  document.getElementById('ui-level').textContent = state.level;
  document.getElementById('ui-coins').textContent = state.coins;
  
  setBar('hunger', state.hunger);
  setBar('happy', state.happiness);
  setBar('energy', state.energy);
  setBar('clean', state.cleanliness);
  setBar('health', state.health);
  setBar('bellies', state.belly); // Note: ID mismatch fix below
  
  // Fix ID for belly bar specifically
  const bFill = document.getElementById('fill-belly');
  const bVal = document.getElementById('val-belly');
  if(bFill) bFill.style.width = state.belly + '%';
  if(bVal) bVal.textContent = state.belly + '%';
}

function setBar(key, val) {
  const fill = document.getElementById('fill-' + key);
  const label = document.getElementById('val-' + key);
  if(fill) fill.style.width = val + '%';
  if(label) label.textContent = val + '%';
}

// --- INIT ---
initRoomsNav();
renderFurniture();
updateCatPhysics();
renderAccessories();
updateUI();
say("Привет! Я Барсик. 🐾");

// Save to Bot Button Logic (Optional integration point)
