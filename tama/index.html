<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Barsik Pet Universe Pro</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --accent: #38bdf8;
    --gold: #fbbf24;
    --danger: #ef4444;
    --success: #22c55e;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; touch-action: none; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:'Segoe UI', sans-serif; overflow:hidden; height:100vh; display:flex; flex-direction:column; }

  /* Header */
  .header { padding:8px 15px; background:rgba(30,41,59,.95); backdrop-filter:blur(10px); border-bottom:1px solid rgba(255,255,255,.1); display:flex; justify-content:space-between; align-items:center; z-index:10; }
  .logo { font-weight:900; font-size:16px; color:var(--accent); }
  .stats { display:flex; gap:10px; font-size:12px; font-weight:bold; }
  .stat-item { display:flex; align-items:center; gap:4px; }

  /* Main Stage (Canvas) */
  #stage-container { flex:1; position:relative; background:#000; overflow:hidden; cursor:crosshair; }
  canvas#game-canvas { width:100%; height:100%; display:block; image-rendering:pixelated; }
  
  /* Tool Selection Bar (Floating) */
  .tools-bar {
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    display:flex; gap:8px; background:rgba(15,23,42,.9); padding:8px; border-radius:20px;
    border:1px solid var(--line); z-index:20; transition:opacity .3s;
  }
  .tool-btn {
    width:50px; height:50px; border-radius:12px; background:var(--panel); border:2px solid transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:20px; cursor:pointer; transition:.2s;
  }
  .tool-btn.active { border-color:var(--accent); background:#0c4a6e; box-shadow:0 0 10px rgba(56,189,248,.3); }
  .tool-label { font-size:9px; color:var(--muted); margin-top:2px; }

  /* Bottom Stats Panel */
  .bottom-panel { background:var(--panel); padding:10px; border-top:1px solid rgba(255,255,255,.1); }
  .bars-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-bottom:8px; }
  .bar-box { background:rgba(0,0,0,.2); padding:4px; border-radius:6px; }
  .bar-label { font-size:9px; color:var(--muted); display:flex; justify-content:space-between; margin-bottom:2px; }
  .bar-track { height:4px; background:#334155; border-radius:2px; overflow:hidden; }
  .bar-fill { height:100%; width:0%; transition:width .3s ease; }

  /* Actions Row */
  .actions-row { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
  .act-btn { 
    background:var(--bg); border:1px solid rgba(255,255,255,.1); 
    color:var(--text); padding:8px; border-radius:8px; 
    font-size:11px; font-weight:bold; cursor:pointer; text-align:center;
  }
  .act-btn:active { transform:scale(.95); background:var(--accent); color:#fff; }
  .act-btn.shop { border-color:var(--gold); color:var(--gold); }

  /* Modals */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.9); z-index:100; display:none; align-items:center; justify-content:center; }
  .modal.open { display:flex; }
  .modal-content { background:var(--panel); width:90%; max-width:350px; max-height:80vh; border-radius:16px; padding:15px; overflow-y:auto; border:1px solid rgba(255,255,255,.1); }
  .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-weight:bold; }
  .close-btn { background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; }
  
  /* Shop Grid */
  .shop-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
  .shop-item { background:rgba(0,0,0,.3); padding:10px; border-radius:10px; text-align:center; border:1px solid transparent; }
  .shop-item.selected { border-color:var(--accent); background:#0c4a6e; }
  .item-icon { font-size:24px; }
  .item-name { font-size:11px; margin:5px 0; }
  .item-price { font-size:10px; color:var(--gold); }
  .buy-btn { width:100%; padding:5px; border:none; border-radius:5px; background:var(--accent); color:#fff; font-size:10px; cursor:pointer; margin-top:5px; }
  .buy-btn:disabled { background:#475569; }

  /* Toast Notification */
  #toast {
    position:absolute; top:60px; left:50%; transform:translateX(-50%);
    background:rgba(0,0,0,.8); color:#fff; padding:8px 16px; border-radius:20px;
    font-size:12px; opacity:0; transition:opacity .3s; z-index:50; pointer-events:none;
  }
  #toast.show { opacity:1; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">🐾 BARSIK PU PRO</div>
  <div class="stats">
    <div class="stat-item"><span style="color:var(--gold)">🪙</span> <span id="ui-coins">0</span></div>
    <div class="stat-item">⭐ Lv.<span id="ui-level">1</span></div>
  </div>
</div>

<div id="stage-container">
  <canvas id="game-canvas"></canvas>
  
  <!-- Floating Tools -->
  <div class="tools-bar" id="tools-bar">
    <div class="tool-btn active" data-tool="hand" title="Рука/Интерактив">✋<span class="tool-label">Рука</span></div>
    <div class="tool-btn" data-tool="food" title="Еда">🍖<span class="tool-label">Еда</span></div>
    <div class="tool-btn" data-tool="water" title="Вода">💧<span class="tool-label">Вода</span></div>
    <div class="tool-btn" data-tool="soap" title="Шампунь">🧼<span class="tool-label">Мыло</span></div>
    <div class="tool-btn" data-tool="scrub" title="Мочалка">🧽<span class="tool-label">Тереть</span></div>
    <div class="tool-btn" data-tool="shovel" title="Совок">🥄<span class="tool-label">Совок</span></div>
    <div class="tool-btn" data-tool="toy" title="Игрушка">🎾<span class="tool-label">Игрушка</span></div>
  </div>

  <div id="toast">Сообщение</div>
</div>

<div class="bottom-panel">
  <div class="bars-grid">
    <div class="bar-box">
      <div class="bar-label"><span>🍖 Сытость</span><span id="val-hunger">0%</span></div>
      <div class="bar-track"><div class="bar-fill" id="fill-hunger" style="background:#f97316;"></div></div>
    </div>
    <div class="bar-box">
      <div class="bar-label"><span>😊 Настроение</span><span id="val-mood">0%</span></div>
      <div class="bar-track"><div class="bar-fill" id="fill-mood" style="background:#fbbf24;"></div></div>
    </div>
    <div class="bar-box">
      <div class="bar-label"><span>⚡ Энергия</span><span id="val-energy">0%</span></div>
      <div class="bar-track"><div class="bar-fill" id="fill-energy" style="background:#38bdf8;"></div></div>
    </div>
    <div class="bar-box">
      <div class="bar-label"><span>🧼 Чистота</span><span id="val-clean">0%</span></div>
      <div class="bar-track"><div class="bar-fill" id="fill-clean" style="background:#22c55e;"></div></div>
    </div>
    <div class="bar-box">
      <div class="bar-label"><span>❤️ Здоровье</span><span id="val-health">0%</span></div>
      <div class="bar-track"><div class="bar-fill" id="fill-health" style="background:#ef4444;"></div></div>
    </div>
    <div class="bar-box">
      <div class="bar-label"><span>🫃 Живот</span><span id="val-belly">0%</span></div>
      <div class="bar-track"><div class="bar-fill" id="fill-belly" style="background:#a855f7;"></div></div>
    </div>
  </div>

  <div class="actions-row">
    <button class="act-btn shop" onclick="openShop()">🛒 Магазин</button>
    <button class="act-btn" onclick="toggleWardrobe()">👗 Шкаф</button>
    <button class="act-btn" onclick="resetGame()">🔄 Сброс</button>
    <button class="act-btn" onclick="sendToBot()">📤 Бот</button>
  </div>
</div>

<!-- Shop Modal -->
<div class="modal" id="shop-modal">
  <div class="modal-content">
    <div class="modal-header">
      <span>🛒 Магазин</span>
      <button class="close-btn" onclick="closeModal('shop-modal')">×</button>
    </div>
    <p style="font-size:11px;color:var(--muted);margin-bottom:10px;">Покупай еду, шампуни и игрушки.</p>
    <div class="shop-grid" id="shop-list"></div>
  </div>
</div>

<!-- Wardrobe Modal -->
<div class="modal" id="wardrobe-modal">
  <div class="modal-content">
    <div class="modal-header">
      <span>👗 Гардероб</span>
      <button class="close-btn" onclick="closeModal('wardrobe-modal')">×</button>
    </div>
    <div class="shop-grid" id="wardrobe-list"></div>
  </div>
</div>

<script>
// --- TELEGRAM INIT ---
var tg = window.Telegram && window.Telegram.WebApp ? Telegram.WebApp : null;
if(tg){ try{ tg.ready(); tg.expand(); }catch(e){} }

// --- CONFIG & STATE ---
const KEY = 'barsik_pu_pro_v4';
let state = {
  coins: 500, level: 1, xp: 0,
  hunger: 80, mood: 70, energy: 90, clean: 85, health: 100, belly: 0,
  currentTool: 'hand',
  inventory: { food: 5, soap: 2, toy: 1 }, // Counts of consumables/items owned
  equipped: { hat: null, scarf: null, glasses: null },
  dirtSpots: [], // Array of {x, y, size, type} on the cat
  poopPiles: [], // Array of {x, y, type} in the room
  mice: [], // Active mice entities
  lastTick: Date.now()
};

// Load State
try {
  const saved = localStorage.getItem(KEY);
  if(saved) state = JSON.parse(saved);
} catch(e) {}

function save() {
  state.lastTick = Date.now();
  localStorage.setItem(KEY, JSON.stringify(state));
  updateUI();
}

// --- CANVAS SETUP ---
const canvas = document.getElementById('game-canvas');
const ctx = canvas.getContext('2d');
let cw, ch;

function resize() {
  cw = canvas.width = canvas.parentElement.clientWidth;
  ch = canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resize);
resize();

// --- ASSETS / DRAWING HELPERS ---

// Draw Snow Leopard Body
function drawCat(x, y, scale, bellyFactor, mood) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath();
  ctx.ellipse(0, 40, 50, 10, 0, 0, Math.PI*2);
  ctx.fill();

  // Tail
  ctx.strokeStyle = '#cbd5e1';
  ctx.lineWidth = 12;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(40, 20);
  ctx.quadraticCurveTo(80, 0, 70, -30);
  ctx.stroke();

  // Body (Egg shape, expands with belly)
  const bodyRx = 45 + (bellyFactor * 10);
  const bodyRy = 35 + (bellyFactor * 5);
  
  ctx.fillStyle = '#e2e8f0';
  ctx.beginPath();
  ctx.ellipse(0, 0, bodyRx, bodyRy, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Spots (Snow Leopard rosettes)
  ctx.fillStyle = 'rgba(100, 116, 139, 0.4)';
  const spots = [
    [-20, -10, 4], [10, -15, 3], [-10, 10, 5], [20, 5, 4],
    [-30, 0, 3], [30, -5, 3], [0, 20, 4]
  ];
  spots.forEach(s => {
    ctx.beginPath();
    ctx.arc(s[0], s[1], s[2], 0, Math.PI*2);
    ctx.fill();
  });

  // Head
  ctx.fillStyle = '#f1f5f9';
  ctx.beginPath();
  ctx.arc(0, -35, 25, 0, Math.PI*2);
  ctx.fill();
  ctx.stroke();

  // Ears
  ctx.fillStyle = '#cbd5e1';
  ctx.beginPath(); ctx.moveTo(-15, -50); ctx.lineTo(-25, -65); ctx.lineTo(-5, -55); ctx.fill();
  ctx.beginPath(); ctx.moveTo(15, -50); ctx.lineTo(25, -65); ctx.lineTo(5, -55); ctx.fill();
  
  // Inner ears
  ctx.fillStyle = '#fda4af';
  ctx.beginPath(); ctx.moveTo(-15, -52); ctx.lineTo(-20, -60); ctx.lineTo(-8, -55); ctx.fill();
  ctx.beginPath(); ctx.moveTo(15, -52); ctx.lineTo(20, -60); ctx.lineTo(8, -55); ctx.fill();

  // Eyes
  ctx.fillStyle = '#1e293b';
  const eyeOpenness = mood > 30 ? 1 : 0.5; // Squint if sad
  ctx.beginPath(); ctx.ellipse(-8, -35, 3, 4 * eyeOpenness, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(8, -35, 3, 4 * eyeOpenness, 0, 0, Math.PI*2); ctx.fill();
  
  // Highlights
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-7, -36, 1, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(9, -36, 1, 0, Math.PI*2); ctx.fill();

  // Nose
  ctx.fillStyle = '#fda4af';
  ctx.beginPath(); ctx.moveTo(0, -28); ctx.lineTo(-3, -25); ctx.lineTo(3, -25); ctx.fill();

  // Mouth
  ctx.strokeStyle = '#1e293b';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  if(mood > 50) {
    ctx.moveTo(0, -25); ctx.quadraticCurveTo(-5, -20, -10, -22); // Smile L
    ctx.moveTo(0, -25); ctx.quadraticCurveTo(5, -20, 10, -22);   // Smile R
  } else {
    ctx.moveTo(0, -25); ctx.quadraticCurveTo(-5, -28, -10, -26); // Frown L
    ctx.moveTo(0, -25); ctx.quadraticCurveTo(5, -28, 10, -26);   // Frown R
  }
  ctx.stroke();

  // Whiskers
  ctx.strokeStyle = '#94a3b8';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-15, -28); ctx.lineTo(-35, -30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-15, -25); ctx.lineTo(-35, -22); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(15, -28); ctx.lineTo(35, -30); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(15, -25); ctx.lineTo(35, -22); ctx.stroke();

  // Accessories
  drawAccessories(ctx, 0, -35); // Head pos relative to center

  ctx.restore();
}

function drawAccessories(ctx, hx, hy) {
  // Hat
  if(state.equipped.hat === 'cap') {
    ctx.fillStyle = '#333';
    ctx.fillRect(hx-10, hy-25, 20, 5);
    ctx.beginPath(); ctx.arc(hx, hy-20, 10, Math.PI, 0); ctx.fill();
  } else if(state.equipped.hat === 'crown') {
    ctx.fillStyle = 'gold';
    ctx.beginPath();
    ctx.moveTo(hx-10, hy-20); ctx.lineTo(hx-5, hy-30); ctx.lineTo(hx, hy-20);
    ctx.lineTo(hx+5, hy-30); ctx.lineTo(hx+10, hy-20);
    ctx.fill();
  }

  // Glasses
  if(state.equipped.glasses === 'sun') {
    ctx.fillStyle = 'rgba(0,0,0,0.8)';
    ctx.fillRect(hx-12, hy-5, 8, 6);
    ctx.fillRect(hx+4, hy-5, 8, 6);
    ctx.strokeStyle = '#333'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(hx-4, hy-2); ctx.lineTo(hx+4, hy-2); ctx.stroke();
  }

  // Scarf
  if(state.equipped.scarf === 'red') {
    ctx.strokeStyle = 'red'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.moveTo(hx-15, hy+10); ctx.quadraticCurveTo(hx, hy+20, hx+15, hy+10); ctx.stroke();
  }
}

// Draw Dirt/Poop
function drawDirt(spots) {
  spots.forEach(d => {
    ctx.fillStyle = d.type === 'poop' ? '#78350f' : '#475569';
    ctx.globalAlpha = 0.7;
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.size, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
    
    // Poop smell waves
    if(d.type === 'poop') {
      ctx.strokeStyle = 'rgba(100,100,100,0.3)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y-d.size);
      ctx.quadraticCurveTo(d.x+5, d.y-d.size-10, d.x, d.y-d.size-20);
      ctx.stroke();
    }
  });
}

// Draw Mice
function drawMice(mices) {
  mices.forEach(m => {
    ctx.save();
    ctx.translate(m.x, m.y);
    ctx.rotate(m.angle);
    
    // Body
    ctx.fillStyle = '#94a3b8';
    ctx.beginPath(); ctx.ellipse(0, 0, 8, 5, 0, 0, Math.PI*2); ctx.fill();
    // Ears
    ctx.fillStyle = '#cbd5e1';
    ctx.beginPath(); ctx.arc(-4, -3, 3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -3, 3, 0, Math.PI*2); ctx.fill();
    // Tail
    ctx.strokeStyle = '#94a3b8'; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(8, 0); ctx.quadraticCurveTo(15, 5, 12, 10); ctx.stroke();
    
    ctx.restore();
  });
}

// --- GAME LOGIC ---

let gameLoopId;
let mouseX = 0, mouseY = 0;
let isDragging = false;

// Mouse Interaction
canvas.addEventListener('mousedown', handleInputStart);
canvas.addEventListener('mousemove', handleInputMove);
canvas.addEventListener('mouseup', handleInputEnd);
canvas.addEventListener('touchstart', e => { e.preventDefault(); handleInputStart(e.touches[0]); }, {passive:false});
canvas.addEventListener('touchmove', e => { e.preventDefault(); handleInputMove(e.touches[0]); }, {passive:false});
canvas.addEventListener('touchend', e => { e.preventDefault(); handleInputEnd(); }, {passive:false});

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

function handleInputStart(e) {
  const pos = getPos(e);
  mouseX = pos.x; mouseY = pos.y;
  isDragging = true;
  performAction(pos.x, pos.y);
}

function handleInputMove(e) {
  if(!isDragging) return;
  const pos = getPos(e);
  mouseX = pos.x; mouseY = pos.y;
  
  // Continuous actions like scrubbing or feeding drag
  if(state.currentTool === 'scrub' || state.currentTool === 'soap' || state.currentTool === 'water') {
    performContinuousAction(pos.x, pos.y);
  }
}

function handleInputEnd() {
  isDragging = false;
}

function performAction(x, y) {
  const tool = state.currentTool;
  const catCenter = { x: cw/2, y: ch/2 + 20 };
  const distToCat = Math.hypot(x - catCenter.x, y - catCenter.y);
  const isOnCat = distToCat < 60;

  if(tool === 'hand') {
    // Petting
    if(isOnCat) {
      state.mood = Math.min(100, state.mood + 2);
      spawnParticle(x, y, '❤️', '#f472b6');
      showToast("Барсику приятно!");
      save();
    }
  } 
  else if(tool === 'food') {
    if(state.inventory.food > 0) {
      // Drop food near cat
      if(distToCat < 100) {
        state.inventory.food--;
        state.hunger = Math.min(100, state.hunger + 15);
        state.belly += 5;
        spawnParticle(catCenter.x, catCenter.y - 40, '🍖', '#f97316');
        showToast("Ням! +15 сытости");
        checkLevelUp(5);
        save();
      } else {
        showToast("Поднеси ближе к миске/барсу");
      }
    } else {
      showToast("Нет еды! Купи в магазине.");
    }
  }
  else if(tool === 'shovel') {
    // Clean poop
    for(let i=state.poopPiles.length-1; i>=0; i--) {
      const p = state.poopPiles[i];
      if(Math.hypot(x-p.x, y-p.y) < 30) {
        state.poopPiles.splice(i, 1);
        state.clean = Math.min(100, state.clean + 10);
        spawnParticle(p.x, p.y, '✨', '#22c55e');
        showToast("Чисто!");
        save();
        break;
      }
    }
  }
  else if(tool === 'toy') {
    // Spawn mouse
    if(state.inventory.toy > 0 || true) { // Free toys for now
       state.mice.push({
         x: x, y: y, vx: (Math.random()-0.5)*5, vy: (Math.random()-0.5)*5, angle: 0, life: 300
       });
       showToast("Мышь появилась! Лови её!");
    }
  }
}

function performContinuousAction(x, y) {
  const tool = state.currentTool;
  const catCenter = { x: cw/2, y: ch/2 + 20 };
  const distToCat = Math.hypot(x - catCenter.x, y - catCenter.y);

  if(tool === 'soap' || tool === 'water' || tool === 'scrub') {
    if(distToCat < 60) {
      // Cleaning logic
      let cleanedSomething = false;
      
      // Check dirt spots on cat
      for(let i=state.dirtSpots.length-1; i>=0; i--) {
        const d = state.dirtSpots[i];
        // Transform dirt coords to screen approx
        const dx = catCenter.x + d.rx;
        const dy = catCenter.y + d.ry;
        
        if(Math.hypot(x-dx, y-dy) < 20) {
          state.dirtSpots.splice(i, 1);
          state.clean = Math.min(100, state.clean + 5);
          spawnParticle(dx, dy, '🫧', '#bae6fd');
          cleanedSomething = true;
        }
      }
      
      if(cleanedSomething) {
        showToast("Чище!");
        save();
      }
    }
  }
}

function spawnParticle(x, y, char, color) {
  // Simple particle system could be added here, using temporary array
  // For brevity, we just flash text via toast or simple visual cue in draw loop
  particles.push({x, y, char, color, life: 30, vy: -2});
}
let particles = [];

function updateParticles() {
  for(let i=particles.length-1; i>=0; i--) {
    let p = particles[i];
    p.y += p.vy;
    p.life--;
    if(p.life <= 0) particles.splice(i, 1);
  }
}

function drawParticles() {
  particles.forEach(p => {
    ctx.font = '16px Arial';
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life / 30;
    ctx.fillText(p.char, p.x, p.y);
    ctx.globalAlpha = 1;
  });
}

// --- MOUSE AI ---
function updateMice() {
  const catPos = { x: cw/2, y: ch/2 + 20 };
  
  for(let i=state.mice.length-1; i>=0; i--) {
    let m = state.mice[i];
    m.life--;
    
    // Move randomly
    m.x += m.vx;
    m.y += m.vy;
    
    // Bounce off walls
    if(m.x < 10 || m.x > cw-10) m.vx *= -1;
    if(m.y < 10 || m.y > ch-10) m.vy *= -1;
    
    // Attract to player cursor slightly if close? No, run away from cat
    const distToCat = Math.hypot(m.x - catPos.x, m.y - catPos.y);
    if(distToCat < 80) {
      // Run away
      const angle = Math.atan2(m.y - catPos.y, m.x - catPos.x);
      m.vx += Math.cos(angle) * 0.5;
      m.vy += Math.sin(angle) * 0.5;
    }
    
    // Friction
    m.vx *= 0.98;
    m.vy *= 0.98;
    m.angle = Math.atan2(m.vy, m.vx);

    // Catch condition (Player clicks mouse)
    // Handled in performAction if tool is hand and click is on mouse
    
    if(m.life <= 0) state.mice.splice(i, 1);
  }
}

// Check if player caught a mouse manually
function checkMouseCatch(x, y) {
  for(let i=state.mice.length-1; i>=0; i--) {
    let m = state.mice[i];
    if(Math.hypot(x-m.x, y-m.y) < 15) {
      state.mice.splice(i, 1);
      state.mood = Math.min(100, state.mood + 10);
      state.energy -= 5;
      spawnParticle(x, y, '🎉', '#fbbf24');
      showToast("Поймал мышь! +Настроение");
      checkLevelUp(10);
      save();
      return true;
    }
  }
  return false;
}

// Modify performAction to include mouse catching
const originalPerformAction = performAction;
performAction = function(x, y) {
  if(checkMouseCatch(x, y)) return; // If caught mouse, stop other actions
  originalPerformAction(x, y);
};


// --- SPAWNERS ---
function spawnPoop() {
  if(state.poopPiles.length < 3 && Math.random() < 0.01) {
    state.poopPiles.push({
      x: Math.random() * (cw - 40) + 20,
      y: Math.random() * (ch - 100) + 50,
      type: 'poop'
    });
    state.clean = Math.max(0, state.clean - 5);
    showToast("Ой... Барсик сделал дела.");
    save();
  }
}

function spawnDirtOnCat() {
  if(state.dirtSpots.length < 5 && Math.random() < 0.005) {
    // Random spot on body ellipse
    const rx = (Math.random() - 0.5) * 60;
    const ry = (Math.random() - 0.5) * 40;
    state.dirtSpots.push({ rx, ry, size: 5 + Math.random()*5, type: 'dust' });
    state.clean = Math.max(0, state.clean - 2);
    save();
  }
}

// --- MAIN LOOP ---
function loop() {
  // Clear
  ctx.clearRect(0, 0, cw, ch);
  
  // Background Room
  drawRoomBackground();

  // Entities
  updateMice();
  drawMice(state.mice);
  
  drawPoop(state.poopPiles);
  
  // Cat
  const catScale = 1.5;
  const bellyFactor = state.belly / 100;
  drawCat(cw/2, ch/2 + 20, catScale, bellyFactor, state.mood);
  
  // Dirt on Cat (Overlay)
  drawDirtOnCat(cw/2, ch/2 + 20, catScale);

  // Particles
  updateParticles();
  drawParticles();

  // Logic Tick
  spawnPoop();
  spawnDirtOnCat();

  requestAnimationFrame(loop);
}

function drawRoomBackground() {
  // Simple floor/wall distinction
  ctx.fillStyle = '#1e293b'; // Wall
  ctx.fillRect(0, 0, cw, ch * 0.6);
  
  ctx.fillStyle = '#0f172a'; // Floor
  ctx.fillRect(0, ch * 0.6, cw, ch * 0.4);
  
  // Rug
  ctx.fillStyle = 'rgba(56, 189, 248, 0.1)';
  ctx.beginPath();
  ctx.ellipse(cw/2, ch*0.7, 100, 40, 0, 0, Math.PI*2);
  ctx.fill();
}

function drawPoop(piles) {
  piles.forEach(p => {
    ctx.fillStyle = '#78350f';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 8, 0, Math.PI*2);
    ctx.fill();
    // Smell
    ctx.fillStyle = 'rgba(100,100,100,0.2)';
    ctx.font = '10px Arial';
    ctx.fillText('~', p.x, p.y - 10);
  });
}

function drawDirtOnCat(cx, cy, scale) {
  state.dirtSpots.forEach(d => {
    ctx.fillStyle = 'rgba(100, 116, 139, 0.6)';
    ctx.beginPath();
    ctx.arc(cx + d.rx*scale, cy + d.ry*scale, d.size*scale, 0, Math.PI*2);
    ctx.fill();
  });
}

// --- UI UPDATES ---
function updateUI() {
  document.getElementById('ui-coins').textContent = state.coins;
  document.getElementById('ui-level').textContent = state.level;
  
  setBar('hunger', state.hunger);
  setBar('mood', state.mood);
  setBar('energy', state.energy);
  setBar('clean', state.clean);
  setBar('health', state.health);
  setBar('belly', state.belly);
}

function setBar(key, val) {
  const fill = document.getElementById('fill-' + key);
  const label = document.getElementById('val-' + key);
  if(fill) fill.style.width = val + '%';
  if(label) label.textContent = Math.round(val) + '%';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2000);
}

function checkLevelUp(xpGain) {
  state.xp += xpGain;
  const needed = state.level * 100;
  if(state.xp >= needed) {
    state.level++;
    state.xp -= needed;
    state.coins += 50;
    showToast("LEVEL UP! ⭐" + state.level);
  }
}

// --- TOOL SELECTION ---
document.querySelectorAll('.tool-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.currentTool = btn.dataset.tool;
    showToast("Инструмент: " + btn.title);
  };
});

// --- SHOP LOGIC ---
const SHOP_ITEMS = [
  { id: 'food_pack', name: 'Пачка корма', price: 20, type: 'consumable', itemKey: 'food', amount: 5, icon: '🍖' },
  { id: 'soap_bar', name: 'Шампунь', price: 30, type: 'consumable', itemKey: 'soap', amount: 3, icon: '🧼' },
  { id: 'toy_mouse', name: 'Игрушечная мышь', price: 50, type: 'permanent', icon: '🎾' }, // Just unlocks ability
  { id: 'hat_cap', name: 'Кепка', price: 100, type: 'clothing', slot: 'hat', idCloth: 'cap', icon: '🧢' },
  { id: 'glass_sun', name: 'Очки', price: 80, type: 'clothing', slot: 'glasses', idCloth: 'sun', icon: '🕶' },
];

function openShop() {
  const list = document.getElementById('shop-list');
  list.innerHTML = '';
  
  SHOP_ITEMS.forEach(item => {
    const canBuy = state.coins >= item.price;
    const div = document.createElement('div');
    div.className = 'shop-item';
    div.innerHTML = `
      <div class="item-icon">${item.icon}</div>
      <div class="item-name">${item.name}</div>
      <div class="item-price">${item.price} 🪙</div>
      <button class="buy-btn" ${canBuy ? '' : 'disabled'}>${canBuy ? 'Купить' : 'Дорого'}</button>
    `;
    div.querySelector('button').onclick = () => buyItem(item);
    list.appendChild(div);
  });
  
  document.getElementById('shop-modal').classList.add('open');
}

function buyItem(item) {
  if(state.coins < item.price) return;
  
  state.coins -= item.price;
  
  if(item.type === 'consumable') {
    state.inventory[item.itemKey] += item.amount;
    showToast(`Куплено: ${item.name}`);
  } else if(item.type === 'clothing') {
    // Add to wardrobe logic simplified: just equip immediately for demo
    state.equipped[item.slot] = item.idCloth;
    showToast(`Надето: ${item.name}`);
  }
  
  save();
  updateUI();
  closeModal('shop-modal');
}

function toggleWardrobe() {
  // Simplified: In real app, show owned items to equip/unequip
  showToast("Гардероб: Пока только покупка в магазине одевает вещи автоматически.");
}

function closeModal(id) {
  document.getElementById(id).classList.remove('open');
}

function resetGame() {
  if(confirm("Сбросить весь прогресс?")) {
    localStorage.removeItem(KEY);
    location.reload();
  }
}

function sendToBot() {
  if(tg && tg.sendData) {
    tg.sendData(JSON.stringify({ game: 'tama_pro', state: state }));
    showToast("Отправлено в бота!");
  }
}

// --- START ---
updateUI();
loop();

// Passive decay tick
setInterval(() => {
  state.hunger = Math.max(0, state.hunger - 1);
  state.mood = Math.max(0, state.mood - 0.5);
  state.energy = Math.min(100, state.energy + 0.5);
  state.clean = Math.max(0, state.clean - 0.2);
  state.belly = Math.max(0, state.belly - 0.5);
  
  if(state.hunger < 10 || state.clean < 10) state.health = Math.max(0, state.health - 1);
  else if(state.health < 100 && state.hunger > 50) state.health = Math.min(100, state.health + 1);
  
  save();
}, 10000); // Every 10 seconds for faster feel

</script>
