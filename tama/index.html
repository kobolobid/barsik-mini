function updateParticles(dt){for(var i=R.particles.length-1;i>=0;i--){var p=R.particles[i];p.life-=dt*(p.t==='zzz'?0.5:0.9);p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.t==='confetti')p.vy+=200*dt;if(p.t==='drop')p.vy+=300*dt;p.rot+=dt*3;if(p.life<=0)R.particles.splice(i,1);}for(var j=R.floats.length-1;j>=0;j--){var f=R.floats[j];f.life-=dt*0.7;f.y-=40*dt;if(f.life<=0)R.floats.splice(j,1);}}
