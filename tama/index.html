<title>Barsik Life — Домик снежного барса</title>

<style>
:root{
  --bg:#141a2e; --bg2:#0e1322; --panel:#1d2540; --panel2:#252f52; --line:#33406b;
  --text:#eef2ff; --muted:#93a0c4; --ice:#7fd8ff; --mint:#5fe3b3; --amber:#ffc94d;
  --rose:#ff6d9d; --violet:#b48bff; --danger:#ff5d5d; --ok:#43d97b; --warn:#ffb020;
  --gold:#ffd166;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:
 radial-gradient(1200px 600px at 15% -10%,rgba(127,216,255,.10),transparent 60%),
 radial-gradient(900px 500px at 110% 10%,rgba(180,139,255,.10),transparent 55%),
 linear-gradient(180deg,var(--bg),var(--bg2));
 color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;touch-action:manipulation;overscroll-behavior:none;user-select:none}
.app{display:flex;flex-direction:column;height:100%;max-width:600px;margin:0 auto;width:100%;
 padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#10162a;border-radius:8px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--ice),var(--violet));border-radius:8px;border:2px solid #10162a}
.hud{display:flex;align-items:center;gap:8px;padding:8px 10px;background:linear-gradient(135deg,#1c2444,#161d36);border-bottom:1px solid var(--line)}
.hud .logo{font-weight:900;font-size:15px;background:linear-gradient(90deg,var(--ice),var(--mint),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.pill{display:flex;align-items:center;gap:5px;background:#111832;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px;font-weight:800}
.pill b{color:var(--gold)}
.pill.lvl b{color:var(--mint)}
.hud .sp{flex:1}
.ibtn{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#111832;color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.ibtn:active{transform:scale(.93)}
.ibtn .dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--rose);border:2px solid #161d36;display:none}
.ibtn.alert .dot{display:block}
.xpwrap{height:4px;background:#0d1226;border-bottom:1px solid #202a4d}
.xpwrap i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--ice));transition:width .4s}
.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:6px 8px;background:#151c36;border-bottom:1px solid var(--line)}
.stat{background:#0f1530;border:1px solid #26315a;border-radius:9px;padding:4px 5px}
.stat .l{font-size:9px;color:var(--muted);display:flex;justify-content:space-between;font-weight:700}
.stat .l b{color:var(--text)}
.stat .t{height:5px;background:#0a0f22;border-radius:4px;margin-top:3px;overflow:hidden}
.stat .t i{display:block;height:100%;border-radius:4px;transition:width .35s}
.stage{flex:1;position:relative;min-height:180px;background:#0a0e1e;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.wish{position:absolute;top:8px;left:8px;z-index:5;pointer-events:none;display:none;align-items:center;gap:7px;
 background:rgba(16,22,44,.92);border:1px solid var(--violet);border-radius:12px;padding:6px 10px;font-size:11px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.wish.show{display:flex}
.wish .wi{font-size:17px}
.wish .wt{color:var(--muted);font-weight:700;font-size:10px}
.roomtag{position:absolute;top:8px;right:8px;z-index:5;pointer-events:none;background:rgba(16,22,44,.85);border:1px solid var(--line);border-radius:10px;padding:5px 9px;font-size:11px;font-weight:800;color:var(--ice)}
.rooms{display:flex;gap:5px;padding:6px 8px;background:#131a33;border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.rooms::-webkit-scrollbar{display:none}
.rtab{flex:1;min-width:62px;border:1px solid var(--line);background:#0f1530;color:var(--muted);border-radius:11px;padding:6px 4px;font-size:10px;font-weight:800;cursor:pointer;text-align:center;line-height:1.15}
.rtab .ri{font-size:16px;display:block}
.rtab.on{background:linear-gradient(135deg,#1f3b63,#232a55);color:#fff;border-color:var(--ice);box-shadow:0 0 12px rgba(127,216,255,.25)}
.tools{display:flex;gap:6px;padding:7px 8px;background:#10162c;border-top:1px solid var(--line);overflow-x:auto;min-height:58px}
.tool{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:#151d3a;color:var(--text);border-radius:12px;padding:6px 10px;min-width:58px;font-size:9px;font-weight:800;cursor:pointer}
.tool .ti{font-size:19px;line-height:1}
.tool .tc{color:var(--gold);font-size:9px}
.tool.on{border-color:var(--mint);background:#12301f;box-shadow:0 0 10px rgba(95,227,179,.25)}
.tool:active{transform:scale(.94)}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:8px;background:linear-gradient(180deg,#181f3c,#131a33);border-top:1px solid var(--line)}
.nbtn{border:1px solid var(--line);background:linear-gradient(180deg,#20294c,#182040);color:var(--text);border-radius:12px;padding:8px 4px;font-size:10px;font-weight:900;cursor:pointer;text-align:center;line-height:1.2}
.nbtn .ni{font-size:18px;display:block;margin-bottom:2px}
.nbtn:active{transform:scale(.95);border-color:var(--ice)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,8,18,.78);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{width:100%;max-width:600px;max-height:88vh;background:linear-gradient(180deg,#1b2342,#141b34);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:0 -18px 60px rgba(0,0,0,.5);animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.sheet header{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font-size:15px;flex:1}
.x{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:#111832;color:var(--muted);font-size:15px;cursor:pointer}
.mbody{padding:12px 14px;overflow-y:auto;flex:1}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.stab{border:1px solid var(--line);background:#111832;color:var(--muted);border-radius:999px;padding:6px 11px;font-size:11px;font-weight:800;cursor:pointer}
.stab.on{background:linear-gradient(135deg,#23406b,#2a2f5e);color:#fff;border-color:var(--ice)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:#101736;border:1px solid #2a3560;border-radius:13px;padding:8px 6px;text-align:center;position:relative}
.card.eq{border-color:var(--mint);box-shadow:0 0 10px rgba(95,227,179,.2)}
.card.own{border-color:#3d4c85}
.card img{width:64px;height:64px;display:block;margin:0 auto}
.card .cn{font-size:10px;font-weight:800;margin-top:4px;line-height:1.2;min-height:24px}
.card .cp{font-size:10px;font-weight:900;color:var(--gold);margin-top:2px}
.rar{position:absolute;top:5px;left:5px;font-size:8px;font-weight:900;padding:2px 5px;border-radius:6px}
.r0{background:#2a3560;color:#aab6dd}.r1{background:#173a5e;color:#7fd8ff}.r2{background:#3a2360;color:#c9a4ff}.r3{background:#5e3a10;color:#ffd166}
.cbtn{width:100%;margin-top:5px;border:none;border-radius:8px;padding:6px 4px;font-size:10px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,var(--ice),#4aa8e0);color:#08122a}
.cbtn.g{background:linear-gradient(135deg,var(--mint),#2fbf85)}
.cbtn.r{background:linear-gradient(135deg,#ff7d7d,#e04545);color:#fff}
.cbtn.d{background:#2a3560;color:#8b98c2;cursor:default}
.more{width:100%;margin-top:10px;border:1px dashed var(--line);background:none;color:var(--ice);border-radius:10px;padding:9px;font-weight:800;font-size:12px;cursor:pointer}
.row{display:flex;gap:8px;align-items:center}
.res{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.res .pill{font-size:11px}
.note{font-size:11px;color:var(--muted);line-height:1.45;margin:6px 0}
.big{width:100%;border:none;border-radius:12px;padding:12px;font-size:13px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,var(--gold),#f0a832);color:#241a05;margin-top:8px}
.big.b{background:linear-gradient(135deg,var(--ice),#4aa8e0);color:#08122a}
.big.v{background:linear-gradient(135deg,var(--violet),#8b5cf6);color:#fff}
.big.d{background:#2a3560;color:#9aa7cf}
.chat{display:flex;flex-direction:column;gap:8px;min-height:200px}
.msg{max-width:82%;padding:8px 11px;border-radius:14px;font-size:12.5px;line-height:1.4}
.msg.u{align-self:flex-end;background:linear-gradient(135deg,#2a4a7a,#23345e);border:1px solid #3c5b96;border-bottom-right-radius:4px}
.msg.b{align-self:flex-start;background:#131b3a;border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.b .who{font-size:9px;color:var(--mint);font-weight:900;margin-bottom:2px}
.chatin{display:flex;gap:7px;padding-top:10px;border-top:1px solid var(--line);margin-top:10px}
.chatin input{flex:1;background:#0e1430;border:1px solid var(--line);border-radius:11px;color:var(--text);padding:10px 12px;font-size:13px;outline:none}
.chatin input:focus{border-color:var(--ice)}
.chatin button{border:none;border-radius:11px;padding:0 16px;font-size:16px;background:linear-gradient(135deg,var(--mint),#2fbf85);color:#062018;cursor:pointer;font-weight:900}
.fld{margin:10px 0}
.fld label{font-size:11px;color:var(--muted);font-weight:800;display:block;margin-bottom:4px}
.fld input,.fld select{width:100%;background:#0e1430;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:9px 11px;font-size:12px;outline:none;font-family:inherit}
.tog{display:flex;align-items:center;justify-content:space-between;background:#101736;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin:8px 0;font-size:12px;font-weight:800}
.sw{width:44px;height:24px;border-radius:999px;background:#2a3560;position:relative;cursor:pointer;transition:.2s}
.sw i{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#8b98c2;transition:.2s}
.sw.on{background:linear-gradient(135deg,var(--mint),#2fbf85)}
.sw.on i{left:23px;background:#fff}
.gcard{display:flex;gap:10px;align-items:center;background:#101736;border:1px solid #2a3560;border-radius:13px;padding:10px;margin-bottom:8px;cursor:pointer}
.gcard:active{border-color:var(--ice)}
.gcard .gi{font-size:28px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;background:#182148;border-radius:11px}
.gcard .gn{font-weight:900;font-size:13px}
.gcard .gd{font-size:10.5px;color:var(--muted);margin-top:2px;line-height:1.3}
.gcard .gb{margin-left:auto;text-align:right;font-size:10px;color:var(--gold);font-weight:900}
#toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%) translateY(20px);z-index:90;background:rgba(14,20,42,.96);border:1px solid var(--ice);color:var(--text);padding:9px 16px;border-radius:12px;font-size:12px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;max-width:86vw;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#fatal{display:none;position:fixed;inset:0;z-index:999;background:#101018;color:#ffd7d7;padding:18px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;overflow:auto}
#fatal b{color:#ff8080;font-size:14px}
#boot{position:fixed;inset:0;z-index:998;background:#0b0f1e;color:#7fd8ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;text-align:center;padding:20px}
#boot .spin{width:38px;height:38px;border:4px solid #1c2444;border-top-color:#7fd8ff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#boot .st{color:#93a0c4;font-size:11px;max-width:90vw;word-break:break-word}
@media(max-width:380px){.stats{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>

<script>
(function(){'use strict';
var BOOTLOG=[];
function boot(msg){BOOTLOG.push(msg);var el=document.getElementById('bootStage');if(el)el.textContent=msg;}
function bootHide(){var b=document.getElementById('boot');if(b&&b.parentNode)b.parentNode.removeChild(b);}
function showFatal(err){
 var el=document.getElementById('fatal');
 el.style.display='block';
 el.innerHTML='<b>⚠ Ошибка Barsik Life</b>\n\nШаги: '+BOOTLOG.join(' → ')+'\n\n'+(err&&err.stack?err.stack:String(err))+'\n\nПришли этот экран разработчику.';
}
window.onerror=function(m,s,l,c,e){showFatal(e||(m+' @ '+l+':'+c));return true;};
window.addEventListener('unhandledrejection',function(ev){showFatal(ev.reason);});
boot('скрипт загружен');
try{ main(); }catch(e){ showFatal(e); }
function main(){
boot('main()');
/* ============ TELEGRAM ============ */
var TG=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
if(TG){try{TG.ready();TG.expand();if(TG.setHeaderColor)TG.setHeaderColor('#141a2e');if(TG.setBackgroundColor)TG.setBackgroundColor('#0e1322');if(TG.disableVerticalSwipes)TG.disableVerticalSwipes();}catch(e){}}
/* ============ AI CONFIG (ключ нигде не отображается) ============ */
var AI_MODEL='am/nemotron-3-ultra-550b-a55b'; /* основная модель, как в боте — поменяй при желании */
var AI_EMBED_KEY='sk-dc9d4b7df36ba555-wof1d4-80376593'; /* СЮДА можно вшить отдельный ключ OpenRouter с лимитом трат.
   ВНИМАНИЕ: всё, что вшито здесь, видно в исходниках публичной страницы.
   Основной ключ бота не вшивай — держи его только в systemd. */
/* ============ UTILS ============ */
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function rand(a,b){return a+Math.random()*(b-a);}
function randi(a,b){return Math.floor(rand(a,b+1));}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function fmt(n){return String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function now(){return Date.now();}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function qp(x0,y0,cx,cy,x1,y1,t){var u=1-t;return[u*u*x0+2*u*t*cx+t*t*x1,u*u*y0+2*u*t*cy+t*t*y1];}
function wrapText(c,text,maxW){var words=String(text).split(' '),lines=[],cur='';for(var i=0;i<words.length;i++){var test=cur?cur+' '+words[i]:words[i];if(c.measureText(test).width>maxW&&cur){lines.push(cur);cur=words[i];}else cur=test;}if(cur)lines.push(cur);return lines;}

/* ============ AUDIO + MUSIC ============ */
var A={ctx:null,on:true,master:null};
function audioInit(){if(A.ctx)return;try{var AC=window.AudioContext||window.webkitAudioContext;A.ctx=new AC();A.master=A.ctx.createGain();A.master.gain.value=A.on?0.5:0;A.master.connect(A.ctx.destination);MU.next=A.ctx.currentTime+0.1;}catch(e){}}
function tone(f,dur,type,vol,slide){if(!A.ctx||!A.on)return;try{var o=A.ctx.createOscillator(),g=A.ctx.createGain(),t=A.ctx.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);g.gain.setValueAtTime(vol||0.2,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(A.master);o.start(t);o.stop(t+dur+0.02);}catch(e){}}
function noise(dur,vol,freq){if(!A.ctx||!A.on)return;try{var n=Math.floor(A.ctx.sampleRate*dur),buf=A.ctx.createBuffer(1,n,A.ctx.sampleRate),d=buf.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);var s=A.ctx.createBufferSource();s.buffer=buf;var f=A.ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||1200;var g=A.ctx.createGain();g.gain.value=vol||0.15;s.connect(f);f.connect(g);g.connect(A.master);s.start();}catch(e){}}
var SFX={
 click:function(){tone(700,0.05,'square',0.08);},
 coin:function(){tone(880,0.08,'square',0.12);setTimeout(function(){tone(1320,0.12,'square',0.12);},70);},

 purr:function(){for(var i=0;i<5;i++)(function(k){setTimeout(function(){tone(90+k%2*15,0.09,'triangle',0.14);},k*90);})(i);},
 eat:function(){noise(0.08,0.14,900);setTimeout(function(){noise(0.08,0.12,700);},130);setTimeout(function(){noise(0.07,0.1,800);},260);},

var PREVIEWS={};
function itemPreview(it){
 if(PREVIEWS[it.id])return PREVIEWS[it.id];
 var cv=document.createElement('canvas');cv.width=84;cv.height=84;var c=cv.getContext('2d');
 c.translate(42,42);var p=PAL[it.pal];
 try{
  if(it.slot==='hat'){c.translate(0,14);HATS[it.shape](c,p);}
  else if(it.slot==='eyes'){GLASSES[it.shape](c,p);}
  else if(it.slot==='neck'){c.translate(0,-2);NECK[it.shape](c,p);}
  else{c.scale(0.62,0.62);c.translate(0,80);c.beginPath();c.rect(-52,-122,104,90);c.clip();BODY[it.shape](c,p);}
 }catch(e){}
 var url=cv.toDataURL();PREVIEWS[it.id]=url;return url;
}

 var full=belly();
 if(R.state==='sleep'){T.lie=1;T.eyeOpen=0;T.squash=1.04;}
 else if(R.state==='eat'){T.mouth=0.5+Math.abs(Math.sin(R.frame*0.35))*0.5;T.tilt=Math.sin(R.frame*0.2)*0.05;T.bob=Math.abs(Math.sin(R.frame*0.3))*3;}
 else if(R.state==='squat'){T.sit=1;T.squash=1.08;T.tilt=0.06;T.eyeOpen=0.6;}
 else if(R.state==='watch'){T.sit=1;T.tilt=-0.04;T.pupil=0.7;}
 else if(R.state==='wash'){T.tilt=Math.sin(R.frame*0.15)*0.08;T.eyeOpen=0.7;T.pupil=0.6;}
 else if(R.state==='walk'){T.bob=Math.abs(Math.sin(R.frame*0.28))*3;T.lean=Math.sin(R.frame*0.28)*0.03;}
 else{

 }

 if(now()<R.blinkUntil)T.eyeOpen=0.05;

function updateBrain(dt){
 R.secAcc+=dt;
 if(R.state==='eat'){R.eatT-=dt;if(R.eatT<=0){R.state='idle';}}
 if(R.state==='watch'){R.watchT-=dt;S.mood=clamp(S.mood+dt*1.6,0,100);if(R.watchT<=0){R.state='idle';speak('Классный фильм про птичек! 📺');save();}}
 if(R.state==='squat'){R.squatT-=dt;if(R.squatT<=0){doPoop();R.state='idle';R.pendingPoop=false;}}
 if(R.state==='walk'&&R.walkTo!=null){
  var dir=R.walkTo>R.catX?1:-1;var spd=(belly()>78?55:95)*SC;
  R.catX+=dir*spd*dt;
  if(Math.abs(R.catX-R.walkTo)<6){R.catX=R.walkTo;R.walkTo=null;
   if(R.pendingPoop){R.state='squat';R.squatT=1.4;}else R.state='idle';}
 }
 if(R.secAcc>=1){
  var secs=R.secAcc;R.secAcc=0;
  var expired=false;
  for(var i=S.meals.length-1;i>=0;i--){var m=S.meals[i];if((m.start+m.dur*1000)<=now()){S.meals.splice(i,1);expired=true;}}
  recomputeStomach();
  if(expired&&R.state!=='sleep'&&!R.mg&&!R.pendingPoop)schedulePoop();
  S.hunger=clamp(S.hunger-secs*0.05,0,100);
  S.mood=clamp(S.mood-secs*(S.piles.length?0.09:0.04),0,100);
  if(R.state==='sleep'){S.energy=clamp(S.energy+secs*1.4,0,100);if(S.energy>=100){wake(true);}}
  else S.energy=clamp(S.energy-secs*0.035,0,100);
  S.wet=clamp(S.wet-secs*0.01,0,100);
  if(hygiene()<45&&Math.random()<0.02)addDirt('body');
  if(S.hunger<12||hygiene()<15||S.piles.length>=4||belly()>88)S.health=clamp(S.health-secs*0.12,0,100);
  else if(S.hunger>45&&hygiene()>55&&belly()<70)S.health=clamp(S.health+secs*0.08,0,100);
  if(S.wish&&now()>S.wish.until){S.wish=null;S.mood=clamp(S.mood-4,0,100);S.nextWish=now()+randi(25000,50000);renderWish();save();}
  if(!S.wish&&now()>S.nextWish&&!R.mg)wishNew();
  if(now()>R.nextTalk&&!R.mg){R.nextTalk=now()+randi(26000,52000);var line=contextLine();if(line!==R.lastTalk){R.lastTalk=line;speak(line);}}
  var h=new Date().getHours();var night=(h<7||h>=20);
  if(night!==R.night){R.night=night;CACHE.key='';}
  save();renderStats();renderWish();
 }
}

    else{collectGame(g);var id=g.id;R.mg=null;startGame(id,true);}
   }
   return;
  }
  if(g.id==='mice'){
   var ms=g.data.mice;
   for(var i=ms.length-1;i>=0;i--){var m=ms[i];
    if(Math.hypot(x-m.x,y-m.y)<26){ms.splice(i,1);g.score++;SFX.squeak();for(var p=0;p<4;p++)part(m.x,m.y,'spark');floatText('+1',m.x,m.y-16,'#5fe3b3');return;}}
   ms.forEach(function(m2){var d=Math.hypot(x-m2.x,y-m2.y);if(d<120){var a=Math.atan2(m2.y-y,m2.x-x);m2.vx+=Math.cos(a)*260;m2.vy+=Math.sin(a)*260;}});
  }
  else if(g.id==='fish'){
   var d2=g.data;d2.round++;
   var dist=Math.abs(d2.pos-d2.zone);
   if(dist<d2.zw/2){var perfect=dist<d2.zw/6;d2.hits++;if(perfect){d2.perfect++;g.score+=3;d2.msg='ИДЕАЛЬНО! +3';}else{g.score+=1;d2.msg='Поймал! +1';}SFX.coin();for(var pp=0;pp<5;pp++)part(CW*d2.pos,CH*0.42,'drop');}
   else{d2.msg='Мимо… 🐟';SFX.lose();}
   d2.flash=0.5;d2.zone=rand(0.15,0.85);d2.speed*=1.05;
   if(d2.round>=10)g.done=true;
  }
  else if(g.id==='memory'){
   var d3=g.data;if(d3.lock)return;
   var geo=memGeo(d3);
   var col=Math.floor((x-geo.x)/geo.cw),row=Math.floor((y-geo.y)/geo.ch);
   if(col<0||col>=d3.cols||row<0||row>=d3.rows)return;
   var idx=row*d3.cols+col;if(idx>=d3.cards.length)return;
   var card=d3.cards[idx];if(card.open||card.done)return;
   card.open=true;SFX.click();
   if(d3.first==null){d3.first=idx;}
   else{d3.moves++;var firstIdx=d3.first;var a2=d3.cards[firstIdx];
    if(a2.ic===card.ic){a2.done=true;card.done=true;d3.found++;SFX.pop();g.score+=2;
     if(d3.found>=d3.pairs){g.done=true;g.score+=Math.max(0,24-d3.moves);}
    }else{d3.lock=true;setTimeout(function(){if(R.mg&&R.mg.data&&R.mg.data.cards){a2.open=false;card.open=false;d3.lock=false;}},650);}
    d3.first=null;}
  }
  else if(g.id==='bubbles'){
   var bs=g.data.b;
   for(var bi=bs.length-1;bi>=0;bi--){var b=bs[bi];
    if(Math.hypot(x-b.x,y-b.y)<b.r+8){
     bs.splice(bi,1);
     if(b.kind==='dark'){g.score=Math.max(0,g.score-2);g.data.combo=0;SFX.lose();floatText('-2',b.x,b.y,'#ff5d5d');}
     else{g.data.combo++;var val=b.kind==='gold'?5:1;g.score+=val;SFX.pop();for(var bp=0;bp<4;bp++)part(b.x,b.y,'foam');floatText('+'+val+(g.data.combo>4?' 🔥':''),b.x,b.y,b.kind==='gold'?'#ffd166':'#7fd8ff');}
     return;}}
   g.data.combo=0;
  }
 }catch(err){ toast('Ошибка игры: '+err.message); }
}
function memGeo(d){
 var pad=14,availW=CW-pad*2,availH=CH*0.72;
 var cw=Math.min(availW/d.cols,availH/d.rows,96),ch=cw*1.15;
 var x=(CW-cw*d.cols)/2,y=CH*0.14;
 return{x:x,y:y,cw:cw,ch:ch};
}
function updateGame(dt){
 var g=R.mg;if(!g||g.done)return;
 if(g.id==='mice'||g.id==='bubbles')g.t-=dt;
 if(g.id==='mice'){
  var d=g.data;d.spawn-=dt;
  if(d.spawn<=0&&d.mice.length<3+Math.min(2,S.level/4)){d.spawn=rand(0.5,1.1);
   var edge=randi(0,1);d.mice.push({x:edge?rand(30,CW-30):(Math.random()<0.5?-20:CW+20),y:edge?(Math.random()<0.5?CH*0.2:CH*0.85):rand(CH*0.25,CH*0.8),vx:rand(-60,60),vy:rand(-60,60),ph:rand(0,6)});}
  d.mice.forEach(function(m){
   m.ph+=dt*10;
   m.vx+=rand(-1,1)*140*dt*d.speed;m.vy+=rand(-1,1)*140*dt*d.speed;
   var sp=Math.hypot(m.vx,m.vy),max=150*d.speed;
   if(sp>max){m.vx*=max/sp;m.vy*=max/sp;}
   m.x+=m.vx*dt;m.y+=m.vy*dt;
   if(m.x<16){m.x=16;m.vx=Math.abs(m.vx);}if(m.x>CW-16){m.x=CW-16;m.vx=-Math.abs(m.vx);}
   if(m.y<CH*0.16){m.y=CH*0.16;m.vy=Math.abs(m.vy);}if(m.y>CH-16){m.y=CH-16;m.vy=-Math.abs(m.vy);}
  });
  if(g.t<=0)g.done=true;
 }
 else if(g.id==='fish'){
  var d2=g.data;d2.pos+=d2.dir*d2.speed*dt*0.55;
  if(d2.pos>1){d2.pos=1;d2.dir=-1;}if(d2.pos<0){d2.pos=0;d2.dir=1;}
  d2.flash=Math.max(0,d2.flash-dt);
 }
 else if(g.id==='memory'){g.data.cards.forEach(function(cd){cd.flip=lerp(cd.flip,(cd.open||cd.done)?1:0,clamp(dt*10,0,1));});}
 else if(g.id==='bubbles'){
  var d3=g.data;d3.spawn-=dt;
  if(d3.spawn<=0){d3.spawn=rand(0.25,0.5)/d3.speed;
   var kind=Math.random()<0.08?'gold':(Math.random()<0.16?'dark':'norm');
   d3.b.push({x:rand(24,CW-24),y:CH+20,r:kind==='gold'?rand(14,20):rand(16,30),vy:rand(60,110)*d3.speed,ph:rand(0,6),kind:kind});}
  for(var i=d3.b.length-1;i>=0;i--){var b=d3.b[i];b.ph+=dt*3;b.y-=b.vy*dt;b.x+=Math.sin(b.ph)*24*dt;if(b.y<-30)d3.b.splice(i,1);}
  if(g.t<=0)g.done=true;
 }
}

function calcRewards(g){
 var coins=Math.round(g.score*(g.id==='memory'?2.5:3));
 var xp=Math.round(g.score*1.5)+5;
 var res=null;
 if(g.score>0){var pool=GAME_DEFS[g.id].res;res={k:pick(pool),n:1+(g.score>=15?1:0)+(g.score>=30?1:0)};}
 return{coins:coins,xp:xp,res:res};
}
function applyGameRewards(){
 var g=R.mg;if(!g)return;
 var rew=calcRewards(g);
 addCoins(rew.coins);addXP(rew.xp);
 if(rew.res)addRes(rew.res.k,rew.res.n);
 if(g.score>(S.best[g.id]||0))S.best[g.id]=g.score;
 S.mood=clamp(S.mood+Math.min(14,g.score),0,100);

 speak('Вот это игра! Ещё бы разок! 🎮');
 save();renderStats();renderToolbar();
}

CV.addEventListener('pointermove',function(e){
 if(!R.pointer.down)return;
 var p=ptr(e);R.pointer.x=p.x;R.pointer.y=p.y;
 if(R.mg||modalOpen)return;
 var t=now();
 if(S.tool==='hand'){var s=SC;if(Math.hypot(p.x-R.catX,p.y-(FLOOR-100*s))<100*s)petTick(p.x,p.y);}
 else if(S.tool==='sponge'||S.tool==='shower'||S.tool==='towel'){if(t-lastWash>40){lastWash=t;washMove(p.x,p.y);}}
 else if(S.tool==='scoop')scoopAt(p.x,p.y);
},{passive:true});
window.addEventListener('pointerup',function(){R.pointer.down=false;R.petStreak=0;if(R.state==='wash'&&(now()-R.stateT)>400)R.state='idle';});
CV.addEventListener('pointercancel',function(){R.pointer.down=false;});
window.addEventListener('keydown',function(e){
 if(e.key==='Escape'){if(R.mg)finishGame(true);else if(modalOpen)closeModal();}
});
document.addEventListener('visibilitychange',function(){R.lastTS=0;});
$('navShop').onclick=function(){SFX.click();openShop();};
$('navWard').onclick=function(){SFX.click();openWard();};
$('navGames').onclick=function(){SFX.click();openGames();};
$('navFurn').onclick=function(){SFX.click();openFurn();};
$('navChat').onclick=function(){SFX.click();openChat();};
$('btnDaily').onclick=function(){SFX.click();claimDaily();};
$('btnMusic').onclick=function(){S.music=!S.music;if(S.music&&A.ctx)MU.next=A.ctx.currentTime+0.1;SFX.click();save();toast(S.music?'🎵 Музыка играет':'Музыка выключена');};
$('btnSound').onclick=function(){S.sound=!S.sound;A.on=S.sound;if(A.master)A.master.gain.value=S.sound?0.5:0;SFX.click();save();};
$('btnSettings').onclick=function(){SFX.click();openSettings();};
/* ============ LOOP ============ */
function loop(ts){
 requestAnimationFrame(loop);
 try{
  if(!R.lastTS)R.lastTS=ts;
  var dt=clamp((ts-R.lastTS)/1000,0,0.05);R.lastTS=ts;
  R.frame++;
  if(CW<10||CH<10)resize();
  updateBrain(dt);setTargets();updatePose(dt);
  updateFlies(dt);updateButterflies(dt);updateParticles(dt);
  if(R.mg)updateGame(dt);
  CX.setTransform(DPR,0,0,DPR,0,0);
  CX.clearRect(0,0,CW,CH);
  if(R.mg){drawGame();drawParticles();if(R.frame===3)bootHide();return;}
  buildCache();
  CX.drawImage(CACHE.cv,0,0,CW,CH);
  if(R.state==='watch'){R.placed.forEach(function(pl){if(pl.f.id==='tv'){CX.fillStyle='rgba(127,216,255,'+(0.15+Math.random()*0.25)+')';CX.fillRect(pl.x-32*pl.s,pl.y-64*pl.s,64*pl.s,36*pl.s);}});}
  drawButterflies();
  drawPiles();
  drawCat();
  drawParticles();
  drawSpeech();
  if(R.pointer.down&&(S.tool==='sponge'||S.tool==='shower'||S.tool==='towel'||S.tool==='scoop')){
   CX.font='20px serif';CX.textAlign='center';
   var ic=S.tool==='sponge'?'🧽':S.tool==='shower'?'🚿':S.tool==='towel'?'🧻':'🧹';
   CX.fillText(ic,R.pointer.x,R.pointer.y-8);CX.textAlign='left';
  }
  if(R.frame===3)bootHide();
 }catch(err){ showFatal(err); }
}
/* ============ INIT ============ */
boot('инициализация интерфейса');
A.on=S.sound;
resize();
boot('canvas '+CW+'x'+CH);
R.catX=CW/2;
var h0=new Date().getHours();R.night=(h0<7||h0>=20);
if(!S.nextWish)S.nextWish=now()+15000;
R.flies=[];
renderHUD();renderStats();renderTabs();renderToolbar();renderWish();
ensureButterflies();
boot('первый кадр');
speak(pick(LINES.greet).replace('{name}',userName()),true);
requestAnimationFrame(loop);
setTimeout(function(){var b=document.getElementById('boot');if(b&&b.parentNode){boot('ЗАВИС: '+BOOTLOG[BOOTLOG.length-1]);b.querySelector('.st').innerHTML+='<br><br>Если это видно дольше 5 секунд — пришли скрин разработчику.';}},5000);
} /* end main */
})();
</script>
</body>
