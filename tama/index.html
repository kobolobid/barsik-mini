<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#111420">
  <title>Barsik Tamagotchi</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root {
      --bg: #111420;
      --panel: #1b2030;
      --panel2: #20263a;
      --text: #e9edf5;
      --muted: #9aa3b2;
      --accent: #5ac8fa;
      --danger: #ff5a5a;
      --warn: #ffdc50;
      --good: #64e678;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      overscroll-behavior: none;
    }

    .fatal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 99;
      background: #111;
      color: #fff;
      padding: 16px;
      white-space: pre-wrap;
      font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      overflow: auto;
    }

    .wrap {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding:
        max(8px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        max(8px, env(safe-area-inset-bottom))
        max(8px, env(safe-area-inset-left));
      overscroll-behavior: none;
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
    }

    .title {
      font-size: 18px;
      font-weight: 900;
    }

    .sub {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      max-width: 62vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chips {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      flex: 0 0 auto;
    }

    .chip {
      background: var(--panel);
      border: 1px solid #2a3145;
      border-radius: 12px;
      padding: 7px 6px;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.2;
    }

    .chip b {
      display: block;
      margin-top: 2px;
      font-size: 15px;
      color: var(--text);
    }

    .stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 220px;
      border-radius: 18px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 35%, rgba(90,200,250,.16), transparent 38%),
        linear-gradient(180deg, #151a2a, #0f1320);
      border: 1px solid #2a3145;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 0 40px rgba(0,0,0,.25);
    }

    #fx {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    #pet {
      position: relative;
      z-index: 2;
      font-size: clamp(86px, 25vw, 142px);
      line-height: 1;
      filter: drop-shadow(0 12px 24px rgba(0,0,0,.35));
      animation: idle 3s ease-in-out infinite;
      user-select: none;
      -webkit-user-select: none;
    }

    #pet.eat {
      animation: eat .6s ease;
    }

    #pet.happy {
      animation: happy .7s ease;
    }

    #pet.sick {
      animation: sick 1.1s ease-in-out infinite;
      filter: grayscale(.45) drop-shadow(0 10px 20px rgba(255,90,90,.18));
    }

    #pet.sleep {
      animation: sleep 3s ease-in-out infinite;
      opacity: .86;
    }

    #pet.dead {
      animation: none;
      filter: grayscale(1);
      opacity: .75;
    }

    #speech {
      position: absolute;
      z-index: 3;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 82%;
      padding: 7px 11px;
      border-radius: 14px;
      background: rgba(249,246,242,.92);
      color: #222;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      opacity: 0;
      transition: opacity .18s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,.18);
    }

    #speech.show {
      opacity: 1;
    }

    #mood {
      position: absolute;
      z-index: 3;
      bottom: 10px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      padding: 0 10px;
    }

    .p {
      position: absolute;
      bottom: 24%;
      font-size: 24px;
      opacity: 0;
      animation: floatUp 1.25s ease-out forwards;
      pointer-events: none;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,.25));
    }

    @keyframes idle {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.02); }
    }

    @keyframes eat {
      0% { transform: scale(1) rotate(0); }
      35% { transform: scale(1.16) rotate(-7deg); }
      70% { transform: scale(.96) rotate(5deg); }
      100% { transform: scale(1) rotate(0); }
    }

    @keyframes happy {
      0% { transform: translateY(0) scale(1); }
      28% { transform: translateY(-20px) scale(1.09); }
      58% { transform: translateY(0) scale(.95); }
      78% { transform: translateY(-8px) scale(1.03); }
      100% { transform: translateY(0) scale(1); }
    }

    @keyframes sick {
      0%, 100% { transform: translateX(0) rotate(0); }
      25% { transform: translateX(-5px) rotate(-3deg); }
      75% { transform: translateX(5px) rotate(3deg); }
    }

    @keyframes sleep {
      0%, 100% { transform: scale(1) translateY(0); }
      50% { transform: scale(1.045) translateY(-3px); }
    }

    @keyframes floatUp {
      0% { opacity: 0; transform: translateY(16px) scale(.72); }
      18% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-120px) scale(1.18); }
    }

    .bars {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      flex: 0 0 auto;
    }

    .stat {
      background: var(--panel);
      border: 1px solid #2a3145;
      border-radius: 12px;
      padding: 7px 8px;
      font-size: 11px;
      color: var(--muted);
    }

    .stat span {
      display: flex;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 5px;
    }

    .bar {
      height: 9px;
      border-radius: 999px;
      background: #0d1018;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.05);
    }

    .bar i {
      display: block;
      height: 100%;
      width: 0%;
      border-radius: 999px;
      transition: width .22s ease;
    }

    #bHunger { background: #f65e3b; }
    #bHappy { background: #edc22e; }
    #bEnergy { background: #5ac8fa; }
    #bClean { background: #64e678; }
    #bHealth { background: #ff5a5a; }
    #bXp { background: #be64ff; }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      flex: 0 0 auto;
    }

    button {
      appearance: none;
      border: 1px solid #303850;
      border-radius: 14px;
      background: linear-gradient(180deg, #252c40, #1e2435);
      color: var(--text);
      font-size: 13px;
      font-weight: 800;
      line-height: 1.1;
      min-height: 46px;
      height: 46px;
      padding: 0 8px;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    button:active {
      transform: scale(.97);
      background: #313a55;
      border-color: #4a5575;
    }

    button.primary {
      background: linear-gradient(180deg, #2b78c8, #1f5ea0);
      border-color: #3b8ee0;
    }

    button.secondary {
      background: linear-gradient(180deg, #3a3f55, #2b3045);
    }

    button.danger {
      background: linear-gradient(180deg, #a33b3b, #7c2b2b);
      border-color: #d05555;
    }

    .footer {
      display: grid;
      grid-template-columns: 1.4fr 1fr 1fr;
      gap: 6px;
      flex: 0 0 auto;
    }

    @media (max-height: 760px) {
      .stage { min-height: 180px; }
      #pet { font-size: clamp(72px, 21vw, 112px); }
      button { min-height: 42px; height: 42px; font-size: 12px; }
      .stat { padding: 6px; font-size: 10px; }
    }

    @media (min-width: 760px) {
      .wrap {
        max-width: 760px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <div id="fatal" class="fatal"></div>

  <div class="wrap">
    <div class="top">
      <div>
        <div class="title">🐾 Барсик Тамагочи</div>
        <div class="sub" id="uname">Игрок</div>
      </div>
      <div class="sub" id="status">▶ Бодрствует</div>
    </div>

    <div class="chips">
      <div class="chip">⭐ Уровень<b id="level">1</b></div>
      <div class="chip">🪙 Монеты<b id="coins">50</b></div>
      <div class="chip">🎮 Игры<b id="minigames">0</b></div>
    </div>

    <div class="stage">
      <div id="fx"></div>
      <div id="speech">Мяу!</div>
      <div id="pet">🐱</div>
      <div id="mood">😊 Хорошее настроение</div>
    </div>

    <div class="bars">
      <div class="stat"><span>🍖 Сытость <b id="vHunger">80%</b></span><div class="bar"><i id="bHunger"></i></div></div>
      <div class="stat"><span>😊 Счастье <b id="vHappy">70%</b></span><div class="bar"><i id="bHappy"></i></div></div>
      <div class="stat"><span>⚡ Энергия <b id="vEnergy">90%</b></span><div class="bar"><i id="bEnergy"></i></div></div>
      <div class="stat"><span>🧼 Чистота <b id="vClean">85%</b></span><div class="bar"><i id="bClean"></i></div></div>
      <div class="stat"><span>❤️ Здоровье <b id="vHealth">100%</b></span><div class="bar"><i id="bHealth"></i></div></div>
      <div class="stat"><span>⭐ XP <b id="vXp">0/100</b></span><div class="bar"><i id="bXp"></i></div></div>
    </div>

    <div class="actions">
      <button type="button" id="feed">🍖 Кормить</button>
      <button type="button" id="play">🎾 Играть</button>
      <button type="button" id="sleep">😴 Сон</button>
      <button type="button" id="clean">🧹 Убрать</button>
      <button type="button" id="heal">💊 Лечить 20🪙</button>
      <button type="button" id="game">🎮 Миниигра</button>
      <button type="button" id="daily">🎁 Бонус дня</button>
      <button type="button" id="poop">💩 Проверить</button>
    </div>

    <div class="footer">
      <button type="button" class="primary" id="save">📤 Сохранить в боте</button>
      <button type="button" class="secondary" id="new">🔄 Новый</button>
      <button type="button" class="danger" id="close">✖ Закрыть</button>
    </div>
  </div>

  <script>
    function showFatal(err) {
      var el = document.getElementById('fatal');
      if (!el) {
        el = document.createElement('div');
        el.id = 'fatal';
        el.className = 'fatal';
        document.body.appendChild(el);
      }
      el.style.display = 'block';
      el.textContent =
        'Ошибка запуска тамагочи:\n\n' +
        (err && err.stack ? err.stack : String(err));
    }

    window.onerror = function (message, source, lineno, colno, error) {
      showFatal(error || (message + ' @ ' + lineno + ':' + colno));
    };

    (function () {
      try {
        var tg = null;
        if (window.Telegram && window.Telegram.WebApp) {
          tg = window.Telegram.WebApp;
        }

        if (tg) {
          try {
            tg.ready();
            tg.expand();

            if (tg.setHeaderColor) tg.setHeaderColor('#111420');
            if (tg.setBackgroundColor) tg.setBackgroundColor('#111420');
            if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
          } catch (e) {}

          setTimeout(function () {
            try { tg.expand(); } catch (e) {}
          }, 300);
        }

        function $(id) {
          return document.getElementById(id);
        }

        function getUserId() {
          try {
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.id) {
              return String(tg.initDataUnsafe.user.id);
            }
          } catch (e) {}
          return 'local';
        }

        function getUserName() {
          try {
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.first_name) {
              return String(tg.initDataUnsafe.user.first_name);
            }
          } catch (e) {}
          return 'Игрок';
        }

        var UID = getUserId();
        var KEY = 'barsiktama_' + UID;

        function defaultState() {
          return {
            name: getUserName(),
            hunger: 80,
            happiness: 70,
            energy: 90,
            cleanliness: 85,
            health: 100,
            coins: 50,
            xp: 0,
            level: 1,
            poop: 0,
            sleeping: false,
            dead: false,
            totalFeeds: 0,
            totalPlays: 0,
            totalMinigames: 0,
            lastDaily: 0,
            lastTick: Date.now(),
            bornAt: Date.now()
          };
        }

        function normalize(s) {
          var d = defaultState();
          for (var k in d) {
            if (typeof s[k] === 'undefined' || s[k] === null) {
              s[k] = d[k];
            }
          }
          return s;
        }

        function loadState() {
          try {
            var raw = localStorage.getItem(KEY);
            if (!raw) return defaultState();
            return normalize(JSON.parse(raw));
          } catch (e) {
            return defaultState();
          }
        }

        function saveLocal() {
          try {
            localStorage.setItem(KEY, JSON.stringify(state));
          } catch (e) {}
        }

        var state = loadState();

        function clamp(v, min, max) {
          if (typeof min === 'undefined') min = 0;
          if (typeof max === 'undefined') max = 100;
          v = Number(v || 0);
          if (v < min) return min;
          if (v > max) return max;
          return v;
        }

        function updateLevel() {
          state.level = 1 + Math.floor(state.xp / 100);
        }

        function addXp(n) {
          state.xp += Math.max(0, Math.floor(n || 0));
          updateLevel();
        }

        var speechTimer = null;

        function say(text) {
          var el = $('speech');
          el.textContent = text;
          el.classList.add('show');
          clearTimeout(speechTimer);
          speechTimer = setTimeout(function () {
            el.classList.remove('show');
          }, 1900);
        }

        function burst(emoji, count) {
          var fx = $('fx');
          count = count || 6;

          for (var i = 0; i < count; i++) {
            var el = document.createElement('div');
            el.className = 'p';
            el.textContent = emoji;
            el.style.left = (18 + Math.random() * 64) + '%';
            el.style.animationDuration = (0.9 + Math.random() * 0.7) + 's';
            el.style.animationDelay = (Math.random() * 0.18) + 's';
            fx.appendChild(el);

            (function (node) {
              setTimeout(function () {
                if (node && node.parentNode) node.parentNode.removeChild(node);
              }, 1700);
            })(el);
          }
        }

        function setPetAnim(cls, emoji, text, ms) {
          var pet = $('pet');

          if (emoji) pet.textContent = emoji;

          pet.classList.remove('eat', 'happy', 'sick', 'sleep', 'dead');
          void pet.offsetWidth;

          if (cls) pet.classList.add(cls);
          if (text) say(text);

          setTimeout(render, ms || 750);
        }

        function petEmoji() {
          if (state.dead) return '💀';
          if (state.sleeping) return '😴';
          if (state.health < 30) return '🤒';
          if (state.hunger < 25) return '🙀';
          if (state.cleanliness < 25 || state.poop >= 3) return '😾';
          if (state.happiness > 88) return '😻';
          if (state.happiness > 72) return '😸';
          if (state.happiness > 54) return '😺';
          if (state.happiness > 34) return '🐱';
          return '😿';
        }

        function moodText() {
          if (state.dead) return '💀 Питомец ушёл...';
          if (state.sleeping) return '💤 Спит и восстанавливает энергию';
          if (state.health < 30) return '🤒 Болен. Нужна аптечка.';
          if (state.hunger < 25) return '🙀 Очень голоден.';
          if (state.cleanliness < 25 || state.poop >= 3) return '😾 Грязно. Убери 💩.';
          if (state.happiness > 88) return '😻 Счастлив и сияет.';
          if (state.happiness > 72) return '😸 Мурлычет от удовольствия.';
          if (state.happiness > 54) return '😊 Хорошее настроение.';
          if (state.happiness > 34) return '😐 Скучает немного.';
          return '😿 Грустит.';
        }

        function statusText() {
          if (state.dead) return '💀 Game over';
          if (state.sleeping) return '😴 Спит';
          if (state.health < 35) return '🤒 Болен';
          if (state.poop >= 3) return '💩 Грязно';
          if (state.hunger < 25) return '🍖 Голоден';
          return '▶ Бодрствует';
        }

        function setBar(barId, value) {
          $(barId).style.width = clamp(value) + '%';
        }

        function render() {
          $('uname').textContent = state.name || 'Игрок';
          $('status').textContent = statusText();
          $('level').textContent = state.level;
          $('coins').textContent = Math.floor(state.coins);
          $('minigames').textContent = state.totalMinigames;

          $('vHunger').textContent = Math.round(state.hunger) + '%';
          $('vHappy').textContent = Math.round(state.happiness) + '%';
          $('vEnergy').textContent = Math.round(state.energy) + '%';
          $('vClean').textContent = Math.round(state.cleanliness) + '%';
          $('vHealth').textContent = Math.round(state.health) + '%';

          var xpIn = state.xp % 100;
          $('vXp').textContent = xpIn + '/100';

          setBar('bHunger', state.hunger);
          setBar('bHappy', state.happiness);
          setBar('bEnergy', state.energy);
          setBar('bClean', state.cleanliness);
          setBar('bHealth', state.health);
          setBar('bXp', xpIn);

          var pet = $('pet');
          pet.textContent = petEmoji();
          pet.classList.remove('eat', 'happy', 'sick', 'sleep', 'dead');

          if (state.dead) pet.classList.add('dead');
          else if (state.sleeping) pet.classList.add('sleep');
          else if (state.health < 35) pet.classList.add('sick');

          $('mood').textContent = moodText();
        }

        function tick() {
          if (state.dead) {
            state.lastTick = Date.now();
            render();
            return;
          }

          var now = Date.now();
          var dt = (now - (state.lastTick || now)) / 1000;

          if (dt < 0) dt = 0;
          if (dt > 3600) dt = 3600;

          state.lastTick = now;

          if (state.sleeping) {
            state.energy = clamp(state.energy + dt * 0.09);
            state.hunger = clamp(state.hunger - dt * 0.006);
            state.happiness = clamp(state.happiness - dt * 0.002);

            if (state.energy >= 100) {
              state.sleeping = false;
              say('Выспался! ☀️');
              burst('☀️', 5);
            }
          } else {
            state.hunger = clamp(state.hunger - dt * 0.025);
            state.happiness = clamp(state.happiness - dt * 0.018);
            state.energy = clamp(state.energy - dt * 0.012);
            state.cleanliness = clamp(state.cleanliness - dt * 0.010);

            if (Math.random() < dt * 0.004 && state.hunger < 75) {
              state.poop = Math.min(6, state.poop + 1);
            }
          }

          if (state.poop >= 3) {
            state.health = clamp(state.health - dt * 0.030);
          }

          if (state.hunger <= 0) {
            state.health = clamp(state.health - dt * 0.060);
          }

          if (state.happiness <= 10) {
            state.health = clamp(state.health - dt * 0.012);
          }

          if (state.hunger > 50 && state.cleanliness > 50 && state.happiness > 50) {
            state.health = clamp(state.health + dt * 0.008);
          }

          if (state.health <= 0) {
            state.health = 0;
            state.dead = true;
            state.sleeping = false;
            say('Питомец умер... 💀');
            burst('🪦', 4);
          }

          saveLocal();
          render();
        }

        function canAct() {
          if (state.dead) {
            say('Уже поздно. Нажми 🔄 Новый.');
            return false;
          }

          if (state.sleeping) {
            say('Он спит. Разбуди кнопкой 😴.');
            return false;
          }

          return true;
        }

        function feed() {
          if (state.dead) {
            say('Питомец умер...');
            return;
          }

          if (state.sleeping) {
            state.sleeping = false;
            say('Разбудил кормёжкой!');
            render();
          }

          state.hunger = clamp(state.hunger + 18);
          state.happiness = clamp(state.happiness + 4);
          state.poop = Math.min(6, state.poop + 1);
          state.totalFeeds += 1;
          addXp(5);

          setPetAnim('eat', '😋', 'Ням! 🍖', 650);
          burst('🍖', 7);

          setTimeout(function () {
            burst('💩', 1);
            saveLocal();
            render();
          }, 720);
        }

        function play() {
          if (!canAct()) return;

          if (state.energy < 12) {
            say('Слишком устал для игр 😿');
            return;
          }

          state.happiness = clamp(state.happiness + 14);
          state.energy = clamp(state.energy - 10);
          state.cleanliness = clamp(state.cleanliness - 4);
          state.coins += 2;
          state.totalPlays += 1;
          addXp(8);

          setPetAnim('happy', '😸', 'Мур! 🎾', 700);
          burst('🎾', 8);
          saveLocal();
        }

        function toggleSleep() {
          if (state.dead) {
            say('Уже поздно...');
            return;
          }

          state.sleeping = !state.sleeping;

          if (state.sleeping) {
            setPetAnim('sleep', '😴', 'Сладких снов... 💤', 900);
            burst('💤', 4);
          } else {
            setPetAnim('happy', '😺', 'Проснулся! ☀️', 550);
            burst('☀️', 4);
          }

          saveLocal();
          render();
        }

        function clean() {
          if (!canAct()) return;

          if (state.poop === 0 && state.cleanliness > 92) {
            say('Уже чисто! 🧼');
            return;
          }

          state.poop = 0;
          state.cleanliness = clamp(state.cleanliness + 25);
          addXp(4);

          setPetAnim('happy', '😺', 'Чисто! 🧹', 650);
          burst('🧹', 6);
          saveLocal();
        }

        function heal() {
          if (state.dead) {
            say('Аптечка уже не поможет... 💀');
            return;
          }

          if (state.health >= 100) {
            say('Здоровье уже полное ❤️');
            return;
          }

          if (state.coins < 20) {
            say('Нужно 20 🪙. Сыграй миниигру.');
            return;
          }

          state.coins -= 20;
          state.health = clamp(state.health + 32);
          addXp(6);

          setPetAnim('happy', '😺', 'Лечусь! 💊', 650);
          burst('💊', 6);
          saveLocal();
        }

        function minigame() {
          if (!canAct()) return;

          if (state.energy < 8) {
            say('Устал для миниигры 😿');
            return;
          }

          var win = Math.floor(Math.random() * 21) + 5;

          state.coins += win;
          state.energy = clamp(state.energy - 6);
          state.happiness = clamp(state.happiness + 3);
          state.totalMinigames += 1;
          addXp(7);

          setPetAnim('happy', '😸', 'Победа! +' + win + ' 🪙', 700);
          burst('🪙', 9);
          saveLocal();
        }

        function daily() {
          if (state.dead) {
            say('Питомец умер...');
            return;
          }

          var now = Date.now();
          var cooldown = 20 * 60 * 60 * 1000;

          if (state.lastDaily && now - state.lastDaily < cooldown) {
            var left = Math.ceil((cooldown - (now - state.lastDaily)) / (60 * 60 * 1000));
            say('Бонус будет через ' + left + ' ч.');
            return;
          }

          state.coins += 50;
          state.lastDaily = now;
          addXp(3);

          setPetAnim('happy', '😻', 'Бонус дня +50 🪙', 700);
          burst('🎁', 8);
          saveLocal();
        }

        function checkPoop() {
          if (state.dead) {
            say('Уже поздно...');
            return;
          }

          if (state.poop > 0) {
            say('Кучек: ' + state.poop + ' 💩. Нужно убрать!');
            burst('💩', Math.min(5, state.poop));
          } else {
            say('Кучек нет. Чисто! 🧼');
          }
        }

        function newPet() {
          state = defaultState();
          state.name = getUserName();
          saveLocal();
          render();
          say('Новый питомец появился! 🐣');
          burst('🐣', 6);
        }

        function sendToBot() {
          updateLevel();

          var payload = {
            game: 'tama',
            action: 'save',
            name: state.name || 'Игрок',
            level: state.level,
            coins: Math.floor(state.coins),
            happiness: Math.round(state.happiness),
            health: Math.round(state.health),
            hunger: Math.round(state.hunger),
            energy: Math.round(state.energy),
            cleanliness: Math.round(state.cleanliness),
            poop: state.poop,
            dead: !!state.dead,
            sleeping: !!state.sleeping,
            state: state
          };

          if (tg && tg.sendData) {
            tg.sendData(JSON.stringify(payload));
          } else {
            alert('Сохранение в бота доступно только внутри Telegram Mini App.');
          }
        }

        function closeApp() {
          if (tg && tg.close) {
            try { tg.close(); } catch (e) {}
          }
        }

        function bindPress(id, fn) {
          var el = $(id);
          if (!el) return;

          var lockUntil = 0;

          function fire(e) {
            var now = Date.now();
            if (now < lockUntil) return;
            lockUntil = now + 120;

            if (e && e.preventDefault) e.preventDefault();

            try {
              fn();
            } catch (err) {
              showFatal(err);
            }
          }

          el.addEventListener('pointerdown', fire);
          el.addEventListener('touchstart', fire, { passive: false });
          el.addEventListener('click', fire);
        }

        bindPress('feed', feed);
        bindPress('play', play);
        bindPress('sleep', toggleSleep);
        bindPress('clean', clean);
        bindPress('heal', heal);
        bindPress('game', minigame);
        bindPress('daily', daily);
        bindPress('poop', checkPoop);
        bindPress('save', sendToBot);
        bindPress('new', newPet);
        bindPress('close', closeApp);

        window.addEventListener('resize', function () {
          if (tg && tg.expand) {
            try { tg.expand(); } catch (e) {}
          }
        });

        updateLevel();
        render();
        setInterval(tick, 1000);

        setTimeout(function () {
          say('Покорми меня и поиграй! 🐾');
        }, 700);
      } catch (err) {
        showFatal(err);
      }
    })();
  </script>
</body>
</html>
