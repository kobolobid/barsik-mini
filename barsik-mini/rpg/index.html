<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Barsik RPG — Легенды Снежного Края</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0a0f1e;--panel:#141b33;--line:#2b3a66;--text:#eef2ff;--muted:#93a0c4;--gold:#ffd166;--grn:#39ff8e;--red:#ff5d5d;--ice:#7fd8ff;--vio:#b48bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:linear-gradient(180deg,#0d1226,#0a0f1e);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;user-select:none;touch-action:manipulation;overscroll-behavior:none}
.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;width:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);gap:5px}
::-webkit-scrollbar{width:8px}::-webkit-scrollbar-track{background:#0a0f1e}::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--ice),var(--vio));border-radius:6px}
.hud{display:flex;align-items:center;gap:6px;padding:6px 8px;background:linear-gradient(135deg,#1c2444,#141b33);border:1px solid var(--line);border-radius:13px;flex-wrap:wrap}
.who{font-weight:900;font-size:12px;color:var(--gold);white-space:nowrap}
.bars{flex:1;min-width:120px;display:flex;flex-direction:column;gap:3px}
.bar{height:9px;border-radius:6px;background:#0a0f22;border:1px solid #202a4d;overflow:hidden;position:relative}
.bar i{display:block;height:100%;transition:width .3s;border-radius:6px}
.bar.hp i{background:linear-gradient(90deg,#ff5d5d,#ff9d9d)}
.bar.en i{background:linear-gradient(90deg,#1d6fa8,#60c8ff)}
.bar b{position:absolute;inset:0;font-size:7.5px;line-height:9px;text-align:center;color:#fff;font-weight:900;text-shadow:0 1px 2px #000}
.pill{display:flex;align-items:center;gap:4px;background:#0d1226;border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:11px;font-weight:900}
.pill b{color:var(--gold)}
.ibtn{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#0d1226;color:var(--text);font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.ibtn:active{transform:scale(.92)}
.stage{flex:1;position:relative;min-height:180px;background:#060a14;border:1px solid var(--line);border-radius:13px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.tab{border:1px solid var(--line);background:linear-gradient(180deg,#20294c,#161d3a);color:var(--muted);border-radius:11px;padding:7px 2px;font-size:9.5px;font-weight:900;cursor:pointer;text-align:center}
.tab .ti{font-size:16px;display:block;margin-bottom:1px}
.tab.on{color:#fff;border-color:var(--ice);background:linear-gradient(180deg,#1d3a5c,#16294a);box-shadow:0 0 10px rgba(127,216,255,.2)}
#panel{max-height:46vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:8px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--line);background:linear-gradient(180deg,#20294c,#161d3a);color:var(--text);border-radius:11px;padding:9px 10px;font-size:11.5px;font-weight:900;cursor:pointer;font-family:inherit;min-height:37px}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.gold{background:linear-gradient(180deg,#b98b20,#7a5b15);border-color:var(--gold);color:#fff8dc}
.btn.grn{background:linear-gradient(180deg,#1f8f4d,#146637);border-color:#4ade80}
.btn.red{background:linear-gradient(180deg,#a83232,#7a2020);border-color:#f87171}
.btn.blu{background:linear-gradient(180deg,#1d6fa8,#14537b);border-color:#60c8ff}
.btn.vio{background:linear-gradient(180deg,#6d28d9,#4c1d95);border-color:#c4b5fd}
.msg{min-height:16px;font-size:11.5px;font-weight:800;color:var(--gold);text-align:center;margin-top:5px;line-height:1.35}
.eqrow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:8px}
.eslot{aspect-ratio:1;border-radius:11px;border:1px dashed #3d4c85;background:#0d1430;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative}
.eslot img{width:70%;height:70%;object-fit:contain}
.eslot span{font-size:7.5px;color:var(--muted);font-weight:900}
.eslot.filled{border-style:solid}
.invgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.icell{aspect-ratio:1;border-radius:10px;border:1px solid #2a3560;background:#101736;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.icell img{width:78%;height:78%;object-fit:contain}
.icell .q{position:absolute;bottom:1px;right:3px;font-size:8.5px;font-weight:900;color:var(--gold);text-shadow:0 1px 2px #000}
.icell:active{transform:scale(.93)}
.statline{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:3px 0}
.statline .sv{color:var(--ice);min-width:26px;text-align:right}
.statline .plus{width:26px;height:26px;border-radius:8px;border:1px solid var(--grn);background:#0d2418;color:var(--grn);font-weight:900;cursor:pointer;font-size:14px}
.logbox{font-size:11px;line-height:1.5;color:#c9d4f0}
.logbox div{padding:2px 0;border-bottom:1px solid rgba(43,58,102,.4)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,8,18,.8);backdrop-filter:blur(3px);display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{width:100%;max-width:600px;max-height:86vh;background:linear-gradient(180deg,#1b2342,#141b34);border:1px solid var(--line);border-bottom:none;border-radius:18px 18px 0 0;display:flex;flex-direction:column}
.sheet header{display:flex;align-items:center;gap:8px;padding:11px 13px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font-size:14px;flex:1}
.x{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:#111832;color:var(--muted);font-size:14px;cursor:pointer}
.mbody{padding:11px 13px;overflow-y:auto;flex:1}
.ithead{display:flex;gap:10px;align-items:center}
.ithead img{width:64px;height:64px;background:#0d1430;border:1px solid var(--line);border-radius:12px;padding:5px}
.itname{font-weight:950;font-size:14px}
.itrar{font-size:10px;font-weight:900}
.itmods{font-size:11.5px;color:#c9d4f0;line-height:1.6;margin:8px 0}
.fld{margin:8px 0}
.fld label{font-size:10.5px;color:var(--muted);font-weight:800;display:block;margin-bottom:3px}
.fld input,.fld textarea{width:100%;background:#0e1430;border:1px solid var(--line);border-radius:10px;color:var(--text);padding:8px 10px;font-size:12px;outline:none;font-family:inherit}
.tog{display:flex;align-items:center;justify-content:space-between;background:#101736;border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin:7px 0;font-size:12px;font-weight:800}
.sw{width:42px;height:23px;border-radius:999px;background:#2a3560;position:relative;cursor:pointer;transition:.2s;flex:0 0 auto}
.sw i{position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#8b98c2;transition:.2s}
.sw.on{background:linear-gradient(135deg,var(--grn),#2fbf85)}
.sw.on i{left:22px;background:#fff}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(16px);z-index:90;background:rgba(14,20,42,.96);border:1px solid var(--gold);color:var(--text);padding:8px 16px;border-radius:12px;font-size:12px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#fatal{display:none;position:fixed;inset:0;z-index:99;background:#101018;color:#ffd7d7;padding:16px;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow:auto}
#boot{position:fixed;inset:0;z-index:98;background:#0a0f1e;color:var(--ice);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:13px/1.5 ui-monospace,Menlo,monospace;text-align:center;padding:20px}
#boot .spin{width:38px;height:38px;border:4px solid #1c2444;border-top-color:var(--ice);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="boot"><div class="spin"></div><div>🐾 Барсик запрягает сани…</div><div id="bootMsg" style="color:#93a0c4;font-size:11px"></div></div>

<div class="app">
  <div class="hud">
    <div class="who" id="whoTxt">…</div>

      <div class="bar hp"><i id="hpFill"></i><b id="hpTxt"></b></div>

    <button class="tab on" data-scr="loc"><span class="ti">🏔</span>Мир</button>

</div>
<div class="modal" id="modal"><div class="sheet">

</div></div>

<script>
(function(){'use strict';
function showFatal(e){var el=document.getElementById('fatal');el.style.display='block';el.innerHTML='<b>⚠ Barsik RPG error</b>\n\n'+(e&&e.stack?e.stack:String(e));}
window.onerror=function(m,s,l,c,e){showFatal(e||(m+' @ '+l+':'+c));return true;};
window.addEventListener('unhandledrejection',function(ev){showFatal(ev.reason);});
try{main();}catch(e){showFatal(e);}
function main(){
var TG=(window.Telegram&&window.Telegram.WebApp)?window.Telegram.WebApp:null;
if(TG){try{TG.ready();TG.expand();if(TG.setHeaderColor)TG.setHeaderColor('#0a0f1e');if(TG.setBackgroundColor)TG.setBackgroundColor('#0a0f1e');if(TG.disableVerticalSwipes)TG.disableVerticalSwipes();}catch(e){}}
function $(id){return document.getElementById(id);}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function lerp(a,b,t){return a+(b-a)*t;}
function rand(a,b){return a+Math.random()*(b-a);}
function randi(a,b){return Math.floor(rand(a,b+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function fmt(n){return String(Math.floor(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
function now(){return Date.now();}
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function eoc(t){return 1-Math.pow(1-clamp(t,0,1),3);}
var toastT=null;
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('show');},2300);}
/* ================= SAVE ================= */
var KEY='barsik_rpg_v1';
var DEF={
 name:'',cls:'warrior',lv:1,xp:0,sp:0,
 stats:{str:6,agi:5,int:4,vit:6},
 hp:0,en:0,gold:60,
 inv:[{id:'pot1',q:3},{id:'sword1',q:1},{id:'cloth1',q:1}],
 equip:{w:null,a:null,h:null,c:null,t:null},
 loc:'village',flags:{},log:[],
 scr:'loc',
 ai:{enabled:true,endpoint:'https://anymodel.org/v1/chat/completions',model:'am/nemotron-3-ultra-550b-a55b',key:'sk-dc9d4b7df36ba555-wof1d4-80376593',note:''},
 sound:true,music:true,vol:50,
 gmCool:0,born:now(),seen:now()
};
function load(){var s=JSON.parse(JSON.stringify(DEF));try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);for(var k in DEF){if(o[k]===undefined)continue;if(k==='stats'||k==='equip'||k==='ai'||k==='flags'){for(var kk in DEF[k])s[k][kk]=(o[k]&&o[k][kk]!==undefined)?o[k][kk]:DEF[k][kk];}else s[k]=o[k];}}}catch(e){}
 if(!s.name){try{s.name=(TG&&TG.initDataUnsafe&&TG.initDataUnsafe.user)?TG.initDataUnsafe.user.first_name:'Барс';}catch(e){s.name='Барс';}}
 if(!s.hp){var d=derived(s);s.hp=d.maxHp;s.en=d.maxEn;}
 return s;}
var S=load();
var saveT=null;
function save(){S.seen=now();clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}},200);renderHUD();}
function logAdd(t){S.log.unshift('• '+t);if(S.log.length>70)S.log.pop();}
/* ================= AUDIO ================= */
var A={ctx:null,master:null};
function volGain(){return S.sound?(clamp(S.vol,0,100)/100)*0.5:0;}
function applyAudio(){if(A.master)A.master.gain.value=volGain();}
function audioInit(){if(A.ctx)return;try{var C=window.AudioContext||window.webkitAudioContext;A.ctx=new C();A.master=A.ctx.createGain();A.master.gain.value=volGain();A.master.connect(A.ctx.destination);MU.next=A.ctx.currentTime+0.1;}catch(e){}}
function tone(f,dur,type,vol,slide){if(!A.ctx||!S.sound)return;try{var o=A.ctx.createOscillator(),g=A.ctx.createGain(),t=A.ctx.currentTime;o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+dur);g.gain.setValueAtTime(vol||0.15,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(A.master);o.start(t);o.stop(t+dur+0.02);}catch(e){}}
function noise(dur,vol,freq){if(!A.ctx||!S.sound)return;try{var n=Math.floor(A.ctx.sampleRate*dur),buf=A.ctx.createBuffer(1,n,A.ctx.sampleRate),d=buf.getChannelData(0);for(var i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);var s=A.ctx.createBufferSource();s.buffer=buf;var f=A.ctx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||1200;var g=A.ctx.createGain();g.gain.value=vol||0.1;s.connect(f);f.connect(g);g.connect(A.master);s.start();}catch(e){}}
var SFX={
 click:function(){tone(700,0.05,'square',0.06);},
 hit:function(){noise(0.09,0.16,900);tone(180,0.12,'sawtooth',0.12,-60);},
 crit:function(){noise(0.12,0.2,1400);tone(320,0.18,'sawtooth',0.14,-120);setTimeout(function(){tone(660,0.12,'square',0.1);},60);},
 hurt:function(){tone(140,0.2,'sawtooth',0.14,-40);noise(0.08,0.1,500);},
 heal:function(){[523,659,784].forEach(function(f,i){setTimeout(function(){tone(f,0.14,'sine',0.1);},i*70);});},
 magic:function(){tone(880,0.25,'sine',0.1,420);setTimeout(function(){tone(1320,0.2,'sine',0.08,-300);},90);},
 coin:function(){tone(980,0.07,'square',0.1);setTimeout(function(){tone(1460,0.1,'square',0.1);},60);},
 lvl:function(){[392,523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,0.22,'triangle',0.13);},i*90);});},
 win:function(){[523,659,784,1046].forEach(function(f,i){setTimeout(function(){tone(f,0.18,'triangle',0.12);},i*90);});},
 lose:function(){[392,311,233,175].forEach(function(f,i){setTimeout(function(){tone(f,0.25,'sawtooth',0.09);},i*130);});},
 step:function(){noise(0.05,0.06,700);}
};
var MU={theme:'explore',step:0,next:0};
var MU_TH={
 explore:{bpm:0.42,notes:[0,-1,3,-1,5,-1,3,-1,7,-1,5,-1,3,-1,0,-1,-2,-1,3,-1,5,-1,7,-1,10,-1,7,-1,5,-1,3,-1],bass:[0,-1,-1,-1,5,-1,-1,-1,3,-1,-1,-1,7,-1,-1,-1]},
 battle:{bpm:0.2,notes:[12,-1,12,-1,10,-1,12,-1,15,-1,12,-1,10,-1,8,-1,12,-1,12,-1,10,-1,12,-1,17,-1,15,-1,12,-1,10,-1],bass:[0,0,7,0,5,5,3,3,0,0,7,0,8,8,10,10]}
};
function muTick(){
 if(!A.ctx||!S.music)return;
 var th=MU_TH[MU.theme];
 if(MU.next<A.ctx.currentTime)MU.next=A.ctx.currentTime+0.05;
 while(MU.next<A.ctx.currentTime+0.3){
  var i=MU.step%32;
  if(th.bass[i]!==undefined&&th.bass[i]!==-1)tone(65.41*Math.pow(2,th.bass[i]/12),th.bpm*1.7,'sine',0.08);
  if(th.notes[i]!==undefined&&th.notes[i]!==-1)tone(261.63*Math.pow(2,th.notes[i]/12),th.bpm*1.3,MU.theme==='battle'?'square':'triangle',0.045);
  if(MU.theme==='battle'&&MU.step%2===1)noise(0.02,0.02,6000);
  MU.step++;MU.next+=th.bpm;
 }
}
setInterval(muTick,120);
function firstTouch(){audioInit();if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume();if(A.ctx)MU.next=A.ctx.currentTime+0.1;document.removeEventListener('pointerdown',firstTouch);}
document.addEventListener('pointerdown',firstTouch,{passive:true});
/* ================= ITEMS ================= */
var RARC=['#9aa7bf','#39ff8e','#7fd8ff','#b48bff','#ffd166'];
var RARN=['Обычный','Необычный','Редкий','Эпический','Легендарный'];
var ITEMS={};
function it(id,name,kind,sub,rar,price,lvl,mods,desc){ITEMS[id]={id:id,name:name,kind:kind,sub:sub,rar:rar,price:price,lvl:lvl,mods:mods||{},desc:desc||''};}
it('sword1','Ржавый меч','w','sword',0,20,1,{atk:4},'Видал виды, но ещё кусается.');
it('sword2','Ледяной клинок','w','sword',2,120,3,{atk:11,agi:2},'Лезе из вечной мерзлоты.');
it('sword3','Клинок Вершины','w','sword',4,600,7,{atk:24,str:5,crit:6},'Оружие древних барсов.');
it('bow1','Охотничий лук','w','bow',1,60,2,{atk:7,agi:3,crit:4},'Тетива из шерсти яка.');
it('bow2','Лук Вьюги','w','bow',3,260,5,{atk:15,agi:6,crit:8},'Стрелы находят цель сами.');
it('staff1','Посох искр','w','staff',1,70,2,{atk:5,int:5},'Трескает статикой.');
it('staff2','Посох Метели','w','staff',3,280,5,{atk:9,int:11,en:10},'Внутри воет вьюга.');
it('claw1','Когти барса','w','claw',2,150,4,{atk:12,agi:4,crit:7},'Наследие предков.');
it('cloth1','Тканевый плащ','a','armor',0,15,1,{def:2,hp:6},'Лучше, чем ничего.');
it('leather1','Кожаный доспех','a','armor',1,55,2,{def:5,hp:14},'Прочная выделка.');
it('chain1','Кольчуга','a','armor',2,140,4,{def:9,hp:26},'Звенит на морозе.');
it('snow1','Снежный плащ','a','armor',3,300,5,{def:11,hp:34,agi:3},'Ткань из сне шёлкопа.');
it('crystal1','Кристальный панцирь','a','armor',4,700,7,{def:18,hp:55,vit:4},'Выращен в пещере.');
it('hood1','Капюшон следопыта','h','hood',0,12,1,{def:1,agi:1},'Пахнет хвоей.');
it('helm1','Кожаный шлем','h','helm',1,50,2,{def:3,hp:8},'Простой и надёжный.');

function endCombat(win){
 CB.active=false;MU.theme='explore';
 if(win){
  var e=CB.enemy;
  S.gold+=e.g;
  logAdd('🏆 Победа: '+e.n+'! +'+e.xp+' опыта, +'+e.g+' золота');
  var drop=null;
  if(Math.random()<0.4){var loc=LOCS[S.loc];drop=pick(loc.drops);invAdd(drop,1);logAdd('🎁 Трофей: '+ITEMS[drop].name);}
  CB.reward={xp:e.xp,g:e.g,drop:drop};
  if(e.id==='boss'){S.flags.bossDown=true;logAdd('👑 Тень Вершины рассеялась! Край спасён.');}
  addXp(e.xp);
  SFX.win();confetti(26);
 }else{
  S.gold=Math.floor(S.gold*0.9);
  var d=derived();S.hp=Math.ceil(d.maxHp*0.4);S.en=d.maxEn;S.loc='village';
  logAdd('💀 Поражение… Очнулся в деревне без части золота.');
  SFX.lose();
 }

 save();ui();
}
function playerAttack(skillId){
 if(CB.stage!=='playerIdle')return;
 var d=derived();
 var sk=skillId?SKILLS[skillId]:null;
 if(sk){
  if(S.lv<sk.lv){toast('Нужен уровень '+sk.lv);return;}
  if(S.en<sk.en){toast('Мало энергии!');return;}
  S.en-=sk.en;
 }
 CB.pendSkill=sk||null;
 CB.pendMult=sk&&sk.mult?sk.mult:1;
 CB.pendCrit=(sk&&sk.crit?sk.crit:0);
 CB.pendHits=sk&&sk.hits?sk.hits:1;
 CB.pendStun=sk&&sk.stun?sk.stun:0;
 if(sk&&sk.type==='heal'){
  CB.stage='playerAnim';CB.t0=now();CB.applied=false;CB.healOnly=true;
  SFX.magic();save();ui();return;
 }
 if(sk&&sk.type==='buff'){
  CB.buffDef=0.6;CB.buffTurns=2;
  CB.stage='playerAnim';CB.t0=now();CB.applied=true;CB.healOnly=false;CB.noHit=true;
  floatTxt('🛡 Защита +60%',CW*0.28,CH*0.4,'#7fd8ff');
  SFX.magic();save();ui();return;
 }
 CB.healOnly=false;CB.noHit=false;
 CB.stage='playerAnim';CB.t0=now();CB.applied=false;
 if(sk&&sk.type==='magic')SFX.magic();else SFX.step();
 save();ui();
}
function applyPlayerHit(){
 var d=derived(),e=CB.enemy;
 var sk=CB.pendSkill;
 var base=sk&&sk.type==='magic'?d.matk:d.atk;
 var hits=CB.pendHits,total=0,crits=0;
 for(var h=0;h<hits;h++){
  var crit=Math.random()*100<d.crit+CB.pendCrit;
  var raw=base*CB.pendMult*rand(0.9,1.1);
  var defPart=e.def*(sk&&sk.type==='magic'?0.4:1);
  var dmg=Math.max(1,Math.round(raw-defPart*0.5));
  if(crit){dmg=Math.round(dmg*1.7);crits++;}
  e.hp-=dmg;total+=dmg;
 }
 e.pose={hurt:0.4};
 floatTxt('-'+total+(crits?' КРИТ!':''),CW*0.7,CH*0.32,crits?'#ffd166':'#ff5d5d');

 var sw3=document.createElement('div');sw3.className='sw'+(S.ai.enabled?' on':'');sw3.innerHTML='<i></i>';
 sw3.onclick=function(){S.ai.enabled=!S.ai.enabled;sw3.classList.toggle('on',S.ai.enabled);save();toast(S.ai.enabled?'ИИ включён ✨':'ИИ выключен — события локальные');};
 t3.appendChild(sw3);b.appendChild(t3);
 var f1=document.createElement('div');f1.className='fld';f1.innerHTML='<label>API Endpoint</label><input id="aiEp" value="'+S.ai.endpoint+'">';b.appendChild(f1);
 var f2=document.createElement('div');f2.className='fld';f2.innerHTML='<label>Модель</label><input id="aiMd" value="'+S.ai.model+'">';b.appendChild(f2);
 var f3=document.createElement('div');f3.className='fld';f3.innerHTML='<label>API Key (хранится только у тебя)</label><input id="aiKey" type="password" value="'+S.ai.key+'">';b.appendChild(f3);
 var f4=document.createElement('div');f4.className='fld';f4.innerHTML='<label>Свой сеттинг (дополнение к миру)</label><textarea id="aiNote" rows="2">'+(S.ai.note||'')+'</textarea>';b.appendChild(f4);
 var sv=document.createElement('button');sv.className='btn blu grow';sv.textContent='Сохранить ИИ';
 sv.onclick=function(){S.ai.endpoint=$('aiEp').value.trim();S.ai.model=$('aiMd').value.trim();S.ai.key=$('aiKey').value.trim();S.ai.note=$('aiNote').value.trim();save();toast('🧠 Настройки ИИ сохранены');closeModal();};
 b.appendChild(sv);
 var sb=document.createElement('button');sb.className='btn vio grow';sb.textContent='📤 Сохранить в бота';
 sb.onclick=function(){
  var payload={game:'rpg',action:'save',name:S.name,cls:S.cls,level:S.lv,gold:S.gold,hp:Math.round(S.hp),loc:S.loc,boss:!!S.flags.bossDown};
  if(TG&&TG.sendData){TG.sendData(JSON.stringify(payload));toast('📤 Отправлено в бота');}else toast('Только внутри Telegram');
 };
 b.appendChild(sb);
 var rs=document.createElement('button');rs.className='btn red grow';rs.textContent='🗑 Новый герой (сброс)';
 rs.onclick=function(){if(confirm('Начать заново? Весь прогресс сгорит!')){try{localStorage.removeItem(KEY);}catch(e){}location.reload();}};
 b.appendChild(rs);
}
$('btnSet').onclick=function(){SFX.click();openSettings();};
$('btnMusic').onclick=function(){S.music=!S.music;if(S.music&&A.ctx)MU.next=A.ctx.currentTime+0.1;SFX.click();save();};
$('btnGM').onclick=function(){SFX.click();gmEvent();};
/* ================= SCENE DRAW ================= */
var TT=0;
function drawScene(t){
 CX.clearRect(0,0,CW,CH);
 if(CB.active&&CB.enemy){drawCombat(t);return;}
 if(SCR==='map'){drawMap(t);return;}
 if(SCR==='inv'||SCR==='char'){
  bgLoc(S.loc,t);
  var d=derived();
  drawHero(CX,CW/2,CH*0.62,Math.min(CW,CH)*0.5,S.cls,S.equip,{},t);
  CX.font='bold 13px system-ui';CX.textAlign='center';CX.fillStyle='#ffd166';
  CX.fillText(S.name+' · '+CLASSES[S.cls].n+' · ур.'+S.lv,CW/2,CH*0.14);
  CX.font='11px system-ui';CX.fillStyle='rgba(233,237,245,.85)';
  CX.fillText('⚔'+d.atk+' 🛡'+d.def+' 🎯'+d.crit.toFixed(0)+'% ❤'+Math.round(S.hp)+'/'+d.maxHp,CW/2,CH*0.14+16);
  CX.textAlign='left';
  drawFx();
  return;
 }
 if(SCR==='log'){bgLoc(S.loc,t);drawHero(CX,CW*0.24,CH*0.6,Math.min(CW,CH)*0.34,S.cls,S.equip,{},t);drawFx();return;}
 bgLoc(S.loc,t);
 drawHero(CX,CW*0.3,CH*0.62,Math.min(CW,CH)*0.42,S.cls,S.equip,{},t);
 if(LOCS[S.loc].safe){
  drawHero(CX,CW*0.68,CH*0.64,Math.min(CW,CH)*0.34,'ranger',{w:'bow1',a:'leather1',h:'hood1',c:null,t:null},{},t+1);
  CX.font='10px system-ui';CX.textAlign='center';CX.fillStyle='rgba(233,237,245,.8)';CX.fillText('Торговец Хмур',CW*0.68,CH*0.86);CX.textAlign='left';
 }
 CX.font='bold 12px system-ui';CX.textAlign='center';CX.fillStyle='rgba(255,209,102,.9)';
 CX.fillText(LOCS[S.loc].icon+' '+LOCS[S.loc].n,CW/2,CH*0.1);
 CX.textAlign='left';
 drawFx();
}
function drawCombat(t){
 bgLoc(S.loc,t);
 var e=CB.enemy;
 CB.heroPose=CB.heroPose||{};
 e.pose=e.pose||{};
 if(CB.heroPose.hurt>0)CB.heroPose.hurt-=0.016;
 if(e.pose.hurt>0)e.pose.hurt-=0.016;
 var heroX=CW*0.28,heroY=CH*0.6,enemyX=CW*0.72,enemyY=CH*0.58;
 var hs=Math.min(CW,CH)*0.46,es=Math.min(CW,CH)*0.5;
 var heroPose={},enemyPose={};
 if(CB.stage==='playerAnim'){
  var pr=clamp((now()-CB.t0)/600,0,1);
  heroPose.atk=pr;
  if(pr>=0.4&&!CB.applied){CB.applied=true;
   if(CB.healOnly){var d=derived();var hl=Math.round(d.matk*CB.pendMult);S.hp=clamp(S.hp+hl,0,d.maxHp);floatTxt('+'+hl+' ❤',heroX,heroY-hs*0.6,'#39ff8e');SFX.heal();logAdd('Ты лечишься: +'+hl);}
   else if(!CB.noHit)applyPlayerHit();
  }
  if(pr>=1){
   if(CB.healOnly||CB.noHit){CB.stage='enemyWait';CB.t0=now();}
   else if(e.hp<=0){e.pose.dead=1;CB.stage='done';CB.result='win';setTimeout(function(){endCombat(true);},900);}
   else{CB.stage='enemyWait';CB.t0=now();}
  }
 }else if(CB.stage==='enemyWait'){
  if(now()-CB.t0>450)enemyTurn();
 }else if(CB.stage==='enemyAnim'){
  var pr2=clamp((now()-CB.t0)/600,0,1);
  enemyPose.atk=pr2;
  if(pr2>=0.4&&!CB.applied){CB.applied=true;applyEnemyHit();}
 }
 drawHero(CX,heroX,heroY,hs,S.cls,S.equip,heroPose,t);
 if(!e.pose.dead)drawEnemy(CX,enemyX,enemyY,es,e.draw,enemyPose,t);
 else drawEnemy(CX,enemyX,enemyY,es,e.draw,{dead:1},t);
 var d2=derived();
 CX.fillStyle='rgba(10,15,30,.75)';rr(CX,8,8,CW*0.42,34,9);CX.fill();rr(CX,CW*0.5,8,CW*0.42,34,9);CX.fill();
 CX.font='bold 10px system-ui';CX.fillStyle='#eef2ff';CX.textAlign='left';
 CX.fillText(S.name+' ур.'+S.lv,14,20);
 CX.fillText(e.n+' ур.'+e.lv,CW*0.5+6,20);
 CX.fillStyle='#3b0a18';rr(CX,14,24,CW*0.42-12,7,4);CX.fill();
 CX.fillStyle='#ff5d5d';rr(CX,14,24,(CW*0.42-12)*clamp(S.hp/d2.maxHp,0,1),7,4);CX.fill();
 CX.fillStyle='#3b0a18';rr(CX,CW*0.5+6,24,CW*0.42-12,7,4);CX.fill();
 CX.fillStyle='#ff5d5d';rr(CX,CW*0.5+6,24,(CW*0.42-12)*clamp(e.hp/e.maxHp,0,1),7,4);CX.fill();
 if(CB.result==='win'){CX.font='bold 26px system-ui';CX.textAlign='center';CX.fillStyle='#ffd166';CX.shadowColor='#ffd166';CX.shadowBlur=18;CX.fillText('ПОБЕДА!',CW/2,CH*0.42);CX.shadowBlur=0;CX.textAlign='left';}
 if(CB.result==='lose'){CX.font='bold 26px system-ui';CX.textAlign='center';CX.fillStyle='#ff5d5d';CX.shadowColor='#ff5d5d';CX.shadowBlur=18;CX.fillText('ПОРАЖЕНИЕ…',CW/2,CH*0.42);CX.shadowBlur=0;CX.textAlign='left';}
 drawFx();
}
var MAPN=[];
function drawMap(t){
 var g=CX.createLinearGradient(0,0,0,CH);g.addColorStop(0,'#0d1226');g.addColorStop(1,'#1a2444');
 CX.fillStyle=g;CX.fillRect(0,0,CW,CH);
 drawSnow();
 MAPN=[];
 var keys=Object.keys(LOCS);
 CX.strokeStyle='rgba(127,216,255,.35)';CX.lineWidth=2;CX.setLineDash([5,5]);
 var links=[['village','forest'],['village','lake'],['forest','cave'],['lake','pass'],['cave','ruins'],['pass','ruins'],['ruins','peak']];
 links.forEach(function(l){
  var a=LOCS[l[0]],b2=LOCS[l[1]];
  CX.beginPath();CX.moveTo(a.x*CW,a.y*CH);CX.lineTo(b2.x*CW,b2.y*CH);CX.stroke();
 });
 CX.setLineDash([]);
 keys.forEach(function(k){
  var L=LOCS[k];
  var locked=S.lv<L.lv;
  var x=L.x*CW,y=L.y*CH;
  MAPN.push({id:k,x:x,y:y,r:26,locked:locked});
  CX.fillStyle='rgba(0,0,0,.4)';CX.beginPath();CX.arc(x,y+3,24,0,7);CX.fill();
  CX.fillStyle=locked?'#20293c':(S.loc===k?'#14532d':'#1d3a5c');
  CX.beginPath();CX.arc(x,y,24,0,7);CX.fill();
  CX.strokeStyle=S.loc===k?'#39ff8e':(locked?'#3d4c85':'#7fd8ff');CX.lineWidth=2;CX.beginPath();CX.arc(x,y,24,0,7);CX.stroke();
  CX.font='20px serif';CX.textAlign='center';
  CX.globalAlpha=locked?0.35:1;
  CX.fillText(L.icon,x,y+7);
  CX.globalAlpha=1;
  if(locked){CX.font='14px serif';CX.fillText('🔒',x+14,y-10);}
  CX.font='bold 8.5px system-ui';CX.fillStyle=locked?'#5a6480':'#eef2ff';
  CX.fillText(L.n,x,y+36);
  if(!locked&&L.lv>0){CX.font='8px system-ui';CX.fillStyle='#ffd166';CX.fillText('ур.'+L.lv+'+',x,y+45);}
  CX.textAlign='left';
 });
 CX.font='bold 12px system-ui';CX.textAlign='center';CX.fillStyle='rgba(255,209,102,.9)';
 CX.fillText('🗺 Карта Снежного Края',CW/2,CH*0.06+10);CX.textAlign='left';
 drawFx();
}
CV.addEventListener('pointerdown',function(e){
 e.preventDefault();
 var r=CV.getBoundingClientRect();
 var x=e.clientX-r.left,y=e.clientY-r.top;
 if(SCR==='map'&&!CB.active){
  for(var i=0;i<MAPN.length;i++){
   var n=MAPN[i];
   if(Math.hypot(x-n.x,y-n.y)<n.r+6){
    if(n.locked){toast('Нужен уровень '+LOCS[n.id].lv+'!');SFX.lose();return;}
    if(n.id===S.loc){toast('Ты уже здесь.');return;}
    S.loc=n.id;SFX.step();logAdd('🧭 Переход: '+LOCS[n.id].n);toast(LOCS[n.id].icon+' '+LOCS[n.id].n);
    SCR='loc';setTabs();save();ui();return;
   }
  }
 }
},{passive:false});
/* ================= LOOP ================= */
var lastTS=0;
function loop(ts){
 requestAnimationFrame(loop);
 try{
  if(!lastTS)lastTS=ts;
  var dt=clamp((ts-lastTS)/1000,0,0.05);lastTS=ts;TT+=dt;
  if(CW<10||CH<10)resize();
  CX.setTransform(DPR,0,0,DPR,0,0);
  drawScene(TT);
  updFx(dt);
 }catch(err){showFatal(err);}
}
/* ================= INIT ================= */
resize();
if(!S.log.length)logAdd('🐾 '+S.name+' начинает путь в Снежном Краю. Класс: '+CLASSES[S.cls].n+'.');
renderHUD();setTabs();buildPanel();
requestAnimationFrame(loop);
setTimeout(function(){var b=$('boot');if(b&&b.parentNode)b.parentNode.removeChild(b);},400);
window.__BARSIK_OK=true;
/* выбор класса при первом входе */
if(!localStorage.getItem(KEY+'_init')){
 localStorage.setItem(KEY+'_init','1');
 var b2=openModal('🐾 Выбери путь героя');
 var n2=document.createElement('div');n2.className='msg';n2.textContent=S.name+, привет! Кем ты станешь?';
 b2.appendChild(n2);
 Object.keys(CLASSES).forEach(function(ck){
  var cc=CLASSES[ck];
  var btn=document.createElement('button');btn.className='btn grow';btn.style.marginBottom='6px';
  btn.innerHTML='<b style="color:'+cc.col+'">'+cc.n+'</b><br><span style="font-size:10px;color:var(--muted)">'+({warrior:'Сила и стойкость, меч и броня',mage:'Разум и энергия, лёд и лечение',ranger:'Ловкость и крит, лук и капканы'})[ck]+'</span>';
  btn.onclick=function(){S.cls=ck;var d=derived();S.hp=d.maxHp;S.en=d.maxEn;save();closeModal();ui();SFX.lvl();confetti(20);};
  b2.appendChild(btn);
 });
}
} /* end main */
})();
</script>

setTimeout(function(){
 if(!window.__BARSIK_OK){
  var b=document.getElementById('boot');
  if(b){b.innerHTML='<div style="max-width:92vw;line-height:1.6">⚠️ Скрипт RPG не запустился.<br>Файл вставлен не целиком — проверь, что код заканчивается на <b>&lt;/html&gt;</b>.</div>';}
 }
},3000);
</script>
