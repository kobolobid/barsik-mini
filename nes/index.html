<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Barsik NES Emulator</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; touch-action: none; }
  #app { width: 100vw; height: 100vh; display: flex; flex-direction: column; }
  
  .header {
    height: 40px;
    background: #111;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0 10px;
    font-size: 12px;
    border-bottom: 1px solid #333;
    z-index: 10;
  }
  
  /* Container for the emulator canvas */
  #game-container {
    flex: 1;
    position: relative;
    background: #000;
    overflow: hidden;
  }
  
  /* Force controls to be visible on mobile */
  .ejs_controls {
    opacity: 1 !important;
    visibility: visible !important;
  }
</style>
<link rel="stylesheet" href="https://cdn.emulatorjs.org/stable/data/loader.css">
</head>
<body>

<div id="app">
  <div class="header">
    <span>🎮 BARSIK NES</span>
    <button style="background:#333;border:none;color:#fff;padding:5px 10px;font-size:10px;" onclick="location.reload()">⟳ RELOAD</button>
  </div>
  <div id="game-container"></div>
</div>

<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

<script>
// Telegram Init
var tg = window.Telegram && window.Telegram.WebApp ? Telegram.WebApp : null;
if(tg){
  try{
    tg.ready();
    tg.expand();
    if(tg.setHeaderColor) tg.setHeaderColor('#000000');
    if(tg.setBackgroundColor) tg.setBackgroundColor('#000000');
    if(tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  }catch(e){}
}

// --- CRITICAL CONFIG FOR MOBILE BUTTONS ---
window.EJS_player = "#game-container";
window.EJS_core = "nes";
window.EJS_color = "#ffffff";
window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
window.EJS_startOnLoaded = true;
window.EJS_language = "ru";

// THIS IS THE KEY LINE TO SHOW BUTTONS ON MOBILE
window.EJS_mobileControls = true; 

// Optional: Adjust button size/layout if needed
// window.EJS_controlScheme = "custom"; // Can define custom layouts later

// THE GAME FILE PATH
// Make sure this matches your GitHub structure exactly!
window.EJS_gameUrl = "roms/battle_city.nes"; 

// Initialize
EJS_loader();

// Fallback: If buttons don't appear automatically, force them via DOM manipulation after load
setTimeout(function(){
  var controls = document.querySelector('.ejs_controls');
  if(controls) {
    controls.style.opacity = '1';
    controls.style.visibility = 'visible';
    console.log("Forced controls visibility");
  } else {
    console.warn("Controls element not found yet, waiting...");
  }
}, 2000);

</script>

</body>
</html>
