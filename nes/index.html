<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Barsik NES Hub</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body { margin:0; background:#000; color:#fff; font-family:'Courier New', monospace; overflow:hidden; touch-action:none; user-select:none; height:100vh; display:flex; flex-direction:column; }
  
  .header { padding:10px; background:#111; border-bottom:1px solid #333; display:flex; justify-content:space-between; align-items:center; z-index:10; }
  .title { color:#0f0; font-weight:bold; font-size:16px; }
  .back-btn { background:none; border:1px solid #0f0; color:#0f0; padding:5px 10px; cursor:pointer; font-family:inherit; display:none; }
  
  /* Game List */
  #gameList { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:10px; }
  .game-card { background:#222; border:1px solid #444; padding:15px; border-radius:8px; cursor:pointer; transition:all .2s; text-align:center; }
  .game-card:active { transform:scale(.98); background:#333; border-color:#0f0; }
  .game-name { font-size:18px; font-weight:bold; color:#fff; margin-bottom:5px; }
  .game-desc { font-size:12px; color:#aaa; }

  /* Emulator Container */
  #emulatorContainer { flex:1; position:relative; background:#000; display:none; }
  
  /* Loader */
  #loader { position:absolute; inset:0; background:rgba(0,0,0,.9); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:50; color:#0f0; font-size:18px; }
  .spinner { width:40px; height:40px; border:4px solid #333; border-top:4px solid #0f0; border-radius:50%; animation:spin 1s linear infinite; margin-bottom:10px; }
  @keyframes spin { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
  .error-msg { color:#f00; font-size:14px; text-align:center; padding:20px; }

  /* FORCE VISIBILITY OF NATIVE CONTROLS */
  .ejs_controls_container, 
  .mobile-controls,
  .ejs_ui_element {
    opacity: 1 !important;
    visibility: visible !important;
    display: block !important;
    pointer-events: auto !important;
  }
  
  /* Ensure canvas fills space */
  #ejs-player {
    width: 100%;
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
  }
</style>
<link rel="stylesheet" href="https://cdn.emulatorjs.org/stable/data/loader.css">
</head>
<body>

<div class="header">
  <span class="title">🎮 BARSIK NES HUB</span>
  <button id="backBtn" class="back-btn">← НАЗАД</button>
</div>

<!-- LIST VIEW -->
<div id="gameList">
  <div class="game-card" onclick="loadGame('roms/battle_city.nes')">
    <div class="game-name">Battle City (Танчики)</div>
    <div class="game-desc">Классика Dendy. Защити базу!</div>
  </div>
</div>

<!-- EMULATOR VIEW -->
<div id="emulatorContainer">
  <div id="loader"><div class="spinner"></div>Загрузка ядра...</div>
  <div id="ejs-player"></div>
</div>

<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

<script>
// --- TELEGRAM INIT ---
var tg = window.Telegram && window.Telegram.WebApp ? Telegram.WebApp : null;
if(tg){
  try{
    tg.ready();
    tg.expand();
    if(tg.setHeaderColor) tg.setHeaderColor('#000000');
    if(tg.setBackgroundColor) tg.setBackgroundColor('#000000');
    if(tg.disableVerticalSwipes) tg.disableVerticalSwipes();
  }catch(e){}
}

let ejsInstance = null;

window.loadGame = function(url) {
  // Hide list, show emulator
  document.getElementById('gameList').style.display = 'none';
  document.getElementById('emulatorContainer').style.display = 'block';
  document.getElementById('backBtn').style.display = 'block';
  document.getElementById('loader').style.display = 'flex';
  document.getElementById('loader').innerHTML = '<div class="spinner"></div>Загрузка...';
  
  initEmulator(url);
};

document.getElementById('backBtn').onclick = function() {
  if(ejsInstance) {
    try { ejsInstance.stop(); } catch(e){}
  }
  document.getElementById('gameList').style.display = 'flex';
  document.getElementById('emulatorContainer').style.display = 'none';
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('loader').style.display = 'none';
  document.getElementById('ejs-player').innerHTML = '';
  ejsInstance = null;
};

function initEmulator(gameUrl) {
  // Clear previous instance
  document.getElementById('ejs-player').innerHTML = '';
  
  window.EJS_player = "#ejs-player";
  window.EJS_core = "nes";
  window.EJS_gameUrl = gameUrl;
  window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
  window.EJS_startOnLoaded = true;
  window.EJS_language = "ru";
  
  // IMPORTANT: Enable native mobile controls explicitly
  window.EJS_mobileControls = true; 
  
  // Initialize
  EJS_loader().then(instance => {
    ejsInstance = instance;
    document.getElementById('loader').style.display = 'none';
    
    // Additional hack to force controls visibility in some browsers
    setTimeout(() => {
      const controls = document.querySelector('.ejs_controls_container') || document.querySelector('.mobile-controls');
      if(controls) {
        controls.style.opacity = '1';
        controls.style.visibility = 'visible';
        controls.style.pointerEvents = 'auto';
      }
    }, 1000);
    
  }).catch(err => {
    console.error("EJS Error:", err);
    document.getElementById('loader').innerHTML = "<div class='error-msg'>Ошибка загрузки:<br>" + err.message + "<br><br>Проверь, что файл battle_city.nes загружен в папку roms/ на GitHub.</div>";
  });
}
</script>

</body>
</html>
