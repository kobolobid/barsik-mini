function showModal(kind){cancelInputs();if($('modal').hidden)lastFocus=document.activeElement;modalKind=kind;let d=$('dialog');$('modal').hidden=false;$('app').inert=true;let h='';if(kind==='menu'){h=hero('Мяу! Добро пожаловать','Космолапки','Твой уютный тетрис со снежным Барсиком. Выбери приключение.')+`<div class="mode-grid">${modeMarkup()}</div>`+(validSave(saved)?action('continue','▶ Продолжить · '+MODES[saved.mode].name,'main'):'')+action('start',validSave(saved)?'Новая игра':'Играть',validSave(saved)?'':'main')+`<div class="actions-row">${action('openSettings','Настройки','sub')}${action('openHelp','Как играть','sub')}</div><div class="notice" id="modeRecord"></div>`}else if(kind==='pause'){h=hero('Пауза','Мур-перерыв','Партия сохранена на этом устройстве.')+action('resume','▶ Продолжить','main')+action('openSettings','Настройки')+`<div class="actions-row">${action('restart','Начать заново')}${action('toMenu','Режимы')}</div>`+action('openHelp','Управление','sub')}else if(kind==='result'){let s=state;h=hero(newRecord?'Новый рекорд!':MODES[s.mode].name,finishReason==='40 линий собраны!'?'Мяу, победа!':'Ещё одну?',finishReason)+`<div class="result-grid"><div><strong>${fmt(s.score)}</strong>Очки</div><div><strong>${s.lines}</strong>Линии</div><div><strong>${clock(s.elapsed)}</strong>Время</div></div><p>Тетрисов: ${s.tetrises} · Лучшее комбо: ${Math.max(0,s.maxCombo)} · Фигур: ${s.pieces}</p>`+action('again','Играть ещё','main')+action('send',tg?.initData?'Отправить результат в Telegram':'Поделиться результатом')+action('toMenu','Выбрать режим','sub')+'<div class="notice" id="shareNotice" role="status"></div>'}else if(kind==='confirm'){h='<h2 id="dialogTitle">Начать новую игру?</h2><p>Текущая сохранённая партия будет заменена. Рекорды останутся.</p>'+action('confirmStart','Да, новая игра','main')+action('cancelConfirm','Отмена','sub')}else if(kind==='settings'){h='<span class="tag">✦ Твой космос</span><h2 id="dialogTitle">Настройки</h2>'+settingCheck('music','Музы function settingCheck(k,label,sub){return `<label class="settings-row"><span>${label}<small>${sub}</small></span><input id="opt-${k}" type="checkbox" ${settings[k]?'checked':''}></label>`}function settingSelect(k,label,opts){return `<label class="settings-row"><span>${label}</span><select id="opt-${k}">${Object.entries(opts).map(([v,n])=>`<option value="${v}" ${settings[k]===v?'selected':''}>${n}</option>`).join('')}</select></label>`}

const active=new Map(),keys=new Map();let gesture=null;const act={left:()=>move(-1,0),right:()=>move(1,0),down:()=>move(0,1,true),cw:()=>rotate(1),ccw:()=>rotate(-1),drop:hardDrop,hold,power};const repeated=new Set(['left','right','down']);function repeatParams(a){if(a==='down')return [100,settings.speed==='fast'?32:settings.speed==='slow'?80:50];return settings.speed==='fast'?[105,28]:settings.speed==='slow'?[215,95]:[155,48]}
