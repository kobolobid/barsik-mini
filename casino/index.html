var HNAME=['Старшая карта','Пара','Две пары','Тройка','Стрит','Флеш','Фулл-хаус','Каре','Стрит-флеш','Роял-флеш'];
function uniq5(a){var s={};for(var i=0;i<a.length;i++){if(s[a[i]])return false;s[a[i]]=1;}return true;}
function eval5(cs){
 var rs=cs.map(function(c){return c.r;}).sort(function(a,b){return b-a;});
 var ss=cs.map(function(c){return c.s;});
 var cnt={};rs.forEach(function(r){cnt[r]=(cnt[r]||0)+1;});
 var gr=Object.keys(cnt).map(Number).sort(function(a,b){return cnt[b]-cnt[a]||b-a;});
 var flush=ss[0]===ss[1]&&ss[1]===ss[2]&&ss[2]===ss[3]&&ss[3]===ss[4];
 var u=rs.slice().sort(function(a,b){return a-b;});
 var straight=false,sh=0;
 if(u[4]-u[0]===4&&uniq5(u)){straight=true;sh=u[4];}
 else if(u.join(',')==='2,3,4,5,14'){straight=true;sh=5;}
 var cat,k;
 if(straight&&flush){cat=(sh===14&&u[0]===10)?9:8;k=[sh];}
 else if(cnt[gr[0]]===4){cat=7;k=[gr[0],gr[1]];}
 else if(cnt[gr[0]]===3&&cnt[gr[1]]===2){cat=6;k=[gr[0],gr[1]];}
 else if(flush){cat=5;k=rs;}
 else if(straight){cat=4;k=[sh];}
 else if(cnt[gr[0]]===3){cat=3;k=[gr[0]].concat(rs.filter(function(r){return r!==gr[0];}).slice(0,2));}
 else if(cnt[gr[0]]===2&&cnt[gr[1]]===2){var tp=[gr[0],gr[1]].sort(function(a,b){return b-a;});cat=2;k=tp.concat(rs.filter(function(r){return r!==tp[0]&&r!==tp[1];}).slice(0,1));}
 else if(cnt[gr[0]]===2){cat=1;k=[gr[0]].concat(rs.filter(function(r){return r!==gr[0];}).slice(0,3));}
 else{cat=0;k=rs;}
 while(k.length<5)k.push(0);
 return{v:cat*1e10+k[0]*1e8+k[1]*1e6+k[2]*1e4+k[3]*1e2+k[4],cat:cat,name:HNAME[cat]};
}
function bestOf(cs){
 if(cs.length<5)return{v:-1,cat:-1,name:''};
 var best=null;
 for(var a=0;a<3;a++)for(var b=a+1;b<4;b++){
  var rest=[0,1,2,3,4,5,6].filter(function(i){return i!==a&&i!==b;});
  var e=eval5(rest.map(function(i){return cs[i];}));
  if(!best||e.v>best.v)best=e;
 }
 return best;
}

 };
 function renderH(){
  var el=$('whHist');if(!el)return;
  el.innerHTML='';
  g.hist.slice(0,10).forEach(function(h){
   var d=document.createElement('div');
   d.className='hn '+(h===0?'r':(h>=3?'g':'b'));
   d.textContent='x'+h;
   el.appendChild(d);
  });
 }
 g.update=function(dt){
  if(!g.spin)return;
  var t=(now()-g.t0)/g.dur;
  g.a=eoc(t)*g.Wf;
  if(Math.floor(g.a/(Math.PI/6))!==g.lastS){g.lastS=Math.floor(g.a/(Math.PI/6));if(t<0.85)SFX.tick();}
  if(t>=1){
   g.spin=false;
   var b=$('whGo');if(b)b.disabled=false;
   var m=SEG[g.res],w=Math.floor(g.bet*m);
   g.hist.unshift(m);if(g.hist.length>12)g.hist.pop();renderH();
   var msg=$('whMsg');
   if(w>0){pay(w);if(msg)msg.textContent='☸️ x'+m+'! +'+fmt(w)+' 🪙';confetti(m>=5?44:22);if(m>=5)SFX.big();else SFX.win();floatTxt('+'+fmt(w),CW/2,CH*0.35,'#39ff8e');}
   else{if(msg)msg.textContent='☸️ x0… колесо коварно.';SFX.lose();}
   save();
  }
 };
 g.draw=function(t){
  CX.clearRect(0,0,CW,CH);
  var bg=CX.createRadialGradient(CW/2,CH*0.45,10,CW/2,CH*0.45,Math.max(CW,CH)*0.7);
  bg.addColorStop(0,'#241a3a');bg.addColorStop(1,'#0d0818');
  CX.fillStyle=bg;CX.fillRect(0,0,CW,CH);
  var cx=CW/2,cy=CH*0.46,R=Math.min(CW,CH)*0.36;
  CX.save();CX.translate(cx,cy);
  CX.fillStyle='#ffd166';
  CX.beginPath();CX.moveTo(0,-R-16);CX.lineTo(-9,-R+2);CX.lineTo(9,-R+2);CX.closePath();CX.fill();
  CX.save();CX.rotate(g.a);
  var segA=Math.PI*2/SEG.length;
  for(var i=0;i<SEG.length;i++){
   var a0=i*segA-Math.PI/2,a1=a0+segA;
   CX.fillStyle=COL[i];
   CX.beginPath();CX.moveTo(0,0);CX.arc(0,0,R,a0,a1);CX.closePath();CX.fill();
   CX.strokeStyle='rgba(255,209,102,.6)';CX.lineWidth=1.5;CX.beginPath();CX.moveTo(0,0);CX.lineTo(Math.cos(a0)*R,Math.sin(a0)*R);CX.stroke();
   CX.save();CX.rotate(i*segA+segA/2-Math.PI/2);
   CX.fillStyle='#fff';CX.font='bold '+(R*0.13)+'px system-ui';CX.textAlign='center';
   CX.fillText('x'+SEG[i],0,-R*0.68);
   CX.restore();
  }
  CX.restore();
  CX.fillStyle='#141b33';CX.beginPath();CX.arc(0,0,R*0.22,0,7);CX.fill();
  CX.strokeStyle='#ffd166';CX.lineWidth=2;CX.beginPath();CX.arc(0,0,R*0.22,0,7);CX.stroke();
  CX.font=(R*0.2)+'px serif';CX.textAlign='center';CX.fillText('🐾',0,R*0.07);CX.textAlign='left';
  CX.restore();
  drawFx();
 };
 return g;
})();
/* ---------- НОВОЕ: ОРЁЛ/РЕШКА ---------- */
GAMES.coin=(function(){
 var g={bet:50,side:0,flip:false,t0:0,res:0,rot:0};
 g.enter=function(p){
  p.innerHTML='<div class="row"><span style="font-size:11px;color:var(--muted);font-weight:800">Ставка:</span>'+
   [10,50,100,500].map(function(v){return '<button class="chip c'+v+'" data-cf="'+v+'">'+v+'</button>';}).join('')+'</div>'+
   '<div class="row" style="margin-top:6px"><button class="btn grn grow" id="cfH">🦅 Орёл</button><button class="btn blu grow" id="cfT">🐾 Решка</button></div>'+
   '<div class="msg" id="cfMsg">Выбери сторону — монета сделает всё сама</div>';
  p.querySelectorAll('[data-cf]').forEach(function(b){b.onclick=function(){g.bet=+b.getAttribute('data-cf');p.querySelectorAll('[data-cf]').forEach(function(x){x.classList.remove('on');});b.classList.add('on');SFX.chip();};});
  p.querySelector('[data-cf="50"]').classList.add('on');
  function flipTo(side){
   if(g.flip)return;
   if(!bet(g.bet))return;
   g.side=side;g.flip=true;g.t0=now();g.res=Math.random()<0.5?0:1;
   SFX.dice();
   $('cfH').disabled=true;$('cfT').disabled=true;
  }
  $('cfH').onclick=function(){flipTo(0);};
  $('cfT').onclick=function(){flipTo(1);};
 };
 g.update=function(dt){
  if(!g.flip)return;
  var t=(now()-g.t0)/1200;
  g.rot=t;
  if(t>=1){
   g.flip=false;
   $('cfH').disabled=false;$('cfT').disabled=false;
   var m=$('cfMsg');
   if(g.res===g.side){pay(g.bet*2);if(m)m.textContent=(g.res?'🐾 Решка':'🦅 Орёл')+'! Победа +'+fmt(g.bet*2)+' 🪙';SFX.win();confetti(20);floatTxt('+'+fmt(g.bet*2),CW/2,CH*0.35,'#39ff8e');}
   else{if(m)m.textContent=(g.res?'🐾 Решка':'🦅 Орёл')+'. Увы…';SFX.lose();}
   save();
  }
 };
 g.draw=function(t){
  CX.clearRect(0,0,CW,CH);
  var bg=CX.createRadialGradient(CW/2,CH*0.45,10,CW/2,CH*0.45,Math.max(CW,CH)*0.7);
  bg.addColorStop(0,'#2a2410');bg.addColorStop(1,'#141006');
  CX.fillStyle=bg;CX.fillRect(0,0,CW,CH);
  var R=Math.min(CW,CH)*0.26;
  var y=CH*0.45-(g.flip?Math.sin(clamp(g.rot,0,1)*Math.PI)*60:0);
  var face;
  if(g.flip)face=(Math.floor(g.rot*5)%2===0)?g.side:1-g.side;
  else face=g.res;
  var sx=g.flip?Math.max(0.08,Math.abs(Math.cos(g.rot*5*Math.PI))):1;
  CX.save();CX.translate(CW/2,y);CX.scale(sx,1);
  var gr=CX.createLinearGradient(-R,-R,R,R);gr.addColorStop(0,'#ffe9a0');gr.addColorStop(0.5,'#f5b301');gr.addColorStop(1,'#b97701');
  CX.fillStyle=gr;CX.beginPath();CX.arc(0,0,R,0,7);CX.fill();
  CX.strokeStyle='#fff0c4';CX.lineWidth=3;CX.beginPath();CX.arc(0,0,R*0.86,0,7);CX.stroke();
  CX.font=(R*0.9)+'px serif';CX.textAlign='center';CX.fillText(face===0?'🦅':'🐾',0,R*0.32);CX.textAlign='left';
  CX.restore();
  CX.fillStyle='rgba(0,0,0,.35)';CX.beginPath();CX.ellipse(CW/2,CH*0.78,R*0.8*(g.flip?0.6:1),10,0,0,7);CX.fill();
  CX.font='bold 12px system-ui';CX.textAlign='center';CX.fillStyle='rgba(233,237,245,.8)';
  CX.fillText('Твой выбор: '+(g.side?'🐾 Решка':'🦅 Орёл'),CW/2,CH*0.9);CX.textAlign='left';
  drawFx();
 };
 return g;
})();
/* ---------- VOLUME / HEADER ---------- */
var volHideT=null;
function syncVolbar(){$('volRange').value=S.vol;$('volVal').textContent=Math.round(S.vol)+'%';$('volMute').textContent=S.sound?'🔊':'🔇';}
function toggleVolbar(){var vb=$('volbar');var show=!vb.classList.contains('show');vb.classList.toggle('show',show);if(show){syncVolbar();armVol();}}
function armVol(){clearTimeout(volHideT);volHideT=setTimeout(function(){$('volbar').classList.remove('show');},5000);}
$('volRange').addEventListener('input',function(e){S.vol=+e.target.value;applyAudio();$('volVal').textContent=Math.round(S.vol)+'%';save();armVol();});
$('volMute').onclick=function(){S.sound=!S.sound;applyAudio();syncVolbar();renderBal();save();armVol();};
document.addEventListener('pointerdown',function(e){var vb=$('volbar');if(vb.classList.contains('show')&&!vb.contains(e.target)&&!e.target.closest('#btnSound'))vb.classList.remove('show');},{passive:true});
$('btnSound').onclick=function(){SFX.click();toggleVolbar();};
$('btnMusic').onclick=function(){S.music=!S.music;if(S.music&&A.ctx)MU.next=A.ctx.currentTime+0.1;MU.step=0;SFX.click();toast(S.music?'🎵 '+MU_THEMES[S.mTheme%2].name:'Музыка выключена');$('btnMusic').style.opacity=S.music?1:0.45;save();};
$('btnDaily').onclick=function(){
 if(now()-S.lastDaily<24*3600*1000){toast('Бонус через '+Math.ceil((24*3600*1000-(now()-S.lastDaily))/3600000)+' ч');return;}
 S.lastDaily=now();pay(500);SFX.big();confetti(40);floatTxt('+500 🪙',CW/2,CH*0.4,'#ffd166');toast('🎁 Бонус дня +500 🪙');save();
};
$('btnHelp').onclick=function(){
 if(now()-S.lastHelp<24*3600*1000){toast('Помощь через '+Math.ceil((24*3600*1000-(now()-S.lastHelp))/3600000)+' ч');return;}
 if(S.bal>=100){toast('🆘 Доступно при балансе < 100 🪙');return;}
 S.lastHelp=now();pay(1000);SFX.win();confetti(30);floatTxt('+1000 🪙',CW/2,CH*0.4,'#39ff8e');toast('🆘 Барсик выручил: +1000 🪙');save();
};
/* ---------- INPUT ---------- */
function ptr(e){var r=CV.getBoundingClientRect();var cx,cy;if(e.touches&&e.touches.length){cx=e.touches[0].clientX;cy=e.touches[0].clientY;}else if(e.changedTouches&&e.changedTouches.length){cx=e.changedTouches[0].clientX;cy=e.changedTouches[0].clientY;}else{cx=e.clientX;cy=e.clientY;}return{x:cx-r.left,y:cy-r.top};}
CV.addEventListener('pointerdown',function(e){e.preventDefault();var p=ptr(e);if(G&&G.tap)G.tap(p.x,p.y);},{passive:false});
/* ---------- LOOP ---------- */
var lastTS=0,TT=0;
function loop(ts){
 requestAnimationFrame(loop);
 try{
  if(!lastTS)lastTS=ts;
  var dt=clamp((ts-lastTS)/1000,0,0.05);lastTS=ts;TT+=dt;
  if(CW<10||CH<10)resize();
  CX.setTransform(DPR,0,0,DPR,0,0);
  if(G){if(G.update)G.update(dt);if(G.draw)G.draw(TT);}
  updFx(dt);
 }catch(err){showFatal(err);}
}
/* ---------- INIT ---------- */
resize();
$('btnMusic').style.opacity=S.music?1:0.45;
renderBal();
setGame('lobby');
requestAnimationFrame(loop);
setTimeout(function(){var b=$('boot');if(b&&b.parentNode)b.parentNode.removeChild(b);},400);
if(TG&&TG.sendData){
 var sendBtn=document.createElement('button');sendBtn.className='ibtn';sendBtn.textContent='📤';sendBtn.title='Сохранить в бота';
 sendBtn.onclick=function(){TG.sendData(JSON.stringify({game:'casino',action:'save',balance:S.bal,hands:S.hands,wins:S.wins,best:S.best,wagered:S.wagered}));toast('📤 Отправлено в бота');};
 document.querySelector('.hud').insertBefore(sendBtn,$('btnMusic'));
}
} /* end main */
})();
