<style>
:root{--bg:#0b0f1e;--panel:#151d38;--line:#2b3a66;--text:#eef2ff;--muted:#93a0c4;--gold:#ffd166;--grn:#39ff8e;--red:#ff5d5d;--ice:#7fd8ff;--violet:#b48bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:radial-gradient(900px 500px at 20% -10%,rgba(180,139,255,.14),transparent 60%),radial-gradient(900px 500px at 90% 0%,rgba(255,209,102,.10),transparent 55%),linear-gradient(180deg,#0d1226,#0b0f1e);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;user-select:none;touch-action:manipulation;overscroll-behavior:none}
.app{display:flex;flex-direction:column;height:100%;max-width:640px;margin:0 auto;width:100%;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);gap:6px}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:#0a0f1e}::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--gold),var(--violet));border-radius:6px}
.hud{display:flex;align-items:center;gap:6px;padding:7px 8px;background:linear-gradient(135deg,#1c2444,#141b33);border:1px solid var(--line);border-radius:14px}
.logo{font-weight:900;font-size:14px;background:linear-gradient(90deg,var(--gold),var(--red),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.sp{flex:1;min-width:4px}
.hud{overflow-x:auto;scrollbar-width:none}
.hud::-webkit-scrollbar{display:none}
.hud>*{flex:0 0 auto}
.logo{max-width:30vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:430px){.logo{font-size:11px}.pill{padding:4px 7px;font-size:11px}.ibtn{width:29px;height:29px;font-size:13px}.hud{gap:4px;padding:6px}}
.ibtn{width:33px;height:33px;border-radius:10px;border:1px solid var(--line);background:#0d1226;color:var(--text);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative}
.ibtn:active{transform:scale(.92)}
.ibtn .dot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #141b33;display:none}
.ibtn.alert .dot{display:block}
.pill{display:flex;align-items:center;gap:5px;background:#0d1226;border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:900}
.pill b{color:var(--gold)}
.pill.pulse{animation:pl .4s ease}
@keyframes pl{40%{transform:scale(1.12)}}
.stage{flex:1;position:relative;min-height:190px;background:#070b16;border:1px solid var(--line);border-radius:14px;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
#panel{max-height:50vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:9px}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.btn{border:1px solid var(--line);background:linear-gradient(180deg,#20294c,#161d3a);color:var(--text);border-radius:11px;padding:9px 12px;font-size:12px;font-weight:900;cursor:pointer;font-family:inherit;min-height:38px}
.btn:active{transform:scale(.95)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.gold{background:linear-gradient(180deg,#b98b20,#7a5b15);border-color:var(--gold);color:#fff8dc}
.btn.grn{background:linear-gradient(180deg,#1f8f4d,#146637);border-color:#4ade80}
.btn.red{background:linear-gradient(180deg,#a83232,#7a2020);border-color:#f87171}
.btn.blu{background:linear-gradient(180deg,#1d6fa8,#14537b);border-color:#60c8ff}
.chip{min-width:44px;min-height:38px;border-radius:999px;border:2px solid rgba(255,255,255,.25);font-weight:950;color:#fff;font-size:12px;cursor:pointer;font-family:inherit;box-shadow:inset 0 0 10px rgba(0,0,0,.35)}
.chip.on{outline:3px solid var(--gold);box-shadow:0 0 14px rgba(255,209,102,.4)}
.c10{background:linear-gradient(180deg,#475569,#334155)}.c50{background:linear-gradient(180deg,#0ea5e9,#0369a1)}.c100{background:linear-gradient(180deg,#22c55e,#15803d)}.c500{background:linear-gradient(180deg,#a855f7,#6b21a8)}.c1000{background:linear-gradient(180deg,#f59e0b,#b45309)}
.msg{min-height:18px;font-size:12px;font-weight:850;color:var(--gold);text-align:center;margin-top:6px}
.hist{display:flex;gap:4px;flex-wrap:wrap;min-height:24px}
.hn{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:950;border:1px solid rgba(255,255,255,.15)}
.hn.r{background:#7f1d1d;color:#ffe4e4}.hn.b{background:#111827;color:#e5e7eb}.hn.g{background:#14532d;color:#dcfce7}
.rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:6px}
.rc{min-height:34px;border-radius:8px;border:1px solid rgba(255,255,255,.14);font-weight:950;font-size:12px;cursor:pointer;position:relative;color:#fff;font-family:inherit}
.rc.r{background:linear-gradient(180deg,#991b1b,#7f1d1d)}.rc.b{background:linear-gradient(180deg,#1f2937,#111827)}.rc.g{background:linear-gradient(180deg,#166534,#14532d);grid-column:1/-1}
.rc .st,.og .st{position:absolute;top:2px;right:4px;font-size:9px;color:var(--gold);font-weight:900}
.ogrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:4px}
.og{min-height:32px;border-radius:8px;border:1px solid rgba(255,255,255,.14);background:#182148;color:var(--text);font-size:10.5px;font-weight:900;cursor:pointer;position:relative;font-family:inherit}
.mgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:8px}
.mcell{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);background:linear-gradient(180deg,#243055,#182148);color:var(--text);font-size:18px;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;transition:transform .12s}
.mcell:active{transform:scale(.92)}
.mcell.o{background:linear-gradient(180deg,#0d2418,#0a1c12);border-color:var(--grn)}
.mcell.b{background:linear-gradient(180deg,#4a1010,#2c0808);border-color:var(--red)}
.lobby{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.lcard{background:linear-gradient(135deg,#1d2750,#141b3a);border:1px solid var(--line);border-radius:15px;padding:11px 8px;text-align:center;cursor:pointer;position:relative;overflow:hidden}
.lcard:active{transform:scale(.97)}
.lcard .li{font-size:30px;display:block;margin-bottom:5px;filter:drop-shadow(0 4px 10px rgba(0,0,0,.4))}
.lcard .ln{font-weight:950;font-size:12.5px}
.lcard .ld{font-size:9.5px;color:var(--muted);margin-top:3px;line-height:1.3}
.lcard::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.08) 50%,transparent 70%);transform:translateX(-100%);animation:sh 3.4s infinite}
@keyframes sh{60%{transform:translateX(100%)}100%{transform:translateX(100%)}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:#101736;border:1px solid #2a3560;border-radius:13px;padding:8px 6px;text-align:center;position:relative}
.card.eq{border-color:var(--grn)}.card.own{border-color:#3d4c85}
.card img{width:60px;height:60px;display:block;margin:0 auto;object-fit:contain}
.card .cn{font-size:9.5px;font-weight:800;margin-top:4px;min-height:22px;line-height:1.2}
.card .cp{font-size:10px;font-weight:900;color:var(--gold);margin-top:2px}
.rar{position:absolute;top:5px;left:5px;font-size:8px;font-weight:900;padding:2px 5px;border-radius:6px}
.r0{background:#2a3560;color:#aab6dd}.r1{background:#173a5e;color:#7fd8ff}.r2{background:#3a2360;color:#c9a4ff}.r3{background:#5e3a10;color:#ffd166}
.cbtn{width:100%;margin-top:5px;border:none;border-radius:8px;padding:6px 4px;font-size:10px;font-weight:900;cursor:pointer;background:linear-gradient(135deg,var(--ice),#4aa8e0);color:#08122a}
.cbtn.g{background:linear-gradient(135deg,var(--mint),#2fbf85)}
.cbtn.d{background:#2a3560;color:#8b98c2;cursor:default}
.more{width:100%;margin-top:10px;border:1px dashed var(--line);background:none;color:var(--ice);border-radius:10px;padding:9px;font-weight:800;font-size:12px;cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.stab{border:1px solid var(--line);background:#111832;color:var(--muted);border-radius:999px;padding:6px 11px;font-size:11px;font-weight:800;cursor:pointer}
.stab.on{background:linear-gradient(135deg,#23406b,#2a2f5e);color:#fff;border-color:var(--ice)}
.volbar{position:fixed;left:50%;transform:translateX(-50%);bottom:70px;z-index:60;display:none;align-items:center;gap:10px;background:rgba(16,22,44,.96);border:1px solid var(--line);border-radius:14px;padding:10px 14px;width:min(92vw,380px);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.volbar.show{display:flex}
.volbar input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:4px;background:linear-gradient(90deg,var(--gold),var(--violet));outline:none}
.volbar input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--gold);cursor:pointer}
.volbar .vmute{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#0d1226;color:var(--text);font-size:15px;cursor:pointer}
.volbar .vval{font-size:11px;font-weight:800;color:var(--muted);min-width:34px;text-align:right}
#toast{position:fixed;left:50%;bottom:118px;transform:translateX(-50%) translateY(16px);z-index:90;background:rgba(14,20,42,.96);border:1px solid var(--gold);color:var(--text);padding:8px 16px;border-radius:12px;font-size:12px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;max-width:86vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
#fatal{display:none;position:fixed;inset:0;z-index:99;background:#101018;color:#ffd7d7;padding:16px;font:12px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;overflow:auto}
#boot{position:fixed;inset:0;z-index:98;background:#0b0f1e;color:var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;font:13px/1.5 ui-monospace,Menlo,monospace;text-align:center;padding:20px}
#boot .spin{width:38px;height:38px;border:4px solid #2b3a66;border-top-color:var(--gold);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

 var ctx=A.ctx,voice=ctx.createOscillator(),env=ctx.createGain();
 voice.type=wave;voice.frequency.value=440*Math.pow(2,(key-69)/12);
 env.gain.setValueAtTime(.0001,time);env.gain.exponentialRampToValueAtTime(volume,time+.015);
 env.gain.exponentialRampToValueAtTime(.0001,time+length);

}
function muTick(){
 if(!A.ctx||!S.music||!S.sound||document.hidden||A.ctx.state!=='running')return;

 if(!MU.bus){MU.bus=A.ctx.createGain();MU.bus.gain.value=.85;MU.bus.connect(A.master);}
 if(MU.next<A.ctx.currentTime)MU.next=A.ctx.currentTime+.025;

  var pos=MU.step%track.line.length,bar=Math.floor(MU.step/track.line.length);
  var root=track.root+track.bars[bar%4],degree=track.line[pos],t=MU.next;
  if(degree!=='.'){
   var index=bar%8>=4?Number(track.variation[Number(degree)]):Number(degree);
   musicNote(root+track.chord[index]+12,t,beat*(pos%2?.82:1.32),track.wave,track.wave==='square'?.027:.075);
  }
  if(pos===0||pos===Math.floor(track.line.length/2))musicNote(root-12+(pos?7:0),t,beat*1.75,'sine',.14);
  if(pos===2||pos===track.line.length-2)for(var j of [1,2])musicNote(root+track.chord[j],t,beat*.90,'triangle',.033);

function uniq5(a){var s={};for(var i=0;i<a.length;i++){if(s[a[i]])return false;s[a[i]]=1;}return true;}
function eval5(cs){
 var rs=cs.map(function(c){return c.r;}).sort(function(a,b){return b-a;});

 var cnt={};rs.forEach(function(r){cnt[r]=(cnt[r]||0)+1;});
 var gr=Object.keys(cnt).map(Number).sort(function(a,b){return cnt[b]-cnt[a]||b-a;});
 var flush=ss[0]===ss[1]&&ss[1]===ss[2]&&ss[2]===ss[3]&&ss[3]===ss[4];
 var u=rs.slice().sort(function(a,b){return a-b;});
 var straight=false,sh=0;
 if(u[4]-u[0]===4&&uniq5(u)){straight=true;sh=u[4];}

 if(straight&&flush){cat=(sh===14&&u[0]===10)?9:8;k=[sh];}
 else if(cnt[gr[0]]===4){cat=7;k=[gr[0],gr[1]];}
 else if(cnt[gr[0]]===3&&cnt[gr[1]]===2){cat=6;k=[gr[0],gr[1]];}
 else if(flush){cat=5;k=rs;}
 else if(straight){cat=4;k=[sh];}
 else if(cnt[gr[0]]===3){cat=3;k=[gr[0]].concat(rs.filter(function(r){return r!==gr[0];}).slice(0,2));}
 else if(cnt[gr[0]]===2&&cnt[gr[1]]===2){var tp=[gr[0],gr[1]].sort(function(a,b){return b-a;});cat=2;k=tp.concat(rs.filter(function(r){return r!==tp[0]&&r!==tp[1];}).slice(0,1));}
 else if(cnt[gr[0]]===2){cat=1;k=[gr[0]].concat(rs.filter(function(r){return r!==gr[0];}).slice(0,3));}
 else{cat=0;k=rs;}
 while(k.length<5)k.push(0);

}
function bestOf(cs){

  for(var i=0;i<6;i++){(function(skip){var e=eval5(cs.filter(function(_,j){return j!==skip;}));if(!best||e.v>best.v)best=e;})(i);}

  var rest=[];for(var i2=0;i2<n;i2++)if(i2!==a&&i2!==b)rest.push(cs[i2]);
  var e2=eval5(rest);

 }

}

var volHideT=null;
function syncVolbar(){$('volRange').value=S.vol;$('volVal').textContent=Math.round(S.vol)+'%';$('volMute').textContent=S.sound?'🔊':'🔇';}
function toggleVolbar(){var vb=$('volbar');var show=!vb.classList.contains('show');vb.classList.toggle('show',show);if(show){syncVolbar();armVol();}}
function armVol(){clearTimeout(volHideT);volHideT=setTimeout(function(){$('volbar').classList.remove('show');},5000);}
$('volRange').addEventListener('input',function(e){S.vol=+e.target.value;applyAudio();$('volVal').textContent=Math.round(S.vol)+'%';save();armVol();});
$('volMute').onclick=function(){S.sound=!S.sound;applyAudio();syncVolbar();renderBal();save();armVol();};
document.addEventListener('pointerdown',function(e){var vb=$('volbar');if(vb.classList.contains('show')&&!vb.contains(e.target)&&!e.target.closest('#btnSound'))vb.classList.remove('show');},{passive:true});
$('btnSound').onclick=function(){SFX.click();toggleVolbar();};
$('btnMusic').onclick=function(){S.music=!S.music;if(S.music&&A.ctx)MU.next=A.ctx.currentTime+0.1;resetScore(MU.room);SFX.click();toast(S.music?'🎵 '+scores[MU.room].name:'Музыка выключена');$('btnMusic').style.opacity=S.music?1:0.45;save();};
$('btnDaily').onclick=function(){
 if(now()-S.lastDaily<24*3600*1000){toast('Бонус через '+Math.ceil((24*3600*1000-(now()-S.lastDaily))/3600000)+' ч');return;}
 S.lastDaily=now();pay(500);SFX.big();confetti(40);floatTxt('+500 🪙',CW/2,CH*0.4,'#ffd166');toast('🎁 Бонус дня +500 🪙');save();
};
$('btnHelp').onclick=function(){
 if(now()-S.lastHelp<24*3600*1000){toast('Помощь через '+Math.ceil((24*3600*1000-(now()-S.lastHelp))/3600000)+' ч');return;}
 if(S.bal>=100){toast('🆘 Доступно при балансе < 100 🪙');return;}
 S.lastHelp=now();pay(1000);SFX.win();confetti(30);floatTxt('+1000 🪙',CW/2,CH*0.4,'#39ff8e');toast('🆘 Барсик выручил: +1000 🪙');save();
};
/* ---------- INPUT ---------- */
function ptr(e){var r=CV.getBoundingClientRect();var cx,cy;if(e.touches&&e.touches.length){cx=e.touches[0].clientX;cy=e.touches[0].clientY;}else if(e.changedTouches&&e.changedTouches.length){cx=e.changedTouches[0].clientX;cy=e.changedTouches[0].clientY;}else{cx=e.clientX;cy=e.clientY;}return{x:cx-r.left,y:cy-r.top};}
CV.addEventListener('pointerdown',function(e){e.preventDefault();var p=ptr(e);if(G&&G.tap)G.tap(p.x,p.y);},{passive:false});
/* ---------- LOOP ---------- */
var lastTS=0,TT=0;
function loop(ts){
 requestAnimationFrame(loop);
 try{
  if(!lastTS)lastTS=ts;
  var dt=clamp((ts-lastTS)/1000,0,0.05);lastTS=ts;TT+=dt;
  if(CW<10||CH<10)resize();
  CX.setTransform(DPR,0,0,DPR,0,0);
  if(G){if(G.update)G.update(dt);if(G.draw)G.draw(TT);}
  updFx(dt);
 }catch(err){showFatal(err);}
}
/* ---------- INIT ---------- */
resize();
$('btnMusic').style.opacity=S.music?1:0.45;
renderBal();
setGame('lobby');
requestAnimationFrame(loop);
setTimeout(function(){var b=$('boot');if(b&&b.parentNode)b.parentNode.removeChild(b);},400);
window.__BARSIK_OK=true;
if(TG&&TG.sendData){
 var sendBtn=document.createElement('button');sendBtn.className='ibtn';sendBtn.textContent='📤';sendBtn.title='Сохранить в бота';
 sendBtn.onclick=function(){TG.sendData(JSON.stringify({game:'casino',action:'save',balance:S.bal,hands:S.hands,wins:S.wins,best:S.best,wagered:S.wagered}));toast('📤 Отправлено в бота');};
 document.querySelector('.hud').appendChild(sendBtn);
}
} /* end main */
})();
</script>
<script>
setTimeout(function(){
 if(!window.__BARSIK_OK){
  var b=document.getElementById('boot');
  if(b){b.innerHTML='<div style="max-width:92vw;line-height:1.6">⚠️ Скрипт казино не запустился.<br>Скорее всего файл вставлен НЕ ЦЕЛИКОМ.<br><br>Проверь в GitHub, что код заканчивается на <b>&lt;/html&gt;</b>.<br>Затем открой снова с ?v=9</div>';}
 }
},3000);
</script>
