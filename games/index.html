<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1020">
<title>Barsik Mini Games</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0b1020;--panel:#151d35;--panel2:#1b2545;--line:#2b3a66;
  --text:#eef3ff;--muted:#9aa8ca;--gold:#ffd166;--green:#22c55e;
  --red:#ef4444;--blue:#38bdf8;--purple:#a855f7;--orange:#fb923c;--pink:#f472b6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;padding:0;width:100%;height:100%;
  background:
    radial-gradient(circle at 15% 10%,rgba(168,85,247,.18),transparent 28%),
    radial-gradient(circle at 85% 20%,rgba(56,189,248,.16),transparent 30%),
    linear-gradient(180deg,#090d1b,#0b1020 40%,#090e1b);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  overflow:hidden;touch-action:manipulation;overscroll-behavior:none;
}
.fatal{display:none;position:fixed;inset:0;z-index:999;background:#111;color:#fff;padding:16px;white-space:pre-wrap;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;overflow:auto}
.app{position:relative;width:100%;height:100vh;height:100dvh;display:flex;flex-direction:column;gap:8px;padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));overscroll-behavior:none}
header{flex:0 0 auto;background:linear-gradient(135deg,rgba(21,29,53,.95),rgba(11,16,32,.92));border:1px solid var(--line);border-radius:18px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:8px}
.logo{font-size:18px;font-weight:950;background:linear-gradient(90deg,#ffd166,#38bdf8,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:11px;color:var(--muted);margin-top:2px}
.coins{justify-self:end;text-align:right;font-weight:950;font-size:18px;color:var(--gold)}
.hact{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs{flex:0 0 auto;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:rgba(21,29,53,.75);color:var(--muted);border-radius:999px;padding:9px 12px;font-size:12px;font-weight:900;white-space:nowrap;cursor:pointer}
.tab.active{background:linear-gradient(135deg,#24335f,#16203d);color:#fff;border-color:#48609b}
main{flex:1 1 auto;min-height:0;overflow:auto;border-radius:18px}
.page{display:none}.page.active{display:block}
.panel{background:linear-gradient(180deg,rgba(21,29,53,.94),rgba(12,18,35,.94));border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px}
.title{font-size:16px;font-weight:950;margin-bottom:8px}
.muted{color:var(--muted);font-size:12px;line-height:1.35}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
button{appearance:none;border:1px solid #31416d;border-radius:14px;background:linear-gradient(180deg,#202b4d,#151d35);color:var(--text);font-size:13px;font-weight:900;line-height:1.1;min-height:44px;padding:8px;cursor:pointer;user-select:none;touch-action:manipulation}
button:active{transform:scale(.97);filter:brightness(1.08)}
button:disabled{opacity:.45;pointer-events:none}
button.gold{background:linear-gradient(180deg,#b98b20,#7a5b15);border-color:#ffd166;color:#fff8dc}
button.green{background:linear-gradient(180deg,#1f8f4d,#146637);border-color:#4ade80}
button.red{background:linear-gradient(180deg,#a83232,#7a2020);border-color:#f87171}
button.blue{background:linear-gradient(180deg,#1d6fa8,#14537b);border-color:#60c8ff}
button.small{min-height:36px;font-size:12px;border-radius:11px;padding:6px}
.msg{min-height:20px;margin-top:8px;font-size:13px;font-weight:850;color:var(--gold);text-align:center}
.stat{background:rgba(8,12,24,.55);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat .k{font-size:11px;color:var(--muted)}.stat .v{font-size:18px;font-weight:950;margin-top:4px}
.area{position:relative;height:240px;background:#0d1018;border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:none}
.mob{position:absolute;border:0;background:transparent;font-size:30px;line-height:1;padding:0;cursor:pointer;animation:pop .12s ease}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.grid{display:grid;gap:6px;justify-content:center}
.cell{width:44px;height:44px;border-radius:12px;background:#202b4d;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;user-select:none;transition:transform .08s}
.cell.sel{outline:3px solid var(--gold);transform:scale(1.06)}
.cell.fl{background:#8f7a66}.cell.mk{background:#2e8b57;opacity:.5}
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;max-width:330px;margin:8px auto}
.gcell{aspect-ratio:1;border-radius:10px;background:#202b4d;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:clamp(20px,6vw,30px);cursor:pointer;user-select:none}
.gcell.player{background:#7a5b15;outline:2px solid #ffd166}
.gcell.tree{background:#14532d}
.gcell.trap{background:#7a2020}
.gcell.fish{background:#14537b}
.gcell.rabbit{background:#6b21a8}
.gcell.deer{background:#7c4a12}
.gcell.spark{background:#a16207}
.m3{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;justify-content:center;margin:8px auto;max-width:340px}
.mc{aspect-ratio:1;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:clamp(18px,5vw,26px);cursor:pointer;border:2px solid transparent;transition:transform .1s,opacity .15s}
.mc.sel{border-color:#fff;transform:scale(1.1)}
.mc.clr{opacity:.2;transform:scale(.6)}
.mc.sp{box-shadow:0 0 10px rgba(255,255,255,.5)}
.big{font-size:40px;text-align:center;margin:8px 0}
.tl{height:120px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:60px;margin:8px 0;transition:background .2s}
.notice{font-size:11px;color:var(--muted);line-height:1.35;margin-top:8px}
.dice-stage{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.die-card{background:linear-gradient(180deg,rgba(32,43,77,.95),rgba(12,18,35,.95));border:1px solid var(--line);border-radius:18px;padding:10px;text-align:center}
.die-name{font-size:12px;color:var(--muted);font-weight:900}
.die-face{width:88px;height:88px;margin:10px auto;background:linear-gradient(145deg,#fff,#cbd5e1);border-radius:18px;box-shadow:0 10px 25px rgba(0,0,0,.25),inset 0 0 0 1px rgba(0,0,0,.08);display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:12px;gap:4px;align-items:center;justify-items:center}
.die-face .dot{width:14px;height:14px;border-radius:50%;background:#111827;box-shadow:inset 0 -2px 4px rgba(0,0,0,.25)}
.die-face .dot.empty{visibility:hidden}
.die-face .q{grid-column:1/-1;grid-row:1/-1;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:950;color:#111827}
.die-value{font-size:20px;font-weight:950;margin-top:4px}
.die-card.you{outline:2px solid rgba(255,209,102,.35)}
.die-card.cat{outline:2px solid rgba(56,189,248,.25)}
.dice-result{min-height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:950;margin:10px 0;padding:8px;background:rgba(8,12,24,.55);border:1px solid var(--line);color:var(--text)}
.dice-result.win{background:linear-gradient(180deg,#146637,#0f4b29);border-color:#4ade80;color:#dcfce7}
.dice-result.lose{background:linear-gradient(180deg,#7a2020,#5b1717);border-color:#f87171;color:#fee2e2}
.dice-result.push{background:linear-gradient(180deg,#14537b,#0f3b57);border-color:#60c8ff;color:#e0f2fe}
.dice-bets{margin:10px 0}
.dice-bet-current{font-size:13px;color:var(--muted);text-align:center;margin-bottom:8px}
.dice-bet-current b{color:var(--gold)}
.dbet.active{outline:3px solid var(--gold);box-shadow:0 0 18px rgba(255,209,102,.25)}
@media(min-width:760px){.app{max-width:860px;margin:0 auto}}
</style>
</head>
<body>
<div id="fatal" class="fatal"></div>
<div class="app">
<header>
<div>
  <div class="logo">🎯 BARSIK MINI GAMES</div>
  <div class="sub" id="ul">Игрок · виртуальные монеты</div>
</div>
<div class="coins">🪙 <span id="bal">200</span></div>
<div class="hact">
  <button class="gold small" id="bTop">🎁 Пополнить</button>
  <button class="blue small" id="bSave">📤 В бота</button>
  <button class="small" id="bClose">✖ Закрыть</button>
</div>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>
</div>

<script>
function showFatal(e){
  var el=document.getElementById('fatal');
  el.style.display='block';
  el.textContent='Ошибка:\n\n'+(e&&e.stack?e.stack:String(e));
}
window.onerror=function(m,s,l,c,e){showFatal(e||(m+' @ '+l+':'+c));};

(function(){
try{
  var tg=window.Telegram&&window.Telegram.WebApp?Telegram.WebApp:null;
  if(tg){
    try{
      tg.ready();tg.expand();
      if(tg.setHeaderColor)tg.setHeaderColor('#0b1020');
      if(tg.setBackgroundColor)tg.setBackgroundColor('#0b1020');
      if(tg.disableVerticalSwipes)tg.disableVerticalSwipes();
    }catch(e){}
    setTimeout(function(){try{tg.expand();}catch(e){}},300);
  }

  function $(i){return document.getElementById(i);}
  function uid(){try{if(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user)return String(tg.initDataUnsafe.user.id);}catch(e){}return 'local';}
  function uname(){try{if(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name)return tg.initDataUnsafe.user.first_name;}catch(e){}return 'Игрок';}

  var UID=uid(),KEY='barsikgames_'+UID,HOUR=3600*1000;

  function def(){return{name:uname(),bal:200,top:0,played:0,won:0,best:0,updated:Date.now()};}
  function load(){
    try{
      var r=localStorage.getItem(KEY);
      if(!r)return def();
      var s=JSON.parse(r),d=def();
      for(var k in d)if(s[k]==null)s[k]=d[k];
      return s;
    }catch(e){return def();}
  }

  var S=load();

  function save(){S.updated=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}hdr();}
  function fmt(n){return String(Math.floor(n||0)).replace(/\B(?=(\d{3})+(?!\d))/g,' ');}
  function ri(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
  function pick(a){return a[Math.floor(Math.random()*a.length)];}
  function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=ri(0,i);var t=a[i];a[i]=a[j];a[j]=t;}return a;}
  function hdr(){$('bal').textContent=fmt(S.bal);$('ul').textContent=(S.name||'Игрок')+' · сыграно '+S.played+' · побед '+S.won;}
  function pay(c){c=Math.max(0,Math.floor(c||0));S.bal+=c;if(c>S.best)S.best=c;S.won++;save();}
  function bet(c){c=Math.max(0,Math.floor(c||0));if(S.bal<c)return false;S.bal-=c;S.played++;save();return true;}

  $('bTop').onclick=function(){
    var n=Date.now();
    if(n-(S.top||0)<HOUR){alert('Пополнение будет через '+Math.ceil((HOUR-(n-S.top))/60000)+' мин');return;}
    S.bal+=100;S.top=n;save();alert('🎁 +100 🪙');
  };

  $('bSave').onclick=function(){
    var p={game:'games',name:S.name,balance:S.bal,played:S.played,won:S.won,best:S.best,state:S};
    if(tg&&tg.sendData){tg.sendData(JSON.stringify(p));alert('📤 Отправлено в бота.');}
    else alert('Сохранение доступно только внутри Telegram Mini App.');
  };

  $('bClose').onclick=function(){if(tg&&tg.close)try{tg.close();}catch(e){}};

  var GAMES=[
    {id:'lobby',n:'🏠 Лобби'},
    {id:'quiz',n:'🧠 Викторина'},
    {id:'hunt',n:'🐭 Охота'},
    {id:'dice',n:'🎲 Кости'},
    {id:'coin',n:'🪙 Орёл/решка'},
    {id:'guess',n:'🔢 Угадайка'},
    {id:'rps',n:'✊ КНБ'},
    {id:'mem',n:'🃏 Память'},
    {id:'react',n:'⚡ Реакция'},
    {id:'m3',n:'🍬 3 в ряд'},
    {id:'click',n:'🐾 Кликер'}
  ];

  var tabsEl=$('tabs'),mainEl=$('main');

  GAMES.forEach(function(g,i){
    var b=document.createElement('button');
    b.className='tab'+(i===0?' active':'');
    b.textContent=g.n;
    b.dataset.g=g.id;
    tabsEl.appendChild(b);
  });

  tabsEl.addEventListener('click',function(e){
    var b=e.target.closest('.tab');
    if(!b)return;
    setPage(b.dataset.g);
  });

  function setPage(id){
    var ps=mainEl.querySelectorAll('.page');
    for(var i=0;i<ps.length;i++)ps[i].classList.remove('active');
    var ts=tabsEl.querySelectorAll('.tab');
    for(var j=0;j<ts.length;j++)ts[j].classList.toggle('active',ts[j].dataset.g===id);
    var p=$('p-'+id);
    if(p)p.classList.add('active');

    if(id==='hunt'&&!HUNT.boot)HUNT.init();
    if(id==='mem'&&!MEM.boot)MEM.init();
    if(id==='m3'&&!M3.boot)M3.init();
  }

  function addPage(id,title,body){
    var sec=document.createElement('section');
    sec.className='page'+(id==='lobby'?' active':'');
    sec.id='p-'+id;
    sec.innerHTML='<div class="panel"><div class="title">'+title+'</div>'+body+'</div>';
    mainEl.appendChild(sec);
    return sec;
  }

  // ================= LOBBY =================
  addPage('lobby','🎯 Выбери игру','<div class="muted">Все игры на виртуальные монеты. Если обнулился — можно пополнить раз в час.</div><div class="g3" id="lbGrid" style="margin-top:10px"></div>');

  GAMES.slice(1).forEach(function(g){
    var b=document.createElement('button');
    b.className='green';
    b.style.minHeight='58px';
    b.textContent=g.n;
    b.onclick=function(){setPage(g.id);};
    $('lbGrid').appendChild(b);
  });

  // ================= QUIZ =================
  var QZ=[
    {q:'Сколько очков нужно для всех 9 сундуков в Безумной жиле?',a:['600 тысяч','300 тысяч','1 миллион'],c:0},
    {q:'Что даёт нахождение базы в тёмной зоне в Безумной жиле?',a:['40 монет/сек','10 монет/сек','100 монет/сек'],c:0},
    {q:'Работает ли щит в тёмной зоне?',a:['Нет','Да','Только ночью'],c:0},
    {q:'Что теряет игрок при случайном телепорте в Безумной жиле?',a:['Все очки','Руду','Госпиталь'],c:0},
    {q:'Сколько длится этап состязания в Безумной жиле?',a:['2 раза по 30 мин','1 час','15 минут'],c:0},
    {q:'Какой класс героя приоритетен для сильного фронтлайна?',a:['Warrior','Mage','Archer'],c:0},
    {q:'Что копить к Безумной жиле?',a:['Полигон солдат и банки выносливости','Только золото','Только ускорения'],c:0},
    {q:'Что происходит, если базу сожгли в ноль (пенёк)?',a:['Все монеты и руда теряются','Ничего','Только руда теряется'],c:0},
    {q:'Где лечить раненых бесплатно во время боя?',a:['В Госпитале за ручки','В Казино','В Тамагочи'],c:0},
    {q:'Что такое ВС в контексте альянса?',a:['Alliance Showdown','Вечный Сон','Внешний Связной'],c:0},
    {q:'Можно ли бить свой сервер в Безумной жиле?',a:['Нет','Да','Только лидеру'],c:0},
    {q:'Что даёт сбор с плиток по окончании?',a:['300/1500/6000 монет','10 монет','Ничего'],c:0}
  ];

  var quizPage=addPage('quiz','🧠 Викторина','<div class="muted">5 случайных вопросов. Правильный ответ = +20 🪙.</div><button class="gold" id="qzStart" style="width:100%;margin-top:8px">▶ Начать</button><div id="qzBody" style="margin-top:10px"></div><div id="qzM" class="msg"></div>');

  var qzState={qs:[],i:0,sc:0,lock:false};

  function qzRender(){
    var body=quizPage.querySelector('#qzBody');
    if(qzState.i>=qzState.qs.length){
      var r=qzState.sc*20;
      pay(r);
      body.innerHTML='<div class="big">🏆 '+qzState.sc+'/5</div><div class="muted">Награда: +'+r+' 🪙</div>';
      quizPage.querySelector('#qzM').textContent='';
      return;
    }
    var q=qzState.qs[qzState.i];
    var html='<div class="title">'+(qzState.i+1)+'/'+qzState.qs.length+'. '+q.q+'</div><div class="g3">';
    for(var k=0;k<q.a.length;k++){
      html+='<button class="blue qzopt" data-k="'+k+'">'+q.a[k]+'</button>';
    }
    html+='</div>';
    body.innerHTML=html;
  }

  quizPage.addEventListener('click',function(e){
    if(e.target.id==='qzStart'){
      qzState.qs=shuf(QZ).slice(0,5);
      qzState.i=0;qzState.sc=0;qzState.lock=false;
      quizPage.querySelector('#qzM').textContent='';
      qzRender();
      return;
    }
    var b=e.target.closest('.qzopt');
    if(!b||qzState.lock)return;
    qzState.lock=true;
    var q=qzState.qs[qzState.i];
    var k=+b.dataset.k;
    if(k===q.c){qzState.sc++;quizPage.querySelector('#qzM').textContent='✅ Верно';}
    else quizPage.querySelector('#qzM').textContent='❌ Неверно. Ответ: '+q.a[q.c];
    qzState.i++;
    setTimeout(function(){qzState.lock=false;qzRender();},650);
  });

  // ================= HUNT =================
  var huntPage=addPage('hunt','🐭 Охота',
    '<div id="huHead" class="muted"></div>'+
    '<div id="huGrid" class="grid5"></div>'+
    '<div class="muted">🐟+10  🐇+25  🦌+50  ✨+150  🪤−❤️  🌲 непроходим</div>'+
    '<button class="gold" id="huNew" style="width:100%;margin-top:8px">🔄 Новая охота</button>'+
    '<div id="huMsg" class="msg"></div>'
  );

  var HUNT={
    boot:false,
    board:[],
    player:{r:2,c:2},
    hearts:3,
    moves:22,
    score:0,
    target:250,
    streak:0,
    over:false
  };

  function huMul(){return 1+Math.min(1,HUNT.streak*0.1);}
  function huBar(){
    var f=Math.min(8,HUNT.streak);
    var s='';
    for(var i=0;i<f;i++)s+='▰';
    for(var j=f;j<8;j++)s+='▱';
    return s;
  }
  function huSym(type){
    if(type==='empty')return '⬜';
    if(type==='tree')return '🌲';
    if(type==='trap')return '🪤';
    if(type==='fish')return '🐟';
    if(type==='rabbit')return '🐇';
    if(type==='deer')return '🦌';
    if(type==='spark')return '✨';
    return '⬜';
  }
  function huBase(type){
    if(type==='fish')return 10;
    if(type==='rabbit')return 25;
    if(type==='deer')return 50;
    if(type==='spark')return 150;
    return 0;
  }
  function huIsAnimal(type){return type==='fish'||type==='rabbit'||type==='deer'||type==='spark';}

  function huRenderHead(){
    huntPage.querySelector('#huHead').innerHTML=
      '❤️ '+HUNT.hearts+'   👣 Ходы: '+HUNT.moves+'<br>'+
      '🎯 Очки: '+HUNT.score+' / '+HUNT.target+'  '+huBar()+'<br>'+
      '🔥 Комбо: x'+huMul().toFixed(1)+' (серия '+HUNT.streak+')';
  }

  function huRenderGrid(){
    var g=huntPage.querySelector('#huGrid');
    g.innerHTML='';
    for(var r=0;r<5;r++){
      for(var c=0;c<5;c++){
        var i=r*5+c;
        var d=document.createElement('div');
        d.className='gcell';
        d.dataset.r=r;
        d.dataset.c=c;
        if(HUNT.player.r===r&&HUNT.player.c===c){
          d.classList.add('player');

  function huRender(){huRenderHead();huRenderGrid();}

  function huGenerate(){
    HUNT.board=[];
    for(var i=0;i<25;i++)HUNT.board.push('empty');

    var positions=[];
    for(var p=0;p<25;p++){
      var r=Math.floor(p/5),c=p%5;
      if(!(r===2&&c===2))positions.push(p);
    }
    positions=shuf(positions);

    var pool=[];
    for(var t=0;t<4;t++)pool.push('tree');
    for(var tr=0;tr<3;tr++)pool.push('trap');
    for(var f=0;f<6;f++)pool.push('fish');
    for(var rb=0;rb<4;rb++)pool.push('rabbit');
    for(var d=0;d<2;d++)pool.push('deer');
    pool.push('spark');

    pool=shuf(pool);
    for(var k=0;k<pool.length&&k<positions.length;k++){
      HUNT.board[positions[k]]=pool[k];
    }
  }

  function huNew(){
    HUNT.hearts=3;
    HUNT.moves=22;
    HUNT.score=0;
    HUNT.streak=0;
    HUNT.over=false;
    HUNT.player={r:2,c:2};
    huGenerate();
    huRender();

  function huEnd(win){
    HUNT.over=true;
    var reward;
    if(win)reward=100+Math.max(0,Math.floor((HUNT.score-HUNT.target)/5));
    else reward=Math.floor(HUNT.score/10);
    pay(reward);
    huntPage.querySelector('#huMsg').textContent=(win?'🏆 Охота завершена! ':'💀 Охота окончена. ')+'+'+reward+' 🪙';
    huRender();
  }

  function huMove(dr,dc){
    if(HUNT.over)return;
    var nr=HUNT.player.r+dr,nc=HUNT.player.c+dc;
    if(nr<0||nr>=5||nc<0||nc>=5)return;
    var idx=nr*5+nc;
    var type=HUNT.board[idx];

    if(type==='tree'){
      huntPage.querySelector('#huMsg').textContent='🌲 непроходим';
      return;
    }

    HUNT.moves--;

    if(huIsAnimal(type)){
      var pts=Math.round(huBase(type)*huMul());
      HUNT.score+=pts;
      HUNT.streak++;
      HUNT.board[idx]='empty';
      huntPage.querySelector('#huMsg').textContent='🎯 '+huSym(type)+' +'+pts+' 🪙';
      if(HUNT.score>=HUNT.target){huRender();huEnd(true);return;}
    }else if(type==='trap'){
      HUNT.hearts--;
      HUNT.streak=0;
      HUNT.board[idx]='empty';
      huntPage.querySelector('#huMsg').textContent='🪤 −❤️';
      if(HUNT.hearts<=0){huRender();huEnd(false);return;}
    }else{
      huntPage.querySelector('#huMsg').textContent='';
    }

    HUNT.player={r:nr,c:nc};

    if(HUNT.moves<=0){huRender();huEnd(false);return;}
    huRender();
  }

            for(var k=s;k<c;k++)cells.push(M3.idx(r,k));
            runs.push({dir:'h',len:len,cells:cells});
            for(var m=0;m<cells.length;m++)h[cells[m]]=1;
          }
          s=c;
        }
      }
    }
    for(var c2=0;c2<COLS;c2++){
      var s2=0;
      for(var r2=1;r2<=ROWS;r2++){
        var same2=r2<ROWS&&M3.b[M3.idx(r2,c2)]&&M3.b[M3.idx(r2-1,c2)]&&M3.b[M3.idx(r2,c2)].t===M3.b[M3.idx(r2-1,c2)].t;
        if(!same2||r2===ROWS){
          var len2=r2-s2;
          if(len2>=3){
            var cells2=[];
            for(var k2=s2;k2<r2;k2++)cells2.push(M3.idx(k2,c2));
            runs.push({dir:'v',len:len2,cells:cells2});
            for(var m2=0;m2<cells2.length;m2++)v[cells2[m2]]=1;
          }
          s2=r2;
        }
      }
    }
    return{runs:runs,h:h,v:v};
  };

  M3.hasAnyRun=function(){return M3.findRuns().runs.length>0;};

  M3.new=function(){
    M3.sel=-1;M3.score=0;M3.moves=MOVES;M3.combo=1;M3.busy=false;
    do{
      M3.b=[];
      for(var i=0;i<ROWS*COLS;i++)M3.b.push({t:M3.rand(),sp:null});
    }while(M3.hasAnyRun());
    M3.render();
    m3Page.querySelector('#m3Msg').textContent='Собирай каскады и спецконфеты.';
  };

  M3.gravity=function(){
    for(var c=0;c<COLS;c++){
      var col=[];
      for(var r=ROWS-1;r>=0;r--){
        if(M3.b[M3.idx(r,c)])col.push(M3.b[M3.idx(r,c)]);
      }
      while(col.length<ROWS)col.push({t:M3.rand(),sp:null});
      for(var r2=0;r2<ROWS;r2++)M3.b[M3.idx(ROWS-1-r2,c)]=col[r2];
    }
  };

  M3.applyClear=function(clear,spawn){
    var n=Object.keys(clear).length;
    var gain=n*10*M3.combo;
    M3.score+=gain;
    Object.keys(clear).forEach(function(i){M3.b[+i]=null;});
    Object.keys(spawn).forEach(function(i){M3.b[+i]={t:M3.rand(),sp:spawn[i]};});
    M3.gravity();
    M3.combo++;
    M3.render();
  };

  M3.expandSpecials=function(clear){
    var processed={};
    var queue=Object.keys(clear);
    while(queue.length){
      var ks=queue.shift();
      var idx=+ks;
      if(processed[idx])continue;
      processed[idx]=1;
      var cell=M3.b[idx];
      if(!cell||!cell.sp)continue;
      var rc=M3.rc(idx);
      var add=[];
      if(cell.sp==='stripeH'){
        for(var c=0;c<COLS;c++)add.push(M3.idx(rc[0],c));
      }else if(cell.sp==='stripeV'){
        for(var r=0;r<ROWS;r++)add.push(M3.idx(r,rc[1]));
      }else if(cell.sp==='bomb'){
        for(var dr=-1;dr<=1;dr++)for(var dc=-1;dc<=1;dc++){
          var rr=rc[0]+dr,cc=rc[1]+dc;
          if(rr>=0&&rr<ROWS&&cc>=0&&cc<COLS)add.push(M3.idx(rr,cc));
        }
      }else if(cell.sp==='rainbow'){
        var color=cell.t;
        for(var x=0;x<M3.b.length;x++)if(M3.b[x]&&M3.b[x].t===color)add.push(x);
      }
      add.forEach(function(ai){
        if(!clear[ai]){clear[ai]=1;queue.push(String(ai));}
      });
    }
  };

  M3.step=function(){
    var fr=M3.findRuns();
    if(!fr.runs.length){
      M3.busy=false;
      M3.checkEnd();
      return;
    }
    var clear={},spawn={};
    fr.runs.forEach(function(run){
      run.cells.forEach(function(i){clear[i]=1;});
      if(run.len===4){
        var si=run.cells[1];
        spawn[si]=run.dir==='h'?'stripeH':'stripeV';
      }else if(run.len>=5){
        spawn[run.cells[Math.floor(run.cells.length/2)]]='rainbow';
      }
    });
    for(var ih in fr.h){
      if(fr.v[ih]){
        spawn[ih]='bomb';
        clear[ih]=1;
      }
    }
    M3.expandSpecials(clear);
    Object.keys(spawn).forEach(function(si){delete clear[si];});
    M3.applyClear(clear,spawn);
    setTimeout(M3.step,240);
  };

  M3.checkEnd=function(){
    if(M3.score>=TARGET){
      var r=100+Math.floor((M3.score-TARGET)/20);
      pay(r);
      m3Page.querySelector('#m3Msg').textContent='🏆 Цель достигнута! +'+r+' 🪙';
      M3.new();
      return;
    }
    if(M3.moves<=0){
      var r2=Math.floor(M3.score/40);
      pay(r2);
      m3Page.querySelector('#m3Msg').textContent='💀 Ходы кончились. +'+r2+' 🪙';
      M3.new();
    }
  };

  M3.swap=function(a,b){
    var ca=M3.b[a],cb=M3.b[b];
    if(!ca||!cb)return;

    if(ca.sp==='rainbow'||cb.sp==='rainbow'){
      M3.moves--;
      M3.combo=1;
      var clear={};
      if(ca.sp==='rainbow'&&cb.sp==='rainbow'){
        for(var i=0;i<M3.b.length;i++)clear[i]=1;
      }else{
        var rainbowIdx=ca.sp==='rainbow'?a:b;
        var other=ca.sp==='rainbow'?cb:ca;
        clear[rainbowIdx]=1;
        for(var x=0;x<M3.b.length;x++)if(M3.b[x]&&M3.b[x].t===other.t)clear[x]=1;
      }
      M3.expandSpecials(clear);
      M3.applyClear(clear,{});
      M3.busy=true;
      setTimeout(M3.step,220);
      return;
    }

    M3.b[a]=cb;M3.b[b]=ca;
    var fr=M3.findRuns();
    if(!fr.runs.length){
      M3.b[a]=ca;M3.b[b]=cb;
      M3.render();
      return;
    }
    M3.moves--;
    M3.combo=1;
    M3.busy=true;
    M3.step();
  };

  M3.tap=function(i){
    if(M3.busy||M3.moves<=0)return;
    if(M3.sel<0){M3.sel=i;M3.render();return;}
    if(M3.sel===i){M3.sel=-1;M3.render();return;}
    if(!M3.adj(M3.sel,i)){M3.sel=i;M3.render();return;}
    var a=M3.sel,b=i;
    M3.sel=-1;
    M3.swap(a,b);
  };

  M3.init=function(){
    M3.boot=true;
    M3.new();
    m3Page.addEventListener('click',function(e){
      if(e.target.id==='m3R'){M3.new();return;}
      var d=e.target.closest('.mc');
      if(!d)return;
      M3.tap(+d.dataset.i);
    });
  };

  hdr();
  setPage('lobby');

}catch(e){showFatal(e);}
})();
</script>
